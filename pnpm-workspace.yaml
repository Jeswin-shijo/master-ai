packages:
  - master-ai-backend
  - master-ai-web
  - master-ai-mobile
  - packages/*

# Native/postinstall builds that are allowed to run.
onlyBuiltDependencies:
  - "@temporalio/core-bridge"
  - "@swc/core"
  - esbuild
  - "@nestjs/core"
  - protobufjs

# Pin motion's own packages to releases at least two weeks old (its ranges would pull the newest).
overrides:
  framer-motion: 13.4.4
  motion-dom: 13.4.4
  motion-utils: 13.3.0
