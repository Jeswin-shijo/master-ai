# Ready-made pack: travel agencies and tour operators (holidays, groups, tickets
# and visas, inbound and outbound tours). First curated industry pack, upgraded
# to the 8-stage case lifecycle. Built from researched Indian practice: DGCA
# passenger charter (CAR Section 3, Series M), Consumer Protection (E-Commerce)
# Rules 2020, Ministry of Tourism helpline and adventure guidelines, MEA consular
# help, and TCS and GST rules for tour packages.
id: travel-agency
version: 2.0.0
name: Travel agency & tour operator
description: Trip queries, holiday and group tours, tickets and visas, cancellations and refunds, flight and trip disruptions, traveller emergencies, supplier bills and complaints for travel agencies and tour operators.
kind: industry
sector: trade-logistics-tourism
extends: [sector-trade-logistics-tourism, bookings-base]
match:
  keywords: [travel agency, travel agent, tour operator, tours and travels, holiday planner, tourism, trip planner, travel]

labels:
  Customer: Traveller
  Service: Package

entities:
  - name: Trip
    label: Trip
    title_field: destination
    list_columns: [travellerName, destination, startDate, travellers, status, budget]
    fields:
      - { name: travellerName, label: Lead traveller, type: string, required: true }
      - { name: phone, label: Phone, type: phone }
      - { name: email, label: Email, type: email }
      - { name: destination, label: Destination, type: string, required: true }
      - { name: startDate, label: Start date, type: date }
      - { name: endDate, label: End date, type: date }
      - { name: travellers, label: Travellers, type: integer }
      - { name: budget, label: Budget, type: money }
      - name: status
        label: Status
        type: enum
        required: true
        options: [enquiry, planning, quoted, booked, travelling, completed, cancelled]
      - { name: notes, label: Notes, type: text }
  - name: Itinerary
    label: Itinerary
    plural_label: Itineraries
    title_field: title
    list_columns: [trip, title, totalPrice, status]
    fields:
      - { name: trip, label: Trip, type: string, required: true }
      - { name: title, label: Title, type: string, required: true }
      - { name: days, label: Day-by-day plan, type: text, required: true }
      - { name: totalPrice, label: Total price, type: money }
      - name: status
        label: Status
        type: enum
        required: true
        options: [draft, sent, accepted, rejected]
  - name: Supplier
    label: Supplier
    title_field: name
    list_columns: [name, type, city, rating, commissionPercent]
    fields:
      - { name: name, label: Name, type: string, required: true }
      - name: type
        label: Type
        type: enum
        required: true
        options: [hotel, airline, transport, activity, guide, other]
      - { name: city, label: City, type: string }
      - { name: phone, label: Phone, type: phone }
      - { name: email, label: Email, type: email }
      - { name: rating, label: Rating, type: number }
      - { name: commissionPercent, label: Commission %, type: number }

  - name: Booking
    label: Booking
    description: A traveller's booking of a package or service, and the supplier who confirms it.
    title_field: customerName
    list_columns: [customerName, service, date, supplier, status, paymentStatus, amount]
    fields:
      - { name: customerName, label: Customer name, type: string, required: true }
      - { name: phone, label: Phone, type: phone }
      - { name: email, label: Email, type: email }
      - { name: service, label: Service, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: time, label: Time, type: string }
      - { name: partySize, label: People, type: integer }
      - { name: amount, label: Amount, type: money }
      - name: status
        label: Status
        type: enum
        required: true
        options: [requested, held, confirmed, cancelled, completed]
      - name: paymentStatus
        label: Payment
        type: enum
        options: [unpaid, requested, paid, refunded]
      - { name: notes, label: Notes, type: text }
      - { name: supplier, label: Supplier, type: string }
      - { name: supplierPhone, label: Supplier phone, type: phone }

tools:
  - name: suppliers.search
    description: Search hotels, transport, guides and activity suppliers.
    uses: records.search
    with: { entity: Supplier }
  - name: trips.search
    description: Search trips by traveller, destination or status.
    uses: records.search
    with: { entity: Trip }

agents:
  - role: trip-intake
    name: Trip intake
    description: Captures each travel enquiry as a Trip and drafts the first reply.
    job:
      mission: "Capture each travel enquiry as a trip and draft the first reply."
      customer_facing: true
      never:
        - "Paid bookings"
        - "Quoting prices not from a supplier"
        - "Emergency medical situations during travel"
    autonomy: 2
    tools: [trips.search, records.create, message.draft, knowledge.search, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 100000, money_per_task_inr: 0, max_steps: 15 }
  - role: itinerary-planner
    name: Itinerary planner
    description: Builds day-by-day itineraries from suppliers and the knowledge base, within the traveller's budget.
    job:
      mission: "Build day-by-day itineraries from suppliers and company knowledge, within the traveller's budget."
      customer_facing: false
      never:
        - "Paid bookings"
        - "Material itinerary changes without approval"
        - "Non-refundable hotel advances"
        - "Going over the traveller's budget"
    autonomy: 2
    tools: [suppliers.search, trips.search, knowledge.search, records.create, document.generate, human.handoff]
    model: { tier: frontier, fallback: standard, data_class: confidential }
    budgets: { tokens_per_task: 250000, money_per_task_inr: 0, max_steps: 30 }
  - role: booking-coordinator
    name: Booking coordinator
    description: Confirms supplier bookings for approved itineraries, collects payment and handles refunds.
    job:
      mission: "Confirm supplier bookings for approved itineraries, collect payment and handle refunds within policy."
      customer_facing: true
      never:
        - "Paid bookings without approval"
        - "Refunds"
        - "Cancellation penalties"
        - "Non-refundable hotel advances"
        - "Emergency medical situations during travel"
    autonomy: 4
    tools: [trips.search, records.search, records.create, booking.hold, booking.confirm, booking.cancel, payment.request, refund.issue, message.send, message.draft, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 200000, money_per_task_inr: 0, max_steps: 40 }

workflows:
  - id: new-enquiry
    name: New trip enquiry
    description: Capture the enquiry, then draft an itinerary.
    keywords: [enquiry, inquiry, trip, holiday, plan, itinerary, quote, honeymoon, package]
    trigger: { event: enquiry.received }
    steps:
      - key: capture-trip
        title: Capture the trip enquiry
        agent: trip-intake
        instructions: Create a Trip record with status enquiry and draft a warm first reply asking for any missing details.
      - key: draft-itinerary
        title: Draft an itinerary
        agent: itinerary-planner
        depends_on: [capture-trip]
        instructions: Search suppliers and the knowledge base, then write a day-by-day itinerary within budget and save it as a draft Itinerary.
  - id: itinerary-to-booking
    name: Itinerary to booking
    description: Book suppliers and collect payment for an accepted itinerary.
    keywords: [book, booking, confirm, accepted, payment, advance]
    steps:
      - key: book-suppliers
        title: Book suppliers and collect payment
        agent: booking-coordinator
        instructions: Create and confirm the Booking records for the accepted itinerary, then send a payment request for the advance.
  - id: disruption-response
    name: Disruption response
    description: Handle a cancelled flight, closed hotel or weather disruption.
    keywords: [disruption, cancelled, delay, flight, weather, rebook, refund]
    steps:
      - key: assess
        title: Assess affected trips
        agent: booking-coordinator
        instructions: Find affected trips and bookings and decide between rebooking and refunding.
      - key: inform-travellers
        title: Inform travellers
        agent: trip-intake
        depends_on: [assess]
        instructions: Draft a clear message to each affected traveller with the options.

policies:
  - id: confirm-booking
    action: booking.confirm
    require_approval: true
    reason: Confirming commits the agency to suppliers.
  - id: refund-above-5000
    action: refund.issue
    require_approval_above: { amount: 5000, currency: INR }
    reason: Refunds above ₹5,000 need owner approval.

kpis:
  - id: enquiry-response-time
    name: Enquiry response time
    description: Minutes from enquiry to first reply. Needs the WhatsApp/email connector.
    unit: minutes
    direction: down
    target: 30
  - id: quote-to-booking-rate
    name: Quote-to-booking rate
    description: Share of quoted trips that get booked. Needs trip history.
    unit: percent
    direction: up
  - id: refund-rate
    name: Refund rate
    description: Share of bookings refunded. Needs the payments connector.
    unit: percent
    direction: down
  - id: trips-booked
    name: Trips booked
    description: Trips currently booked.
    unit: count
    direction: up
    source: { type: records_count, entity: Trip, where: { status: booked } }

  - id: disruptions-sorted-in-4-hours
    name: Disruptions sorted in 4 hours
    description: Share of disruption files this month where every affected traveller had a confirmed new plan or a refund within 4 hours of the alert.
    unit: percent
    direction: up
    target: 90
  - id: happy-travellers
    name: Travellers rating us 4 or 5
    description: Share of travellers who give 4 or 5 out of 5 in the post-trip feedback this month.
    unit: percent
    direction: up
    target: 90

connectors: [booking-engine, whatsapp-business, razorpay, gmail]

lifecycle:
  case: { label: Trip file, plural: Trip files, prefix: TF }
  stages:
    request:
      name: Query or alert received
      description: A trip query, booking change, cancellation, complaint, supplier bill or alert (flight cancelled, road closed) comes in by WhatsApp, phone, email, the website or a walk-in, from a sub-agent or supplier, or from the booking system, and gets a file number and a first reply.
    review:
      name: Check details and documents
      description: The desk checks who is travelling, when, where, the budget and any booking reference, and the papers the trip needs, asks for anything missing, and stops a trip that cannot go ahead as asked, such as a passport that runs out too soon.
      checks:
        - Names exactly as on passport or photo ID, ages of children and seniors, and the traveller's own mobile and email
        - Dates, places, number of travellers, rooms and budget are clear
        - "Foreign trips: passport valid at least 6 months after the return date with 2 blank pages, visa and insurance rules checked for each country, PAN of the payer taken for TCS"
        - "Restricted places: Inner Line Permit for Arunachal Pradesh, Nagaland, Mizoram and Manipur, Lakshadweep entry permit, and a Protected Area Permit for foreign guests where needed"
        - "Changes, cancellations and refunds: booking reference, money paid and each supplier's cancellation rules found"
        - "Complaints and supplier bills: quote, vouchers, confirmations and messages pulled into the file"
        - Not a repeat of a file that is already open
    classify:
      name: Set type and urgency
      description: The file gets its type (holiday, group, tickets or visa, cancellation, disruption, emergency, supplier bill or complaint), priority, risk, reply-by and finish-by times, and the desk that owns it.
    assign:
      name: Assign consultant and deadline
      description: A travel consultant, ticketing executive, operations executive, duty manager or accountant is named for the file, with a deadline that beats supplier hold times, ticket time limits and free-cancellation dates.
    approve:
      name: Owner or manager approval
      description: When the rules need it, the named person approves before money or a promise goes out; safety steps in a traveller emergency never wait for this.
      checks:
        - Amount within the approver's limit, or the owner asked
        - "Group tours: costing, client contract and supplier deposits seen by the owner"
        - Emergency help already under way, not waiting for the approval
    execute:
      name: Book, pay and track
      description: Agents and staff quote, hold, confirm suppliers (each supplier confirmation needs approval), send payment links, tickets and vouchers, give 24x7 trip support, rebook, refund and pay suppliers, and every cost, message and deadline goes in the file.
    close:
      name: Settle and close file
      description: Someone other than the person who did the work checks the result and the money, the named role signs off where the rules ask for it, and the file is closed.
      checks:
        - "Bookings: every supplier confirmed in writing; confirmation, vouchers and payment receipt sent to the traveller"
        - "Money: payment received as agreed; GST invoice issued; TCS collected and shown for foreign packages"
        - "Refunds: paid to the original payment method with a written breakdown of charges; airline and supplier refunds received"
        - "Supplier bills: matched to the confirmation and paid only to verified bank details"
        - "Complaints: final written reply sent within one month of receipt"
        - "Group tours and emergencies: everyone home safe; incident notes and insurance claims filed"
    report:
      name: Feedback and monthly review
      description: Travellers are asked for feedback after the trip, and each month the owner reviews reply times, quote-to-booking rate, refunds, disruptions, complaints and supplier problems, files TCS and GST returns on time, and drops suppliers who keep failing.
  priorities:
    - { id: P1, name: "Emergency: traveller safety at risk", respond_within_hours: 0.25, resolve_within_hours: 24 }
    - { id: P2, name: "Urgent: travel date or money at stake", respond_within_hours: 1, resolve_within_hours: 120 }
    - { id: P3, name: Normal, respond_within_hours: 2, resolve_within_hours: 240 }
    - { id: P4, name: Routine, respond_within_hours: 24, resolve_within_hours: 360 }
  roles:
    - { id: operations-manager, name: Operations manager, approves: "Extra rebooking costs above ₹10,000 when a flight or trip is disrupted; signs off group tours and traveller emergencies once everyone is home safe" }
    - { id: accounts-manager, name: Accounts manager, approves: "Signs off every cancellation and refund once airline and supplier refunds are in and the traveller is paid back to the original payment method" }
  urgent_keywords: [fire, explosion, accident, collision, injured, injury, ambulance, unconscious, heart attack, drowned, drowning, gone missing, went missing, kidnapped, assaulted, molested, robbed, robbery, theft, stolen, food poisoning, gas leak, evacuate, evacuation, earthquake, avalanche, flash flood, cloudburst, tsunami, stampede, terror attack, bomb threat]
  categories:
    - id: customer-order
      name: Holiday or tour package
      keywords: [package, holiday, holiday package, tour package, package price, honeymoon, family trip, family holiday, family tour, trip, nights, itinerary, quote, quotation, best price, houseboat, hotel booking, book a hotel, need a hotel, resort, sightseeing, book a cab, cab booking, taxi booking, airport transfer, airport pickup, airport drop, car with driver, tempo traveller, yatra, pilgrimage, char dham, darshan, weekend getaway, plan a trip, plan our trip, ghumne jana]
      priority: P3
      risk: low
      department: Sales
      required_details:
        - { key: travelDates, label: Travel dates, kind: date }
        - key: travellers
          label: Number of travellers
          kind: keywords
          keywords: [adult, child, children, kid, infant, pax, people, persons, traveller, couple, member, guest, family of, parents, senior citizen]
      required_checks:
        - "Dates, places, number of adults and children (with ages), rooms and budget"
        - Lead traveller's name, mobile and email
        - "Foreign trips: passport valid 6 months after return, visa and insurance rules, PAN of the payer for TCS"
        - "Permits planned for restricted places (Inner Line Permit, Protected Area Permit)"
        - Hotels, cabs and activities from approved suppliers at rates valid for the travel dates
        - "Quote shows what is included and not included, GST and TCS, payment dates and cancellation charges"
        - "Payments of ₹2 lakh or more for one booking taken only by bank transfer, UPI or card, never in cash"
      not_eligible:
        - keywords: [fake bill, dummy bill, inflated bill, bill for a higher amount, higher amount on the bill, bill without travelling, bill without travel, only the bill for ltc, without bill, bina bill, no gst bill needed, without gst bill]
          reason: "We bill every booking with a proper GST invoice for the travel we actually book, at the price paid. We do not skip the bill or make fake or inflated bills for LTC or reimbursement claims."
      approval: { required: never }
      signoff: { required: false }
      workflow: new-enquiry
      execution: both
    - id: group-tour
      name: Group, school or adventure tour
      keywords: [package, trip, itinerary, quote, quotation, group tour, group trip, group booking, group package, group of, school trip, school tour, college trip, college tour, educational tour, study tour, industrial visit, excursion, students, teachers, corporate offsite, corporate tour, corporate group, offsite, employees, staff trip, mice, incentive trip, incentive tour, conference, destination wedding, wedding guests, room block, rooming list, trek, trekking, rafting, camping, adventure, paragliding, bike trip, per head, per student]
      priority: P3
      risk: medium
      department: Operations (groups)
      required_details:
        - key: headCount
          label: How many people
          kind: keywords
          keywords: [student, employee, people, pax, persons, member, guest, participant, delegate, teacher, adult, group of, pilgrim, yatri, devotee, senior citizen]
        - { key: travelDates, label: Travel dates, kind: date }
      required_checks:
        - "Head count, dates, room plan and budget per person; name-list and deposit deadlines from airlines and hotels"
        - "Costing sheet with margin, deposits and each supplier's cancellation terms"
        - "Written confirmation from the client (school, company or family) with the payment schedule"
        - "School trips: written permission from the school and every parent, staff list and medical notes, collected before departure"
        - "Adventure activities: operator following the Indian Adventure Tourism Guidelines, first-aid trained guides, certified gear, a signed risk waiver and the operator's age and fitness limits"
        - "Coaches and cabs: valid tourist permit (All India Tourist Permit on Vahan, or a state permit), fitness, insurance and a licensed driver"
        - "Emergency plan: nearest hospitals, 112, the insurer's number and our 24x7 duty phone"
      not_eligible:
        - keywords: [without parents consent, without parent consent, no consent letters, skip the consent letters, without consent letters, without school permission, without the principal s permission]
          reason: "We take school trips only with written permission from the school and every parent. Please send the consent letters first."
      approval: { required: always, role: owner }
      signoff: { required: true, role: operations-manager }
      workflow: new-enquiry
      execution: both
    - id: tickets-visa
      name: Tickets, visa or insurance
      keywords: [flight, flight ticket, air ticket, airfare, air fare, fare, fare quote, book a flight, ticket, pnr, train ticket, tatkal, irctc, rail ticket, bus ticket, sleeper bus, volvo bus, date change, change the date, name correction, web check-in, extra baggage, excess baggage, visa, e-visa, evisa, visa appointment, vfs, biometrics, passport, travel insurance, forex, one way, return ticket, round trip]
      priority: P3
      risk: low
      department: Ticketing and visas
      required_details:
        - { key: travelDate, label: Travel date, kind: date }
      required_checks:
        - Names exactly as on passport or photo ID
        - Traveller's own mobile and email in the airline booking (without them the airline owes no compensation for missed notices)
        - "Fare rules shown before issue: refundable or not, change fee, baggage"
        - Payment received before the ticket is issued
        - "Rail Tatkal: no agent bookings in the first 30 minutes after opening; the traveller confirms the Aadhaar OTP on their own mobile"
        - "Visa: passport valid 6 months after return with 2 blank pages, documents as per the embassy or VFS checklist, appointment booked; the embassy decides, so never promise a visa"
        - Travel insurance meets the visa rule and covers the whole trip
      not_eligible:
        - keywords: [work visa, work permit, job visa, employment visa, job abroad, overseas job, job offer abroad, gulf job, emigration clearance]
          reason: "Visas for jobs abroad must go through a recruiting agent registered with the Ministry of External Affairs on eMigrate (Emigration Act, 1983). We handle tourist, visit and business visas only."
        - keywords: [less than 6 months validity, less than six months validity, less than 6 months valid, validity less than 6 months, only 3 months validity, only 4 months validity, only 5 months validity, passport expiring soon, passport about to expire, passport is about to expire, passport expires soon]
          reason: "For most countries the passport must stay valid at least 6 months beyond the trip. The traveller renews it first through Passport Seva (Tatkal if urgent), and we apply for the visa once the new passport is in hand."
      approval: { required: never }
      signoff: { required: false }
      execution: both
    - id: return-refund
      name: Cancellation or refund
      keywords: [cancel, cancellation, cancel my, cancel our, cancel the, cancel my trip, cancel our trip, cancel the trip, cancel the package, cancel the booking, cancel the ticket, we cancelled, i cancelled, cancelled my booking, we cancelled our booking, want to cancel, have to cancel, need to cancel, refund, money back, paisa wapas, credit shell, no-show, not travelling, cannot travel, can't travel, unable to travel, unused night, how much will we get back, how much will i get back, how much refund]
      priority: P2
      risk: medium
      department: Operations and accounts
      required_details:
        - key: booking
          label: Which booking or ticket
          kind: keywords
          keywords: [booking, booked, pnr, ticket, voucher, invoice, file no, file number, booking id, package, trip, tour, in the name of, under the name]
      required_checks:
        - Cancellation asked for in writing by the person who booked
        - "Each supplier's cancellation charges applied by date, and no free-cancellation deadline missed"
        - "Airline tickets: refund claimed from the airline, which owns the refund for agent bookings; taxes and airport fees refunded even on non-refundable fares"
        - Credit shell only if the traveller chooses it
        - Our own service charge exactly as told before booking
        - Written refund breakdown sent; money back only to the original payment method
        - GST credit note issued for our invoice
      not_eligible:
        - keywords: [booked on makemytrip, booked on goibibo, booked on cleartrip, booked on yatra, booked on the airline website, booked directly with the airline, booked directly with the hotel, booked through another agent, booked with another agent, booked elsewhere, not booked through you, not booked with you]
          reason: "We can cancel and refund only bookings made through us. Bookings made elsewhere are cancelled with the website, airline or agent that took the money."
      approval: { required: above_amount, role: owner, amount_inr: 5000 }
      signoff: { required: true, role: accounts-manager }
      workflow: refund-request
      execution: both
    - id: transit-delay
      name: Flight or trip disruption
      keywords: [flight cancelled, flight canceled, flight cancellation, flight got cancelled, flight has been cancelled, flight is cancelled, flight was cancelled, flight got delayed, train got cancelled, train is cancelled, cancelled by the airline, cancelled by airline, flight delayed, flight delay, flight is delayed, delayed by, train delayed, train cancelled, train is late, schedule change, rescheduled, missed connection, missed flight, missed the flight, denied boarding, offloaded, overbooked, rebook, we are stuck, stuck due to, stuck because of, stuck at the airport, stuck at airport, stranded at the airport, stranded at airport, stuck at the station, stranded at the station, lost luggage, luggage lost, baggage lost, baggage delayed, bag not arrived, luggage not arrived, landslide, road closed, road blocked, heavy rain, snowfall, cyclone, strike, bandh, hartal, hotel cancelled, hotel has cancelled, cancelled our booking, cancelled our rooms, hotel overbooked, no booking at the hotel, no booking under, booking not found, reservation not found, no reservation, rooms not available, room not available, hotel refused, cab not arrived, cab did not come, cab didn't come, driver did not come, driver didn't come, driver not reachable, no pickup, pickup not done, vehicle breakdown, bus breakdown, broke down, stuck in traffic]
      priority: P2
      risk: medium
      department: Operations
      required_details:
        - key: booking
          label: Which flight, train, vehicle or booking
          kind: keywords
          keywords: [flight, airline, pnr, pir, baggage, luggage, train, bus, coach, cab, taxi, driver, vehicle, hotel, booking, package, tour, trip, group, guest, family]
      required_checks:
        - Every affected traveller, booking and onward connection listed
        - "Airline or supplier notice saved: time, reason, new plan"
        - "Airline duties claimed: alternate flight or full refund, meals or a hotel during long delays, compensation where the rules give it"
        - Traveller told the options in writing; any extra cost, and who pays it, agreed before booking
        - Onward hotels, cabs and tours moved to the new timing
      not_eligible:
        - keywords: [booked on makemytrip, booked on goibibo, booked on cleartrip, booked on the airline website, booked directly with the airline, booked through another agent, booked with another agent, booked elsewhere, not booked through you, not booked with you]
          reason: "The trip was not booked through us, so the airline or the agent who booked it must rebook or refund. We can offer a fresh booking."
      approval: { required: above_amount, role: operations-manager, amount_inr: 10000 }
      signoff: { required: false }
      workflow: disruption-response
      execution: both
    - id: traveller-emergency
      name: Traveller emergency
      keywords: [emergency, medical emergency, urgent help, help urgently, need help urgently, accident, met with an accident, injured, hurt, slipped, fracture, bleeding, hospital, hospitalised, hospitalized, ambulance, fainted, collapsed, heart attack, chest pain, breathless, altitude sickness, unconscious, food poisoning, lost passport, passport lost, passport stolen, passport missing, lost my wallet, lost his wallet, lost her wallet, lost my purse, lost her purse, lost wallet, lost purse, stolen, robbed, gone missing, went missing, not reachable, stranded, we are trapped, nowhere to stay, no place to stay, are they safe, is everyone safe, are you safe, is he safe, is she safe, safe or not, are they ok, are they okay, is everyone ok, is everyone okay, lost contact, no news of, no news from, not heard from, cannot reach them, can't reach them, flood, flash flood, cloudburst, earthquake, avalanche, tsunami, stampede, riot, curfew, evacuate, unsafe, harassed, molested, assaulted, died, madad chahiye, bachao]
      priority: P1
      risk: high
      department: Operations (24x7 duty desk)
      required_checks:
        - "Traveller safe now: 112 in India or the local emergency number abroad; hospital or police reached"
        - Family or emergency contact told
        - Insurer's assistance line told and a claim number taken
        - "Abroad: Indian embassy or consulate contacted; lost passport reported to the police and the mission for an Emergency Certificate; MADAD used for consular help"
        - "Foreign guests in India: the 24x7 tourist helpline 1800-11-1363 or 1363 can alert the authorities"
        - Every call, cost and decision written in the file
      approval: { required: high_risk_or_p1, role: owner }
      signoff: { required: true, role: operations-manager }
      workflow: delegate-work
      execution: both
    - id: supplier-payment
      name: Supplier bill or payment
      keywords: [supplier bill, supplier invoice, supplier payment, vendor bill, vendor invoice, vendor payment, hotel bill, hotel invoice, coach bill, cab bill, transport bill, transporter bill, dmc, dmc invoice, dmc payment, pending from us, due from us, outstanding from us, outstanding with us, we owe, hotel dues, hotel outstanding, asking for their payment, stop rooms, stop the rooms, will release the rooms, rooms will be released, attaching invoice, attached invoice, our invoice, pending invoice, release the payment, release payment, payment release, payment due, deposit, bsp, adm, agency debit memo, allotment, rate contract, bank details, change of bank account, payment not received, transfer did not reach, msme, udyam]
      priority: P3
      risk: medium
      department: Accounts
      required_details:
        - { key: amount, label: Bill amount, kind: amount }
      required_checks:
        - "Bill matches the confirmed booking: dates, rooms, people, rate and taxes"
        - "Customer's money for this trip received, or the owner agreed to pay first"
        - Supplier's GSTIN valid and the GST invoice correct
        - Bank details match the supplier record; any change confirmed by calling a number we already have
        - TDS deducted where it applies
        - "Paid by bank transfer; never more than ₹10,000 in cash to one supplier in a day"
        - "Paid before the supplier's deadline (room release date, BSP due date), and MSME suppliers within 45 days"
      approval: { required: above_amount, role: owner, amount_inr: 50000 }
      signoff: { required: false }
      execution: both
    - id: complaint
      name: Customer complaint
      keywords: [complaint, complain, disappointed, not happy, unhappy, worst, pathetic, horrible, dirty, unclean, smelled, smelly, no hot water, not as promised, not as shown, not what we paid for, rude, misbehaved, refused, cheated, overcharged, hidden charges, no reply, no response, no one answers, nobody answers, still not received, consumer court, consumer forum, consumer commission, legal notice, bad review, shikayat]
      priority: P2
      risk: medium
      department: Customer care
      required_checks:
        - Acknowledged within 48 hours with a complaint number
        - "Facts checked: quote, itinerary and vouchers against what happened, the supplier's side, photos, messages and call notes"
        - Supplier asked to fix or pay where it was their fault
        - Final written reply within one month of receipt
        - Any refund or goodwill amount raised as its own cancellation or refund file
      approval: { required: never }
      signoff: { required: true, role: grievance-officer }
      workflow: delegate-work
      execution: both
  examples:
    - { request: "Need a 5-night Andaman package for 2 adults from 10 March, 3-star hotels, budget ₹90,000", category: customer-order, priority: P3, approval: false }
