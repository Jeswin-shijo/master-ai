playbooks:
  - id: flight-disruptions
    title: Flight cancelled, delayed or overbooked
    source: DGCA Civil Aviation Requirements, Section 3, Series M, Part IV (facilities for denied boarding, cancellations and delays), paras 3.3, 3.4 and 3.8, as reproduced on Vikaspedia
    body: |
      1. Put the traveller's own mobile and email in every airline booking. Without them the airline owes no compensation for a change it could not tell them about.
      2. Cancelled with less than 2 weeks' notice (and up to 24 hours before departure): the airline must offer an alternate flight or a refund that the traveller accepts.
      3. Not told in time, or a missed connection on the same ticket: the airline gives an alternate flight, or a full refund plus compensation of ₹5,000, ₹7,500 or ₹10,000 for flights of up to 1 hour, up to 2 hours and longer, never more than the one-way basic fare plus fuel charge.
      4. Delays: meals and drinks once the delay reaches 2, 3 or 4 hours depending on flight length; a domestic delay over 6 hours means another flight within 6 hours or a full refund; a hotel when the delay passes 24 hours, or 6 hours for flights due between 8 pm and 3 am.
      5. Denied boarding on an overbooked flight: nothing if another flight leaves within 1 hour; otherwise 200% of the one-way basic fare plus fuel charge (up to ₹10,000) for a new flight within 24 hours, or 400% (up to ₹20,000) beyond that.
      6. Bad weather and other causes beyond the airline's control earn no compensation, but the refund or alternate flight still applies.
      7. Move onward hotels, cabs and tours to the new timing. Extra cost up to ₹10,000 can be spent at once; above that, or when the cost is not known yet, the operations manager approves first. If anyone is hurt, unsafe or without a place to stay, open a traveller emergency file.
  - id: travel-cancellations-refunds
    title: Cancellations, refunds and who approves them
    source: DGCA CAR Section 3, Series M, Part II (refund of airline tickets), as revised on 24 Feb 2026 and reported by PTI; Consumer Protection (E-Commerce) Rules, 2020, rule 4; this pack's approval rules (the trip file approval, approval to confirm or cancel a supplier booking, owner approval for refunds above ₹5,000, and the ₹2 lakh refund cap)
    body: |
      1. Take the cancellation in writing from the person who booked, and cancel with each supplier at once: hotel and cab charges rise as the travel date comes closer, and a no-show loses most of the money.
      2. Work out the refund from each supplier's rules and the fare rules, and send the traveller a written breakdown: what was paid, each charge kept and the refund due.
      3. Two approvals apply, and one does not cover the other. The first is the trip file's gate: above ₹5,000, or when the amount is not known yet, the owner approves the cancellation and the refund worked out, before anyone acts. The second comes when the money moves: the refund rule asks the owner again for any refund above ₹5,000, and cancelling a confirmed supplier booking always needs approval because it cannot be undone. The first approval says the refund is right; the second releases the money. Refunds above ₹2,00,000 are paid by a person outside the system.
      4. Airline tickets: under the revised DGCA rule the airline owns the refund for agent bookings and must finish it within 14 working days. Taxes and airport fees come back even on non-refundable fares and no-shows. Pass the money on as soon as it arrives. Check the current DGCA refund rule, as it has changed more than once.
      5. Within 48 hours of booking a ticket can be cancelled or changed free except for any fare difference, unless the flight is less than 7 days (domestic) or 15 days (international) away. Check each airline's rule for agent bookings.
      6. Offer money back by default and a credit shell only if the traveller chooses it. Never charge a cancellation fee we would not bear ourselves if we cancelled.
      7. Pay back to the original payment method within 14 days, issue a GST credit note, and the accounts manager signs off once the money is with the traveller.
  - id: foreign-tour-tcs-gst
    title: Foreign tour packages, PAN, TCS and GST
    source: Union Budget 2026-27 TCS changes (Business Today, 1 Feb 2026); GST notes after the 56th GST Council (TaxGuru, Taxaj)
    body: |
      1. Take the PAN of the person paying before taking any money for a foreign tour package.
      2. From 1 April 2026, collect TCS at 2% of the package price whatever the amount (before that: 5%, and 20% above ₹10 lakh). Without a PAN a higher rate applies. Confirm the current rate with your CA before quoting.
      3. Show TCS on the quote and the invoice; the traveller can set it off against their income tax.
      4. Deposit the TCS, file the quarterly TCS return on time and give the traveller the TCS certificate.
      5. Tour packages are usually billed at 5% GST without input tax credit. Hotel rooms up to ₹7,500 a night carry 5% from 22 September 2025, and 18% above that. On air tickets sold as an agent, GST is on our service charge, not the fare.
      6. Take ₹2 lakh or more for one booking only by bank transfer, UPI or card, never in cash.
  - id: traveller-emergency-on-trip
    title: Traveller emergency on a trip
    source: PIB on the Ministry of Tourism 24x7 tourist helpline, Dec 2024; MEA pages on consular grievances (MADAD) and the Indian Community Welfare Fund; Passport Seva lost-passport FAQ
    body: |
      1. Safety first and without waiting for any approval: call 112 in India or the local emergency number abroad, get the traveller to hospital or the police, then tell the family.
      2. Foreign guests in India can call the Ministry of Tourism's 24x7 helpline, 1800-11-1363 or 1363, in 12 languages; it can alert the authorities.
      3. Abroad, report a lost or stolen passport to the local police and the Indian embassy or consulate at once; the mission issues an Emergency Certificate to fly home after checking nationality.
      4. Raise consular help on MADAD (madad.gov.in). The Indian Community Welfare Fund can help Indians in distress abroad, on a means-tested basis.
      5. Call the insurer's assistance line before big hospital bills where possible, and keep every bill and report for the claim.
      6. The owner approves the money and trip changes (hospital deposit, new tickets, sending someone). The operations manager signs off when the traveller is safe or home and the claim papers are filed.
  - id: group-and-school-tours
    title: Group, school and adventure tours
    source: Ministry of Tourism guidelines for approval of adventure tour operators and the Indian Adventure Tourism Guidelines (with ATOAI); All India Tourist Vehicles (Authorisation or Permit) Rules, 2023 and the Vahan AITP portal
    body: |
      1. Make a costing sheet: head count, room plan, each supplier's rate, deposit and cancellation terms, and our margin. The owner approves it before any deposit goes out.
      2. Get written confirmation from the client (school, company or family) with the payment schedule, and collect the advance before paying suppliers.
      3. School trips: written permission from the school and every parent, the staff list and medical notes, all collected before departure.
      4. Adventure activities only with operators who follow the Indian Adventure Tourism Guidelines: first-aid trained guides, certified gear, a signed risk waiver, and their age and fitness limits.
      5. Coaches and cabs must have a valid tourist permit (All India Tourist Permit on Vahan, or a state permit), fitness certificate, insurance and a licensed driver.
      6. Send an escort with big groups, carry the rooming list and emergency plan (nearest hospitals, 112, the insurer's number, our 24x7 duty phone), and meet airline and hotel name-list deadlines.
      7. The operations manager signs off once everyone is home and every supplier bill is settled.

routines:
  - id: new-bookings
    name: New bookings
    description: The AI calls the sales desk each evening and adds the day's new bookings to the Bookings list.
    days: [1, 2, 3, 4, 5, 6]
    time: '19:00'
    collect:
      list: bookings
      ask: [customerName, phone, service, date, partySize, amount, supplier]
      defaults: { status: requested }
      who: the sales desk

registers:
  - id: bookings
    entity: Booking
    label: Bookings
    columns: [customerName, service, date, supplier, amount, status, paymentStatus]
    filters: [status, paymentStatus]
    date_field: date
    totals: [amount]
    card: { sum: { field: amount, when: { paymentStatus: [unpaid, requested] }, label: unpaid } }
    checks:
      - missing: [phone]
      - overdue: { date: date }
        when: { status: [requested, held] }
        why: travel date passed and still not confirmed
    follow_ups:
      - id: held-bookings
        label: Held bookings → the supplier
        who: party
        due: { expiring: { date: date, days: 7 } }
        when: { status: [held] }
        phone: { field: supplierPhone }
        contact: { field: supplier }
        about: [service, date, partySize]
        find_out: [status]
  - id: trips
    entity: Trip
    label: Trips
    columns: [travellerName, destination, startDate, endDate, travellers, budget, status]
    filters: [status]
    date_field: startDate
    totals: [budget]
    card: { count: { when: { status: [booked, travelling] }, label: booked or travelling } }
    checks:
      - limit: { fields: [endDate], min: startDate }
  - id: suppliers
    entity: Supplier
    label: Suppliers
    columns: [name, type, city, phone, rating]
    filters: [type]
    checks:
      - missing: [phone]
