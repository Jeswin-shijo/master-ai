# Sector base for essential public and service organizations: hospitals and
# clinics, schools, colleges and coaching, and municipal and citizen services.
# Ready-made types extend it; typed-in types borrow the closest ready-made type
# (other_org_types) or use it directly.
id: sector-public-services
version: 1.0.0
name: Essential Public & Service
description: Emergencies, repairs, certificates, fees and refunds, staff leave and complaints for hospitals and clinics, schools, colleges and coaching centres, and municipal and citizen service offices.
kind: base
sector: public-services
extends: [crm-base]

lifecycle:
  case: { label: Request, plural: Requests, prefix: REQ }
  stages:
    request:
      name: Request received
      description: A patient, parent, student, citizen, staff member or system raises a request, complaint or alert at the counter, by phone, WhatsApp, letter or a portal, and it gets a request number and an acknowledgement.
    review:
      name: Documents and eligibility check
      description: Staff and agents check who is asking, whether this service is theirs to give and whether the papers it needs are attached, and ask for anything missing; emergencies skip this and go straight to the people on duty.
      checks:
        - "Who is asking is confirmed: the person, a parent or guardian, or someone they authorised in writing"
        - This office gives this service to this person (our patient, our student or a resident of our area)
        - Papers the service needs are attached and readable (ID, form, receipt, earlier reports)
        - Aadhaar used only with consent and stored masked
        - Life or safety at risk? Send it to the people on duty at once and mark it P1; emergencies never wait for papers
        - Not a repeat of a request that is already open or done
    classify:
      name: Urgency and department
      description: The request gets its type, priority (P1 to P4), risk and department, which starts the clock for its service time limit.
    assign:
      name: Assign in-charge and deadline
      description: The department head names the person in charge and sets a deadline inside the notified service time limit, so the person who asked knows who is handling it.
    approve:
      name: Approval by authority
      description: The officer with the power to decide approves or rejects in writing, never the person who prepared the work, and no money is paid out before this step.
    execute:
      name: Service and follow-up
      description: The team and agents give the service, keep the person who asked updated, and track progress, cost and papers against the deadline.
    close:
      name: Verify and sign off
      description: Someone other than the person who did the work checks the result, the named role signs off and the person who asked gets a written reply.
      checks:
        - Service given as asked, or the reason it could not be given written down
        - Certificates and record copies checked against the register and signed by the authorised signatory
        - Refunds paid into the payer's own account, with the receipt and ledger updated
        - Report sent to the police or the authority where the law needs one
        - Written reply sent to the person who asked, saying where to appeal if they are not satisfied
    report:
      name: Reports and review
      description: Each month the team reviews requests that missed their time limit, complaints, emergencies and repeat problems, sends the reports the department, board or regulator needs, and fixes the causes that keep coming back.
  priorities:
    - { id: P1, name: "Emergency: life or safety at risk", respond_within_hours: 0.25, resolve_within_hours: 24 }
    - { id: P2, name: "Urgent: service stopped or deadline close", respond_within_hours: 2, resolve_within_hours: 72 }
    - { id: P3, name: "Normal: within the service time limit", respond_within_hours: 24, resolve_within_hours: 168 }
    - { id: P4, name: Routine, respond_within_hours: 48, resolve_within_hours: 360 }
  roles:
    - { id: head-of-institution, name: Head of institution, approves: "Staff leave, and refunds, waivers and concessions above ₹10,000 (the medical superintendent, principal or ward officer)" }
    - { id: safety-officer, name: Safety officer, approves: "Signs off emergencies and safety incidents once the place is safe, the injured are cared for and the police or authority are told" }
    - { id: grievance-officer, name: Grievance officer, approves: "Signs off the written reply to every complaint and grievance (public grievance officer, patient relations or student grievance committee)" }
    - { id: accounts-head, name: Accounts head, approves: "Signs off refunds and fee or bill corrections once the money has reached the payer's own account and the ledger matches" }
    - { id: records-officer, name: Records officer, approves: "Signs certificates and record copies after checking them against the register (medical records in-charge, school office superintendent or registrar)" }
    - { id: estate-officer, name: Estate and maintenance officer, approves: Signs off repairs and building services once the work is checked and the bills match }
