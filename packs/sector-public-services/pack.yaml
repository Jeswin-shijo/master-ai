playbooks:
  - id: sector-grievance-time-limit
    title: Handling a grievance within the time limit
    source: State Right to Public Services Acts (for example the Madhya Pradesh Lok Sewaon Ke Pradan Ki Guarantee Adhiniyam, 2010 and the Karnataka Sakala Services Act, 2011); DARPG comprehensive guidelines for handling public grievances on CPGRAMS, 2024; Charter of Patients' Rights and Responsibilities, 2021; UGC (Redressal of Grievances of Students) Regulations, 2023
    body: |
      1. Log every complaint from any channel (counter, phone, WhatsApp, letter, CPGRAMS or the state grievance portal) with a number and date, and acknowledge it the same day in the person's language.
      2. Never ask the person to write it again in a set format before you start. Nobody named in the complaint handles it.
      3. Get the facts: registers, CCTV, bills, call records and the staff member's side.
      4. Fix what can be fixed now (correct a bill, issue the delayed certificate, repair the fault) and tell the person what you did.
      5. Send a final written reply within the time limit: the days notified for that service under your state's Right to Services Act, 21 days for a CPGRAMS grievance, 15 working days for a college grievance committee, or your own published limit (many hospitals use 7 days).
      6. The reply says what was done, what will change and where to appeal: the first appellate officer under the Right to Services Act, the district registering authority for a clinic, or the Ombudsperson for a college. Officers who miss the notified time without good reason can be fined under most state acts.
      7. Complaints about safety, abuse of a child or a patient, or a bribe are not ordinary complaints. Raise them as an emergency or report them to the police or the vigilance officer the same day.
      8. The grievance officer signs off every final reply. Each month, count complaints by cause and fix the cause that keeps coming back.
  - id: sector-emergency-safety
    title: Emergencies and safety incidents
    source: Supreme Court, Parmanand Katara v. Union of India (1989); Motor Vehicles Act, 1988, section 134A (Good Samaritans); POCSO Act, 2012, sections 19 and 21; Disaster Management Act, 2005; National Building Code of India, 2016, Part 4 (fire and life safety); NDMA School Safety Policy Guidelines, 2016
    body: |
      1. Life first. Call 112 (or 108 for an ambulance and 101 for fire) and give first aid. A hospital treats an emergency patient at once; a deposit, papers or police formalities never come first.
      2. Make the place safe: switch off power or gas, move people out by the fire exits (never by the lift), and cordon off the area.
      3. Tell the head of institution and the family or guardian at once.
      4. Tell the police when the law needs it: accidents, assaults, burns, poisoning and missing persons. Anyone who suspects sexual abuse of a child must tell the police or the Special Juvenile Police Unit at once; not reporting is a crime, and the head of an institution faces up to 1 year in jail for staff under them.
      5. A person who brings a road accident victim is free to go and is never made to pay or give their details.
      6. Keep the evidence: CCTV, registers, photos and the names of witnesses. Do not clean up the spot until the police say so.
      7. Report to the department, district authority or regulator within the time its rules set, and record near misses the same day even when nobody was hurt.
      8. Within 7 days find the cause, give each fix to a named person with a date, and check it worked. Run a fire and evacuation drill at least twice a year and keep fire extinguishers and the fire NOC current.
  - id: sector-certificates-records
    title: Issuing certificates and records with consent and privacy
    source: Registration of Births and Deaths Act, 1969 (as amended in 2023); Indian Medical Council (Professional Conduct, Etiquette and Ethics) Regulations, 2002, regulation 1.3.2; Right to Information Act, 2005; Digital Personal Data Protection Act, 2023; Aadhaar Act, 2016; state Right to Public Services Acts
    body: |
      1. Confirm who is asking: the person the record is about, a parent or guardian of a minor, someone with a signed authority letter, or a police or court order. Check an ID; if you take Aadhaar, use it only with consent and keep it masked (last four digits).
      2. Records about a person go only to that person or someone they authorised. Never read them out to an unknown caller; hand them over against signature or send them only to the registered email or address.
      3. Check every detail against the register before signing: name spelling, date of birth, parents' names, dates of admission or treatment. A correction needs a supporting document and a dated note in the register; never overwrite the original entry.
      4. Issue on time: medical record copies within 72 hours of the request; births and deaths registered within 21 days of the event; a school transfer certificate promptly (at once for Classes 1 to 8 under the RTE Act) and never held back to collect fees; services notified under your state's Right to Services Act within the notified days.
      5. Public offices answer requests under the Right to Information Act within 30 days, or 48 hours where someone's life or liberty is at stake. Treat these separately from service requests.
      6. The authorised signatory (records officer, registrar, principal or medical superintendent) signs. Keep a copy and an entry in the issue register: who asked, what was given, when and why.

kpis:
  - id: requests-within-time-limit
    name: Requests done within the time limit
    description: Share of requests this month closed within their service time limit.
    unit: percent
    direction: up
    target: 95
  - id: emergency-response-minutes
    name: Time to respond to an emergency
    description: Average minutes from an emergency or safety incident being raised to the first person on duty reaching it.
    unit: minutes
    direction: down
    target: 15
  - id: complaints-on-time
    name: Complaints answered on time
    description: Share of complaints this month that got a final written reply within the time limit.
    unit: percent
    direction: up
    target: 100
  - id: certificates-on-time
    name: Certificates issued on time
    description: Share of certificates and record copies this month issued within the notified number of days.
    unit: percent
    direction: up
    target: 95

