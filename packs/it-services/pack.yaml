    - { request: Send a quote for 15 Microsoft 365 Business Basic licences for Patil Constructions, category: purchase-request, priority: P4, approval: true }
    - { request: "Annual maintenance contract for Sai Clinic ends on 30 November, prepare the renewal quote for 12 desktops and 2 printers", category: purchase-request, priority: P4, approval: true }
    - { request: "Two black cartridges for the Canon printer at reception please, ₹1,850 each", category: purchase-request, priority: P4, approval: false }
    - { request: Plan the email migration for Mehta Associates from their old Exchange server to Microsoft 365 on the weekend of 8 November, category: change-release, priority: P4, approval: true }
    - { request: Add a firewall rule at Rathi Textiles so the new ERP vendor can connect by VPN from Monday, category: change-release, priority: P4, approval: true }
    - { request: Apply this month's Windows security patches to the three servers at Om Logistics on Sunday 7 to 9 am, category: change-release, priority: P4, approval: true }
    - { request: "Internet at the Surat branch drops every evening around 7, we need the root cause and a permanent fix", category: repeat-problem, priority: P4, approval: false }
    - { request: "The same Outlook password prompt keeps coming back on six laptops, please find out why", category: repeat-problem, priority: P4, approval: false }
    - { request: "Second complaint this week: your engineer left the server rack unlocked after the visit", category: complaint, priority: P2, approval: false }
    - { request: "We pay ₹45,000 a month for the AMC and still wait two days for every visit. Explain this or we will cancel the contract", category: complaint, priority: P2, approval: false }
    - { request: "Engineer Rakesh was rude to our director on the phone, I want to escalate this", category: complaint, priority: P2, approval: false }

playbooks:
  - id: major-outage
    title: "Major outage: get people working first"
    source: ITIL 4 incident management and change enablement practices; common escalation-matrix practice at Indian managed service providers (house defaults; each client's contract decides the times)
    body: |
      1. Raise a P1 when a client's business has stopped or many people cannot work: billing, dispatch, mail, internet or a main server. One named engineer leads until it is fixed.
      2. Call the client's escalation contact within 15 minutes and open a bridge call or WhatsApp group. Update them every 30 minutes, even when there is no news.
      3. Check for signs of an attack first (ransom note, strange logins, data going out). If there are any, open a security incident too, because the CERT-In 6-hour clock is running.
      4. Get people working with a workaround first: the backup internet link, a standby server or device, manual billing. Find the cause after.
      5. Failover, restarting a production server or rolling back a change needs the change manager's OK by phone, written up within 1 working day.
      6. Log a case with the internet provider or device maker at once and write the docket number on the ticket.
      7. Escalate before the clock runs out: team lead at half the fix time, service delivery manager at three quarters, owner when it is breached.
      8. When the client confirms work has restarted, record the downtime for the SLA report and send the root-cause report within 5 working days.
  - id: amc-fix-times
    title: Fix it within the contract time
    source: AMC tenders of Indian Bank (2021), ELCOT, CBSE and a central government AMC tender on mpa.gov.in; BIS RFP corrigendum, 7 January 2019 (severity 1 answered in 30 minutes, fixed or worked around in 2 hours)
    body: |
      1. The SLA clock starts when the call is logged. Give the caller the ticket number at once.
      2. Check the cover. A comprehensive AMC covers on-site service and spare parts; a non-comprehensive AMC covers labour only. Consumables such as toner, cartridges, printer heads and UPS batteries are always charged.
      3. Devices that are not covered (AMC ended, not on the device list, personal devices) get a quote for a paid visit or an AMC renewal, not free service.
      4. Chargeable parts need the client's written OK on the quote before they are fitted.
      5. Bank and government AMCs usually want desktop and printer faults fixed within 24 hours in metro and urban areas and 48 hours elsewhere. If a repair will take longer, leave a standby device. Critical systems often have much tighter times, such as an answer in 30 minutes and a fix or workaround in 2 hours.
      6. Late fixes cost money: tenders charge a penalty per device per day (often ₹100 to ₹500) or a share of the fee. Know each client's terms.
      7. Connect to a user's computer only with their OK, every time.
      8. Close the call only when the user signs the service report or gives the closing OTP.
  - id: client-security-incident
    title: Security incident on a client's systems
    source: CERT-In Directions under section 70B(6) of the IT Act, 2000 (28 April 2022) and CERT-In FAQs (May 2022); IT Act section 70B(7); Digital Personal Data Protection Act, 2023, section 8, and DPDP Rules, 2025, rule 7 (in force from 13 May 2027)
    body: |
      1. Treat every suspected attack on a client's systems as P1 from the moment anyone notices it, including an alert from our security (SOC) partner.
      2. Contain it with the security lead on the phone: cut the device off the network, block sign-in and reset the password, end sessions, remove mail forwarding rules and unknown admins, and block the sender or IP address. Do not wipe anything yet.
      3. Keep the evidence: logs, mails with headers, screenshots, and the list of affected systems, accounts and data.
      4. Tell the client's named contact in writing at once: what happened, which systems, data and people, and what we have done. On client systems we usually handle personal data for the client, so the client decides what is told to whom.
      5. Report to CERT-In within 6 hours of noticing (incident@cert-in.org.in, 1800-11-4949) with what we know, and send updates later. Agree with the client who files it; whoever notices the incident must make sure it is reported, and a contract cannot pass that duty away. The security lead approves the report.
      6. If personal data is involved, give the client what it needs the same day: from 13 May 2027 it must tell affected people and the Data Protection Board without delay and send the Board a full report within 72 hours.
      7. If money was lost, the client reports it at cybercrime.gov.in or on helpline 1930 at once.
      8. Restore only from clean backups, reset passwords, turn on MFA, close the way in and open a root-cause ticket. Not reporting to CERT-In can mean up to 1 year in jail, a fine of up to ₹1 lakh, or both.
  - id: joiners-and-exits
    title: New users, exits and access
    source: ISO/IEC 27001:2022 Annex A controls 5.15 to 5.18 (access control, identity, passwords and access rights) and 8.2 (privileged access); Digital Personal Data Protection Act, 2023, section 8(5) (reasonable security safeguards)
    body: |
      1. Act on new user, access and exit requests only with a written OK from the client's HR, the reporting manager or a person on the client's list of authorised approvers.
      2. Give only the access the job needs. Admin rights, VPN, finance systems (Tally, banking, payroll) and folders with personal data need the approver's OK by name.
      3. New users: create the account with a temporary password sent separately, turn on two-step login (MFA) before hand-over, and record the access given against the person.
      4. Password resets and unlocks: confirm who is asking by calling back the registered mobile, never the number given in the request.
      5. Exits: turn off email, VPN and app access at the end of the last working day, or at once if the person was asked to leave. Hand mail and files to the named person, collect the laptop and change any shared passwords the person knew.
      6. Each quarter, review every client's users and admins with the client and remove accounts nobody claims.
      7. Keep the written OK with the ticket.
  - id: old-devices-ewaste
    title: Retiring old devices and e-waste
    source: E-Waste (Management) Rules, 2022 (in force from 1 April 2023) and CPCB FAQs on the rules; NIST SP 800-88, Guidelines for Media Sanitization
    body: |
      1. Retire a device only on the client's written instruction, listing each asset tag and serial number.
      2. Back up and hand over any data the client wants to keep.
      3. Wipe every disk with a tool that overwrites or securely erases the whole disk, or destroy the disk. Give the client a wipe certificate that lists the serial numbers.
      4. Hand e-waste only to a CPCB-registered recycler or refurbisher, or the maker's take-back scheme, never to a scrap dealer, and keep the receipt. Most client companies, banks, hospitals and offices are bulk consumers under the rules and must do this.
      5. Mark the device as retired or recycled in the device list, with the date and the certificate number.
      6. Sell, return or donate working devices only after the wipe and with the client's written OK.

kpis:
  - id: sla-met
    name: Tickets fixed within SLA
    description: Tickets closed before the fix time in the client's contract (or the default for their priority), as a share of all tickets closed this month.
    unit: percent
    direction: up
    target: 95
  - id: p1-restore-time
    name: Time to get people working in a P1
    description: Average hours from a P1 ticket being raised to the client's people working again; a workaround counts.
    unit: hours
    direction: down
    target: 4
  - id: first-contact-fix
    name: Fixed on first contact
    description: Fault tickets fixed on the first call, chat or remote session, with no hand-over or visit, as a share of all fault tickets this month.
    unit: percent
    direction: up
    target: 70
  - id: client-satisfaction
    name: Client satisfaction
    description: Closed tickets rated good or very good, as a share of all ratings received this month.
    unit: percent
    direction: up
    target: 90
  - id: open-incidents
    name: Open outages and security incidents
    description: Major outages and security incidents still open.
    unit: count
    direction: down
    source: { type: records_count, entity: Incident, where: { status: open } }
  - id: renewals-due
    name: Contracts due for renewal
    description: Client contracts marked as due for renewal and not yet renewed.
    unit: count
    direction: down
    source: { type: records_count, entity: Contract, where: { status: renewal-due } }

connectors: [gmail, whatsapp-business]

registers:
  - id: tickets
    entity: Ticket
    label: Tickets
    columns: [ticketNo, clientName, summary, kind, priority, assignedTo, dueBy, status]
    filters: [kind, priority, status]
    date_field: raisedAt
    card: { count: { when: { status: [new, assigned, in-progress, waiting-for-client, reopened] }, label: open } }
    checks:
      - missing: [clientName, assignedTo]
      - overdue: { date: dueBy }
        when: { status: [new, assigned, in-progress, waiting-for-client, reopened] }
      - duplicate: [ticketNo]
    follow_ups:
      - id: overdue-tickets
        label: Overdue tickets → the engineer
        who: staff
        due: { overdue: { date: dueBy } }
        when: { status: [new, assigned, in-progress, waiting-for-client, reopened] }
        staff: { field: assignedTo }
        about: [ticketNo, clientName, summary, dueBy]
        find_out: [status, dueBy]
  - id: incidents
    entity: Incident
    label: Incidents
    columns: [title, clientName, kind, noticedAt, usersAffected, status]
    filters: [kind, status, personalDataInvolved]
    date_field: noticedAt
    card: { count: { when: { status: [open, contained] }, label: open } }
    checks:
      - missing: [certInReportedAt]
        when: { kind: [security, data-breach] }
        why: CERT-In must be told within 6 hours
      - missing: [clientToldAt]
      - missing: [rootCause]
        when: { status: [rca-sent, closed] }
  - id: assets
    entity: Asset
    label: Assets
    columns: [assetTag, clientName, deviceType, usedBy, coveredBy, warrantyEndsOn, status]
    filters: [deviceType, coveredBy, status]
    checks:
      - expiring: { date: warrantyEndsOn, days: 30 }
        when: { status: [in-use, in-repair, standby] }
      - missing: [wipeCertificate]
        when: { status: [retired, recycled] }
  - id: contracts
    entity: Contract
    label: Contracts
    columns: [clientName, contractNumber, contractType, endsOn, monthlyFee, status]
    filters: [contractType, status]
    date_field: startsOn
    totals: [monthlyFee]
    card:
      count: { when: { status: [active] }, label: active }
      sum: { field: monthlyFee, when: { status: [active] }, label: a month }
    checks:
      - expiring: { date: endsOn, days: 45 }
        when: { status: [active, renewal-due] }
