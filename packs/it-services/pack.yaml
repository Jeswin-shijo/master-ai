# Ready-made pack: IT services and managed support companies (MSPs, IT support
# and AMC firms, system integrators, network and server support teams) that
# look after client companies under contract. Built from researched Indian
# practice: CERT-In Directions 2022, the DPDP Act 2023 and Rules 2025, the
# E-Waste (Management) Rules 2022, bank and government AMC tenders, ITIL 4
# incident, change and problem practice, and ISO/IEC 27001:2022 access controls.
id: it-services
version: 1.0.0
name: IT services & support
description: Outages, security incidents and CERT-In reports, server, network and backup faults, laptop and printer support, new users and exits, purchases and AMC renewals, changes to client systems, complaints and root-cause reports for IT services and managed support companies.
kind: industry
sector: technology-innovation
extends: [sector-technology-innovation, projects-base]
match:
  keywords:
    - it services
    - it services company
    - it company
    - it support
    - it support company
    - it support services
    - managed it services
    - managed it support
    - managed services provider
    - managed service provider
    - msp
    - it solutions
    - it solutions company
    - it infrastructure
    - it infrastructure services
    - it service provider
    - it helpdesk
    - it outsourcing
    - it amc
    - computer amc
    - computer maintenance
    - desktop support
    - network support
    - network and server support
    - server support
    - server and network support
    - networking solutions
    - it hardware and networking
    - system integrator
    - systems integrator
    - remote it support
    - it facility management

labels:
  Customer: Client

entities:
  - name: Contract
    label: Client contract
    plural_label: Client contracts
    description: The AMC or managed services contract with a client company, with what it covers, its SLA times and who may approve and be told.
    title_field: clientName
    list_columns: [clientName, contractType, supportHours, endsOn, status]
    fields:
      - { name: clientName, label: Client company, type: string, required: true }
      - { name: contractNumber, label: Contract number, type: string, required: true }
      - name: contractType
        label: Contract type
        type: enum
        required: true
        options: [comprehensive-amc, non-comprehensive-amc, managed-services, resident-engineer, per-call]
      - { name: startsOn, label: Starts on, type: date }
      - { name: endsOn, label: Ends on, type: date }
      - name: supportHours
        label: Support hours
        type: enum
        options: [24x7, business-hours, extended-hours]
      - name: areaType
        label: Area
        type: enum
        options: [metro, urban, other]
      - { name: devicesCovered, label: Devices covered, type: integer }
      - { name: monthlyFee, label: Monthly fee, type: money }
      - { name: p1FixHours, label: P1 fix within (hours), type: number }
      - { name: penaltyPerDay, label: Penalty per late day, type: money }
      - { name: escalationContact, label: Client escalation contact, type: string }
      - { name: escalationPhone, label: Escalation contact phone, type: phone }
      - { name: authorisedApprovers, label: People who can approve access and purchases, type: text }
      - { name: dataProtectionEmail, label: Who to tell about a data breach, type: email }
      - name: status
        label: Status
        type: enum
        required: true
        options: [active, renewal-due, ended, on-hold]
  - name: Asset
    label: Device
    plural_label: Devices
    description: A laptop, desktop, printer, server, network device or other equipment we look after for a client.
    title_field: assetTag
    list_columns: [assetTag, clientName, deviceType, usedBy, coveredBy, status]
    fields:
      - { name: assetTag, label: Asset tag, type: string, required: true }
      - { name: clientName, label: Client company, type: string, required: true }
      - name: deviceType
        label: Type
        type: enum
        required: true
        options: [laptop, desktop, printer, scanner, server, nas, switch, firewall, access-point, cctv, ups, biometric, other]
      - { name: makeModel, label: Make and model, type: string }
      - { name: serialNumber, label: Serial number or service tag, type: string }
      - { name: usedBy, label: Used by, type: string }
      - { name: location, label: Location, type: string }
      - name: coveredBy
        label: Covered by
        type: enum
        options: [comprehensive-amc, non-comprehensive-amc, warranty, none]
      - { name: warrantyEndsOn, label: Warranty ends on, type: date }
      - { name: lastServicedOn, label: Last serviced on, type: date }
      - name: status
        label: Status
        type: enum
        required: true
        options: [in-use, in-repair, standby, retired, recycled]
      - { name: wipeCertificate, label: Data wipe certificate number, type: string }
  - name: ClientUser
    label: Client staff member
    plural_label: Client staff
    description: A person at a client company whose accounts and access we manage.
    title_field: fullName
    list_columns: [fullName, clientName, department, status, lastWorkingDay]
    fields:
      - { name: fullName, label: Full name, type: string, required: true }
      - { name: clientName, label: Client company, type: string, required: true }
      - { name: email, label: Work email, type: email }
      - { name: mobile, label: Registered mobile, type: phone }
      - { name: department, label: Department, type: string }
      - { name: reportingManager, label: Reporting manager, type: string }
      - { name: joinedOn, label: Joined on, type: date }
      - { name: lastWorkingDay, label: Last working day, type: date }
      - { name: accessList, label: Systems and folders they can open, type: text }
      - { name: approvedBy, label: Access approved by, type: string }
      - { name: mfaOn, label: Two-step login (MFA) on, type: boolean }
      - name: status
        label: Status
        type: enum
        required: true
        options: [joining, active, leaving, disabled]
  - name: Incident
    label: Outage or security incident
    plural_label: Outages and security incidents
    description: A major outage or security incident at a client, with the clocks that matter for the SLA, CERT-In and the root-cause report.
    title_field: title
    list_columns: [title, clientName, kind, noticedAt, status]
    fields:
      - { name: title, label: What happened, type: string, required: true }
      - { name: clientName, label: Client company, type: string, required: true }
      - name: kind
        label: Kind
        type: enum
        required: true
        options: [outage, security, data-breach]
      - { name: noticedAt, label: Noticed or reported at, type: datetime, required: true }
      - { name: restoredAt, label: Work restarted or contained at, type: datetime }
      - { name: usersAffected, label: Users affected, type: integer }
      - { name: personalDataInvolved, label: Personal data involved, type: boolean }
      - { name: clientToldAt, label: Client told in writing at, type: datetime }
      - { name: certInReportedAt, label: Reported to CERT-In at, type: datetime }
      - { name: certInReference, label: CERT-In reference, type: string }
      - { name: rootCause, label: Root cause, type: text }
      - { name: rcaSentOn, label: Root-cause report sent on, type: date }
      - name: status
        label: Status
        type: enum
        required: true
        options: [open, contained, restored, rca-sent, closed]

  - name: Ticket
    label: Ticket
    description: A task, fault, bug, service or access request from a client.
    title_field: summary
    list_columns: [ticketNo, clientName, summary, priority, assignedTo, status]
    fields:
      - { name: ticketNo, label: Ticket no., type: string }
      - { name: clientName, label: Client, type: string, required: true }
      - { name: raisedBy, label: Raised by, type: string }
      - name: kind
        label: Kind
        type: enum
        options: [fault, service-request, access-request, bug, change, task]
      - { name: summary, label: Summary, type: string, required: true }
      - { name: details, label: Details, type: text }
      - { name: priority, label: Priority, type: enum, options: [P1, P2, P3, P4] }
      - { name: assetTag, label: Asset tag, type: string }
      - { name: assignedTo, label: Assigned to, type: string }
      - { name: raisedAt, label: Raised at, type: datetime }
      - { name: dueBy, label: Due by, type: datetime }
      - { name: resolvedAt, label: Resolved at, type: datetime }
      - { name: resolution, label: Resolution, type: text }
      - name: status
        label: Status
        type: enum
        options: [new, assigned, in-progress, waiting-for-client, resolved, closed, reopened]

tools:
  - name: contracts.search
    description: Search client contracts by client, contract number, type or status, to see what is covered and the SLA times.
    uses: records.search
    with: { entity: Contract }
  - name: assets.search
    description: Search client devices by asset tag, serial number, user, type or cover.
    uses: records.search
    with: { entity: Asset }
  - name: client_users.search
    description: Search a client's staff by name, department or status, with the access each person has.
    uses: records.search
    with: { entity: ClientUser }
  - name: client_user.record
    description: Record a client staff member who is joining or leaving, with the access asked for and who approved it. It records the request; an engineer makes the account change.
    uses: records.create
    with: { entity: ClientUser }
  - name: incidents.search
    description: Search outages and security incidents by client, kind or status.
    uses: records.search
    with: { entity: Incident }
  - name: incident.log
    description: Record an outage or security incident with the time it was noticed, which starts the SLA and CERT-In clocks.
    uses: records.create
    with: { entity: Incident }

agents:
  - role: service-desk
    name: Service desk
    description: Logs client calls and mails as tickets, checks the contract and device cover, walks users through simple fixes, handles new users, exits and access after the written OK, prepares quotes and AMC renewals, handles complaints, and sends field engineers by phone.
    job:
      mission: "Log client calls as tickets, check contract cover, guide simple fixes, handle user access after written approval and prepare quotes."
      customer_facing: true
      never:
        - "Access changes without written approval"
        - "Releasing passwords or API keys"
        - "Deletions"
        - "Signing client agreements"
        - "Production releases"
    instructions: Give every caller the ticket number and when they will hear from us next. Reset passwords only after calling back the registered mobile. Never create, change or remove access without the written OK the rules ask for, and never order anything before the client's written OK on the quote. Connect to a user's computer only with their OK, every time.
    autonomy: 3
    tools: [contracts.search, assets.search, client_users.search, client_user.record, records.search, records.create, records.update, knowledge.search, document.generate, message.draft, message.send, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 120000, money_per_task_inr: 0, max_steps: 25 }
  - role: noc-desk
    name: Network and server desk (NOC)
    description: Watches monitoring alerts, runs outages and server, network and backup faults, keeps the client's escalation contact updated, logs cases with internet providers and device makers, prepares change records and downtime notices, and drafts root-cause reports.
    job:
      mission: "Watch monitoring alerts, run outages and faults, keep clients informed and draft change records and root-cause reports."
      customer_facing: true
      never:
        - "Production releases"
        - "Data migrations"
        - "Access changes"
        - "Security-sensitive changes"
        - "Deletions"
    instructions: In an outage, get people working first with a workaround and find the cause after. Never restart, fail over or change a client system yourself; the change manager okays it and an engineer does it. Update the client every 30 minutes on a P1 until work has restarted. If you see signs of an attack, raise a security incident at once.
    autonomy: 3
    tools: [contracts.search, assets.search, incidents.search, incident.log, records.search, records.update, knowledge.search, document.generate, message.draft, message.send, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }
  - role: security-desk
    name: Security desk
    description: Records security incidents with the time they were noticed, phones the security lead and the client at once, lists the containment steps and the evidence to keep, and drafts the CERT-In report and the client's written notice.
    job:
      mission: "Record security incidents, phone the security lead and the client at once and draft the CERT-In report and client notice."
      customer_facing: false
      never:
        - "Security-sensitive changes"
        - "Releasing passwords or API keys"
        - "Deletions of evidence"
        - "Filing reports without sign-off"
        - "Access changes"
    instructions: Start the CERT-In 6-hour clock from the moment anyone noticed or told us, not when it is confirmed. Never send the CERT-In report or the client notice yourself; the security lead approves and sends them. Do not wipe or rebuild anything before the evidence is kept.
    autonomy: 2
    tools: [incidents.search, incident.log, contracts.search, assets.search, client_users.search, records.update, knowledge.search, document.generate, message.draft, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 120000, money_per_task_inr: 0, max_steps: 20 }

workflows:
  - id: outage-response
    name: Outage response
    description: Open the major incident, alert the client, get people working again and book the root-cause report.
    keywords: [outage, down, work stopped, billing stopped, nobody can work, major incident, failover]
    steps:
      - key: open
        title: Open the major incident and alert the client
        agent: noc-desk
        instructions: Log the incident with the time it was noticed, the site, the system and how many people are stopped, and check for signs of an attack. Phone the client's escalation contact within 15 minutes and hand the incident to the on-call engineer by phone.
      - key: restore
        title: Get people working and keep the client posted
        agent: noc-desk
        depends_on: [open]
        instructions: Push for a workaround first (backup link, standby server or device, manual billing), log the case with the internet provider or device maker and note the docket number, and ask the change manager to okay any failover, restart or rollback. Post an update every 30 minutes and escalate by the matrix before the fix time runs out.
      - key: after
        title: Record the downtime and book the root-cause report
        agent: noc-desk
        depends_on: [restore]
        instructions: Record when work restarted for the SLA report and any penalty, and open a root-cause ticket with the report due to the client within 5 working days.
  - id: fault-fix
    name: Server, network or backup fault
    description: Confirm the alert, try the safe runbook fix and get the engineer or vendor on the rest.
    keywords: [backup, disk space, server slow, wifi, vpn, link down, nas, ups, cctv]
    steps:
      - key: check
        title: Confirm the alert and try the safe fix
        agent: noc-desk
        instructions: Find the device and the contract, confirm the alert or report, and check whether people have stopped working; if they have, raise it as an outage. Try only the safe runbook fixes, such as freeing disk space, re-running a failed backup or restarting a stuck service.
      - key: hand-over
        title: Get the engineer or vendor on it
        agent: noc-desk
        depends_on: [check]
        instructions: Hand anything else to the network and server engineer by phone, log the case with the internet provider or device maker with its docket number, and raise configuration changes as a planned change. For backups, ask for a test restore. Close only when monitoring is normal.
  - id: security-response
    name: Security incident response
    description: Start the clock, contain the attack with the security lead and get the CERT-In report and client notice ready.
    keywords: [hacked, ransomware, phishing, malware, data leak, suspicious login, stolen laptop, cert-in]
    steps:
      - key: contain
        title: Start the clock and contain it
        agent: security-desk
        instructions: Log the incident with the time we noticed it or were told, phone the security lead and the client's named contact at once, and list the containment steps (cut the device off the network, block sign-in, reset passwords, end sessions, remove mail rules) and the logs, mails and screenshots to keep as evidence.
      - key: report
        title: Draft the CERT-In report and the client notice
        agent: security-desk
        depends_on: [contain]
        instructions: Draft the CERT-In report to go within 6 hours of noticing, and the written notice to the client saying what happened, which systems and data, whether personal data is involved and what we have done, for the security lead to approve and send.
      - key: clean-up
        title: Clean up and follow through
        agent: security-desk
        depends_on: [report]
        instructions: Hand the cleaning or rebuild to the engineer by phone with the rule to restore only from clean backups, record the CERT-In reference, and open a root-cause ticket for the way in.
  - id: desk-support
    name: Laptop, printer or user support
    description: Check the cover, try a remote fix and send the field engineer when a visit is needed.
    keywords: [laptop, desktop, printer, scanner, outlook, tally, password, install, visit]
    steps:
      - key: triage
        title: Check the cover and try a remote fix
        agent: service-desk
        instructions: Find the user, the device and the contract, and check AMC or warranty cover. Walk the user through simple fixes or connect remotely with their OK, and reset passwords only after calling back the registered mobile.
      - key: visit
        title: Send the field engineer
        agent: service-desk
        depends_on: [triage]
        instructions: If it needs a visit, hand it to the field engineer for that area by phone with the device, the fault and the contract time. Log warranty cases with the maker, arrange a standby device if the repair will run past the contract time, and close with the signed service report or OTP.
  - id: access-request
    name: New user, exit or access request
    description: Check the written OK, then set up or remove the accounts and record the access.
    keywords: [new joiner, new user, email id, access, exit, last working day, resigned]
    steps:
      - key: verify
        title: Check the written OK
        agent: service-desk
        instructions: Check the request carries a written OK from the client's HR, the reporting manager or a person on the authorised approver list, and list the exact accounts, groups, folders and apps asked for.
      - key: act
        title: Set up or remove the access
        agent: service-desk
        depends_on: [verify]
        instructions: Record the person and the access in the client's staff list and hand the account work to the helpdesk engineer by phone. For exits, confirm access is off at the end of the last working day, mail and files are handed over and the laptop is collected.
  - id: purchase-quote
    name: Purchase, quote or renewal
    description: Prepare the quote, get the client's written OK, then order, deliver and bill.
    keywords: [quote, quotation, purchase, po, licences, toner, renewal, amc renewal, e-waste]
    steps:
      - key: quote
        title: Prepare the quote
        agent: service-desk
        instructions: Check stock and distributor prices and prepare the quote with GST, delivery time and warranty, or the AMC renewal with the device list. Send it to the client for a written OK or a purchase order.
      - key: order
        title: Order, deliver and bill
        agent: service-desk
        depends_on: [quote]
        instructions: After the client's written OK, and the owner's for orders above ₹50,000, hand the order to the purchase person by phone, have the devices or licences set up and delivered, and add them to the client's bill.
  - id: change-plan
    name: Planned change
    description: Check the change plan, send the downtime notice, and carry it out in the window once approved.
    keywords: [change, firmware, upgrade, migration, patching, firewall rule, dns, maintenance window]
    steps:
      - key: prepare
        title: Check the change plan
        agent: noc-desk
        instructions: Prepare the change record with the client, system, window, steps, users affected, test and rollback, and the client's written OK. Check the window is not in a busy period such as month-end or GST return days, and draft the downtime notice.
      - key: carry-out
        title: Carry it out and check
        agent: noc-desk
        depends_on: [prepare]
        instructions: After the change manager approves, hand the change to the engineer by phone with the window and the rollback, confirm a configuration backup is taken first, and run the before-and-after checks with the client.
  - id: rca-report
    name: Root-cause report
    description: Gather the history of a repeat problem, draft the root-cause report and raise the permanent fix.
    keywords: [rca, root cause, permanent fix, recurring, repeat]
    steps:
      - key: gather
        title: Gather the history
        agent: noc-desk
        instructions: List the linked tickets with dates, symptoms and fixes, and collect the logs, monitoring graphs and vendor reports.
      - key: report
        title: Draft the report and the permanent fix
        agent: noc-desk
        depends_on: [gather]
        instructions: Draft the root-cause report with the cause, the evidence, the workaround for the helpdesk and the permanent fix. Raise the fix as a planned change and anything to buy as a purchase request, and send the draft to the service delivery manager.
  - id: complaint-handling
    name: Complaint handling
    description: Check the facts, draft the reply and get the service delivery manager to call the client.
    keywords: [complaint, escalation, unhappy, nobody came, sla breach, rude]
    steps:
      - key: facts
        title: Check the facts and draft the reply
        agent: service-desk
        instructions: Acknowledge within 1 hour with the ticket number, pull the ticket history, SLA timers, visit log, calls and emails, and draft a reply saying what went wrong, what we will do and by when, with any service credit the contract gives.
      - key: call
        title: Get the service delivery manager to call
        agent: service-desk
        depends_on: [facts]
        instructions: Hand the complaint and the draft to the service delivery manager by phone to call the client and push the underlying ticket through the escalation matrix, and record what was promised.

routines:
  - id: daily-work-report
    name: Daily service desk update
    description: Each team lead reports tickets closed, open critical tickets, SLA risks and pending visits at the end of the working day.
    mode: automatic
    days: [1, 2, 3, 4, 5, 6]
    time: "18:30"
    questions:
      - { key: ticketsClosed, label: "Tickets closed", ask: "How many tickets did your team close today?", type: number, unit: tickets }
      - { key: openCritical, label: "Open P1 or P2", ask: "Is any outage, security incident or P1 or P2 ticket still open?", type: text, flag: true }
      - { key: slaAtRisk, label: "SLA at risk", ask: "Which tickets may miss their SLA by tomorrow?", type: text, flag: true }
      - { key: pending, label: "Visits and parts pending", ask: "Are any site visits, parts or vendor cases still pending?", type: text, flag: true }
      - { key: backups, label: "Backups and alerts", ask: "Did any backup fail or any monitoring alert stay red today?", type: text, flag: true }
      - { key: needs, label: "Needs from owner", ask: "Do you need anything from the owner or another team?", type: text, flag: true, required: false }
  - id: new-tickets
    name: New tickets
    description: The AI calls the helpdesk lead each evening and adds the tickets that came in by phone or WhatsApp to the Tickets list.
    days: [1, 2, 3, 4, 5, 6]
    time: '17:30'
    collect:
      list: tickets
      ask: [clientName, summary, kind, priority, raisedBy, assignedTo, dueBy]
      defaults: { raisedAt: now, status: new }
      who: the helpdesk lead

lifecycle:
  case: { label: Ticket, plural: Tickets, prefix: TKT }
  stages:
    request:
      name: Ticket raised
      description: A fault, request, change, complaint or monitoring alert comes in by phone, email, WhatsApp, the portal or a partner such as our security (SOC) partner, an internet provider or a device maker, and the caller gets a ticket number at once as the SLA clock starts.
    review:
      name: Check contract and details
      description: The helpdesk checks who is asking, which client and device it is and whether the contract (AMC, warranty or paid visit) covers it, and asks for anything missing before work starts.
      checks:
        - "Caller is a known client contact: registered email or mobile, or a call-back"
        - Contract active and covering this device or service (AMC, warranty or paid visit)
        - "Device identified: asset tag or serial number, user and location"
        - "Enough detail to act: what is wrong or needed, since when, how many people are affected"
        - New user, access and exit requests carry a written OK from the client's HR, reporting manager or authorised approver
        - "Chargeable work: client's written OK on the quote, or a purchase order for larger orders"
        - Signs of an attack (ransom note, strange logins, mail forwarding, data going out) raised as a security incident at once
    classify:
      name: Set priority and SLA
      description: The ticket gets its type, a priority from P1 to P4 by how many people are stopped, SLA times from the client's contract, and the owning team (helpdesk, field support, network and servers, security or service delivery).
    assign:
      name: Assign engineer and deadline
      description: The helpdesk names the engineer, team or outside vendor and the deadline, and starts the escalation timers for the team lead, then the service delivery manager, then the owner.
    approve:
      name: Change, cost or security approval
      description: The named person says yes before the risky step, with the change manager for changes and emergency fixes on client systems, the security lead for containment and the CERT-In report, and the owner for purchases above ₹50,000.
      checks:
        - Change manager for every change to a client system, and by phone for failover, restarts or rollbacks during an outage (written up within 1 working day)
        - Security lead for containment steps, the CERT-In report and the written notice to the client
        - Owner for purchases and quotes above ₹50,000 or not yet priced, and any ticket above ₹5 lakh
        - Nobody approves their own work, and a promise to a client never replaces approval
    execute:
      name: Fix, deliver and track
      description: Engineers and agents do the remote fix, site visit, setup, purchase or change, track SLA timers, parts and time, escalate by the matrix before the deadline passes and keep the client updated.
      checks:
        - "Escalate before the clock runs out: team lead at half the fix time, service delivery manager at three quarters, owner when breached"
        - Client updated every 30 minutes on P1 tickets until work restarts
        - Remote sessions only with the user's OK
        - Parts, time spent and vendor docket numbers logged on the ticket
    close:
      name: Confirm and close
      description: The user or client contact confirms the result with a signed service report or OTP, and the named role signs off outages, security incidents, changes, root-cause reports and complaints.
      checks:
        - "User or client contact confirms: signed service report or OTP"
        - "Result tested: service working, monitoring normal, backups running"
        - "Ticket notes complete: cause, what was done, parts used, time spent"
        - Parts and chargeable work added to the monthly bill
        - "Outages: root-cause report due to the client within 5 working days"
        - "Security incidents: CERT-In report sent and updated, client told in writing"
        - Sign-off recorded by the named role where the ticket type needs it
    report:
      name: SLA report and review
      description: Each client gets a monthly SLA report with tickets, SLA met, uptime, open items and repeat problems, and the team reviews trends and opens root-cause work for problems that keep coming back.
      checks:
        - Every client's SLA report sent, with penalties or service credits owed
        - Devices or causes with 3 or more tickets in 30 days opened as root-cause tickets
        - Firewall, server, VPN and mail logs kept for a rolling 180 days for CERT-In
        - Contracts ending in the next 60 days listed for renewal
  priorities:
