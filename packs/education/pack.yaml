# Ready-made pack: schools (CBSE, ICSE and state board), colleges and coaching
# institutes in India. Built from researched Indian practice: the RTE Act 2009
# (Sections 5, 12 to 17), the POCSO Act 2012, UGC rules on student grievances
# (2023), ragging (2009) and fee refunds (2018), CBSE bus and exam rules, the
# Ministry of Education coaching centre guidelines (2024) and state fee laws.
id: education
version: 1.0.0
name: School, college & coaching
description: Admissions and RTE seats, fees, concessions and refunds, exams and results, certificates and TCs, child protection, emergencies, staff leave, repairs and transport, and complaints for schools, colleges and coaching institutes.
kind: industry
sector: public-services
extends: [sector-public-services, bookings-base]
match:
  keywords: [school, schools, cbse school, icse school, state board school, international school, public school, high school, higher secondary school, junior college, college, degree college, engineering college, coaching institute, coaching centre, coaching center, coaching classes, coaching class, neet coaching, jee coaching, iit jee coaching, upsc coaching, tuition centre, tuition center, tuition classes, tutorial classes, educational institution, educational institute]

labels:
  Customer: Student
  Booking: Enrolment
  Service: Course

entities:
  - name: Customer
    label: Student
    plural_label: Students
    description: A student or applicant, with the parent or guardian who speaks for a minor.
    title_field: name
    list_columns: [name, admissionNumber, classSection, parentName, status]
    fields:
      - { name: name, label: Full name, type: string, required: true }
      - { name: phone, label: Registered mobile, type: phone }
      - { name: email, label: Email, type: email }
      - { name: city, label: City or village, type: string }
      - name: source
        label: Came through
        type: enum
        options: [walk-in, phone, whatsapp, website, rte-portal, counselling, referral, other]
      - { name: admissionNumber, label: Admission or GR number, type: string }
      - { name: apaarId, label: APAAR ID, type: string }
      - { name: dateOfBirth, label: Date of birth, type: date }
      - { name: classSection, label: Class and section (or course and batch), type: string }
      - name: seatType
        label: Seat
        type: enum
        options: [regular, rte, scholarship, staff-ward, management-quota]
      - { name: parentName, label: Parent or guardian, type: string }
      - { name: address, label: Address, type: text }
      - { name: admittedOn, label: Admitted on, type: date }
      - { name: attendancePercent, label: Attendance (%), type: number }
      - name: status
        label: Status
        type: enum
        options: [applicant, studying, left, passed-out]
      - { name: notes, label: Notes, type: text }
  - name: FeeAccount
    label: Fee account
    plural_label: Fee accounts
    title_field: studentName
    list_columns: [studentName, academicYear, totalFee, paid, due, nextDueDate]
    fields:
      - { name: studentName, label: Student, type: string, required: true }
      - { name: admissionNumber, label: Admission or GR number, type: string }
      - { name: academicYear, label: Academic year, type: string, required: true }
      - { name: totalFee, label: Fee for the year, type: money }
      - { name: concession, label: Concession given, type: money }
      - { name: concessionReason, label: Concession reason, type: string }
      - { name: paid, label: Paid so far, type: money }
      - { name: due, label: Still due, type: money }
      - { name: nextDueDate, label: Next due date, type: date }
      - { name: lateFee, label: Late fee, type: money }
      - { name: refundAmount, label: Refund, type: money }
      - { name: refundPaidOn, label: Refund paid on, type: date }
  - name: StaffMember
    label: Staff member
    plural_label: Staff
    title_field: fullName
    list_columns: [fullName, employeeId, role, subjects, casualLeaveLeft]
    fields:
      - { name: fullName, label: Full name, type: string, required: true }
      - { name: employeeId, label: Employee ID, type: string }
      - name: role
        label: Role
        type: enum
        options: [teacher, lecturer, counsellor, office, driver, attendant, support, other]
      - { name: subjects, label: Subjects or department, type: string }
      - { name: mobile, label: Mobile, type: phone }
      - { name: joinedOn, label: Joined on, type: date }
      - { name: casualLeaveLeft, label: Casual leave left (days), type: number }
      - { name: earnedLeaveLeft, label: Earned leave left (days), type: number }
      - { name: policeVerified, label: Police verification done, type: boolean }
      - { name: safetyTrained, label: Child-safety training done, type: boolean }
  - name: Asset
    label: Bus, room or equipment
