playbooks:
  - id: admissions-and-rte-seats
    title: Admissions and RTE seats
    source: Right of Children to Free and Compulsory Education Act, 2009 (Sections 5, 12, 13, 14 and 15) and your state's RTE rules; Supreme Court, Pramati Educational and Cultural Trust v. Union of India (2014); UGC Regulations on Curbing the Menace of Ragging in Higher Educational Institutions, 2009; UGC notification on Refund of Fees and Non-Retention of Original Certificates, 2018
    body: |
      1. Before admissions open, publish the seats in each class, the fee for the year, the documents needed, the age cut-off and how seats are given (often a lottery).
      2. Never take a donation or capitation fee. The fine is up to 10 times the money taken.
      3. Up to Class 8, never test or interview a child or the parents to choose them. The fine is ₹25,000 the first time and ₹50,000 each time after.
      4. Check the age on your state's cut-off date (Class 1 is usually 6 years). Never refuse a child only because there is no birth certificate (a hospital or anganwadi record or a parent's declaration will do), and never hold up admission up to Class 8 because the old school's TC is late.
      5. Unaided schools that are not minority schools keep at least 25% of entry-class seats (pre-primary or Class 1) for RTE children. The state lottery picks them, not the school. Check the allotment letter, residence and income or category proof, and confirm the admission on the state portal before its deadline. Send any doubt to the block or district education officer; never refuse an allotted child. An RTE child pays no fee; the state pays the school back per child.
      6. Colleges: check eligibility marks, the merit list or seat allotment and category certificates, collect the yearly anti-ragging undertaking from the student and a parent on antiragging.in, and check original certificates and hand them back the same day.
      7. The principal (the centre head in coaching, the admission committee in a college) approves each admission. Enter it in the admission register, UDISE+ and the APAAR record.
  - id: child-protection-reporting
    title: Keep children safe and report at once
    source: Protection of Children from Sexual Offences (POCSO) Act, 2012 (Sections 19, 21 and 23); Supreme Court, Shankar Kisanrao Khade v. State of Maharashtra (2013); RTE Act, 2009 (Section 17); NCPCR Guidelines for Eliminating Corporal Punishment in Schools, 2014; UGC anti-ragging regulations, 2009 (clause 9); Ministry of Education Guidelines on School Safety and Security, 2021
    body: |
      1. Make the child safe first: away from the person accused, first aid or hospital if hurt, and a woman teacher or counsellor stays with the child. Tell the parents at once, unless a parent is the person accused.
      2. Anyone who hears of or suspects sexual abuse of a child tells the police or the Special Juvenile Police Unit the same day (Childline 1098 or 112 also work). Telling the principal or the management is not enough. What the child says is enough to report; do not check it yourselves first.
      3. Not reporting is a crime: up to 6 months in jail for anyone, and up to 1 year for the head of an institution who fails to report about staff under them. Reporting in good faith is protected.
      4. The child tells what happened once, to the police or a counsellor, not again and again to staff. Never share the child's name, photo or school in a way that identifies them.
      5. Keep the accused staff member away from children (off duty or off the bus route) while the inquiry runs. The principal orders it; if the principal or a trustee is accused, the management or trust board takes over.
      6. No physical punishment or mental harassment of any child, ever. Treat every report as a case, keep a record and act under the service rules.
      7. Ragging in a college or hostel: the head files an FIR within 24 hours, the anti-ragging squad inquires, and the district anti-ragging committee and the university are told. The national helpline is 1800-180-5522.
      8. Keep the evidence: CCTV, bus GPS, messages and written statements. Police-verify and give child-safety training to every staff member who meets children, including drivers and attendants.
  - id: fees-refunds-and-tc
    title: Fees, concessions, refunds and TCs
    source: State fee regulation laws (for example the Maharashtra Educational Institutions (Regulation of Fee) Act, 2011, the Gujarat Self-Financed Schools (Regulation of Fees) Act, 2017 and the Uttar Pradesh Self-Financed Independent Schools (Fee Regulation) Act, 2018); UGC notification on Refund of Fees and Non-Retention of Original Certificates, 2018; Ministry of Education Guidelines for Regulation of Coaching Centres, 2024; Madras High Court on transfer certificates and fee arrears, July 2024
    body: |
      1. Charge only the fee approved under your state's fee law (by the fee regulatory committee, the district committee or the parent-teacher executive committee, as your state requires). Publish it, raise it only as the law allows, and add no charge outside it.
      2. Give concessions only under a written policy (sibling, staff ward, merit, single parent, death or job loss of the earning parent) and with proof for hardship. Accounts applies amounts up to ₹10,000 that fit the policy; anything larger or outside the policy goes to the management.
      3. An RTE-seat child pays no fee of any kind.
      4. Colleges refund on the UGC scale: full fee less a processing charge of at most 5% or ₹5,000 if the student leaves 15 or more days before the last admission date, 90% if less, 80% up to 15 days after, 50% from 16 to 30 days after, and nothing later. Check UGC's circular for the year, which has sometimes allowed a wider full refund.
      5. Coaching: a student who leaves mid-course gets back the unused part of the tuition, hostel and mess fees within 10 days.
      6. Pay every refund only into the payer's own bank account, and match the receipt and the ledger.
      7. Issue a TC promptly. Never hold it back for unpaid fees and never write the dues on it; recover dues from the parents separately, by reminders or a legal notice. Colleges never keep a student's original certificates.
      8. Never make parents buy books or uniforms from the school shop or one named vendor.
  - id: fair-exams-and-results
    title: Fair exams and results
    source: RTE (Amendment) Act, 2019 (Section 16) and the RTE (Amendment) Rules, 2024 (PIB, 23 Dec 2024); CBSE Examination Bye-Laws on attendance and condonation; UGC (Redressal of Grievances of Students) Regulations, 2023
    body: |
      1. Publish the exam timetable, the attendance rule and the re-test rules at the start of the year.
      2. Allow a re-test only for a proved reason (illness with a doctor's certificate, a death in the family, or sports or NCC duty), with the exam in-charge's approval.
      3. Before any mark changes, a second teacher rechecks the totals and any unmarked answers; keep the old and new marks on record and tell the family.
      4. Board exams need 75% attendance. Send shortage cases with medical or other proof to the board before its last date; a university follows its own rule, often also 75%.
      5. Classes 5 and 8 in central government schools and in states that ended the no-detention rule: a child who fails gets extra teaching and a re-exam within 2 months, may be held back, but is never expelled before finishing Class 8.
      6. Keep a calendar of board and university dates (registration or LOC, practical marks upload, verification and re-evaluation windows) so no student misses one.
      7. Marks given by a board or university change only through its own process. Unfair-means cases go to the exam committee, and the student is heard before any decision.
  - id: student-grievances
    title: Answer every complaint in writing
    source: UGC (Redressal of Grievances of Students) Regulations, 2023; AICTE (Establishment of Mechanism for Grievance Redressal) Regulations, 2019; RTE Act, 2009 (Section 32); Central Consumer Protection Authority Guidelines for Prevention of Misleading Advertisement in Coaching Sector, 2024
    body: |
      1. Log every complaint from any channel with a number and acknowledge it within one working day. Never ask the family to write it again in a set format.
      2. Check for safety first. A complaint about abuse, beating, ragging, sexual harassment or self-harm becomes a child-protection or emergency case the same hour.
      3. Nobody named in the complaint handles it. Get both sides: the family or student, the staff member, the records and CCTV where useful.
      4. School: a committee of the principal and two senior teachers replies within 15 days. For rights under the RTE Act the family can go to the local authority or the education officer.
      5. College: the Students' Grievance Redressal Committee reports within 15 working days. The student can appeal to the Ombudsperson within 15 days, who aims to decide within 30 days.
      6. Coaching: answer complaints about fees, refunds or teaching in writing. Ads must never promise ranks or selection or show a topper without saying which course they really took; misleading claims can be taken to the consumer commission.
      7. Every reply is in writing, says what was found, what will change and where to appeal. Each term, count complaints by cause and fix the cause that keeps coming back.
  - id: coaching-centre-rules
    title: Running a coaching centre by the rules
    source: Ministry of Education Guidelines for Registration and Regulation of Coaching Centres, 2024 (advice to states, binding where a state has adopted them); state coaching laws such as the Bihar Coaching Institute (Control and Regulation) Act, 2010; Central Consumer Protection Authority Guidelines for Prevention of Misleading Advertisement in Coaching Sector, 2024
    body: |
      1. Register the centre with the state authority where your state requires it, and show the courses, fees, teachers' qualifications, refund rules and hostel charges on the website and in the prospectus.
      2. Enrol only students who are 16 or older or have passed Class 10.
      3. Never promise ranks, marks or guaranteed selection, and never use a topper's name or photo without saying which course they took and with their written consent.
      4. Teachers are at least graduates, and nobody with a conviction for an offence involving moral turpitude teaches.
      5. Do not hold classes during school hours, keep to about 5 hours a day, and give a weekly off.
      6. Keep a counsellor, watch for students under stress, and share help lines such as Tele-MANAS 14416.
      7. Give receipts for every payment, do not raise fees during a course, and refund the unused part of the fees, hostel and mess included, within 10 days of a student leaving.
      8. Keep the fire NOC, building safety, first aid and CCTV in order. Under the guidelines the fine is ₹25,000 the first time, ₹1 lakh the second, and registration can be cancelled after that.

registers:
  - id: fee-accounts
    entity: FeeAccount
    label: Fee accounts
    columns: [studentName, admissionNumber, academicYear, totalFee, paid, due, nextDueDate]
    filters: []
    date_field: nextDueDate
    totals: [totalFee, concession, paid, due]
    card: { sum: { field: due, label: due } }
    checks:
      - adds_up: { field: due, plus: [totalFee], minus: [concession, paid] }
      - overdue: { date: nextDueDate }
        when: { due: { above: 0 } }
      - limit: { fields: [concession], max: totalFee }
      - missing: [concessionReason]
        when: { concession: { above: 0 } }
    follow_ups:
      - id: fees-due
        label: Fees due → the parent
        who: party
        due: { overdue: { date: nextDueDate, grace_days: 7 } }
        when: { due: { above: 0 } }
        phone: { lookup: Customer, match: admissionNumber, value: admissionNumber, field: phone }
        contact: { lookup: Customer, match: admissionNumber, value: admissionNumber, field: parentName }
        about: [studentName, academicYear, due, nextDueDate]
        find_out: [paid]
  - id: enrolments
    entity: Booking
    label: Enrolments
    columns: [customerName, service, date, amount, status, paymentStatus]
    filters: [status, paymentStatus]
    date_field: date
    totals: [amount]
    checks:
      - missing: [phone]
  - id: students
    entity: Customer
    label: Students
    columns: [name, admissionNumber, classSection, parentName, phone, attendancePercent, status]
    filters: [seatType, status]
    date_field: admittedOn
    card: { count: { when: { status: [studying] }, label: studying } }
    checks:
      - missing: [parentName, phone]
      - limit: { fields: [attendancePercent], min: 75 }
        when: { status: [studying] }
        why: attendance below 75%
  - id: assets
    entity: Asset
    label: Assets
    columns: [assetName, assetType, location, fitnessUntil, insuranceUntil, status]
    filters: [assetType, status]
    card: { count: { when: { status: [under-repair, off-road] }, label: out of use } }
    checks:
      - expiring: { date: fitnessUntil, days: 30 }
      - expiring: { date: insuranceUntil, days: 30 }
      - expiring: { date: permitUntil, days: 30 }
      - expiring: { date: amcUntil, days: 30 }
      - missing: [gpsWorking, cctvWorking, attendantOnBoard]
        when: { assetType: [bus, van] }
        why: school transport safety rules
  - id: staff-members
    entity: StaffMember
    label: Staff members
    main: false
    columns: [fullName, employeeId, role, mobile, policeVerified, safetyTrained]
    filters: [role]
    checks:
      - missing: [policeVerified, safetyTrained]
