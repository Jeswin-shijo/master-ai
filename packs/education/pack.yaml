        label: Status
        type: enum
        required: true
        options: [working, under-repair, off-road]

tools:
  - name: students.search
    description: Search students and applicants by name, admission number, class or parent.
    uses: records.search
    with: { entity: Customer }
  - name: fees.search
    description: Search fee accounts by student, admission number or year.
    uses: records.search
    with: { entity: FeeAccount }
  - name: staff.search
    description: Search staff by name, subject, role or leave left.
    uses: records.search
    with: { entity: StaffMember }
  - name: assets.search
    description: Search buses, rooms and equipment by name, route, AMC or status.
    uses: records.search
    with: { entity: Asset }
  - name: enrolment.confirm
    description: Mark a student's enrolment confirmed once the principal has approved the admission. The family is told separately.
    uses: records.update
    with: { entity: Booking, patch: { status: confirmed } }
    level: 3
    risk: { external_reach: false, reversible: true }
  - name: asset.take_off_road
    description: Take a bus, room or machine out of use until it is fixed. Reversible.
    uses: records.update
    with: { entity: Asset, patch: { status: off-road } }
    level: 2

agents:
  - role: booking-coordinator
    name: Admissions and fees desk
    description: Answers admission enquiries, checks age, documents and RTE allotments, holds the enrolment and confirms it once the principal approves, drafts the admission letter and fee schedule, and works out concessions and refunds from the fee account and the written policy.
    instructions: Never ask for a donation or capitation fee, and never set a test or interview for a child up to Class 8. Never refuse an allotted RTE child; send any doubt about papers to the principal. Confirm an enrolment only after the principal has approved the admission. Never promise ranks, marks or selection. Accounts pays refunds, only into the payer's own bank account.
    autonomy: 3
    tools: [students.search, fees.search, records.search, records.create, records.update, booking.hold, enrolment.confirm, enquiry.mark_contacted, knowledge.search, document.generate, schedule.create, message.draft, message.send, payment.request, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }
  - role: school-office
    name: School office desk
    description: Handles certificates and TCs, exam and result requests, staff leave and substitute timetables, repairs and transport faults, and complaints, and hands each job to the teacher, office or vendor in charge by phone.
    instructions: Never mark a certificate as issued; the principal signs it. Never hold back a TC or write unpaid fees on it. Never change marks; the exam in-charge approves every change after a second teacher rechecks. Take a bus off the route when its GPS, camera, speed governor or woman attendant is missing.
    autonomy: 3
    tools: [students.search, staff.search, assets.search, asset.take_off_road, records.search, records.create, records.update, knowledge.search, document.generate, schedule.create, message.draft, message.send, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }
  - role: safety-desk
    name: Safety and welfare desk
    description: Keeps the timeline and the reporting clock for emergencies and child-protection cases, drafts the police intimation and the reports to the board, university or education office, and reminds the principal and the safety in-charge until every step is done.
    instructions: Children first. Never give medical advice; trained staff give first aid and doctors decide treatment. Never question a child, never contact the person accused, and never share a child's name or photo beyond those who must know. Reports the law requires, such as to the police, never wait for an approval. A person signs and sends every report.
    autonomy: 2
    tools: [students.search, staff.search, records.search, knowledge.search, document.generate, message.draft, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: restricted }
    budgets: { tokens_per_task: 120000, money_per_task_inr: 0, max_steps: 20 }

workflows:
  - id: admission-intake
    name: Admission or enrolment
    description: Check the class, age and papers, hold the seat and send the admission letter once the principal approves.
    keywords: [admission, enrolment, seat, rte, batch, nursery]
    steps:
      - key: check-papers
        title: Check the papers and hold the seat
        agent: booking-coordinator
        instructions: Find or create the Student record, check the age for the class against the state's cut-off date, the documents received and, for an RTE seat, the allotment letter. Hold the Enrolment and list anything still missing for the family.
      - key: confirm
        title: Confirm the seat and send the admission letter
        agent: booking-coordinator
        depends_on: [check-papers]
        instructions: Once the principal has approved, confirm the enrolment, draft the admission letter with the fee schedule and refund rules (no fee at all for an RTE seat), send it to the family, and remind the office to confirm RTE admissions on the state portal before its deadline.
  - id: fee-concession-refund
    name: Concession, waiver or refund
    description: Work out the concession or refund from the fee account and the written policy, and get accounts to post or pay it.
    keywords: [concession, waiver, refund, late fee, scholarship, instalment]
    steps:
      - key: work-out
        title: Work out the amount
        agent: booking-coordinator
        instructions: Pull the fee account, check the request against the written concession policy or the refund rule that applies (UGC scale for a college, unused months for a coaching course) and draft the letter with the amount and how it was worked out.
      - key: post-or-pay
        title: Get accounts to post or pay it
        agent: booking-coordinator
        depends_on: [work-out]
        instructions: Hand the ledger entry or the refund to the accounts clerk by phone, with the payer's own bank account for a refund, and tell the family when it is done.
  - id: booking-cancellation
    name: Withdraw an admission
    description: Withdraw a student's admission or batch seat when the family asks, and pass any refund to accounts.
    keywords: [withdraw, withdrawal, cancel admission, cancel the admission, not joining]
    steps:
      - key: withdraw
        title: Withdraw the seat and pass on the refund
        agent: booking-coordinator
        instructions: Find the student's enrolment and mark it cancelled, tell the family in writing, and if fees were paid work out the refund under the rule that applies (UGC scale for a college, unused months for coaching) for accounts to pay into the payer's own bank account.
  - id: exam-request
    name: Exam or result request
    description: Pull the marks, attendance and timetable, plan the re-test or recheck and tell the family the outcome.
    keywords: [re-test, recheck, marks, hall ticket, result, attendance]
    steps:
      - key: gather
        title: Gather marks and plan
        agent: school-office
        instructions: Pull the student's marks, attendance and the exam timetable, check the proof given, and draft the re-test plan, the recheck sheet or the board or university form for the exam in-charge.
      - key: teacher
        title: Hand it to the teacher and reply
        agent: school-office
        depends_on: [gather]
        instructions: Hand the re-test or the recheck to the subject teacher by phone with the date, and send the family the outcome once the exam in-charge approves.
  - id: certificate-issue
    name: Certificate or TC
    description: Check the register, draft the certificate and get it signed by the principal.
    keywords: [tc, certificate, bonafide, transcript, migration]
    steps:
      - key: draft
        title: Check the register and draft it
        agent: school-office
        instructions: Check the details against the admission register and marks records, draft the certificate on letterhead with its serial number, and never add any remark about fees.
      - key: sign
        title: Get it signed and handed over
        agent: school-office
        depends_on: [draft]
        instructions: Hand the draft to the office superintendent by phone for the principal's signature and stamp, then send it to the family or the new school and file a copy.
  - id: staff-leave-cover
    name: Staff leave and substitutes
    description: Check the leave balance and duties and arrange a substitute for every period.
    keywords: [leave, substitute, arrangement, timetable]
    steps:
      - key: cover
        title: Check balance and arrange cover
        agent: school-office
        instructions: Check the leave balance, exam and evaluation duties on those dates, propose a substitute for each period, send the substitute timetable once approved and update the leave register.
  - id: campus-repair
    name: Repair or transport fault
    description: Log the fault, check the AMC and get the technician, vendor or transport in-charge to fix it.
    keywords: [repair, broken, bus, cctv, amc, not working]
    steps:
      - key: log
        title: Log the fault and check the AMC
        agent: school-office
        instructions: Find the bus, room or equipment, log the fault with place and time, check warranty and AMC, and collect quotes when money must be spent. Take a bus off the route if a safety item is not working.
      - key: fix
        title: Get it fixed
        agent: school-office
        depends_on: [log]
        instructions: Hand the job to the admin officer or the AMC vendor by phone with the place, the fault and the target time, and report when it is working again.
  - id: complaint-handling
    name: Complaint reply
    description: Log the complaint, gather the facts and draft the written reply for the grievance committee.
    keywords: [complaint, grievance, reply]
    steps:
      - key: facts
        title: Log it and gather the facts
        agent: school-office
        instructions: Log the complaint with a number, acknowledge it within one working day, and pull the records that matter. Never give it to anyone named in the complaint.
      - key: reply
        title: Arrange the meeting and draft the reply
        agent: school-office
        depends_on: [facts]
        instructions: Ask the coordinator or counsellor by phone to meet the family or student, then draft the written reply saying what will change and where to appeal.
  - id: child-protection-response
    name: Child protection response
    description: Start the reporting clock, draft the police intimation and follow up until every step is done.
    keywords: [pocso, abuse, ragging, beaten, harassment]
    steps:
      - key: clock
        title: Start the timeline and draft the reports
        agent: safety-desk
        instructions: Record what was reported, by whom and when. Draft the intimation to the police or Special Juvenile Police Unit and, for ragging, the FIR request and the note to the district committee and university, for the principal to sign the same day.
      - key: follow-up
        title: Follow up every step
        agent: safety-desk
        depends_on: [clock]
        instructions: Hand the follow-up to the principal by phone and track that the child is safe, the parents are told, the accused is kept away from children and the inquiry is under way.
  - id: emergency-response
    name: Emergency response
    description: Get the person on duty to the spot, keep the timeline and draft the messages to parents.
    keywords: [emergency, fire, injured, missing, accident]
    steps:
      - key: alert
        title: Alert the person on duty
        agent: safety-desk
        instructions: Hand it at once by phone to the safety in-charge or the teacher on duty with the place and what happened, keep the timeline, and draft the message to the parents and the report the board or education office needs.

routines:
  - id: daily-transport-check
    name: Daily bus and safety check-in
    description: The transport in-charge reports the buses that ran, any child not picked up or dropped on time, and any bus missing a safety item.
    mode: automatic
    days: [1, 2, 3, 4, 5, 6]
    time: "16:30"
    questions:
      - { key: busesRan, label: "Buses and vans run", ask: "How many buses and vans ran today?", type: number, unit: vehicles }
      - { key: childrenLate, label: "Children not dropped on time", ask: "Was any child not picked up or not dropped home on time?", type: text, flag: true }
      - { key: safetyKit, label: "Bus safety items missing", ask: "Is any bus missing its GPS, camera, speed governor or woman attendant?", type: text, flag: true }
      - { key: incidents, label: "Problems on the bus", ask: "Did any child get hurt or report a problem on a bus today?", type: text, flag: true, required: false }
  - id: new-enrolments
    name: New enrolments
    description: The AI calls the admissions office each evening and adds the day's enquiries and admissions to the Enrolments list.
    days: [1, 2, 3, 4, 5, 6]
    time: '17:00'
    collect:
      list: enrolments
      ask: [customerName, phone, service, date, amount]
      defaults: { status: requested }
      who: the admissions office

policies:
  - id: facility-spend-above-25000
    action: case.proceed
    approver: owner
    require_approval_above: { amount: 25000, currency: INR }
    when: { category: [facility] }
    reason: Repairs and purchases above ₹25,000 need the management's approval of the quote before work starts.

kpis:
  - id: fee-collection
    name: Fees collected on time
    description: Fees received by the due date as a share of fees due for the term after concessions.
    unit: percent
    direction: up
    target: 95
  - id: classes-covered
    name: Classes covered during leave
    description: Periods of absent teachers taken by a substitute, as a share of all periods of absent teachers in the month.
    unit: percent
    direction: up
    target: 98
  - id: certificates-on-time
    name: Certificates in 3 working days
    description: TCs and other certificates handed over within 3 working days of a complete request, as a share of all certificates issued in the month.
    unit: percent
    direction: up
    target: 95
  - id: complaints-on-time
    name: Complaints answered in 15 days
    description: Complaints given a final written reply within 15 working days, as a share of all complaints that fell due in the month.
    unit: percent
    direction: up
    target: 100
  - id: safety-reported-24h
    name: Safety cases reported in 24 hours
    description: Child-protection and ragging cases where the parents and, where the law needs it, the police were told within 24 hours, as a share of all such cases.
    unit: percent
    direction: up
    target: 100
  - id: seats-filled
    name: Seats filled
    description: Students enrolled as a share of approved seats across classes, courses or batches. RTE seats are counted on their own, and every allotted RTE child should be admitted.
    unit: percent
    direction: up
    target: 95

connectors: [whatsapp-business, razorpay, gmail]

lifecycle:
  case: { label: Request, plural: Requests, prefix: REQ }
  stages:
    request:
      name: Request received
      description: A request, complaint or alert comes in from a parent, student, applicant, staff member, the board or university, a state portal or a campus system (CCTV, bus GPS, fee software), gets a number, and the sender is told it has been received.
    review:
      name: Documents and eligibility check
      description: Office staff and agents confirm who sent it, find the student or staff record, check the documents and the rules that apply, and ask for anything missing; child-safety cases skip this and go straight to the principal.
      checks:
        - "Sender confirmed: parent or student from the registered mobile, staff from their own login, a school or board from its official email"
        - "Student or staff record found: admission or GR number, class and section or course and batch, employee ID"
        - Documents for this type of request received and readable
        - "Rules checked: age for the class, attendance, income or category proof, fee account, leave balance"
        - "Nothing asked breaks the law: no donation for a seat, no test for children up to Class 8, no fee remark on a TC"
        - "Safety first: abuse, beating, ragging, or an injured or missing child go to the principal at once and never wait for papers"
    classify:
      name: Type, urgency and department
      description: The request gets its type, priority, risk and owning department (admissions office, accounts, exam cell, school office, grievance committee, principal's office, or admin and transport), which starts its clock.
    assign:
      name: Assign in-charge and deadline
      description: The principal or office head names the person in charge (class teacher, exam in-charge, accounts clerk, counsellor, transport in-charge) and sets the deadline; agents send the reminders.
    approve:
      name: Principal or management approval
      description: The right person decides within their powers (the principal for admissions and staff leave, the exam in-charge for exam changes, the management for concessions, refunds and spending above the limit); reports the law requires, such as to the police, never wait for an approval, and child-protection cases have no approval step at all.
    execute:
      name: Action and follow-up
      description: Staff and agents do the work and track it (admission and fee records, certificates, re-tests, substitute timetables, repairs and bus checks, replies to families), keeping costs, papers and dates on the request.
    close:
      name: Final check and sign-off
      description: Someone other than the person who did the work checks the result, the named role signs off, the family or staff member gets a written reply and the request is closed.
      checks:
        - Outcome matches what was asked or decided
        - "Records updated: admission register, fee ledger, marks, leave register, asset log, and the state portal where needed (RTE, UDISE+, APAAR)"
        - Certificates signed and stamped by the principal, with a serial number and a copy filed
        - "Money: concession shown in the fee ledger, refund in the payer's own bank account"
        - Police, board, university or education office told where the law needs it
        - Written reply sent, saying where to appeal if it is a complaint
    report:
      name: Reports and term review
      description: Weekly and term reports show open requests, deadlines met, fee collection, leave cover, complaints and safety cases; repeat problems go to the staff meeting, the management or the college's quality cell (IQAC), and the same records feed yearly returns such as UDISE+ and AISHE.
  priorities:
    - { id: P1, name: "Urgent: child safety or emergency", respond_within_hours: 0.25, resolve_within_hours: 24 }
    - { id: P2, name: "High: exam or class time at stake", respond_within_hours: 2, resolve_within_hours: 72 }
    - { id: P3, name: Normal, respond_within_hours: 24, resolve_within_hours: 120 }
    - { id: P4, name: Low, respond_within_hours: 48, resolve_within_hours: 240 }
  roles:
    - { id: owner, name: Management (trust or society), approves: "Concessions, waivers and refunds above ₹10,000, repairs and purchases above ₹25,000, anything above ₹5,00,000, and closing every child-protection case" }
    - { id: head-of-institution, name: Principal or centre head, approves: "Every admission including RTE seats and staff leave; signs every certificate and TC. Decides action against staff or students in child-protection cases (removal from duty, suspension) after the report is made, unless the principal is the person accused, when the management decides" }
    - { id: exam-in-charge, name: Exam in-charge (Controller of Examinations in a college), approves: "Re-tests, mark changes after rechecking, attendance shortage cases, board or university registration corrections and any change to exam dates" }
    - { id: safety-officer, name: Safety in-charge, approves: "Signs off emergencies once every child is safe and cared for, parents are told and the police or authority are informed (vice-principal or head of the school safety committee; the proctor in a college)" }
    - { id: grievance-officer, name: Grievance committee, approves: "Signs off the written reply to every complaint and says where to appeal (in a school the principal with two senior teachers; in a college the Students' Grievance Redressal Committee, with appeal to the Ombudsperson)" }
    - { id: accounts-head, name: Accounts head, approves: "Signs off concessions, waivers and refunds once the fee ledger is updated, receipts match and refunds have reached the payer's own bank account" }
    - { id: estate-officer, name: Admin officer (estate and transport), approves: "Signs off repairs, purchases and transport fixes once the work is checked, the bills match and bus papers and safety kit are in order" }
  urgent_keywords: [caught fire, on fire, fire broke out, fire accident, fire in the, fire in a, fire in our, fire at, fire alarm went off, smoke coming, smoke from, smoke in the, thick smoke, short circuit, electric shock, electrocuted, live wire, gas leak, collapse, collapsed, unconscious, not breathing, heart attack, chest pain, heavy bleeding, convulsions, had a seizure, having a seizure, snake bite, dog bite, poisoning, food poisoning, drowning, drowned, child injured, student injured, seriously injured, badly injured, head injury, road accident, bus accident, van accident, met with an accident, child missing, missing child, student missing, went missing, not reached home, not reached school, missing since, not returned since, not returned home, did not come home, didn't come home, untraceable, ran away, kidnapped, abducted, knife, weapon, gun, pistol, assaulted, attacked, beaten up, violence, sexual assault, sexually abused, molested, rape, pocso, bad touch, suicide, suicidal, self harm, kill myself, kill himself, kill herself, end my life, end his life, end her life, want to die, trapped, stuck in the lift, stuck in lift, lift stuck, lift is stuck, stuck between floors, drunk driver, driver was drunk, driver is drunk, bomb threat, stampede, threat to life]
  categories:
    - id: emergency
      name: Emergency on campus or transport
      keywords: [emergency, ambulance, unconscious, unresponsive, fainted, not breathing, collapsed, collapse, fell down, chest pain, heart attack, heavy bleeding, bleeding, had a seizure, having a seizure, convulsions, asthma attack, allergic reaction, snake bite, dog bite, food poisoning, poisoning, caught fire, on fire, fire broke out, fire accident, fire in the, fire in a, fire in our, fire at, fire alarm went off, smoke coming, smoke from, smoke in the, thick smoke, burning smell, short circuit, electric shock, electrocuted, live wire, gas leak, injured, child injured, student injured, got hurt, head injury, fracture, road accident, bus accident, van accident, met with an accident, child missing, missing child, student missing, went missing, not reached home, not reached school, not returned to the hostel, missing since, not returned since, not returned home, did not come home, didn't come home, untraceable, ran away, off route, kidnapped, abducted, knife, weapon, gun, pistol, trapped, stuck in the lift, stuck in lift, lift stuck, lift is stuck, stuck between floors, drunk driver, driver was drunk, driver is drunk, bomb threat, bomb, stampede, drowning, suicide, suicidal, self harm, kill myself, kill himself, kill herself, end my life, end his life, end her life, want to die]
      priority: P1
      risk: high
      department: Principal's office and safety committee
      required_checks:
        - "Child first: first aid, 112 or 108 called, or the child taken to hospital at once; never wait for papers or a parent's consent"
        - "Place made safe: power or gas off, building cleared by the drill route and every class teacher has counted their children"
