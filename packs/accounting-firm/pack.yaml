    - id: fees-billing
      name: Fee invoices and reminders
      keywords: [fee invoice, raise the invoice, raise an invoice, raise invoice, raise the bill, send the invoice, send our invoice, retainer invoice, proforma invoice, invoice, professional fees, fee receipt, reminder, payment reminder, fee reminder, fees reminder, outstanding fees, fees outstanding, pending fees, fees pending, unpaid fees, fees not paid, owes us, owes]
