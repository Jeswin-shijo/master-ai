          label: Purpose and who it is for
          kind: keywords
          keywords: [bank, visa, embassy, consulate, university, college, tender, loan, remittance, nro, lender, government, ministry, department, donor, grant, court, rbi, sebi, stock exchange, insurance company, landlord, for the]
      required_checks:
        - Purpose, addressee and format known
        - Every figure checked to originals or the books
        - Management representation letter taken
        - Certifies only facts we can check (no future figures; property values only from a registered valuer's report)
        - "For remittances: payee, nature of payment, tax rate and tax paid checked; Form 146 needed for a taxable remittance above ₹5 lakh in the year unless the client has a lower-deduction order"
        - UDIN generated on signing, never later than 60 days
      not_eligible:
        - keywords: [backdate, backdated, back date, back-dated, predate, put an old date, earlier date on it, without documents, without any documents, no documents, without proof, inflate, increase the figures, show higher, show more income, show more net worth, adjust the figures, just sign it, sign it as it is]
          reason: A CA certifies only facts checked against original documents, dated the day it is signed. Backdating, inflating or signing without papers is professional misconduct (Chartered Accountants Act 1949; ICAI Guidance Note on Reports or Certificates for Special Purposes).
      approval: { required: always, role: engagement-partner }
      signoff: { required: true, role: engagement-partner }
