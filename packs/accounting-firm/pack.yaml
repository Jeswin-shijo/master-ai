playbooks:
  - id: client-acceptance
    title: Taking on a new client or audit
    source: ICAI SQC 1 para 28; ICAI KYC norms for members in practice (mandatory for attest work from 1 January 2017); Chartered Accountants Act 1949, First Schedule Part I Clauses (8) and (10); ICAI Council Guidelines Chapter VI (60 tax audits); SA 210; Companies Act 2013 section 144; PMLA notification S.O. 2036(E) of 3 May 2023
    body: |
      1. Collect KYC first: PAN, Aadhaar (stored masked) or CIN/LLPIN, address, partners or directors, and the last returns or audited accounts.
      2. Check the client's integrity, our skills and time, and independence. If the client wants income hidden or false bills used, or any check fails, decline the work.
      3. For any audit (statutory, tax, internal, bank), write to the previous auditor before accepting, keep proof of delivery, and wait a reasonable time for the reply.
      4. A firm that writes the client's books or is its internal auditor cannot also be its statutory or tax auditor.
      5. Count the signing partner's tax audits: at most 60 a year. Audits of presumptive-scheme cases are not counted.
      6. Agree scope, fees and duties in an engagement letter. The owner approves it before work starts. Fees are never a share of a refund, tax saved or any result.
      7. If the firm will manage client money, bank or securities accounts, buy or sell property or businesses for clients, or set up or run companies, LLPs or trusts for them, do the PMLA client checks first.
  - id: gst-monthly-return
    title: Monthly GST return
    source: CGST Act sections 16(4), 37, 39(10), 39(11) and 44; GST portal GSTR-3B FAQs; GSTN advisories on GSTR-3B liability locking (July 2025 tax period) and on barring returns after three years
    body: |
      1. Get the sales and purchase data early. Match sales with e-invoices and e-way bills.
      2. Accept, reject or keep pending each purchase bill in IMS, then match ITC with GSTR-2B. ITC for a year can be claimed only up to 30 November after the year ends, or the annual return if filed earlier.
      3. File GSTR-1 by the 11th (quarterly filers: IFF and GSTR-1 by the 13th). From the July 2025 tax period the liability that flows from GSTR-1 into GSTR-3B cannot be edited, so correct mistakes through GSTR-1A before filing GSTR-3B.
      4. Send the client the tax payable. File only after they confirm in writing and pay. GSTR-3B is due by the 20th (quarterly filers: the 22nd or 24th) and cannot be revised later.
      5. A return more than three years past its due date can no longer be filed; the portal blocks it.
      6. Save the ARN and send the filed copy to the client.
  - id: tax-notice-reply
    title: Replying to a tax notice
    source: CBDT Circular 19/2019 (DIN); incometax.gov.in e-Proceedings FAQ and Appeals help; CBIC Circular 249/06/2025-GST; CGST Rule 99 and section 107; Income-tax Act 1961 section 249
    body: |
      1. Get the full notice and check it is genuine. For income tax, check the DIN with "Authenticate notice/order" on the e-filing portal. For GST, check the RFN on the GST portal, or the CBIC DIN on letters sent outside the portal. Fake notice emails are common; never pay through a link in one.
      2. Note the reply date the same day. A GST scrutiny notice (ASMT-10) allows 30 days. A defective return notice usually allows 15 days.
      3. Add the firm as authorised representative for the proceeding on the portal. If the papers will not be ready, ask for an adjournment on the portal before the due date.
      4. Draft the reply with evidence. The engagement partner approves and the client confirms the facts before it is submitted. A submitted reply cannot be edited.
      5. Save the acknowledgement and track hearings and the order. Appeal time: GST, 3 months (1 more month with good reason) with a 10% pre-deposit of the disputed tax; income tax first appeal, 30 days from receiving the order.
      6. Bank attachment, recovery, a search or a summons is P1: call the partner at once.
      7. Only an advocate can argue in the High Court or a criminal court; we prepare the facts and figures.
  - id: audit-and-certificate-signing
    title: Signing tax audits and certificates
    source: incometax.gov.in Form 3CA-3CD user manual and "Work with My CA" manual; ICAI UDIN FAQs; ICAI SQC 1 paras 60, 74-75 and 83; ICAI Guidance Note on Reports or Certificates for Special Purposes; Income-tax Rules 1962 Rule 37BB and the Income-tax Rules 2026 (Forms 145 and 146)
    body: |
      1. The client assigns the audit form to the firm on the e-filing portal ("My CA"), and the CA accepts it.
      2. Prepare Form 3CA or 3CB with 3CD from the books (under the new Act, Form 26 from tax year 2026-27; check the current form). The partner reviews it. A listed company audit also needs an engagement quality control review before the report goes out.
      3. Sign with DSC and generate the UDIN on the day of signing. ICAI's outer limit has been 60 days; check the current rule before relying on it.
      4. The client must accept the uploaded form on the portal. Only then is it filed. The audit report is due one month before the return due date (check the CBDT circular each year for extensions).
      5. For certificates, confirm the purpose and format, check every figure against originals, take a management representation letter, and never certify what cannot be checked or put an earlier date on it.
      6. A CA certificate (15CB, which the new rules number Form 146; check the current form) is needed for a taxable remittance above ₹5 lakh in the year, unless the client has a lower-deduction order. The CA files it with DSC; the client then files 15CA (Form 145).
      7. Put the audit file together within 60 days of the report and keep it for 7 years.
  - id: itr-and-tds-filing
    title: Income tax return and TDS filing
    source: Income-tax Act 1961 sections 139 and 200; Income-tax Act 2025 (in force from 1 April 2026); incometax.gov.in 30-day e-verification FAQ; Income Tax Department tax calendar (TDS); CBDT Circular 07/2026
    body: |
      1. Know which law applies: AY 2026-27 and earlier years run under the Income-tax Act 1961 and its forms; income earned from 1 April 2026 (tax year 2026-27) runs under the Income-tax Act 2025, with new form numbers (reported as Form 130 for Form 16, and Forms 138 and 140 for 24Q and 26Q; check them on the portal).
      2. Collect Form 16, bank and capital gains statements or the books. Download AIS, TIS and 26AS and clear every difference with the client.
      3. Choose the tax regime with the client and get written confirmation of the computation.
      4. The review manager approves before filing. Check the year's due dates and any CBDT extension (as announced for AY 2026-27: 31 July for ITR-1 and ITR-2, 31 August for business cases without audit, 21 November for audit cases; confirm on the portal).
      5. E-verify within 30 days of filing. After that the return counts as filed on the day it is verified, and an unverified return is invalid.
      6. An updated return can only add income and tax; it cannot lower tax or raise a refund.
      7. TDS: deposit by the 7th of the next month (for March, by 30 April). File quarterly statements by 31 July, 31 October, 31 January and 31 May.
  - id: roc-annual-filing
    title: Company and LLP annual filings
    source: Companies Act 2013 sections 92, 96, 137 and 139; Companies (Registration Offices and Fees) Rules 2014; LLP Rules 2009, Rules 24 and 25
    body: |
      1. A company holds its AGM within six months of the year end (by 30 September); the first AGM within nine months.
      2. File AOC-4 (financial statements) within 30 days of the AGM, and MGT-7 or MGT-7A (annual return) within 60 days of the AGM. File ADT-1 within 15 days of the AGM that appoints the auditor.
      3. LLPs file Form 11 by 30 May and Form 8 by 30 October.
      4. Late forms cost an additional fee of ₹100 a day, so tell the client the cost before the due date passes.
      5. Forms that need a practising professional's certificate are certified by the engagement partner with DSC. MGT-8 and the secretarial audit are for a practising company secretary.
      6. Save the SRN and the challan, and send the filed forms to the client.

kpis:
  - id: filings-on-time
    name: Filed on time
    description: Returns, audit reports, forms and notice replies filed on or before the legal due date, as a share of all that fell due this month.
    unit: percent
    direction: up
    target: 98
  - id: late-fee-cost
    name: Late fees caused by us
    description: Late fees, interest and penalties clients paid this month because the firm filed late.
    unit: inr
    direction: down
    target: 0
  - id: notices-on-time
    name: Notices answered in time
    description: Department notices replied to, or an adjournment asked, before the reply date, as a share of notices due this month.
    unit: percent
    direction: up
    target: 100
  - id: udin-on-signing
    name: UDIN on signing day
    description: Signed audit reports and certificates whose UDIN was generated on the day of signing (the outer limit is 60 days).
    unit: percent
    direction: up
    target: 100
  - id: lock-up-days
    name: Lock-up days
    description: Days of unbilled work plus days of unpaid invoices (WIP days plus debtor days), counted in days.
    unit: count
    direction: down
    target: 90
  - id: fee-realisation
    name: Fee realisation
    description: Fees collected as a share of fees agreed in engagement letters for work done.
    unit: percent
    direction: up
    target: 90
