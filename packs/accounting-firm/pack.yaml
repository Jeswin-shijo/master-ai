    - id: fee-concession
      name: Fee discount or write-off
      keywords: [discount, a discount, discount of, fee discount, discount on fees, discount on the fees, give a discount, any discount, reduce the fees, reduce our fees, reduce my fees, lower the fees, fee reduction, reduction in fees, concession, waive the fees, waive our fees, fee waiver, write off, written off, bad debt, issue a credit note, issue credit note, credit note to the client, revised invoice]
      priority: P4
