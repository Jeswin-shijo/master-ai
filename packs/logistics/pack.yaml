# Ready-made pack: transporters, fleet owners, courier and parcel services,
# freight forwarders and warehouses. Built from researched Indian practice:
# CGST Rules 2017 (rule 138, e-way bills), the Carriage by Road Act 2007 and
# Rules 2011, the Motor Vehicles Act 1988 and the Central Motor Vehicles Rules
# 1989 (hazardous goods). Approval limits are defaults for a mid-size
# transporter; owners tune them.
id: logistics
version: 1.0.0
name: Logistics & transport
description: Load and parcel bookings, hazardous and oversize loads, e-way bills, accidents and thefts on the road, delays and breakdowns, lorry hire payments, damage claims and truck papers for transporters, couriers and freight companies.
kind: industry
sector: trade-logistics-tourism
extends: [sector-trade-logistics-tourism, orders-base]
match:
  keywords: [transport company, transporter, transporters, transport business, goods transport, trucks, truck fleet, truck owner, fleet owner, fleet operator, lorries, lorry service, roadlines, road lines, roadways, road carriers, carriers, freight carrier, logistics, logistics company, 3pl, third party logistics, freight forwarder, freight forwarding, courier, courier service, parcel service, cargo service, container trucking, trailer operator, tanker operator, warehousing, packers and movers, customs broker]

labels:
  Customer: Party
  Order: Freight order

entities:
  - name: Shipment
    label: Shipment (LR)
    plural_label: Shipments (LRs)
    title_field: lrNumber
    list_columns: [lrNumber, fromCity, toCity, truckNumber, status]
    fields:
      - { name: lrNumber, label: LR / docket number, type: string, required: true }
      - { name: bookingDate, label: Booking date, type: date }
      - name: loadType
        label: Load type
        type: enum
        options: [full-load, part-load, parcel, container, hazardous, over-dimensional]
      - { name: consignorName, label: Consignor, type: string, required: true }
      - { name: consignorGstin, label: Consignor GSTIN, type: string }
      - { name: consigneeName, label: Consignee, type: string }
      - { name: consigneePhone, label: Consignee phone, type: phone }
      - { name: deliveryAddress, label: Delivery address, type: text }
      - { name: fromCity, label: From, type: string, required: true }
      - { name: toCity, label: To, type: string, required: true }
      - { name: goods, label: Goods, type: text }
      - { name: packages, label: Packages, type: integer }
      - { name: weightKg, label: Weight (kg), type: number }
      - { name: declaredValue, label: Declared value, type: money }
      - name: riskType
        label: Risk
        type: enum
        options: [carrier-risk, owner-risk]
      - { name: ewayBillNumber, label: E-way bill number, type: string }
      - { name: ewayBillValidUntil, label: E-way bill valid until, type: datetime }
      - { name: truckNumber, label: Truck number, type: string }
      - { name: freight, label: Freight, type: money }
      - name: paymentTerms
        label: Payment terms
        type: enum
        options: [paid, to-pay, to-be-billed]
      - { name: promisedDelivery, label: Promised delivery date, type: date }
      - { name: deliveredAt, label: Delivered at, type: datetime }
      - { name: podReceived, label: POD received, type: boolean }
      - { name: podRemarks, label: POD remarks, type: text }
      - name: status
        label: Status
        type: enum
        required: true
        options: [booked, loaded, in-transit, delivered, pod-received, billed, cancelled]
  - name: Truck
    label: Truck
    plural_label: Trucks
    title_field: truckNumber
    list_columns: [truckNumber, bodyType, ownership, fitnessValidUntil, status]
    fields:
      - { name: truckNumber, label: Truck number, type: string, required: true }
      - name: ownership
        label: Own or market truck
        type: enum
        required: true
        options: [own, attached, market]
      - { name: ownerName, label: Owner name, type: string }
      - { name: ownerPhone, label: Owner phone, type: phone }
      - { name: ownerPan, label: Owner PAN, type: string }
      - { name: bodyType, label: Body type (e.g. 32 ft container), type: string }
      - { name: permittedLoadTonnes, label: Permitted load (tonnes), type: number }
      - name: permitType
        label: Permit
        type: enum
        options: [national, state]
      - { name: permitValidUntil, label: Permit valid until, type: date }
      - { name: fitnessValidUntil, label: Fitness valid until, type: date }
      - { name: insuranceValidUntil, label: Insurance valid until, type: date }
      - { name: pucValidUntil, label: PUC valid until, type: date }
      - { name: trackingWorking, label: GPS or FASTag tracking working, type: boolean }
      - { name: hazardousReady, label: Fitted and insured for hazardous goods, type: boolean }
      - name: status
        label: Status
        type: enum
        required: true
        options: [available, on-trip, in-workshop, papers-expired]
  - name: Driver
    label: Driver
    plural_label: Drivers
    title_field: name
    list_columns: [name, phone, licenceValidUntil, currentTruck, status]
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: phone, label: Phone, type: phone, required: true }
      - { name: licenceNumber, label: Licence number, type: string }
      - { name: licenceValidUntil, label: Licence valid until, type: date }
      - { name: hazardousEndorsement, label: Licence endorsed for hazardous goods, type: boolean }
      - { name: hazardousTrainingDate, label: Hazardous goods training date, type: date }
      - { name: idChecked, label: ID and address checked, type: boolean }
      - { name: currentTruck, label: Current truck, type: string }
      - name: status
        label: Status
        type: enum
        required: true
        options: [available, on-trip, resting, on-leave]
  - name: Claim
    label: Damage or shortage claim
    plural_label: Damage and shortage claims
    title_field: claimNumber
    list_columns: [claimNumber, lrNumber, claimType, claimAmount, status]
    fields:
      - { name: claimNumber, label: Claim number, type: string, required: true }
      - { name: lrNumber, label: LR number, type: string, required: true }
      - name: claimType
        label: Type
        type: enum
        required: true
        options: [damage, shortage, total-loss, theft, delay]
      - { name: bookingDate, label: Booking date, type: date }
      - { name: deliveryDate, label: Delivery date, type: date }
      - { name: noticeDate, label: Written claim received on, type: date }
      - { name: remarkOnPod, label: Damage or shortage noted on the POD, type: boolean }
      - { name: claimAmount, label: Amount claimed, type: money }
      - { name: declaredValue, label: Declared value, type: money }
      - { name: freight, label: Freight charged, type: money }
      - { name: surveyorAssessment, label: Surveyor's assessment, type: money }
      - { name: settledAmount, label: Settled amount, type: money }
      - { name: insurerInformed, label: Insurer informed, type: boolean }
      - name: status
        label: Status
        type: enum
        required: true
        options: [received, survey, offer-made, settled, rejected]

tools:
  - name: shipments.search
    description: Search bookings and LRs by LR number, party, route, truck or status.
    uses: records.search
    with: { entity: Shipment }
  - name: shipment.book
    description: Record a new booking with the consignor, consignee, goods, value, truck and payment terms. It is not an LR until the branch loads and signs it.
    uses: records.create
    with: { entity: Shipment, data: { status: booked } }
  - name: pod.record
    description: Mark that the signed and stamped POD has come back for a delivered load.
    uses: records.update
    with: { entity: Shipment, patch: { status: pod-received, podReceived: true } }
  - name: trucks.search
    description: Search own and market trucks by number, body type, paper expiry dates or status.
    uses: records.search
    with: { entity: Truck }
  - name: drivers.search
    description: Search drivers by name, phone, licence validity or current truck.
    uses: records.search
    with: { entity: Driver }
  - name: claims.search
    description: Search damage, shortage and theft claims by LR, party or status.
    uses: records.search
    with: { entity: Claim }
  - name: claim.open
    description: Open a damage, shortage or theft claim against an LR with the amount asked and the POD remark.
    uses: records.create
    with: { entity: Claim, data: { status: received } }

agents:
  - role: booking-desk
    name: Booking and control room desk
    description: Takes load and parcel bookings, records each LR, checks truck and driver papers, prepares e-way bill details for the documentation clerk, watches deliveries, tells parties about any delay, and hands truck placement and driver calls to the branch in charge by phone.
    instructions: Never generate, extend or cancel an e-way bill yourself; prepare the details and let the documentation clerk do it on the portal. Give parties only the arrival time the driver or control room has confirmed. Quote the LR and truck number in everything you write.
    autonomy: 3
    tools: [shipments.search, shipment.book, trucks.search, drivers.search, records.search, records.update, knowledge.search, document.generate, message.draft, message.send, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }
  - role: safety-claims-desk
    name: Safety and claims desk
    description: Records accidents, thefts and cargo claims, keeps the police and insurer reporting clock, drafts the intimation letters, checks the papers for hazardous and oversize loads, works out our liability limit from the LR and builds the claim file.
    instructions: People first; never hold back an ambulance, a police report or a safety step for paperwork or approval. Never admit liability or offer a settlement amount in writing; the owner decides claims above ₹25,000.
    autonomy: 2
    tools: [claims.search, claim.open, shipments.search, trucks.search, drivers.search, knowledge.search, document.generate, message.draft, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 120000, money_per_task_inr: 0, max_steps: 20 }
  - role: fleet-payments-desk
    name: Fleet and payments desk
    description: Tracks truck and driver paper expiry dates and sends reminders 30 days ahead, collects workshop, tyre and insurance quotes, chases PODs and marks them received, and prepares the truck owner payment list for accounts.
    instructions: A truck with an expired permit, fitness, insurance or PUC gets no new load. Never release or promise a payment; the accounts team releases bank payments.
    autonomy: 3
    tools: [trucks.search, drivers.search, shipments.search, pod.record, records.search, records.update, document.generate, message.draft, message.send, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 100000, money_per_task_inr: 0, max_steps: 20 }

workflows:
  - id: load-booking
    name: Load or parcel booking
    description: Record the booking, check the truck and papers, and get the truck placed and loaded.
    keywords: [booking, truck required, full load, part load, parcel, pickup]
    steps:
      - key: book
        title: Record the booking and check papers
        agent: booking-desk
        instructions: Record the shipment with consignor, consignee, goods, weight, value and payment terms. Check the truck's permit, fitness, insurance and PUC and the driver's licence, and prepare the LR and the e-way bill details.
      - key: place
        title: Get the truck placed and loaded
        agent: booking-desk
        depends_on: [book]
        instructions: Hand truck placement and loading to the branch in charge by phone with the loading point, time, truck type and papers needed. Once loaded, send the party the truck number, driver phone and tracking link.
  - id: hazardous-load
    name: Hazardous or oversize load
    description: Collect the hazardous goods papers or the oversize details and get the safety officer's inspection before loading.
    keywords: [hazardous, dangerous goods, msds, trem, odc, over dimensional]
    steps:
      - key: papers
        title: Collect the papers and check truck and driver
        agent: safety-claims-desk
        instructions: Collect the UN number, class, safety data sheet and TREM card from the consignor, or the size and weight for oversize cargo. Check the truck is fitted and insured for hazardous goods and the driver's licence is endorsed, and draft the route plan.
      - key: inspect
        title: Get the safety officer's inspection
        agent: safety-claims-desk
        depends_on: [papers]
        instructions: Ask the safety officer by phone to inspect the truck, labels and papers before loading and to confirm the route, then report when the load is delivered safely.
  - id: eway-bill-update
    name: E-way bill update
    description: Prepare the Part B update, extension or cancellation and get it done on the portal in time.
    keywords: [e-way bill, part b, extension, cancel]
    steps:
      - key: prepare
        title: Prepare the details
        agent: booking-desk
        instructions: Find the shipment and note the e-way bill number, truck number, current place, distance left and the reason (breakdown, transshipment, accident, flood or law and order).
      - key: portal
        title: Get it done on the portal
        agent: booking-desk
        depends_on: [prepare]
        instructions: Hand the update, extension or cancellation to the documentation clerk by phone with these details and the time window, and record the new validity on the shipment.
  - id: accident-response
    name: Accident or theft response
    description: Record what happened, keep the police and insurer clock, get the branch to the site and open the cargo claim.
    keywords: [accident, overturned, stolen, theft, injured, fire]
    steps:
      - key: record
        title: Record it and draft the intimations
        agent: safety-claims-desk
        instructions: Record the place, time, truck, driver and who is hurt. Confirm with the branch by phone that the injured are in hospital and the police are told, and draft the insurer intimation and the message to the party.
      - key: site
        title: Get the site handled and open the claim
        agent: safety-claims-desk
        depends_on: [record]
        instructions: Hand the site work (police papers, crane, guarding the goods, a replacement truck) to the nearest branch in charge by phone, open a claim for the cargo, and report what was recovered.
  - id: delay-recovery
    name: Delay or breakdown recovery
    description: Find out why the load is late, get it moving again and keep the party informed.
    keywords: [delay, breakdown, not reached, stuck, detained, godown closed]
    steps:
      - key: find
        title: Reach the driver and find the cause
        agent: booking-desk
        instructions: Reach the driver through the branch by phone, find the cause, the place and the new arrival time, and check that the e-way bill stays valid till then.
      - key: inform
        title: Fix it and tell the party
        agent: booking-desk
        depends_on: [find]
        instructions: Tell the party the new arrival time. For a breakdown, get the repair or replacement truck cost and send it to the operations manager if it is above ₹15,000. For a failed delivery, send the consignee a written notice and keep the goods safe.
  - id: truck-owner-payment
    name: Truck owner payment
    description: Check the POD and the hire slip and prepare the balance payment for accounts.
    keywords: [lorry hire, balance hire, pod, advance, diesel bill]
    steps:
      - key: check
        title: Check the POD and the hire slip
        agent: fleet-payments-desk
        instructions: Check the POD is signed, stamped and dated with no damage or shortage remark. Match the LR, hire slip and advance already paid, and check the owner's PAN and declaration are on file.
      - key: pay-list
        title: Prepare the payment list
        agent: fleet-payments-desk
        depends_on: [check]
        instructions: Prepare the payment list with the balance due and any deduction for damage, shortage or late POD, and hand it to the accounts team by phone for release.
  - id: claim-settlement
    name: Damage or shortage claim
    description: Build the claim file, get the survey done and prepare the offer for the owner's decision.
    keywords: [claim, damage, shortage, pilferage, compensation]
    steps:
      - key: file
        title: Build the claim file
        agent: safety-claims-desk
        instructions: Open the claim with the LR, booking date, POD remark, photos and invoice. Check it came within 180 days of booking, work out our limit from the declared value, freight and risk basis, and tell the insurer.
      - key: survey
        title: Survey and offer
        agent: safety-claims-desk
        depends_on: [file]
        instructions: Arrange the surveyor for partial damage through the branch by phone, draft the offer letter for the owner's decision, and get the signed discharge before payment.
  - id: fleet-renewal
    name: Truck papers and repairs
    description: Get quotes, hold trucks with lapsed papers and book the RTO, insurer or workshop visit.
    keywords: [fitness, permit, insurance, puc, service, tyres]
    steps:
      - key: plan
        title: List what is due and get quotes
        agent: fleet-payments-desk
        instructions: List the papers or work due for the truck with their expiry dates, collect quotes from the workshop, tyre dealer or insurer, and hold the truck from new loads if a paper has run out.
      - key: book
        title: Book the visit
        agent: fleet-payments-desk
        depends_on: [plan]
        instructions: Hand the RTO test, renewal or workshop visit to the fleet supervisor by phone with the date and the approved quote, and update the truck record when it is done.

lifecycle:
  case: { label: Job, plural: Jobs, prefix: JOB }
  stages:
    request:
      name: New booking or alert
      description: A party books a load, a driver or branch calls in a problem, a truck owner asks for payment, or the GPS or e-way bill system raises an alert.
    review:
      name: Check papers and details
      description: The desk checks the job has what it needs before anything moves (sender and receiver, goods, value, invoice and e-way bill, and for problems or claims the LR, truck and POD) and asks for anything missing.
      checks:
        - Consignor and consignee name, address, phone and GSTIN
        - Goods, number of packages, weight and declared value
        - "GST invoice or delivery challan, and an e-way bill when the value is over ₹50,000"
        - Forwarding note signed by the consignor, with any dangerous goods declared
        - Nothing banned or undeclared in the load
        - "For problems and claims: LR number, truck number and POD remarks"
        - "Time limits still open: e-way bill extension window, claim notice within 180 days of booking"
    classify:
      name: Set type and urgency
      description: The job gets its type, priority (P1 to P4), risk, deadline and owning desk (booking, control room, documentation, safety, accounts, claims or fleet).
      checks:
        - Accident, theft or injury marked as an emergency
        - Hazardous or oversize goods flagged for the safety officer
        - Deadline set from the promised delivery or the e-way bill expiry
    assign:
      name: Assign truck and team
      description: A branch or desk takes the job and, for loads, a truck and driver with valid papers are fixed with pickup and delivery times.
      checks:
        - Truck RC, permit, fitness, insurance and PUC valid
        - Driver licence valid for the truck, and endorsed for hazardous goods when needed
        - Load within the truck's permitted weight
        - GPS or FASTag tracking working
        - "Market truck: owner's RC, PAN and ID checked, hire and advance agreed in writing"
    approve:
      name: Approval if needed
      description: When the rules call for it, the safety officer, a manager or the owner approves before a risky load moves or money above the limit is spent or given up.
      checks:
        - Approver sees the amount, the risk and the evidence
        - Decision and reason recorded
    execute:
      name: Dispatch and track
      description: The truck, surveyor or mechanic goes out while the control room tracks location, e-way bill validity, costs, photos and the promised time, and tells the party about any delay.
      checks:
        - Location and arrival time kept up to date
        - E-way bill valid until arrival, Part B updated if the truck changes
        - Costs and bills recorded
        - Party told of any delay
    close:
      name: POD and closure
      description: The outcome is confirmed with a signed POD, repair bill, claim settlement or e-way bill record, charges are settled, and the job is closed with sign-off where the rules ask for it.
      checks:
        - POD signed, stamped and dated by the consignee
        - Any damage or shortage written on the POD turned into a claim job
        - Extra charges (detention, unloading) agreed and billed
        - Truck owner paid the balance only after a clean POD
        - Sign-off recorded where required
    report:
      name: Review and improve
      description: Each week the owner sees on-time delivery, POD delays, claims, e-way bill lapses and empty running, with repeat problems by route, party, truck and driver.
      checks:
        - Repeat breakdowns by truck
        - Repeat delays by route or party
        - Claims by cause and by branch
  priorities:
    - { id: P1, name: Emergency, respond_within_hours: 0.25, resolve_within_hours: 24 }
    - { id: P2, name: Urgent, respond_within_hours: 1, resolve_within_hours: 24 }
    - { id: P3, name: Normal, respond_within_hours: 4, resolve_within_hours: 168 }
    - { id: P4, name: Planned, respond_within_hours: 24, resolve_within_hours: 336 }
  roles:
    - { id: operations-manager, name: Operations manager, approves: "Loads worth more than ₹5 lakh before the truck is placed, delays and breakdowns that are P1 or high risk, and extra spend above ₹15,000 on the road; signs off accident and theft jobs" }
    - { id: accounts-manager, name: Accounts manager, approves: "Truck owner and supplier payments above ₹50,000 and refunds above ₹10,000; signs off every refund and claim settlement once it is paid" }
    - { id: safety-officer, name: Safety officer (HSE in-charge), approves: "Every hazardous or over-dimensional load before it moves; signs it off after safe delivery" }
    - { id: fleet-manager, name: Fleet manager, approves: "Truck repairs, tyres and paper renewals above ₹25,000" }
  urgent_keywords: [emergency, fire, caught fire, smoke, explosion, blast, accident, collision, collided, overturned, turned turtle, injured, injury, ambulance, unconscious, fatal, death, died, theft, stolen, robbery, robbed, looted, hijacked, truck missing, driver absconded, fraud, gas leak, chemical spill, tanker leak]
  categories:
    - id: customer-order
      name: Load or parcel booking
      keywords: [new booking, want to book, wish to book, book a truck, book a load, book a parcel, parcel booking, need a truck, need truck, truck required, trucks required, vehicle required, vehicle requirement, need a vehicle, place a truck, truck placement, vehicle placement, full load, full truck load, ftl, part load, ptl, load available, loading point, please pick up, pick up from, pickup from, send goods, send a parcel, freight rate, rate enquiry, need a quote, freight quotation, forwarding note, to pay basis, paid basis, to be billed, 14 ft, 17 ft, 19 ft, 20 ft, 22 ft, 24 ft, 32 ft, 40 ft, sxl, mxl, multi axle, open body, closed body, container required, trailer required]
      priority: P3
      risk: low
      department: Booking desk
      required_details:
        - { key: loadDate, label: Loading or pickup date, kind: date }
        - key: load
          label: Weight or truck size
          kind: keywords
          keywords: [tonne, ton, mt, kg, kgs, quintal, weight, cbm, cft, ft, feet, full load, ftl]
        - { key: value, label: Invoice value of the goods, kind: amount }
      required_checks:
        - Consignor and consignee name, address, phone and GSTIN
        - Goods, packages and weight, and the truck type that fits
        - "Invoice value, and an e-way bill when it is over ₹50,000"
        - Forwarding note signed with the declared value, and carrier's or owner's risk agreed
        - No dangerous, banned or undeclared goods
        - "Freight, GST on freight and payment terms (paid, to-pay or to be billed)"
        - "Loads worth more than ₹5 lakh: closed body or container, GPS working and insurance cover confirmed"
      not_eligible:
        - { keywords: [without bill, bina bill, kachha bill, kacha bill, without invoice, without gst bill], reason: "We move goods only with a GST invoice or delivery challan, as the law requires for every consignment." }
        - { keywords: [without e-way bill, without eway bill, no e-way bill, no eway bill, skip the e-way bill, avoid e-way bill, e-way bill not needed, no need of e-way bill], amount_above_inr: 50000, reason: "Goods worth more than ₹50,000 need an e-way bill before they move, so we cannot load them without one." }
      approval: { required: above_amount, role: operations-manager, amount_inr: 500000 }
      signoff: { required: false }
      workflow: load-booking
      execution: both
    - id: special-cargo
      name: Hazardous or oversize load
      keywords: [hazardous, hazardous goods, dangerous goods, hazchem, un number, un no, class 2, class 3, class 8, flammable, inflammable, corrosive, gas cylinders, lpg cylinders, lpg tanker, chemical tanker, acid, solvent, thinner, paint thinner, msds, trem, trem card, odc, over dimensional, oversize, heavy machinery, low bed trailer, hydraulic axle, transformer, boiler drum, wind blade, project cargo, explosives, detonators, fireworks, crackers, radioactive]
      priority: P3
      risk: high
      department: Safety and compliance
      required_details:
        - { key: moveDate, label: Date the load moves, kind: date }
        - key: cargoDetail
          label: UN number and class, or weight and size
          kind: keywords
          keywords: [un, class, msds, sds, tonne, ton, mt, kg, length, width, height, dimension, metre, meter, ft, feet]
      required_checks:
        - UN number, hazard class and safety data sheet from the consignor
        - Forwarding note and LR marked dangerous goods (red top-left corner)
        - Driver licence endorsed for hazardous goods and driver trained
        - Class labels, emergency information panel and TREM card on the truck
        - Goods insured under a Public Liability Insurance Act policy
        - Route and timing fixed with the consignor
        - "Oversize cargo: size and weight, road permissions and escort, and an e-way bill made as over-dimensional cargo"
      not_eligible:
        - { keywords: [explosives, detonators, gelatine sticks, fireworks, crackers, radioactive], reason: "Explosives, fireworks and radioactive material need a PESO or AERB licensed carrier and vehicle, which we do not hold; the consignor must book a licensed carrier." }
      approval: { required: always, role: safety-officer }
      signoff: { required: true, role: safety-officer }
      workflow: hazardous-load
      execution: both
    - id: eway-bill
      name: E-way bill task
      keywords: [e-way bill, eway bill, ewaybill, ewb, part b, update part b, consolidated e-way bill, extend e-way bill, e-way bill extension, e-way bill expiring, e-way bill expired, cancel e-way bill, e-way bill validity, vehicle number update]
      priority: P2
      risk: medium
      department: Documentation desk
      required_details:
        - key: vehicle
          label: Which truck
          kind: keywords
          keywords: [truck, lorry, vehicle, trailer, tempo, container, tanker]
      required_checks:
        - E-way bill number, invoice number and date
        - Current truck number and transporter ID
        - Current place and distance left
        - Extension only from 8 hours before to 8 hours after expiry, with the reason
        - Cancel only within 24 hours of making it and only if no officer has checked it on the road
        - Part B updated before the goods move to another truck
        - Invoice not older than 180 days, and no extension past 360 days from when the bill was first made
      not_eligible:
        - { keywords: [without e-way bill, without eway bill, no e-way bill, no eway bill, skip the e-way bill, avoid e-way bill, e-way bill not needed, no need of e-way bill], amount_above_inr: 50000, reason: "Goods worth more than ₹50,000 need an e-way bill before they move, so we cannot load them without one." }
        - { keywords: [without bill, bina bill, kachha bill, kacha bill, without invoice, without gst bill], reason: "We move goods only with a GST invoice or delivery challan, as the law requires for every consignment." }
