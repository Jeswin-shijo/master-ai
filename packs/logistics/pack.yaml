    - id: accident-theft
      name: Accident, theft or injury
      keywords: [accident, met with an accident, overturned, turned turtle, toppled, collision, collided, hit by, rammed, injured, injury, hurt, died, death, caught fire, fire, theft, stolen, robbery, robbed, looted, hijack, hijacked, truck missing, vehicle missing, driver absconded, driver ran away, gas leak, tanker leak, chemical spill]
      priority: P1
      risk: high
      department: Control room
      required_checks:
        - Exact place, truck number and driver phone
        - Injured taken to hospital (call 112)
        - Police told within 24 hours; FIR or diary entry number noted
        - Insurer told in writing with policy number, time, place and driver licence
        - Photos of the truck and cargo, and a count of what is left
        - Party told the same day, and a crane or replacement truck arranged
        - E-way bill Part B updated before the goods move to another truck
      approval: { required: high_risk_or_p1, role: owner }
      signoff: { required: true, role: operations-manager }
      workflow: accident-response
      execution: both
    - id: transit-delay
      name: Delay, breakdown or failed delivery
      keywords: [not delivered, not yet delivered, delivery delayed, delayed delivery, late delivery, shipment delayed, consignment delayed, delayed, pickup delayed, goods not reached, truck not reached, parcel not reached, not reached, not arrived, running late, driver late, vehicle not placed, truck not placed, broke down, broken down, breakdown, break down, vehicle breakdown, truck breakdown, puncture, tyre burst, engine failure, stuck in traffic, traffic jam, held up at, held at, stuck at, detained, seized, overloading, checkpost, check post, route diverted, route deviation, gps not working, gps stopped, driver not answering, driver phone off, transport strike, chakka jam, landslide, consignee not available, godown closed, refused delivery, refused to take delivery, re-delivery, return to origin, where is my parcel, where is my shipment, where is my consignment, where is the truck, eta]
      priority: P2
      risk: medium
      department: Control room
      required_details:
        - key: reference
          label: Which LR, consignment or truck
          kind: keywords
          keywords: [lr, docket, awb, bilty, gr, cn, consignment, shipment, parcel, truck, lorry, trailer, tempo, vehicle, container, tanker, driver, invoice, order]
      required_checks:
        - Truck number, LR number and current place
        - Cause and the new arrival time
        - "Cost to fix (repair, crane, extra truck, waiting or return), and the operations manager's OK before spending more than ₹15,000"
        - E-way bill still valid for the new arrival time
        - Party told the new arrival time
        - "Failed delivery: consignee given written notice and the goods held safely"
      not_eligible:
        - { keywords: [not booked with us, booked elsewhere, another transporter, other transporter, another courier company, other courier company, not our consignment, not our lr], reason: "The load was not booked with us; the party should contact the transporter who issued the LR." }
      approval: { required: high_risk_or_p1, role: operations-manager }
      signoff: { required: false }
      workflow: delay-recovery
      execution: both
    - id: supplier-payment
      name: Lorry hire and bills to pay
      keywords: [lorry hire, truck hire, balance hire, hire balance, balance lorry hire, hire charges, market truck payment, truck owner payment, fleet owner payment, broker payment, broker commission, advance for the truck, trip advance, diesel bill, fuel bill, pump bill, tyre bill, toll bill, workshop bill, garage bill, hamali bill, supplier bill, vendor bill, supplier payment, vendor payment, transporter bill, release payment, release the payment, release my payment, payment release, msme, udyam]
      priority: P3
      risk: medium
      department: Accounts
      required_details:
        - { key: amount, label: Bill or hire amount, kind: amount }
      required_checks:
        - "Lorry hire: clean POD received, and any damage or shortage on it held back for the claim"
        - Truck number, LR and amounts match the hire slip or bill
        - Advance already paid taken off the balance
        - "Truck owner's PAN and the 10-or-fewer trucks declaration on file, otherwise TDS deducted"
        - Bank details confirmed by a call before a first or changed payment
      approval: { required: above_amount, role: accounts-manager, amount_inr: 50000 }
      signoff: { required: false }
      workflow: truck-owner-payment
      execution: both
    - id: damage-claim
      name: Damage or shortage claim
      keywords: [damage, damaged, broken, breakage, wet, water damage, torn, leaking, leakage, crushed, dented, shortage, short delivery, short received, received short, delivered short, cartons short, boxes short, bags short, packages short, missing cartons, cartons missing, missing boxes, pilferage, pilfered, tampered, seal broken, claim, claim amount, compensation, goods lost]
      priority: P3
      risk: medium
      department: Claims desk
      required_details:
        - key: reference
          label: LR or docket number
          kind: keywords
          keywords: [lr, docket, awb, bilty, gr, cn, consignment, invoice]
        - { key: amount, label: Amount claimed, kind: amount }
      required_checks:
        - LR number and booking date
        - Damage or shortage written on the POD, or written notice soon after delivery for hidden damage
        - "Written claim within 180 days of booking, saying what was lost or damaged and the amount asked"
        - Photos and invoice copy
        - "Declared value, freight and risk (carrier's or owner's) to work out our limit"
        - Insurer told if the goods were insured
      not_eligible:
        - { keywords: [6 months ago, six months ago, 7 months ago, seven months ago, 8 months ago, eight months ago, 9 months ago, nine months ago, 10 months ago, 11 months ago, a year ago, one year ago, more than 180 days, over 180 days, after 180 days, more than six months, more than 6 months, over six months, over 6 months], reason: "The written claim reached us more than 180 days after booking, so the notice period in section 16 of the Carriage by Road Act, 2007 is over. Reply politely with the dates and the reason." }
        - { keywords: [seal intact, seal was intact, seals intact, seal found intact, said to contain, stc basis], reason: "The container or truck reached with the shipper's seal intact on a said-to-contain LR, so we never counted the goods inside; the shortage is for the shipper and the cargo insurer." }
      approval: { required: above_amount, role: owner, amount_inr: 25000 }
      signoff: { required: true, role: accounts-manager }
      workflow: claim-settlement
      execution: both
    - id: fleet-upkeep
      name: Truck papers and repairs
      keywords: [national permit, permit renewal, state permit, fitness, fitness certificate, fc renewal, insurance renewal, insurance due, insurance expiring, insurance expired, permit expired, permit expiring, puc, pollution certificate, road tax, green tax, rc renewal, rc transfer, licence renewal, license renewal, dl renewal, service due, servicing, oil change, new tyres, tyre change, retreading, battery, workshop, garage, maintenance, fastag, fastag recharge, gps device, speed governor, reflective tape, rto]
      priority: P4
      risk: low
      department: Fleet and workshop
      required_details:
        - key: truck
          label: Which truck
          kind: keywords
          keywords: [truck, lorry, vehicle, trailer, tanker, tipper, tempo, fleet, prime mover]
      required_checks:
        - Truck number and the paper or part concerned
        - Expiry dates of RC, permit, fitness, insurance and PUC
        - Licence validity of the drivers on the trucks affected
        - Quote from the workshop, tyre dealer or insurer
        - Odometer reading and last service record
      approval: { required: above_amount, role: fleet-manager, amount_inr: 25000 }
      signoff: { required: false }
      workflow: fleet-renewal
      execution: team
