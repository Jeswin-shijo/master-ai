playbooks:
  - id: eway-bill-on-the-road
    title: Make, update and extend an e-way bill
    source: CGST Rules, 2017, rule 138 (CBIC); e-way bill portal FAQ and Extend Validity API guide (NIC); GSTN advisory of 17 December 2024
    body: |
      1. Make the e-way bill before the goods move when the consignment is worth more than ₹50,000. Some states set a higher limit for movement inside the state, so check yours.
      2. Part A holds the invoice details and Part B the truck number. On the road the bill is not valid without Part B.
      3. Validity is one day for every 200 km (20 km for over-dimensional cargo). The first day runs until midnight of the day after the bill was made.
      4. If the goods move to another truck after a breakdown or transshipment, update Part B before they move.
      5. Extend only for a real reason (breakdown, accident, flood, law and order, transshipment delay), and only from 8 hours before to 8 hours after expiry. Give the current place and the distance left.
      6. Wrong details cannot be edited. Cancel within 24 hours (not after an officer has checked it on the road) and make a new one.
      7. Since 1 January 2025 the portal refuses invoices older than 180 days and stops extensions 360 days after the bill was first made.
  - id: booking-and-lr
    title: Book a load and issue the LR
    source: Carriage by Road Act, 2007, sections 3 and 8 to 11; Carriage by Road Rules, 2011, rules 10 and 12; Motor Vehicles Act, 1988, section 194
    body: |
      1. Get a goods forwarding note from the consignor stating the goods, their value and any dangerous goods; the consignor answers for what it says.
      2. Count and weigh before signing, because the LR is proof of weight, packages and description.
      3. Issue the LR (goods receipt) once the goods are loaded, with our common carrier registration number, in copies for the consignor, the consignee (travels with the truck) and the office.
      4. Write the declared value and whether it moves at carrier's risk or owner's risk. For total loss we pay up to ten times the freight, never more than the value of the goods, unless the consignor declared a higher value and paid the risk charge.
      5. Keep the load within the truck's permitted weight. Overloading costs ₹20,000 plus ₹2,000 per extra tonne and the truck is held until the extra load is taken off.
      6. For loads worth more than ₹5 lakh, use a closed body or container truck with working GPS and confirm the insurance cover before placing it.
  - id: hazardous-goods
    title: Send hazardous or oversize goods safely
    source: Carriage by Road Act, 2007, section 13; Carriage by Road Rules, 2011, rules 10 to 12; Central Motor Vehicles Rules, 1989, rules 9 and 129 to 137
    body: |
      1. The consignor declares dangerous goods on the forwarding note; the forwarding note and LR go on paper with a red top-left corner.
      2. Before loading, check the goods are insured under a Public Liability Insurance Act policy.
      3. The driver must hold a licence endorsed for hazardous goods and have done the hazardous goods training.
      4. Put the class labels and the emergency information panel on the truck, and give the driver the TREM card with emergency phone numbers.
      5. Fix the route and timing with the consignor, and the driver keeps to it.
      6. For oversize cargo, get the road permissions and escort, and make the e-way bill as over-dimensional cargo (20 km a day).
      7. The safety officer approves before the truck moves and signs off after safe delivery. After any accident the driver reports at once to the nearest police station and calls us.
  - id: road-accident-theft
    title: Accident or theft on the road
    source: Motor Vehicles Act, 1988, section 134; CGST Rules, 2017, rule 138(5) and 138(10)
    body: |
      1. People first: get the injured to a doctor or hospital (call 112) unless it is unsafe to stay. Never wait for approval to do this.
      2. Report at the nearest police station as soon as possible and within 24 hours, and note the FIR or diary entry number.
      3. Tell the insurer in writing: policy number, date, time and place, people hurt, and the driver's name and licence.
      4. Photograph the truck and cargo, count what is left, and keep the goods guarded.
      5. Tell the party the same day and arrange a crane or another truck.
      6. Update e-way bill Part B before the goods move to another truck, and extend it if it will run out.
      7. Open a damage or shortage claim job for the cargo.
  - id: damage-shortage-claim
    title: Handle a damage or shortage claim
    source: Carriage by Road Act, 2007, sections 10, 11 and 16; Carriage by Road Rules, 2011, rule 12; Amrit Transport Co. v. Oriental Insurance Co. (Rajasthan High Court, 16 December 2024)
    body: |
      1. Damage or shortage should be written on the POD at delivery. For damage found only after unpacking, the consignee must write to us soon after delivery, within the days printed on our LR terms.
      2. The written claim must reach us within 180 days of booking and say what was lost or damaged and how much is asked; a bare claim bill is not enough.
      3. Partial damage is valued by an independent licensed surveyor agreed with the consignor.
      4. Work out our limit: up to ten times the freight, never more than the value of the goods, unless a higher value was declared and the risk charge paid.
      5. If the goods came in a sealed container on a said-to-contain LR with the seal intact, the shortage is for the shipper and the cargo insurer.
      6. The owner approves any settlement above ₹25,000; accounts pays against a signed discharge and signs off the claim.
  - id: truck-owner-payments
    title: Pay market truck owners against POD
    source: Income-tax Act, 1961, section 194C(6) and (7) (carried into the Income-tax Act, 2025 from 1 April 2026); Carriage by Road Act, 2007, section 3
    body: |
      1. Before loading, take a copy of the truck's RC, the owner's PAN and ID, and agree the hire, advance and detention in writing on the hire slip.
      2. Pay the advance only after the truck is loaded and the LR is signed.
      3. Pay the balance only after a signed, stamped and dated POD comes back; hold back the amount of any damage or shortage written on it.
      4. No TDS is deducted when the owner has ten or fewer goods trucks and gives a declaration with PAN; otherwise deduct TDS on the hire.
      5. Confirm bank details by a call before a first or changed payment, and pay only to the owner's or broker's account named on the hire slip.
      6. Payments above ₹50,000 need the accounts manager's approval.

kpis:
  - id: placement-on-time
    name: Truck placed on time
    description: Share of truck requests where a checked truck reached the loading point at the agreed time this month.
    unit: percent
    direction: up
    target: 95
  - id: pod-turnaround
    name: POD turnaround
    description: Average hours from delivery to a clean signed POD on record.
    unit: hours
    direction: down
    target: 72
  - id: damage-shortage-rate
    name: Damage and shortage rate
    description: Share of deliveries with damage or shortage written on the POD this month.
    unit: percent
    direction: down
    target: 0.5
  - id: eway-bill-lapses
    name: E-way bill lapses
    description: E-way bills that ran out while the goods were still on the road this month.
    unit: count
    direction: down
    target: 0
  - id: empty-running
    name: Empty running
    description: Share of own-truck kilometres run without a load this month.
    unit: percent
    direction: down
    target: 20
  - id: open-claims
    name: Claims waiting for a survey or offer
    description: Damage and shortage claims received and not yet surveyed or answered.
    unit: count
    direction: down
    source: { type: records_count, entity: Claim, where: { status: received } }
