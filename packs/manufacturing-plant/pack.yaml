# Ready-made pack: factories and manufacturing units (auto parts, cement,
# steel, chemicals, food processing, plastics, textiles). Built from researched
# Indian practice: the OSH Code 2020 and state OSH rules, IS 17893:2023 work
# permits, the CPCB online monitoring protocol, ESI regulations, ISO 9001 and
# IATF 16949, then checked by an operations and compliance expert.
id: manufacturing-plant
version: 1.0.0
name: Manufacturing plant
description: Breakdowns, maintenance under permit, accidents and near misses, pollution alarms, quality problems and CAPA, production orders and purchases for factories and manufacturing units.
kind: industry
sector: energy-heavy-industry
extends: [sector-energy-heavy-industry, orders-base]
match:
  keywords:
    - factory
    - manufacturing unit
    - manufacturing plant
    - manufacturing company
    - manufacturer
    - msme manufacturer
    - msme unit
    - small scale industry
    - ssi unit
    - industrial unit
    - production unit
    - production plant
    - processing plant
    - auto parts manufacturer
    - auto parts maker
    - auto parts unit
    - auto components manufacturer
    - auto components maker
    - auto ancillary
    - component manufacturer
    - machining
    - cnc machining
    - sheet metal
    - stamping unit
    - forging unit
    - foundry
    - casting unit
    - steel plant
    - rolling mill
    - cement plant
    - cement factory
    - chemical plant
    - chemical factory
    - pharma manufacturing
    - food processing unit
    - dairy plant
    - plastic moulding
    - injection moulding
    - textile mill
    - spinning mill
    - garment factory

entities:
  - name: Machine
    label: Machine
    plural_label: Machines
    title_field: name
    list_columns: [code, name, line, criticality, status, nextPmDue]
    fields:
      - { name: code, label: Machine code, type: string, required: true }
      - { name: name, label: Machine name, type: string, required: true }
      - { name: line, label: Line or section, type: string }
      - name: criticality
        label: Criticality (A stops the plant)
        type: enum
        options: [A, B, C]
      - name: status
        label: Status
        type: enum
        required: true
        options: [running, stopped, under-maintenance, standby]
      - { name: lastPmDate, label: Last preventive maintenance, type: date }
      - { name: nextPmDue, label: Next PM due, type: date }
      - { name: statutoryTestDue, label: "Next statutory test due (lifts, hoists, tackle, pressure vessels)", type: date }
      - { name: lossPerHour, label: Loss per hour stopped, type: money }
      - { name: notes, label: Notes, type: text }
  - name: ProductionOrder
    label: Production order
    plural_label: Production orders
    title_field: orderNo
    list_columns: [orderNo, customer, partNo, quantity, dueDate, status]
    fields:
      - { name: orderNo, label: Order no., type: string, required: true }
      - { name: customer, label: Customer, type: string }
      - { name: partNo, label: Part or product, type: string, required: true }
      - { name: drawingRev, label: Drawing or spec revision, type: string }
      - { name: quantity, label: Quantity, type: integer, required: true }
      - { name: dueDate, label: Due date, type: date, required: true }
      - { name: line, label: Line, type: string }
      - { name: producedQty, label: Produced, type: integer }
      - { name: rejectedQty, label: Rejected, type: integer }
      - { name: orderValue, label: Order value, type: money }
      - name: status
        label: Status
        type: enum
        required: true
        options: [planned, released, running, on-hold, completed, dispatched]
  - name: QualityIssue
    label: Quality issue
    plural_label: Quality issues
    title_field: partNo
    list_columns: [partNo, lotNo, foundAt, qtyAffected, disposition, status]
    fields:
      - { name: partNo, label: Part or product, type: string, required: true }
      - { name: lotNo, label: "Batch, lot or heat no.", type: string }
      - { name: defect, label: Defect, type: text, required: true }
      - { name: qtyAffected, label: Quantity affected, type: integer }
      - name: foundAt
        label: Found at
        type: enum
        options: [incoming, in-process, final-inspection, customer]
      - { name: supplierOrCustomer, label: Supplier or customer, type: string }
      - name: disposition
        label: Decision
        type: enum
        options: [pending, sort, rework, scrap, use-as-is-concession, return-to-supplier]
      - { name: decidedBy, label: Decided by, type: string }
      - { name: rootCause, label: Root cause, type: text }
      - { name: capaDue, label: CAPA due, type: date }
      - { name: cost, label: "Cost (scrap, rework, sorting)", type: money }
      - { name: foundOn, label: Found on, type: date }
      - { name: owner, label: Who is handling it, type: string }
      - name: status
        label: Status
        type: enum
        required: true
        options: [open, contained, capa-open, closed]
  - name: SafetyIncident
    label: Safety incident
    plural_label: Safety incidents
    title_field: location
    list_columns: [occurredAt, location, type, personName, status]
    fields:
      - { name: occurredAt, label: When, type: datetime, required: true }
      - { name: location, label: Where, type: string, required: true }
      - name: type
        label: Type
        type: enum
        required: true
        options: [injury, near-miss, unsafe-condition, fire, gas-leak, spill, dangerous-occurrence, pollution-alarm]
      - { name: personName, label: Person involved, type: string }
      - { name: contractWorker, label: Contract worker, type: boolean }
      - { name: injury, label: Injury or damage, type: text }
      - { name: daysLost, label: Days lost, type: integer }
      - { name: permitInPlace, label: Permit and lock-out were in place, type: boolean }
      - { name: reportable, label: Needs notice to the Inspector-cum-Facilitator, type: boolean }
      - { name: noticeSentAt, label: Notice sent at, type: datetime }
      - { name: esiReportSentAt, label: ESIC accident report sent at, type: datetime }
      - { name: rootCause, label: Root cause, type: text }
      - name: status
        label: Status
        type: enum
        required: true
        options: [open, investigating, actions-open, closed]

tools:
  - name: machines.search
    description: Search machines by code, name, line or status.
    uses: records.search
    with: { entity: Machine }
  - name: machine.mark_under_repair
    description: Mark a machine as under maintenance while a breakdown or job is being worked on. Only the shift in-charge puts it back into production.
    uses: records.update
    with: { entity: Machine, patch: { status: under-maintenance } }
  - name: production_orders.search
    description: Search production orders by order number, customer, part or status.
    uses: records.search
    with: { entity: ProductionOrder }
  - name: production_order.plan
    description: Create a production order in planned status with part, drawing revision, quantity and due date.
    uses: records.create
    with: { entity: ProductionOrder, data: { status: planned } }
  - name: production_order.hold
    description: Put a production order on hold while suspect material is contained.
    uses: records.update
    with: { entity: ProductionOrder, patch: { status: on-hold } }
  - name: quality_issues.search
    description: Search quality issues by part, lot, supplier, customer or status.
    uses: records.search
    with: { entity: QualityIssue }
  - name: quality_issue.log
    description: Record a quality problem with part, lot, quantity and where it was found. The quality head decides what happens to the material.
    uses: records.create
    with: { entity: QualityIssue, data: { status: open, disposition: pending } }
  - name: incidents.search
    description: Search accidents, emergencies, pollution alarms and near misses.
    uses: records.search
    with: { entity: SafetyIncident }
    risk: { sensitivity: confidential }
  - name: incident.log
    description: Record an accident, emergency, pollution alarm or near miss with what happened, where, when and who was involved.
    uses: records.create
    with: { entity: SafetyIncident, data: { status: open } }
    risk: { sensitivity: confidential }

agents:
  - role: maintenance-planner
    name: Maintenance planner
    description: Logs breakdowns and maintenance jobs against the machine, prepares the permit and lock-out request for the shift in-charge, checks spares, gets and compares quotes for spares and services, drafts the purchase order, and hands the work to the fitter, electrician or service vendor by phone.
    instructions: Never tell anyone to start work and never mark a permit as signed; the shift in-charge signs permits and releases the machine. Refuse any request to remove or bypass a guard, light curtain, sensor or interlock. Quote the machine code in everything you write.
    autonomy: 3
    tools: [machines.search, machine.mark_under_repair, records.search, records.create, knowledge.search, document.generate, message.draft, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: internal }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }
  - role: quality-desk
    name: Quality and production desk
    description: Plans production orders against material and capacity, hands job cards to the supervisor, tracks output and rejections per shift, logs quality problems, traces the affected lots, drafts containment plans, 8D reports, customer replies and supplier debit notes, and chases CAPA owners.
    instructions: Only the quality head decides what happens to rejected material. Never promise a customer a decision or a date the quality head has not approved, and never release a held lot.
    autonomy: 3
    tools: [production_orders.search, production_order.plan, production_order.hold, quality_issues.search, quality_issue.log, machines.search, records.search, knowledge.search, document.generate, message.draft, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }
  - role: safety-desk
    name: Safety desk (EHS)
    description: Records accidents, emergencies, pollution alarms and near misses, keeps the reporting clock, collects statements and photos, drafts the statutory notice, the ESIC accident report, notes to the pollution board and licence or consent renewals for the plant head, and follows each corrective action to closure.
    instructions: Life and safety first. Never mark a notice as sent and never approve a restart; the plant head signs statutory notices and approves the restart. Never blame the person who reported a near miss.
    autonomy: 2
    tools: [incidents.search, incident.log, machines.search, knowledge.search, document.generate, message.draft, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 120000, money_per_task_inr: 0, max_steps: 20 }

workflows:
  - id: breakdown-repair
    name: Breakdown repair
    description: Log the breakdown, prepare the lock-out and permit, and get the fitter or electrician repairing it.
    keywords: [breakdown, stopped, tripped, jammed, not working, repair]
    steps:
      - key: log
        title: Log the breakdown and prepare the permit
        agent: maintenance-planner
        instructions: Find the machine by code, mark it under repair, log the stop time and what happened, check spares in stores and prepare the lock-out and permit request for the shift in-charge.
      - key: repair
        title: Get the repair done
        agent: maintenance-planner
        depends_on: [log]
        instructions: Hand the repair to the fitter or electrician on shift by phone with the machine, place, permit and target time. Call the service vendor if the plant team cannot fix it, and report the restart time and downtime.
  - id: maintenance-job
    name: Maintenance job under permit
    description: Book the machine release, the right permit and the crew for a planned job or statutory test, and file the readings.
    keywords: [pm, preventive, maintenance, overhaul, calibration, hot work, confined space, statutory test]
    steps:
      - key: book
        title: Book the release, permit and spares
        agent: maintenance-planner
        instructions: Check the PM checklist or statutory test due, the spares and the right permit (cold work, hot work, height, confined space or electrical), and ask the shift in-charge for a time to release the machine.
      - key: do
        title: Hand the job to the crew
        agent: maintenance-planner
        depends_on: [book]
        instructions: Hand the job to the maintenance crew or contractor by phone with the checklist, permit and date. Record the readings or test certificate and the next due date.
  - id: spares-purchase
    name: Spares and services purchase
    description: Check stock, compare quotes and draft the purchase order for a person to send.
    keywords: [indent, purchase, quote, quotation, vendor, spares, amc, po]
    steps:
      - key: compare
        title: Check stock and compare quotes
        agent: maintenance-planner
        instructions: Check stock and open orders, collect three quotes or use the rate contract, check the vendor's GST number and bank details, and write a short comparison.
      - key: order
        title: Draft the purchase order
        agent: maintenance-planner
        depends_on: [compare]
        instructions: Draft the purchase order and the message to the vendor for a person to send, follow up the delivery date, and remind stores to inspect the goods before the bill is passed.
  - id: quality-containment
    name: Quality containment
    description: Log the problem, trace and hold the suspect lots, and get the sorting and the customer reply done.
    keywords: [rejection, defect, complaint, hold, sorting, containment]
    steps:
      - key: contain
        title: Log, trace and hold
        agent: quality-desk
        instructions: Log the quality issue with part, lot and quantity, trace where suspect stock is (line, stores, in transit, at the customer), put the related production order on hold and draft the containment plan for the quality head.
      - key: sort
        title: Get the sorting done and reply
        agent: quality-desk
        depends_on: [contain]
        instructions: Hand the hold, sorting and re-inspection to the quality inspector in charge by phone and report the counts found good and bad. Draft the customer reply or the supplier debit note for a person to send.
  - id: capa-8d
    name: Root cause fix (CAPA or 8D)
    description: Run the 8D or CAPA, chase each action and check that the fix worked.
    keywords: [capa, 8d, root cause, repeat, audit finding, corrective action]
    steps:
      - key: analyse
        title: Open the 8D and list the actions
        agent: quality-desk
        instructions: Open the 8D or CAPA document with the problem data, the containment and the why-why or fishbone findings the team gives, and list each action with an owner and a date.
      - key: follow-up
        title: Chase the actions and check the fix
        agent: quality-desk
        depends_on: [analyse]
        instructions: Remind each action owner by phone before the due date, and check the next 3 lots for the problem before asking the quality head to close it.
  - id: production-order-run
    name: Production order
    description: Plan the order against material and capacity, release the job card and track it to dispatch.
    keywords: [schedule, production plan, customer order, job card, dispatch]
    steps:
      - key: plan
        title: Plan the order
        agent: quality-desk
        instructions: Create the production order with part, drawing revision, quantity and due date. Check raw material and machine capacity against the date and warn early if it will slip.
      - key: release
        title: Release the job card and track output
        agent: quality-desk
        depends_on: [plan]
        instructions: Hand the job card to the production supervisor by phone, track output and rejections each shift, and get the final inspection report from quality before dispatch.
  - id: emergency-response
    name: Accident or emergency response
    description: Record the event, keep the reporting clock, draft the notices and follow up the corrective actions.
    keywords: [accident, injury, fire, gas leak, spill, ocems, pollution, dangerous occurrence]
    steps:
      - key: record
        title: Record it and start the clock
        agent: safety-desk
        instructions: Record what happened, where, when and who was hurt, and whether a permit and lock-out were in place. For a pollution alarm, record the reading, the limit and the stack or outlet. List the reporting deadlines.
      - key: notice
        title: Draft the notices
        agent: safety-desk
        depends_on: [record]
        instructions: Draft the notice to the Inspector-cum-Facilitator, the ESIC accident report or the note to the pollution board, as the case needs, for the plant head to sign and send.
      - key: follow-up
        title: Follow up the investigation
        agent: safety-desk
        depends_on: [notice]
        instructions: Hand the investigation and corrective actions to the safety officer by phone and report what was agreed, with owners and dates.
  - id: statutory-filing
    name: Statutory reply or renewal
    description: List what a notice, licence or consent needs, and draft the reply or application for the plant head to sign before the due date.
    keywords: [notice, licence, renewal, consent, noc, inspector, return]
    steps:
      - key: prepare
        title: Prepare the reply or application
        agent: safety-desk
        instructions: Find the notice, licence or consent and its due date, list the papers, forms and fees it needs, and draft the reply or application for the plant head to sign. Never mark it as filed; a person files it and keeps the acknowledgement.
  - id: near-miss-fix
    name: Near miss fix
    description: Record the near miss and get the spot made safe and fixed.
    keywords: [near miss, unsafe, unsafe condition, slippery, guard missing]
    steps:
      - key: record-fix
        title: Record it and get it fixed
        agent: safety-desk
        instructions: Record the near miss or unsafe condition without naming anyone to blame, hand the fix to the area in-charge by phone with a date, and chase it until the safety officer closes it.

routines:
  - id: daily-plant-report
    name: Daily plant report
    description: Before the morning meeting, the plant in-charge reports yesterday's output, rejections, breakdown hours, safety events and shortages for the daily MIS.
    mode: automatic
    days: [1, 2, 3, 4, 5, 6]
    time: "08:30"
    questions:
      - { key: output, label: "Output yesterday", ask: "How much did the plant produce yesterday, against the plan?", type: text }
      - { key: rejections, label: "Rejections", ask: "How many pieces or tonnes were rejected or sent for rework?", type: text }
      - { key: breakdownHours, label: "Breakdown hours", ask: "How many hours were machines stopped for breakdowns?", type: number, unit: hours }
      - { key: safetyEvents, label: "Accidents or near misses", ask: "Was there any accident, near miss or unsafe condition?", type: text, flag: true }
      - { key: shortages, label: "Shortages", ask: "Is any raw material, spare or manpower short for today's plan?", type: text, flag: true, required: false }

lifecycle:
  case: { label: Work order, plural: Work orders, prefix: WO }
  stages:
    request:
      name: Request or alarm raised
      description: A worker, supervisor, customer, supplier, machine alarm or pollution monitor raises the work, and it is logged with time, line and shift.
    review:
      name: Details and safety check
      description: The shift supervisor checks that the details, photos and papers are complete and the area is safe, and refuses any request to bypass a guard or safety rule.
      checks:
        - Who raised it and how to reach them
        - Machine, product or area named, with line and shift
        - What happened and when
        - Batch, lot or heat number for quality problems
        - Quote, customer PO or drawing attached when the work needs one
        - Area made safe and people out of danger
        - Not a repeat of an open work order
        - Does not ask to remove or bypass a guard, light curtain, sensor or interlock
    classify:
      name: Priority and department
      description: The work order gets its type, priority (P1 to P4), risk, target times and department, which starts the response clock.
    assign:
      name: Assign in-charge and deadline
      description: A named in-charge (engineer, supervisor or contractor) and crew get the job with a deadline that fits the shift plan.
      checks:
        - Named in-charge with a phone number
        - Contract workers have safety induction, gate pass and PPE
    approve:
      name: Permit or approval
      description: Where the rules say so, the shift in-charge signs the permit and lock-out, the safety officer clears hot work, height and confined-space permits, the quality head decides on the material, or the plant head or owner approves before work starts.
      checks:
        - "Breakdown and maintenance jobs: shift in-charge releases the machine and signs the permit and lock-out"
        - "Hot work, height and confined-space permits: the safety officer clears them after the shift in-charge releases the machine"
        - "Quality problems and CAPA plans: quality head"
        - "Accidents, emergencies and pollution alarms: plant head approves the notice and the restart"
        - "Statutory notices, licence and consent renewals: plant head signs the reply"
        - "Purchases above ₹1,00,000 and any work order above ₹5,00,000: owner"
    execute:
      name: Job in progress
      description: The crew or team does the job under the permit while downtime, spares, cost, photos and readings are logged and deadlines are watched shift by shift.
      checks:
        - Stop and restart times logged
        - Spares and cost booked to the work order
        - Before and after photos
        - Permit renewed if the job runs into the next shift
    close:
      name: Verify and sign off
      description: The result is checked with a trial run or re-inspection, the permit is closed, and the named role signs off before the work order closes.
      checks:
        - Trial run or re-inspection passed
        - "Permit closed: locks and tags off, guards back, area clean"
        - Root cause written, and a CAPA opened if the problem can come back
        - Statutory notice, ESIC report or customer reply sent where required
        - Spares, cost, downtime and photos recorded
        - Person who raised it told the outcome
    report:
      name: MIS and improvement
      description: The daily and monthly MIS shows OEE, downtime, rejections, accidents and near misses, open CAPAs and on-time delivery, flags repeat problems for root-cause work and keeps the record for inspectors and auditors.
      checks:
        - Daily MIS ready for the morning meeting
        - Repeat problem flagged when the same machine or defect comes back 3 times in 30 days
        - Open safety items taken to the monthly safety committee
  priorities:
    - { id: P1, name: Emergency or line stopped, respond_within_hours: 0.25, resolve_within_hours: 8 }
    - { id: P2, name: Urgent, respond_within_hours: 1, resolve_within_hours: 24 }
    - { id: P3, name: Normal, respond_within_hours: 8, resolve_within_hours: 168 }
    - { id: P4, name: Planned, respond_within_hours: 24, resolve_within_hours: 720 }
  roles:
    - { id: plant-head, name: Plant head (factory manager), approves: "Statutory notices after an accident, dangerous occurrence or pollution alarm, replies to inspectors and the pollution board, and restarting the machine or area afterwards" }
    - { id: shift-in-charge, name: Shift in-charge, approves: "Releases the machine and signs the permit and lock-out before any breakdown or maintenance job; accepts the machine back after the trial run" }
    - { id: safety-officer, name: Safety officer (EHS), approves: "Clears (countersigns) hot work, height and confined-space permits; signs off accidents, emergencies and near misses once the investigation and fixes are done" }
    - { id: quality-head, name: Quality head (QA/QC), approves: "Decides what happens to rejected material (rework, scrap, return, or use as is with the customer's concession) and approves CAPA plans; signs off quality problems, CAPAs and the final inspection before dispatch" }
    - { id: maintenance-head, name: Maintenance in-charge, approves: "Signs off finished preventive maintenance checklists and statutory test certificates" }
