playbooks:
  - id: accident-first-hours
    title: "Accident or dangerous occurrence: the first hours"
    source: OSH Code 2020 ss.10 and 11; OSH (Central) Rules 2026 and the state OSH rules (Gujarat OSH Rules 2025, Form 6 within 12 hours); ESI (General) Regulations 1950, Reg 68
    body: |
      1. Stop the machine, isolate the supply, give first aid and get the injured person to hospital (the ESIC hospital or dispensary if they are covered by ESI). Leave the spot as it was for the investigation.
      2. Phone the plant head, the owner and the safety officer at once, and tell the family.
      3. A death, an injury that may keep someone off work 48 hours or more, or a dangerous occurrence (fire, explosion, gas leak, crane, hoist or scaffold failure) needs a notice to the Inspector-cum-Facilitator: phone at once, then send the written notice in the form and time your state's OSH rules set (for example, Gujarat's rules say Form 6 within 12 hours; check the current rule for your state).
      4. For a worker covered by ESI, send the accident report to the ESIC branch office within 24 hours. For others, keep the papers for an Employee's Compensation claim.
      5. Collect photos, CCTV, witness statements and the permit and lock-out record before the shift ends.
      6. Restart only after the plant head approves, then open a CAPA work order for the root cause and track each action to closure.
  - id: work-permit-lockout
    title: Work permit and lock-out before any job
    source: IS 17893:2023 Work Permit System, Code of Practice; OSH Code 2020 ss.13(e) and 15; Factories Act 1948 ss.21, 36 and 111; Safe in India, CRUSHED 2026
    body: |
      1. Nobody works on a machine until production has released it, every energy source (electrical, hydraulic, air, gravity, stored pressure) is switched off, locked, tagged and tested dead, and the shift in-charge has signed the permit.
      2. Pick the right permit: cold work, hot work (welding, gas cutting, grinding), work at height, confined space or electrical. The safety officer countersigns hot work, height and confined-space permits.
      3. Confined space: a competent person tests the air and certifies it in writing, and one person stays outside with a rope and a way to call for help.
      4. Contract workers need a safety induction, a gate pass and PPE before they start.
      5. Never remove, bypass or jumper a guard, light curtain, sensor or interlock to keep production going; refuse and tell the plant head.
      6. Close the permit with the shift in-charge: locks off by the people who put them on, guards back, trial run done, area clean. Renew the permit if the job runs into the next shift.
  - id: quality-containment
    title: "Quality problem: contain fast, then fix the cause"
    source: ISO 9001:2015 clauses 8.7 and 10.2; IATF 16949:2016 clause 10.2.3
    body: |
      1. Hold and red-tag every suspect piece: on the line, in stores, in transit and at the customer.
      2. Record the part number, the batch, lot or heat number, the quantity, photos and the last good lot.
      3. Only the quality head decides: rework, scrap, return to supplier, or use as is with the customer's written concession. Record who decided and why.
      4. Re-inspect every reworked piece before it moves on, and mark the lots that are cleared.
      5. Send the customer a containment plan within 24 hours. A repeat problem becomes a CAPA with a root cause and a check on the next lots.
  - id: ocems-pollution-alarm
    title: Pollution alarm from the online monitor (OCEMS)
    source: CPCB protocol for online continuous emission and effluent monitoring, with automated alerts (13 March 2018); Air Act 1981 s.31A; Water Act 1974 s.33A
    body: |
      1. Treat a CPCB or SPCB SMS alert like a notice from the board and raise an emergency work order at once.
      2. Check the bag filter, ESP or effluent plant and the analyser. Cut the feed or stop the section if the control equipment has failed.
      3. Write down the cause and the action taken within 24 hours, and keep the log and the analyser calibration record for inspections.
      4. If the reading went high during start-up, shutdown or analyser calibration, log it and send a note to the board within 24 hours.
      5. Repeated alerts lead to show-cause notices and closure directions; the plant head approves every reply to the board.
  - id: near-miss-reporting
    title: Near miss and unsafe condition reports
    source: OSH Code 2020 ss.13(d), 14 and 22
    body: |
      1. Every worker, contract workers included, can report an unsafe act, an unsafe condition or a near miss. Thank the person and never blame.
      2. Make the spot safe in the same shift: barricade, clean, cover or stop the job.
      3. Give each fix an owner and a date, and close it with the safety officer.
      4. If someone sees imminent danger, stop the work, fix it at once and report the action to the Inspector-cum-Facilitator.
      5. Review near misses and open fixes in the monthly safety committee. More reports is a good sign: people trust the system.

kpis:
  - id: oee
    name: Machine efficiency (OEE)
    description: Availability × performance × quality for the key machines or lines, per month.
    unit: percent
    direction: up
    target: 75
  - id: mean-time-to-repair
    name: Average repair time (MTTR)
    description: Total breakdown time from machine stop to restart, divided by the number of breakdowns, per month.
    unit: hours
    direction: down
    target: 2
  - id: rejection-rate
    name: Rejection rate
    description: Pieces or tonnes rejected or reworked, in the plant and at customers, as a share of everything produced this month.
    unit: percent
    direction: down
    target: 1
  - id: otif
    name: On-time in-full delivery (OTIF)
    description: Customer order lines delivered complete by the promised date, as a share of all order lines due this month.
    unit: percent
    direction: up
    target: 95
  - id: near-misses-reported
    name: Near misses reported
    description: Near misses and unsafe conditions reported this month. More reports mean people trust the system and the next accident is caught early.
    unit: count
    direction: up
  - id: open-quality-issues
    name: Open quality issues
    description: Quality issues still open, waiting for containment or a decision.
    unit: count
    direction: down
    source: { type: records_count, entity: QualityIssue, where: { status: open } }

registers:
  - id: production-orders
    entity: ProductionOrder
    label: Production orders
    columns: [orderNo, customer, partNo, quantity, producedQty, dueDate, status]
    filters: [status]
    date_field: dueDate
    totals: [quantity, producedQty, rejectedQty, orderValue]
    card: { count: { when: { status: [released, running] }, label: running } }
    checks:
      - overdue: { date: dueDate }
        when: { status: [planned, released, running, on-hold] }
      - limit: { fields: [rejectedQty], max: producedQty }
      - duplicate: [orderNo]
  - id: quality-issues
    entity: QualityIssue
    label: Quality issues
    columns: [partNo, lotNo, defect, foundAt, disposition, owner, status]
    filters: [foundAt, disposition, status]
    date_field: foundOn
    totals: [qtyAffected, cost]
    card: { count: { when: { status: [open, contained, capa-open] }, label: open } }
    checks:
      - overdue: { date: capaDue }
        when: { status: [open, contained, capa-open] }
      - missing: [decidedBy]
        when: { disposition: [use-as-is-concession] }
      - missing: [rootCause]
        when: { status: [closed] }
  - id: machines
    entity: Machine
    label: Machines
    columns: [code, name, line, criticality, nextPmDue, status]
    filters: [criticality, status]
    card: { count: { when: { status: [stopped] }, label: stopped } }
    checks:
      - overdue: { date: nextPmDue }
        when: { status: [running, standby] }
      - overdue: { date: statutoryTestDue }
  - id: safety-incidents
    entity: SafetyIncident
    label: Safety incidents
    columns: [occurredAt, location, type, personName, daysLost, status]
    filters: [type, status, reportable]
    date_field: occurredAt
    totals: [daysLost]
    card: { count: { when: { status: [open, investigating, actions-open] }, label: open } }
    checks:
      - missing: [noticeSentAt]
        when: { reportable: [true] }
        why: Factories Act notice
      - missing: [esiReportSentAt]
        when: { daysLost: { above: 0 } }
