# Ready-made pack: software and SaaS companies (product companies running
# customer-facing web and mobile apps). Built from researched Indian practice:
# CERT-In Directions 2022, the DPDP Act 2023 and Rules 2025, the IT Act sections
# 69, 69A and 79 with the IT Rules 2021 (as amended in 2026), section 94 BNSS,
# RBI e-mandate rules, the CGST Act and common incident and release practice.
id: software-saas
version: 1.0.0
name: Software & SaaS company
description: Outages, security incidents and CERT-In reports, bugs, releases, subscription billing and refunds, privacy and police requests, admin and login changes, how-to questions and feature requests for software and SaaS product companies.
kind: industry
sector: technology-innovation
extends: [sector-technology-innovation, projects-base]
match:
  keywords:
    - saas
    - saas company
    - saas startup
    - saas product
    - b2b saas
    - software as a service
    - software company
    - software product
    - software product company
    - software startup
    - tech startup
    - technology startup
    - app company
    - mobile app company
    - consumer app
    - cloud software
    - subscription software
    - online software

labels:
  Project: Implementation

entities:
  - name: CustomerAccount
    label: Customer account
    plural_label: Customer accounts
    description: A company or person subscribed to the product, with its plan, admins and billing details.
    title_field: companyName
    list_columns: [companyName, plan, status, renewalOn, monthlyValue]
    fields:
      - { name: companyName, label: Company or customer name, type: string, required: true }
      - { name: accountId, label: Account ID, type: string, required: true }
      - name: plan
        label: Plan
        type: enum
        options: [free, trial, starter, growth, enterprise]
      - name: supportLevel
        label: Support level
        type: enum
        options: [standard, priority, enterprise]
      - { name: adminName, label: Account admin, type: string }
      - { name: adminEmail, label: Admin email, type: email }
      - { name: billingEmail, label: Billing contact email, type: email }
      - { name: phone, label: Registered phone, type: phone }
      - { name: gstin, label: GSTIN, type: string }
      - { name: state, label: State (place of supply), type: string }
      - { name: monthlyValue, label: Monthly value, type: money }
      - { name: renewalOn, label: Renewal date, type: date }
      - name: status
        label: Status
        type: enum
        required: true
        options: [trial, active, past-due, cancelled]
      - { name: holdsPersonalData, label: We hold personal data of their staff or customers, type: boolean }
  - name: Incident
    label: Outage or security incident
    plural_label: Outages and security incidents
    title_field: title
    list_columns: [title, kind, severity, noticedAt, status]
    fields:
      - { name: title, label: What happened, type: string, required: true }
      - name: kind
        label: Kind
        type: enum
        required: true
        options: [outage, slowdown, security, data-leak]
      - name: severity
        label: Severity
        type: enum
        options: [P1, P2, P3]
      - { name: startedAt, label: Started at, type: datetime }
      - { name: noticedAt, label: Noticed or reported at, type: datetime, required: true }
      - { name: restoredAt, label: Restored or contained at, type: datetime }
      - { name: customersAffected, label: Customers affected, type: integer }
      - { name: downtimeMinutes, label: Downtime (minutes), type: integer }
      - { name: personalDataInvolved, label: Personal data involved, type: boolean }
      - { name: certInReportedAt, label: Reported to CERT-In at, type: datetime }
      - { name: certInReference, label: CERT-In reference, type: string }
      - { name: rootCause, label: Root cause, type: text }
      - { name: reviewHeldOn, label: Incident review held on, type: date }
      - name: status
        label: Status
        type: enum
        required: true
        options: [open, contained, resolved, review-done]
  - name: Release
    label: Release or change
    plural_label: Releases and changes
    title_field: version
    list_columns: [version, changeType, plannedAt, status, outcome]
    fields:
      - { name: version, label: Version or change name, type: string, required: true }
      - name: changeType
        label: Type
        type: enum
        required: true
        options: [standard, normal, emergency]
      - { name: summary, label: What changes, type: text }
      - { name: plannedAt, label: Planned for, type: datetime }
      - { name: downtimeExpectedMinutes, label: Downtime expected (minutes), type: integer }
      - { name: customersToldOn, label: Customers told on, type: date }
      - { name: testedOnStaging, label: Tested on staging, type: boolean }
      - { name: rollbackPlan, label: Rollback plan, type: text }
      - { name: approvedBy, label: Approved by, type: string }
      - { name: releasedAt, label: Released at, type: datetime }
      - name: status
        label: Status
        type: enum
        required: true
        options: [planned, approved, released, rolled-back, cancelled]
      - name: outcome
        label: Outcome
        type: enum
        options: [fine, hotfix-needed, rolled-back, caused-incident]
  - name: Payment
    label: Invoice and payment
    plural_label: Invoices and payments
    title_field: invoiceNumber
    list_columns: [invoiceNumber, account, amount, status, paidOn]
    fields:
      - { name: invoiceNumber, label: Invoice number, type: string, required: true }
      - { name: account, label: Customer account, type: string, required: true }
      - { name: invoiceDate, label: Invoice date, type: date }
      - { name: amount, label: Amount (with GST), type: money, required: true }
      - { name: gstAmount, label: GST, type: money }
      - name: mode
        label: Paid by
        type: enum
        options: [card-auto-debit, upi-autopay, net-banking, neft-rtgs, other]
      - { name: reference, label: Gateway payment ID or UTR, type: string }
      - { name: paidOn, label: Paid on, type: date }
      - name: status
        label: Status
        type: enum
        required: true
        options: [due, paid, failed, refunded, disputed]
      - { name: refundOrCredit, label: Refund or credit given, type: money }
      - { name: creditNoteNumber, label: Credit note number, type: string }

tools:
  - name: accounts.search
    description: Search customer accounts by company, account ID, admin, plan or status.
    uses: records.search
    with: { entity: CustomerAccount }
  - name: incidents.search
    description: Search outages and security incidents by what happened, kind or status.
    uses: records.search
    with: { entity: Incident }
  - name: incident.log
    description: Record an outage or security incident with when it started and when it was noticed, which starts its clocks.
    uses: records.create
    with: { entity: Incident }
  - name: releases.search
    description: Search releases and changes by version, type or status.
    uses: records.search
    with: { entity: Release }
  - name: release.plan
    description: Prepare a release or change record for the engineering manager to approve. It is not approved or live until a person says so.
    uses: records.create
    with: { entity: Release, data: { status: planned } }
  - name: payments.search
    description: Search invoices and payments by invoice number, account, payment ID or status.
    uses: records.search
    with: { entity: Payment }

agents:
  - role: support-desk
    name: Support desk
    description: Answers how-to questions from the help articles, collects bug details and tries to repeat them, checks known issues, verifies admin and login change requests, logs feature ideas and personal data requests, keeps customers updated and hands engineering work to the engineer in charge by phone.
    instructions: Give every customer the ticket number and when they will hear from us next. Never change admins, owners or login details without the written OK the rules ask for. Never share or delete anyone's personal data, or reply to the police or a court, until the privacy officer approves. Hand over to a person when the customer asks for one, is upset, or two answers have not solved it.
    autonomy: 3
    tools: [accounts.search, incidents.search, releases.search, records.search, records.create, records.update, knowledge.search, document.generate, message.draft, message.send, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 120000, money_per_task_inr: 0, max_steps: 25 }
  - role: incident-desk
    name: Incident and release desk
    description: Runs the clock on outages, security incidents and releases. Logs the incident, pages the on-call engineer or security lead by phone, drafts status page and customer updates, keeps the timeline, drafts the CERT-In report and breach notices for approval, prepares release records and watches errors after go-live.
    instructions: Start the CERT-In 6-hour clock from the moment anyone noticed or told us, not when it is confirmed. Never send a CERT-In report or a breach notice, and never mark a release approved; the security lead or the engineering manager does that. During an outage, roll back first and find the cause after.
    autonomy: 3
    tools: [incidents.search, incident.log, releases.search, release.plan, accounts.search, records.update, knowledge.search, document.generate, message.draft, message.send, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }
  - role: billing-desk
    name: Billing desk
    description: Answers billing questions, resends and corrects GST invoices, retries failed payments, changes plans, processes refunds and service credits within policy and prepares chargeback evidence.
    instructions: Refunds go back only to the card, UPI or bank account that paid. Refunds, credits or waivers above ₹10,000 wait for the finance manager. Send the pre-debit notice at least 24 hours before every auto-debit, and get the customer's OTP for any auto-debit above ₹15,000.
    autonomy: 3
    tools: [accounts.search, payments.search, records.search, records.update, knowledge.search, document.generate, payment.request, refund.issue, message.draft, message.send, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 100000, money_per_task_inr: 10000, max_steps: 20 }

workflows:
  - id: outage-response
    name: Outage response
    description: Open the incident, get the on-call engineer restoring service and keep customers updated until it is back.
    keywords: [outage, down, "503", "502", uptime, health check, error rate, latency, failover, rollback]
    steps:
      - key: open-incident
        title: Open the incident and page on call
        agent: incident-desk
        instructions: Log the incident with when it started and when it was noticed, list releases and config changes from the last 24 hours, and page the on-call engineer by phone with the impact. Draft the first status page and customer update within 30 minutes.
      - key: restore
        title: Restore service and keep everyone posted
        agent: incident-desk
        depends_on: [open-incident]
        instructions: Keep the timeline, post updates at least every hour, ask the engineering head to okay any rollback, failover or emergency fix, and record the restore time.
      - key: after
        title: Work out credits and book the review
        agent: incident-desk
        depends_on: [restore]
        instructions: Work out the downtime per customer for the uptime report and service credits, and book the blameless review within 5 working days.
  - id: security-response
    name: Security incident response
    description: Contain the attack or leak, keep the evidence and get the CERT-In report and notices ready for the security lead.
    keywords: [hacked, breach, leak, ransomware, phishing, suspicious login, vulnerability, cert-in, ddos]
    steps:
      - key: contain
        title: Start the clock and contain it
        agent: incident-desk
        instructions: Log the incident with the time it was noticed, phone the security lead at once, and list the containment steps (block, close the exposed link, rotate keys and passwords, log users out) and the logs and accounts to keep as evidence.
      - key: report
        title: Draft the CERT-In report and notices
        agent: incident-desk
        depends_on: [contain]
        instructions: Draft the CERT-In report to go within 6 hours of noticing it, the notices to affected customers and people in plain words, and the status page update, all for the security lead to approve.
      - key: close-gap
        title: Close the way in and follow up
        agent: incident-desk
        depends_on: [report]
        instructions: Hand the fix of the way in to the engineer in charge by phone, record the CERT-In reference, and book the blameless review.
  - id: bug-fix
    name: Bug fix
    description: Collect the details, repeat the bug, get it fixed and tell everyone who reported it.
    keywords: [bug, error, crash, broken, wrong total, not working, regression]
    steps:
      - key: triage
        title: Collect details and repeat it
        agent: support-desk
        instructions: Ask for anything missing (screen, steps, screenshot, error text, app or browser version), search known issues, try to repeat it and give the customer a workaround if there is one.
      - key: fix
        title: Get it fixed
        agent: support-desk
        depends_on: [triage]
        instructions: Hand the bug to the engineer in charge of that module by phone with the steps and how many customers hit it, and tell everyone who reported it when the fix is live.
  - id: release-change
    name: Release or change
    description: Prepare the change record, get it approved, release it in the agreed window and watch it afterwards.
    keywords: [release, deploy, go live, hotfix, migration, maintenance window, feature flag, ssl, dns]
    steps:
      - key: prepare
        title: Prepare the change record
        agent: incident-desk
        instructions: Fill the release record from the pull request with what changes, who it affects, the window, test and staging results and the rollback plan, and draft the maintenance notice if there is downtime.
      - key: release
        title: Release and watch
        agent: incident-desk
        depends_on: [prepare]
        instructions: Once the engineering manager approves, hand the release to the engineer on duty by phone with the window and rollback plan, watch errors for an hour afterwards and draft the release notes.
  - id: billing-request
    name: Billing request
    description: Check the payment, fix the invoice or plan, and refund or credit within policy.
    keywords: [invoice, refund, credit note, chargeback, autopay, payment failed, gstin, plan change]
    steps:
      - key: handle
        title: Check and settle it
        agent: billing-desk
        instructions: Check the invoice and payment with the gateway or bank, correct the invoice by credit note and a fresh invoice, change the plan, or prepare the refund, credit or chargeback evidence within the published policy, and reply to the customer.
  - id: account-help
    name: Question or account help
    description: Answer the question from the help articles and guide the customer step by step.
    keywords: [how to, how do i, setup, configure, add user, password, otp, training]
    steps:
      - key: answer
        title: Answer and guide
        agent: support-desk
        instructions: Find the answer in the help articles for the customer's plan, guide them step by step, and move the ticket to the right type if it turns out to be a bug, billing, data or admin change.
  - id: account-access-change
    name: Admin or login change
    description: Verify who is asking and their authority, then make the admin, owner or login change after the security lead approves.
    keywords: [admin, owner, login email, registered mobile, 2fa, authenticator]
    steps:
      - key: verify
        title: Verify the person and their authority
        agent: support-desk
        instructions: Check the account, the current admins and the written OK or company letter, and verify the person by OTP to the registered email or phone or by a call back on the number in our records.
      - key: change
        title: Make the change and tell the admins
        agent: support-desk
        depends_on: [verify]
        instructions: After the security lead approves, hand the change to the support lead by phone, then email every admin on the account that it was made.
  - id: privacy-request
    name: Privacy, police or legal request
    description: Check the person or the order, find the data and draft the reply, export, deletion plan or takedown for the privacy officer.
    keywords: [delete my data, personal data, dpdp, police, court order, notice, takedown, grievance]
    steps:
      - key: check
        title: Check the person or the order
        agent: support-desk
        instructions: Verify the person by OTP, or check that the order is written, signed, names the officer and the law and is genuine. Note every deadline that applies and whether the data belongs to a business customer who must decide.
      - key: draft
        title: Find the data and draft the reply
        agent: support-desk
        depends_on: [check]
        instructions: List where the person's data sits, what the law makes us keep, and draft the export, deletion plan, takedown or reply for the privacy officer. Nothing is shared or deleted before the privacy officer approves.
  - id: feature-intake
    name: Feature request
    description: Log the idea, merge duplicates and reply without promising a date.
    keywords: [feature request, new feature, idea, suggestion, integration, roadmap]
    steps:
      - key: log
        title: Log and reply
        agent: support-desk
        instructions: Log the problem the customer wants solved, merge it with the same idea if already logged, add the customer's plan and yearly value, and reply without any date. Tell everyone who asked once the product manager decides.
  - id: complaint-handling
    name: Complaint handling
    description: Check the facts and get the customer success manager's reply out the same day.
    keywords: [complaint, escalation, unhappy, sla breach, rude, no response]
    steps:
      - key: facts
        title: Check the facts
        agent: support-desk
        instructions: Gather the ticket history, chats, emails and SLA timers, and draft a reply saying what we will do and by when, with any service credit the contract gives.
      - key: reply
        title: Get the customer success manager to reply
        agent: support-desk
        depends_on: [facts]
        instructions: Hand the complaint and the draft to the customer success manager by phone and record the promise they make.

policies:
  - id: refund-above-10000
    action: refund.issue
    require_approval_above: { amount: 10000, currency: INR }
    approver: finance-manager
    reason: Refunds above ₹10,000 need the finance manager's approval.

routines:
  - id: daily-work-report
    name: Daily team update
    description: Each team lead reports tickets closed, what went live, open incidents and blockers at the end of the working day.
    mode: manual
    days: [1, 2, 3, 4, 5]
    time: "18:30"
    questions:
      - { key: ticketsClosed, label: "Tickets closed", ask: "How many tickets did your team close today?", type: number, unit: tickets }
      - { key: shipped, label: "Shipped today", ask: "What went live or got fixed today?", type: text }
      - { key: openIncidents, label: "Open P1 or P2", ask: "Is any outage, security issue or P1 or P2 ticket still open?", type: text, flag: true }
      - { key: blockers, label: "Blocked", ask: "Is anything blocked or likely to miss its deadline?", type: text, flag: true }
      - { key: needs, label: "Needs from founder", ask: "Do you need anything from the founder or another team?", type: text, flag: true, required: false }

lifecycle:
  case: { label: Ticket, plural: Tickets, prefix: TKT }
  stages:
    request:
      name: New ticket or alert
      description: A customer, staff member, partner or monitoring system raises a ticket by email, chat, WhatsApp, phone or an automatic alert, and the sender gets a reply with the ticket number.
    review:
      name: Check details and account
      description: Support checks who is asking and which account and plan they are on, collects what is missing, tries to repeat the problem and looks for duplicates before the ticket moves on.
      checks:
        - Account found and active; plan and support level known
        - Requester is a user on that account; admin, owner, login, billing or data changes only with a current admin's written OK, or a signed letter on company letterhead if no admin is left
        - "Enough to act on: what happened, when, where (screen, link or API), how many users, and a screenshot or error text"
        - Problem repeated by support or QA, or seen in logs and monitoring
        - Not a duplicate of an open ticket, a known issue or a planned feature
        - Signs of an attack or exposed data? Open a security incident at once, because the CERT-In 6-hour clock is running
    classify:
      name: Set severity and priority
      description: The ticket gets its type, priority (P1 to P4), reply and fix deadlines and owning team; P1 means down for everyone, data lost or a security breach, and P2 means some customers blocked or a legal deadline running.
    assign:
      name: Assign team and deadline
      description: The team lead names the person responsible and the deadline; P1 tickets page the on-call engineer at any hour, P3 and P4 tickets wait for working hours.
    approve:
      name: Approval to go ahead
      description: The named approver says yes before the risky step, never for their own work, such as a rollback or failover, a release, a CERT-In report, an admin change, a refund above ₹10,000, a feature promise or a reply to the police.
      checks:
        - Engineering head for rollbacks, failover and emergency fixes during an outage
        - Engineering manager for every release or change to the live system
        - Security lead for CERT-In reports, breach notices and admin or owner changes
        - Finance manager for refunds, credits and chargebacks above ₹10,000
        - Privacy officer for deleting or sharing personal data, takedowns and replies to police, court or government orders and to legal notices
    execute:
      name: Fix, release and update
      description: The team and agents fix and test, release with a rollback plan ready, update the status page and the customer, and track time against the deadline.
    close:
      name: Test, confirm and close
      description: Someone other than the person who did the work checks the result in the live system, the customer confirms, the named role signs off and the ticket is closed.
      checks:
        - Fix checked in the live system by someone other than the person who made it
        - Customer confirmed, or no reply 3 working days after we said it was fixed
        - "Outages: status page closed out; start, noticed and restored times recorded for the uptime report and service credits"
        - "Security incidents: CERT-In report sent and its acknowledgement saved; breach notices sent where needed"
        - P1 and P2 incidents have a blameless review booked within 5 working days
        - Help articles and release notes updated if anything changed for customers
    report:
      name: Reports and incident reviews
      description: Weekly and monthly reports show uptime, reply times, customer ratings, failed releases and repeat problems, and every P1 and P2 incident gets a blameless review whose fixes are tracked until done.
      checks:
        - Uptime against the promise in each plan, with service credits owed
        - Releases that needed a rollback or hotfix reviewed
        - Root-cause fixes past their deadline listed with their owners
  priorities:
    - { id: P1, name: "Critical: service down, data lost or security breach", respond_within_hours: 0.5, resolve_within_hours: 4 }
    - { id: P2, name: "High: some customers blocked or a legal deadline", respond_within_hours: 2, resolve_within_hours: 48 }
    - { id: P3, name: Normal, respond_within_hours: 8, resolve_within_hours: 120 }
    - { id: P4, name: "Low: ideas and small issues", respond_within_hours: 24, resolve_within_hours: 360 }
  roles:
    - { id: engineering-head, name: Engineering head (CTO), approves: "Rollbacks, failover and emergency fixes during an outage; signs off outages once the incident review is booked" }
    - { id: engineering-manager, name: Engineering manager (release approver), approves: "Every release or change to the live system, never their own; low-risk changes on the pre-approved list get a quick yes" }
    - { id: qa-lead, name: QA lead, approves: Signs off fixed bugs and releases after checking them in the live system }
    - { id: security-lead, name: Security lead (CERT-In contact), approves: "Containment steps, the CERT-In report, breach notices to customers, people and the Data Protection Board, and changes to account admins, owners and two-step login" }
    - { id: product-manager, name: Product manager, approves: "Decides feature requests (plan, park or decline) and any date or promise about new features" }
    - { id: finance-manager, name: Finance manager, approves: "Refunds, credit notes, waivers, service credits and chargeback decisions above ₹10,000" }
    - { id: privacy-officer, name: Grievance and privacy officer, approves: "Deleting, exporting or correcting a person's data, takedowns, and every reply to police, court or government orders and to legal notices; named on the website and app for grievances" }
    - { id: account-manager, name: Customer success manager, approves: "Signs off replies to customer complaints and escalations, with any service credit the contract gives; feature dates stay with the product manager" }
  # Bare "outage", "site down", "server down" and "smoke" are left out: planned
  # maintenance notices and smoke tests use them. Bare "fire" is left out too:
  # webhooks and events "fire" in everyday software talk.
  urgent_keywords:
