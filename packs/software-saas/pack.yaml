        - error rate
        - error spike
        - latency alert
        - high latency
        - payments failing for everyone
        - data loss
        - app nahi chal raha
        - site nahi khul raha
      priority: P1
      risk: high
      department: Engineering (on call)
      required_checks:
        - "Impact confirmed from monitoring: which service, how many customers, since when (not one user's own internet)"
        - Releases and config changes from the last 24 hours checked; roll back first if one lines up
        - Status page and affected customers updated within 30 minutes, then at least every hour until fixed
        - "Data lost or exposed, or an attack such as DDoS? Open a security incident too: the CERT-In 6-hour clock starts"
        - Rollback, failover or emergency fix approved by the engineering head and written up within 1 working day
        - Start, noticed and restored times recorded for the uptime report and service credits
      approval: { required: high_risk_or_p1, role: engineering-head }
      signoff: { required: true, role: engineering-head }
      workflow: outage-response
