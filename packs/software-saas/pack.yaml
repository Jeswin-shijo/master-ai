playbooks:
  - id: major-outage
    title: "Major outage: the first hours"
    source: Atlassian Incident Management Handbook (incident roles, communication and severity levels); service credit and notice periods are house defaults for the owner to tune
    body: |
      1. Confirm it is real from monitoring: two regions, many customers or the uptime check, not one user's own internet. Open the incident and page the on-call engineer at any hour.
      2. Name one incident lead who decides and one person who talks to customers. The engineering head okays any rollback, failover or emergency fix by phone; write it up within 1 working day.
      3. Check releases and config changes from the last 24 hours. If one lines up, roll back first and find the cause after.
      4. Post on the status page and tell affected customers within 30 minutes, then at least every hour, even when there is no news. Use plain words and give the next update time.
      5. If data was lost or exposed, or it is an attack such as DDoS, open a security incident too, because the CERT-In 6-hour clock starts.
      6. Record when it started, when we noticed and when it was restored. Work out service credits from the contract (suggested default: 10% of the monthly fee below 99.9% uptime, 25% below 99%, claimed within 30 days).
      7. Book a blameless review within 5 working days.
  - id: incident-review
    title: Blameless review after a P1 or P2 incident
    source: Atlassian Incident Management Handbook, Postmortems; Atlassian, Incident severity levels (vendor practice, not law)
    body: |
      1. Hold a review for every P1 and P2 incident, in a meeting within 5 working days.
      2. Keep it blameless: ask what let it happen, not who did it.
      3. One owner writes it up: what customers saw and for how long, the timeline, the root cause found by asking "why?" until the real cause shows, and what will stop it coming back.
      4. Each root-cause fix gets a named owner and a deadline of 4 or 8 weeks, and is tracked until done.
      5. A manager approves the write-up. Affected customers get a short, plain summary without internal names or blame.
      6. Review open fixes every month and chase the ones past their deadline.
  - id: account-access-changes
    title: Changing admins, owners and login details
    source: OWASP Authentication and Forgot Password Cheat Sheets; common SaaS support practice against account takeover by social engineering
    body: |
      1. Only a current admin can add or remove admins, change the account owner or change login details. Show them how to do it in the app first.
      2. If no admin is left, ask for a signed letter on company letterhead from a director, partner or proprietor, with their ID, sent from the company's own email domain.
      3. Verify the person by OTP to the registered email or phone, or call back on the number in our records. Never use the number given in the request.
      4. Partners, resellers and consultants never get admin rights on their own word. They need the customer's written OK.
      5. The security lead approves the change. Record who asked, how they were verified and who approved.
      6. After the change, email every admin on the account so a false request is caught quickly.
      7. Pressure to do it right now, a free email address asking for a company account, or a story that does not add up are warning signs. If in doubt, open a security incident.
  - id: data-rights-requests
    title: Requests to see, correct or erase personal data
    source: Digital Personal Data Protection Act, 2023, sections 8(7) and 11 to 14, and DPDP Rules, 2025 (rights and breach duties from May 2027); CGST Act, 2017, section 36; CERT-In Directions, 28 April 2022 (180-day logs)
    body: |
      1. Ask whose data it is. For our own users we decide. For data we hold for a business customer (their staff or their customers), that customer decides: pass the request to them within 2 working days and tell the person.
      2. Verify the person by OTP to the registered email or phone. Never act on a phone call alone. A person can name someone to act for them; ask for the written nomination.
      3. Find the data everywhere: the app database, file storage, support tickets, CRM, email lists, analytics and backups.
      4. Erase what is no longer needed. Keep only what the law makes us keep, such as GST invoices and accounts (72 months from the annual return due date) and security logs (180 days), and tell the person what is kept and why. Backups are cleared as they expire.
      5. Withdrawing consent must be as easy as giving it. Stop marketing messages at once.
      6. Answer within 90 days at most; aim for 30. The privacy officer approves every export and deletion.
      7. Record the request and the outcome without keeping the deleted data.
  - id: police-court-government-orders
    title: Police, court and government orders and grievances
    source: IT Act, 2000, sections 69, 69A and 79; IT (Intermediary Guidelines and Digital Media Ethics Code) Rules, 2021, rule 3, as amended by the IT Amendment Rules, 2026 (notified 10 February 2026, in force 20 February 2026); Bharatiya Nagarik Suraksha Sanhita, 2023, section 94
    body: |
      1. Act only on written orders: signed, from an official email or letterhead, naming the officer, the law used (for example section 94 BNSS, section 69 or 69A of the IT Act, or rule 3 of the IT Rules), the account and the data or content. A call or WhatsApp is not enough; ask for the written notice.
      2. Check it is genuine by calling the police station or office on its published number.
      3. Share only what the order asks for, only with the officer named, by the deadline in the order. An information order from an authorised government agency under the IT Rules must be answered within 72 hours.
      4. If users can post content on our product: remove content within 3 hours of a court order or government notice, and within 2 hours of a complaint about nudity, intimate images, impersonation or morphed images.
      5. Interception and decryption orders (section 69) and blocking orders (section 69A) are confidential. Do not tell the user or anyone who does not need to act on them.
      6. Show the grievance officer's name and contact on the website and in the app. Acknowledge grievances within 24 hours, resolve removal requests within 36 hours and other grievances within 7 days. These times changed in February 2026, so check the current rules with your lawyer.
      7. The privacy officer approves every reply. Keep the order, what we shared and when, with the ticket.
  - id: subscription-billing
    title: Refunds, auto-debit and GST invoices
    source: RBI e-mandate framework for recurring payments (24-hour pre-debit notice; OTP needed above ₹15,000 per charge, RBI circular of 16 June 2022; check the current limit); CGST Act, 2017, sections 31 and 34; CCPA Guidelines for Prevention and Regulation of Dark Patterns, 2023; Consumer Protection (E-Commerce) Rules, 2020
    body: |
      1. Publish the refund policy where people pay. House default: duplicate or wrong charges are always refunded in full; annual plans can be refunded within 30 days of purchase; no part refunds after that.
      2. Auto-debit by card or UPI AutoPay needs the customer's mandate. Send a notice at least 24 hours before each charge, get the customer's OTP for any charge above ₹15,000, and let them cancel the mandate at any time.
      3. Cancelling must be as easy as signing up. No hidden auto-renewal and no tricks to keep people paying.
      4. GST on SaaS is 18%. The invoice shows the customer's GSTIN and state, which decides IGST or CGST plus SGST. Customers abroad paying in foreign currency are billed as an export of services under a LUT.
      5. Correct a wrong invoice with a credit note and a fresh invoice. Credit notes for a year's invoices can be issued only until 30 November of the next year.
      6. Refunds go back only to the card, UPI or bank account that paid, never to someone else.
      7. Answer chargebacks before the gateway's deadline with the invoice, usage records, accepted terms and any cancellation record. The finance manager decides refunds, credits and chargebacks above ₹10,000.

kpis:
  - id: uptime
    name: Uptime
    description: Minutes the app and API worked for customers this month as a share of all minutes, not counting planned maintenance announced 72 hours ahead. 99.9% allows about 43 minutes of downtime in a 30-day month.
    unit: percent
    direction: up
    target: 99.9
  - id: first-reply-on-time
    name: First replies on time
    description: Tickets that got a first reply within their priority's time (P1 30 minutes, P2 2 hours, P3 8 hours, P4 24 hours), as a share of tickets opened this month.
    unit: percent
    direction: up
    target: 95
  - id: csat
    name: Customer satisfaction
    description: Closed tickets the customer rated good or better, as a share of all ratings received this month.
    unit: percent
    direction: up
    target: 90
  - id: review-fixes-on-time
    name: Incident fixes done on time
    description: Root-cause fixes from incident reviews finished by their 4- or 8-week deadline, as a share of such fixes due this month.
    unit: percent
    direction: up
    target: 90
  - id: open-incidents
    name: Open incidents
    description: Outages and security incidents still open.
    unit: count
    direction: down
    source: { type: records_count, entity: Incident, where: { status: open } }
  - id: accounts-past-due
    name: Accounts past due
    description: Customer accounts whose payment is overdue.
    unit: count
    direction: down
    source: { type: records_count, entity: CustomerAccount, where: { status: past-due } }

connectors: [gmail, whatsapp-business, razorpay]
