playbooks:
  - id: brief-to-go-ahead
    title: From brief to written go-ahead
    source: Common Indian agency practice for estimates, retainers and change orders; Indian Contract Act, 1872 (terms agreed in writing)
    body: |
      1. Take every brief in writing: goal, audience, deliverables, channels or pages, deadline, budget and the client's approver. Ask for what is missing before you quote.
      2. Send a written estimate: deliverables, rounds of changes included (usually two), timeline, payment milestones (for example 50% advance), what is not included and who owns the finished work.
      3. For retainers and AMCs, list the items per month (posts, reels, blogs, hours or updates) and say whether unused items carry over.
      4. Start only after the client's written go-ahead (signed estimate, PO or an email from the named approver) and the advance. A yes on the phone is confirmed by email the same day.
      5. Anything new, or beyond the included rounds, is a change order with cost and dates, accepted by the client in writing before the work starts.
      6. The owner approves new projects and retainers above ₹5 lakh (use the full contract value: monthly fee times months). The account director approves every change order, discount, credit note or refund.
  - id: getting-paid
    title: GST invoices, TDS and getting paid
    source: CGST Act, 2017, section 31 and CGST Rules, rule 46; IGST Act, 2017, section 16 (export under LUT); CBDT Circular 23/2017 (TDS on the amount before GST); Income-tax Act, 2025, section 393 (from 1 April 2026; earlier sections 194C and 194J of the 1961 Act); MSMED Act, 2006, sections 15 to 18
    body: |
      1. Raise a GST tax invoice for every bill: our GSTIN and the client's, the client's state (place of supply), the right SAC code (998361 advertising, 998314 web and app development, 998391 design; confirm with your CA), 18% GST and the client's PO number.
      2. A client abroad paying in foreign currency is billed as an export under a Letter of Undertaking (LUT), without GST. Keep the bank's foreign remittance proof (FIRC) for each payment.
      3. Clients deduct TDS on the amount before GST when GST is shown separately: usually 2% on advertising and other contract work (1% if the agency is an individual or HUF), 10% on professional fees such as design or consulting, and 2% on technical services. From 1 April 2026 these rules sit in section 393 of the Income-tax Act, 2025. Match every deduction with our 26AS or AIS each quarter and chase missing TDS certificates.
      4. Send a polite reminder 3 days before the due date, on the due date and every week after, and log each one. Correct a wrong invoice with a credit note and a fresh invoice, never by editing it.
      5. If we are a micro or small enterprise registered on Udyam, business clients must pay within the agreed days and never later than 45 days after accepting the work. After that, compound interest at three times the RBI bank rate is due, and we can file a delayed-payment case with the MSE Facilitation Council.
      6. Stopping work, a legal notice or an MSME case is the owner's decision. Never issue a backdated, inflated or no-GST cash bill.
  - id: client-owned-work
    title: Handing over work the client can own
    source: Copyright Act, 1957, sections 17, 18 and 19; Meta music guidelines for branded content
    body: |
      1. Work our employees make in their job belongs to us. Copy, designs and code a freelancer makes stay theirs until they assign them in writing, so get a signed assignment before they start. Photos and films made for us for payment belong to us unless agreed otherwise, but put that in writing too.
      2. Give the client a signed written assignment once they have paid in full. Name the work, the rights, the period and the territory: if the period is missing it is only 5 years, and if the territory is missing it is only India.
      3. An assignment lapses if the rights are not used within a year, unless the agreement says otherwise, so write that it does not lapse.
      4. Buy stock images, fonts and music on licences that cover the client's brand use, and hand over the licence records. Songs from the Instagram or YouTube library are not licensed for brand posts.
      5. Keep domains, hosting, social pages, ad accounts and app store accounts in the client's name, with our access as a partner or admin, and hand over every login at the end.
      6. Keep source files for the period agreed in the estimate and hand them over when the contract says so.
  - id: honest-ads-and-influencers
    title: Honest ads and influencer posts
    source: Consumer Protection Act, 2019, sections 2(28) and 21; CCPA Guidelines for Prevention of Misleading Advertisements and Endorsements for Misleading Advertisements, 2022; ASCI Guidelines for Influencer Advertising in Digital Media (2021, with the 2023 health and finance additions); Promotion and Regulation of Online Gaming Act, 2025, sections 6 and 9 (in force 1 May 2026); Drugs and Magic Remedies (Objectionable Advertisements) Act, 1954; Cigarettes and Other Tobacco Products Act, 2003, section 5; Real Estate (Regulation and Development) Act, 2016, section 11(2)
    body: |
      1. Every claim needs the client's written proof: best, No. 1, % off, clinically proven, returns. A disclaimer cannot fix a misleading claim, and it must be in the same language and font as the claim. These rules bind advertising agencies as well as brands.
      2. No ads for tobacco, vapes or online money games (cash rummy, poker, fantasy contests with cash prizes, betting, casinos), and no surrogate ads for alcohol or tobacco brands. Money-game ads carry up to 2 years in jail or a ₹50 lakh fine.
      3. No post or ad may claim to cure diseases such as diabetes, cancer, obesity or infertility.
      4. Influencer posts carry a clear label such as #ad, #sponsored or #collab, upfront and not hidden among other hashtags; in videos the label is shown on screen. Virtual influencers say they are not real people.
      5. Health creators show their qualification, and only SEBI-registered creators may give investment advice.
      6. Property ads show the RERA registration number and website. Political ads need pre-certification from the election office's media committee (MCMC).
      7. Ads for children make no unproven health claims and use no film, sports or music stars for products that need a health warning or that children cannot buy.
      8. Misleading ads can bring a penalty of up to ₹10 lakh (₹50 lakh for repeats), and endorsers can be barred for up to 1 year (3 years for repeats).
  - id: ad-spend-on-client-money
    title: Ad spend on the client's money
    source: Common Indian performance-marketing practice; Meta and Google advertiser terms; CGST Rules, 2017, rule 33 (expenses as a pure agent)
    body: |
      1. Keep ad accounts in the client's name, paid by the client's own card or prepaid funds. We get partner or admin access, never the client's card details.
      2. If we pay the platform for the client, take the media advance first and show media separately from our fee on the invoice. Ask the CA whether we bill it as a pure agent or charge GST on it.
      3. Every new budget or increase needs the client's written OK with the total cap and dates. The account director also approves new spend above ₹1 lakh, after checking the client's unpaid invoices.
      4. New ads go live only after the client approves the copy, offer and landing page, and the account manager clears it.
      5. Set daily caps and spend alerts on every campaign. If spend runs past the cap, pause or cap it at once and tell the client the same day; pausing never waits for approval.
      6. Each month, match spend with the platform invoices and send the client the report with our invoice.
  - id: client-sites-launch-and-care
    title: Launching and looking after client sites
    source: CCPA Guidelines for Prevention and Regulation of Dark Patterns, 2023; Digital Personal Data Protection Act, 2023 and DPDP Rules, 2025 (notice, consent and breach duties from May 2027); CERT-In Directions of 28 April 2022
    body: |
      1. Build no dark patterns: no fake countdowns or "only 2 left", no items slipped into the cart, no shaming "No thanks" buttons, no charges shown only at checkout and no subscriptions that are hard to cancel. The CCPA lists 13 such tricks.
      2. Before launch, get the client's written OK on the final site, then check the backup, SSL, speed, forms and payments, the privacy notice on every form, analytics and redirects from old pages.
      3. Lead forms ask only for what is needed and say why. We handle the leads for the client, so we follow its instructions and delete them when the contract ends.
      4. Under an AMC, update plugins and themes on a staging copy first, keep weekly backups away from the server, and keep server logs for 180 days in India.
      5. If a site is down, check hosting, domain and SSL expiry and the last change, roll back first, and tell the client within an hour.
      6. If a site or page is hacked, put up a maintenance page, change passwords and keys, remove unknown admins and keep the logs. Tell the client in writing and agree who reports to CERT-In within 6 hours (we do if we host it), then clean up, close the way in and send a written report.

kpis:
  - id: on-time-delivery
    name: On-time delivery
    description: Deliverables the client approved on or before the agreed date, as a share of all deliverables due this month.
    unit: percent
    direction: up
    target: 90
  - id: billable-time
    name: Billable time
    description: Hours logged on client work as a share of the delivery team's available working hours (designers, writers, developers and media buyers). Agencies average about 65%; aim for 70 to 80%.
    unit: percent
    direction: up
    target: 70
  - id: rounds-of-changes
    name: Rounds of changes
    description: Average rounds of client changes per deliverable approved this month; most estimates include two.
    unit: count
    direction: down
    target: 2
  - id: hours-over-estimate
    name: Hours over estimate
    description: Hours worked beyond the estimate on jobs closed this month, as a share of their estimated hours.
    unit: percent
    direction: down
    target: 10
  - id: overdue-invoices
    name: Overdue invoices
    description: Client invoices past their due date and still unpaid.
    unit: count
    direction: down
    source: { type: records_count, entity: Invoice, where: { status: overdue } }
  - id: retainers-renewed
    name: Retainers renewed
    description: Retainers and AMCs renewed or extended, as a share of those that came up for renewal this quarter.
    unit: percent
    direction: up
    target: 85

connectors: [gmail, whatsapp-business, razorpay]
