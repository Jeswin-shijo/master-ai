# Ready-made pack: digital agencies (digital marketing, social media, SEO and
# performance marketing, creative and branding, web and app studios) working
# for clients. Built from researched Indian practice: the CCPA misleading-ads
# (2022) and dark-patterns (2023) guidelines, ASCI influencer guidelines, the
# Promotion and Regulation of Online Gaming Act 2025, the Copyright Act 1957,
# CERT-In Directions 2022, the DPDP Act 2023 and Rules 2025, the CGST Act, TDS
# under the Income-tax Act 2025 and the MSMED Act 2006.
id: digital-agency
version: 1.0.0
name: Digital & creative agency
description: Website and app projects, campaigns and branding, retainer posts and AMC tasks, scope and price changes, ad budgets and ad problems, client sites down or hacked, launches, invoices and TDS, and client complaints for digital marketing, creative, web and app agencies.
kind: industry
sector: technology-innovation
extends: [sector-technology-innovation, projects-base]
match:
  keywords:
    - digital agency
    - digital marketing agency
    - digital marketing company
    - digital marketing firm
    - digital marketing
    - online marketing agency
    - internet marketing agency
    - marketing agency
    - creative agency
    - advertising agency
    - ad agency
    - advertising and marketing agency
    - branding agency
    - branding studio
    - creative studio
    - graphic design studio
    - graphic design agency
    - web design agency
    - web design company
    - website design company
    - web designing company
    - website designing
    - web development agency
    - website development company
    - web and app development
    - app development agency
    - mobile app development
    - social media agency
    - social media marketing agency
    - social media management
    - seo agency
    - seo company
    - performance marketing agency
    - influencer marketing agency
    - content marketing agency
    - video production house
    - animation studio

labels:
  Customer: Client

entities:
  - name: Customer
    label: Client
    description: A brand or business the agency works for, with its billing and tax details and who approves work.
    title_field: name
    list_columns: [name, contactPerson, services, accountManager, status]
    fields:
      - { name: name, label: Client or brand name, type: string, required: true }
      - { name: legalName, label: Legal name (as on GST), type: string }
      - { name: contactPerson, label: Main contact, type: string }
      - { name: approverName, label: Who approves work, type: string }
      - { name: phone, label: Mobile / WhatsApp, type: phone }
      - { name: email, label: Email, type: email }
      - { name: gstin, label: GSTIN, type: string }
      - { name: pan, label: PAN, type: string }
      - { name: billingAddress, label: Billing address, type: text }
      - { name: state, label: State (place of supply), type: string }
      - { name: city, label: City, type: string }
      - { name: country, label: Country, type: string }
      - name: services
        label: Main service
        type: enum
        options: [social-media, seo-content, performance-ads, website-app, branding-creative, video, mixed]
      - { name: accountManager, label: Account manager, type: string }
      - { name: paymentTermsDays, label: Payment terms (days), type: integer }
      - name: source
        label: Source
        type: enum
        options: [walk-in, phone, whatsapp, website, referral, other]
      - name: status
        label: Status
        type: enum
        required: true
        options: [prospect, active, paused, work-stopped, former]
      - { name: notes, label: Notes, type: text }
  - name: Scope
    label: Estimate or retainer
    plural_label: Estimates and retainers
    description: What the client agreed to pay for, with what is included, the rounds of changes and the payment terms.
    title_field: scopeNumber
    list_columns: [scopeNumber, client, kind, fee, status]
    fields:
      - { name: scopeNumber, label: Estimate or retainer number, type: string, required: true }
      - { name: client, label: Client, type: string, required: true }
      - name: kind
        label: Kind
        type: enum
        required: true
        options: [project-estimate, monthly-retainer, website-amc, change-order]
      - { name: deliverables, label: What is included, type: text }
      - { name: notIncluded, label: What is not included, type: text }
      - { name: roundsIncluded, label: Rounds of changes included, type: integer }
      - { name: fee, label: Fee before GST (monthly for a retainer), type: money }
      - { name: paymentTerms, label: Payment terms (for example 50% advance), type: string }
      - { name: poNumber, label: Client PO number, type: string }
      - { name: clientApprovedBy, label: Approved by (client side), type: string }
      - { name: clientApprovedOn, label: Client's written go-ahead on, type: date }
      - { name: startDate, label: Start date, type: date }
      - { name: endDate, label: End or renewal date, type: date }
      - { name: adBudgetMonthly, label: Monthly ad budget (client's money), type: money }
      - name: adsPaidBy
        label: Ads paid by
        type: enum
        options: [client-card, agency-from-media-advance, no-ads]
      - name: status
        label: Status
        type: enum
        required: true
        options: [draft, sent, approved, active, ended, cancelled]
  - name: Deliverable
    label: Deliverable
    description: One piece of work for a client (a page, post, reel, video, ad, design, blog or report) with its rounds, hours and the client's OK.
    title_field: title
    list_columns: [title, client, kind, dueDate, status]
    fields:
      - { name: jobNumber, label: Job number, type: string }
      - { name: client, label: Client, type: string, required: true }
      - { name: title, label: Title, type: string, required: true }
      - name: kind
        label: Kind
        type: enum
        required: true
        options: [website, web-page, design, post, reel, video, ad, ad-budget-change, blog, newsletter, report, other]
      - { name: dueDate, label: Due date, type: date }
      - { name: roundsIncluded, label: Rounds of changes included, type: integer }
      - { name: roundsUsed, label: Rounds of changes used, type: integer }
      - { name: hoursEstimated, label: Hours estimated, type: number }
      - { name: hoursSpent, label: Hours spent, type: number }
      - { name: paidPartnership, label: "Paid partnership (labelled #ad or #collab)", type: boolean }
      - { name: clientApprovedBy, label: Approved by (client side), type: string }
      - { name: clientApprovedOn, label: Client approved on, type: date }
      - { name: scheduledFor, label: Goes live at, type: datetime }
      - { name: liveLink, label: Live link, type: string }
      - { name: licences, label: "Stock, font and music licences", type: text }
      - name: status
        label: Status
        type: enum
        required: true
        options: [in-progress, internal-review, with-client, changes-asked, cleared-to-publish, live, on-hold, cancelled]
  - name: Invoice
    label: Invoice
    description: A GST invoice to a client, with the TDS the client deducted and when it was paid.
    title_field: invoiceNumber
    list_columns: [invoiceNumber, client, amount, dueDate, status]
    fields:
      - { name: invoiceNumber, label: Invoice number, type: string, required: true }
      - { name: client, label: Client, type: string, required: true }
      - { name: invoiceDate, label: Invoice date, type: date }
      - { name: poNumber, label: Client PO number, type: string }
      - { name: sacCode, label: SAC code, type: string }
      - { name: amount, label: Amount before GST, type: money, required: true }
      - { name: gst, label: GST, type: money }
      - { name: underLut, label: Export under LUT (no GST), type: boolean }
      - { name: tdsDeducted, label: TDS deducted by the client, type: money }
      - { name: tdsCertificateReceived, label: TDS certificate received, type: boolean }
      - { name: dueDate, label: Due date, type: date }
      - { name: remindersSent, label: Reminders sent, type: integer }
      - { name: paidOn, label: Paid on, type: date }
      - name: status
        label: Status
        type: enum
        required: true
        options: [draft, sent, part-paid, paid, overdue, disputed, written-off]

tools:
  - name: clients.search
    description: Search clients by name, contact, service, account manager or status.
    uses: records.search
    with: { entity: Customer }
  - name: scopes.search
    description: Search estimates, retainers, website AMCs and change orders by number, client or status.
    uses: records.search
    with: { entity: Scope }
  - name: estimate.prepare
    description: Prepare a draft estimate, retainer or change order. It is not sent or agreed until a person sends it and the client accepts in writing.
    uses: records.create
    with: { entity: Scope, data: { status: draft } }
  - name: deliverables.search
    description: Search deliverables by client, kind, due date or status.
    uses: records.search
    with: { entity: Deliverable }
  - name: deliverable.add
    description: Add a deliverable to a job with its due date, rounds included and estimated hours.
    uses: records.create
    with: { entity: Deliverable, data: { status: in-progress } }
  - name: deliverable.clear_to_publish
    description: Mark a post, page, ad or ad budget change as cleared to go live once the client's written OK is on record. The person who schedules, publishes or changes the budget acts only on this.
    uses: records.update
    with: { entity: Deliverable, patch: { status: cleared-to-publish } }
  - name: invoices.search
    description: Search client invoices by number, client, due date or status.
    uses: records.search
    with: { entity: Invoice }
  - name: invoice.prepare
    description: Prepare a draft GST invoice from the signed estimate or retainer for accounts to check and send.
    uses: records.create
    with: { entity: Invoice, data: { status: draft } }
  - name: client.stop_work
    description: Mark a client as work stopped over unpaid dues so the team pauses new work. Used only after the owner approves.
    uses: records.update
    with: { entity: Customer, patch: { status: work-stopped } }

agents:
  - role: client-servicing-desk
    name: Client servicing desk
    description: Turns briefs into estimates and timelines, checks every request against the signed estimate or retainer, drafts change orders, keeps clients updated, handles complaints, raises GST invoices, sends payment reminders and matches TDS.
    instructions: "Nothing is agreed until the client accepts in writing and the advance is in; a yes on the phone is confirmed by email the same day. Never promise a price, discount, date or free work: the account director decides those. Stopping work or a legal notice over unpaid dues is the owner's decision. Never issue a backdated, inflated or no-GST bill."
    autonomy: 3
    tools: [clients.search, scopes.search, estimate.prepare, deliverables.search, invoices.search, invoice.prepare, client.stop_work, records.search, records.update, knowledge.search, document.generate, message.draft, message.send, payment.request, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 120000, money_per_task_inr: 0, max_steps: 25 }
  - role: content-studio
    name: Content and creative desk
    description: Writes first drafts of posts, captions, blogs, scripts, calendars and creative briefs, checks claims, offers and influencer labels, logs deliverables and rounds, sends work for the client's OK and hands design, video and scheduling to the team by phone.
    instructions: "Every claim (best, No. 1, % off, health or money benefit) needs the client's written proof, and every paid partnership is labelled #ad or #collab upfront. Use only licensed images, fonts and music. Nothing is scheduled or published until the client's written OK is recorded and the account manager clears it."
    autonomy: 3
    tools: [clients.search, scopes.search, deliverables.search, deliverable.add, deliverable.clear_to_publish, records.update, knowledge.search, document.generate, message.draft, message.send, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }
  - role: web-ads-desk
    name: Web and ads desk
    description: Watches client sites and ad accounts, opens site-down and hacked-site jobs, gets the on-call developer working by phone, drafts the CERT-In report and client updates, runs launch checklists, and handles ad budget changes and ad problems with the media buyer.
    instructions: "Start the CERT-In 6-hour clock from the moment anyone noticed a hack or leak, and never send the report yourself: the security lead approves it. Roll back first and find the cause after. Pausing or capping runaway ad spend never waits, but new spend goes live only after the client's written OK is recorded and the account manager clears it."
    autonomy: 3
    tools: [clients.search, scopes.search, deliverables.search, deliverable.add, deliverable.clear_to_publish, records.search, records.update, knowledge.search, document.generate, message.draft, message.send, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }

workflows:
  - id: website-project
    name: Website or app project
    description: Turn the brief into an estimate and plan, get the build going with the team and run the client's review rounds.
    keywords: [website, redesign, landing page, app development, ecommerce, shopify, wordpress, amc]
    steps:
      - key: plan
        title: Estimate and plan
        agent: client-servicing-desk
        instructions: Draft the estimate with pages and features, rounds of changes included, timeline, payment milestones and what is not included, plus the sitemap and the list of content and logins the client must give by which date.
      - key: build
        title: Get the build going
        agent: web-ads-desk
        depends_on: [plan]
        instructions: Once the client's written go-ahead and the advance are in, hand the design and build to the developer lead by phone with the sitemap, dates and test site, and test every page and form as it is ready.
      - key: review-rounds
        title: Run the client's review rounds
        agent: client-servicing-desk
        depends_on: [build]
        instructions: Share the test site, record the client's feedback for each round, count the rounds used, and raise a change order for anything new or beyond the included rounds.
  - id: campaign-production
    name: Campaign or creative project
    description: Turn the brief into a creative brief and estimate, make the work with the team and get it approved by the creative director and the client.
    keywords: [campaign, branding, logo, brochure, packaging, ad film, video, shoot, influencer, retainer proposal]
    steps:
      - key: brief
        title: Creative brief and estimate
        agent: client-servicing-desk
        instructions: Write the creative brief (objective, audience, deliverables, channels, launch date, approver) and the estimate with rounds included, and list the proofs needed for every claim.
      - key: make
        title: First ideas and production
        agent: content-studio
        depends_on: [brief]
        instructions: Research the audience and competitors, draft copy and first ideas, and hand design, video and shoots to the creative lead by phone. Freelancers sign a copyright assignment before they start.
      - key: approve
        title: Checks and client approval
        agent: content-studio
        depends_on: [make]
        instructions: Check claims, influencer labels, RERA numbers and licences, get the creative director's review, then send the work for the client's OK and track the rounds used.
  - id: retainer-task-delivery
    name: Retainer or AMC task
    description: Draft the post, page change or AMC task, get the client's written OK and hand it to the person who schedules or publishes it.
    keywords: [post, reel, story, calendar, blog, newsletter, banner, seo, website maintenance, plugin update]
    steps:
      - key: draft
        title: Draft and check
        agent: content-studio
        instructions: Check the item is inside this month's retainer or AMC, draft the copy and caption, size the creative for each platform, and check offers, prices and labels against what the client confirmed in writing.
      - key: client-ok
        title: Get the client's OK
        agent: content-studio
        depends_on: [draft]
        instructions: Send it to the client's approver, record who approved and when, and ask the account manager to clear it to go live.
      - key: publish
        title: Hand it over to go live
        agent: content-studio
        depends_on: [client-ok]
        instructions: Hand the scheduling or site update to the social media executive or developer by phone with the go-live time, and add the live link to the deliverable.
  - id: change-order
    name: Scope or price change
    description: Compare the request with the signed scope, draft the change order and start only after the client accepts it in writing.
    keywords: [change request, change order, out of scope, extra round, discount, credit note, refund]
    steps:
      - key: compare
        title: Compare with the signed scope
        agent: client-servicing-desk
        instructions: Find the signed estimate or retainer, count the rounds and items used, and list exactly what is new or extra.
      - key: draft
        title: Draft the change order
        agent: client-servicing-desk
        depends_on: [compare]
        instructions: Draft the change order with cost before GST from the rate card and the new dates, or the discount, credit note or refund with its reason and invoice, for the account director to approve. Send it to the client once approved and start work only after the client accepts in writing.
  - id: ad-budget-change
    name: New ad spend or budget increase
    description: Check the client's written OK and dues, hand the change to the media buyer with a cap and watch the pacing.
    keywords: [ad budget, boost post, run ads, media plan, increase the budget]
    steps:
      - key: check
        title: Check the OK, the cap and who pays
        agent: web-ads-desk
        instructions: Check the client's written OK with the total cap and dates, who pays the platform (the client's card, or our media advance already received), the client's unpaid invoices, and that the ad copy, offer and landing page are approved.
      - key: change
        title: Make the change and watch it
        agent: web-ads-desk
        depends_on: [check]
        instructions: Once cleared, hand the change to the media buyer by phone with the cap, dates and daily limit, and check spend and results every day until the end date.
  - id: ad-fix
    name: Ad problem, pause or cut
    description: Stop runaway spend, find what changed and fix it with the media buyer, and tell the client the same day.
    keywords: [overspend, disapproved, leads dropped, cost per lead, pause, ad account]
    steps:
      - key: diagnose
        title: Stop the damage and find the cause
        agent: web-ads-desk
        instructions: Ask the media buyer by phone to pause or cap runaway spend at once, then check pacing, disapproval reasons, tracking, landing page and recent changes against last week.
      - key: fix
        title: Fix and tell the client
        agent: web-ads-desk
        depends_on: [diagnose]
        instructions: Hand the fix to the media buyer by phone, and draft a short note to the client on what happened, what we did and any money spent above the cap.
  - id: site-down-response
    name: Client site down
    description: Confirm the outage, get the on-call developer restoring it and keep the client updated until it is back.
    keywords: [site down, hosting, domain expired, ssl expired, "503", uptime]
    steps:
      - key: confirm
        title: Confirm it and page the developer
        agent: web-ads-desk
        instructions: Confirm from outside that the site is down, check hosting, domain and SSL expiry and the last change or plugin update, and hand the restore to the on-call developer by phone. Tell the client within an hour.
      - key: restore
        title: Restore and report
        agent: web-ads-desk
        depends_on: [confirm]
        instructions: Ask the tech lead to okay any rollback or restore, keep the client updated until it is back, and record when it went down and came back for the client report.
  - id: hacked-site-response
    name: Hacked site, page or data leak
    description: Contain it, keep the evidence and get the CERT-In report and client notice ready for the security lead.
    keywords: [hacked, defaced, malware, spam, phishing, leak, lost access, cert-in]
    steps:
      - key: contain
        title: Start the clock and contain it
        agent: web-ads-desk
        instructions: Record when it was noticed, phone the security lead at once, and get the developer to put up a maintenance page, change passwords and keys and remove unknown admins. Keep logs and screenshots before anything is cleaned.
      - key: report
        title: Draft the CERT-In report and client notice
        agent: web-ads-desk
        depends_on: [contain]
        instructions: Draft the CERT-In report to go within 6 hours of noticing it, agreeing with the client who files it, and the written notice to the client saying whether leads or other personal data may be involved, all for the security lead to approve.
      - key: clean-up
        title: Clean up and close the way in
        agent: web-ads-desk
        depends_on: [report]
        instructions: Hand the clean-up, restore from a clean backup and the fix of the way in to the developer by phone, then draft the written incident report for the client.
  - id: site-launch
    name: Website or app launch
    description: Run the launch checklist, get the client's written OK and hand the launch to the developer in the agreed window.
    keywords: [launch, go live, migration, dns, ssl, hosting, play store]
    steps:
      - key: checklist
        title: Run the launch checklist
        agent: web-ads-desk
        instructions: Check the client's written OK on the final site, the backup, SSL, speed, forms and payments, privacy notice, analytics and redirects from old pages, and that domain and hosting are in the client's name.
      - key: launch
        title: Launch and watch
        agent: web-ads-desk
        depends_on: [checklist]
        instructions: Once the tech lead approves, hand the launch to the developer by phone with the window and rollback plan, then check the live site and watch for errors for the first hour.
  - id: invoice-follow-up
    name: Invoice and payment follow-up
    description: Raise the GST invoice, send polite reminders, match payments and TDS, and pass stuck dues to the owner.
    keywords: [invoice, overdue, payment reminder, tds, dues]
    steps:
      - key: invoice
        title: Raise or fix the invoice
        agent: client-servicing-desk
        instructions: Prepare the GST invoice from the signed estimate or retainer with both GSTINs, the SAC code, the client's PO number and the due date, or correct it by credit note and a fresh invoice.
      - key: follow-up
        title: Remind, match and escalate
        agent: client-servicing-desk
        depends_on: [invoice]
        instructions: Send polite reminders before and after the due date, match payments and TDS with the bank and 26AS, chase TDS certificates, and hand dues past 45 days to the accounts head by phone. Stopping work or a legal notice goes to the owner.
  - id: complaint-handling
    name: Client complaint
    description: Take wrong live content down, check the facts and get the account director's reply and fix plan out the same day.
    keywords: [complaint, escalation, unhappy, missed deadline, wrong price, posted without approval]
    steps:
      - key: facts
        title: Take it down and check the facts
        agent: client-servicing-desk
        instructions: Ask the person who published it by phone to take down or correct any wrong live content at once, then gather the brief, approvals, emails and timeline, and draft a reply with a fix plan.
      - key: reply
        title: Get the account director to reply
        agent: client-servicing-desk
        depends_on: [facts]
        instructions: Hand the complaint and the draft to the account director by phone, record what they promise, and tell the owner the same day about any legal notice or threat to end the contract.

policies:
  - id: client-ok-before-going-live
    action: deliverable.clear_to_publish
    require_approval: true
    approver: account-manager
    reason: Nothing goes live on a client's page, site or ad account, and no ad budget changes, until the account manager confirms the client's written OK is on record.
  - id: stop-work-needs-owner
    action: client.stop_work
    require_approval: true
    approver: owner
    reason: Stopping work for a client over unpaid dues is the owner's decision.
  - id: payment-request-accounts-check
    action: payment.request
    require_approval_above: { amount: 25000, currency: INR }
    approver: finance-manager
    reason: Payment requests above ₹25,000 are checked by the accounts head (GSTIN, SAC code, PO number and TDS) before they go to the client.

routines:
  - id: daily-work-report
    name: Daily studio update
    description: Each team lead reports what went to clients, what is late, ad accounts in trouble and what they need at the end of the working day.
    mode: manual
    days: [1, 2, 3, 4, 5, 6]
    time: "18:30"
    questions:
      - { key: delivered, label: "Sent or live today", ask: "What did your team send to clients or put live today?", type: text }
      - { key: waitingOnClient, label: "Waiting on clients", ask: "Which items are waiting for a client's approval, content or logins?", type: text, required: false }
      - { key: late, label: "Late or at risk", ask: "Is any deliverable late or likely to miss its date?", type: text, flag: true }
      - { key: adAccounts, label: "Ad accounts in trouble", ask: "Is any ad account overspending, rejected or not delivering?", type: text, flag: true }
      - { key: hoursLogged, label: "Client hours logged", ask: "How many hours did your team log on client work today?", type: number, unit: hours }
      - { key: needs, label: "Needs help", ask: "Do you need anything from the account director or the owner?", type: text, flag: true, required: false }

lifecycle:
  case: { label: Job, plural: Jobs, prefix: JOB }
  stages:
    request:
      name: Brief or request received
      description: A client brief, retainer task, change, ad budget request, complaint or alert (site down, ad overspend, invoice overdue) comes in by email, WhatsApp, the request form or a call, gets a job number and the sender gets a reply.
    review:
      name: Brief and scope check
      description: The account manager and agents check the brief against the signed estimate or retainer, the client's details and unpaid invoices, and ask for anything missing before the job moves on.
      checks:
        - Brief has the goal, deliverables, channels or pages, deadline, budget and the client's approver
        - Brand files, content, product facts and logins received, or a date set for them
        - "Compared with the signed estimate or retainer: inside the scope, or a change order"
        - "Client details for the estimate and GST invoice: legal name, address, state, GSTIN and PAN"
        - Client's unpaid invoices noted before new work or new ad spend starts
        - Not for an online money game, betting, tobacco or surrogate ads, cure claims, fake reviews or bought followers
        - Claims and offers backed by the client's written proof; property ads carry the RERA number
        - "Signs of a hacked site, page or account? Open a security incident at once: the CERT-In 6-hour clock is running"
    classify:
      name: Job type and priority
      description: The job gets its type, priority, risk, amount and due dates, and an owning team (client servicing, creative, content and social, web and tech, performance marketing or accounts).
    assign:
      name: Assign team and deadline
      description: The account manager, the lead and the makers (designers, writers, developers, media buyers or freelancers) are named, hours are budgeted against the estimate, and the deadline and the client's review dates are set.
    approve:
      name: Approval to start
      description: When the rules ask, the named person approves before work starts (the owner for projects above ₹5 lakh, the account director for scope or price changes and new ad spend above ₹1 lakh, the tech lead for launches and live-site fixes, the security lead for hacked sites), and paid work also needs the client's written go-ahead.
      checks:
        - Client's written go-ahead (signed estimate, PO or email from the named approver) and the advance received for paid work
        - "Amount within the approver's limit: owner above ₹5 lakh, account director for new ad spend above ₹1 lakh"
        - The approver did not make the work or raise the change themselves
    execute:
      name: Production and revisions
      description: Agents and the team make the work, check it in-house, share it with the client and track rounds of changes, hours, ad spend and deadlines, and nothing goes live on a client's page, site or ad account without the client's written OK.
      checks:
        - Work checked inside the agency before the client sees it
        - Rounds of changes and hours counted against the estimate or retainer
        - "Paid partnerships labelled upfront (#ad or #collab); stock, fonts and music licensed for brand use"
        - Client's written OK recorded and cleared by the account manager before anything goes live
        - Ad spend checked every day against the cap the client approved
    close:
      name: Client sign-off and handover
      description: The client approves the final work in writing, the named person signs off, files, licences, logins and copyright are handed over, and the invoice goes out.
      checks:
        - Client's final approval in writing (email or WhatsApp from the named approver, or a signed delivery note)
        - Final and source files, licences and logins handed over as agreed; domain, hosting, pages and ad accounts in the client's name
        - "Copyright assigned to the client in writing once paid: the work, the rights, the period and the territory named"
        - Hours and rounds used compared with the estimate; extra work raised as a change order
        - GST invoice raised with the right SAC code and the client's PO number
    report:
      name: Reports and monthly review
      description: Monthly client reports (reach, leads, sales, ad spend) go out, and the agency reviews on-time delivery, rounds of changes, hours over estimate, billable time, overdue invoices, complaints and repeat problems.
      checks:
        - On-time delivery, rounds of changes and hours over estimate per client
        - Retainer items used against the plan; extra work raised with the client
        - Overdue invoices and missing TDS certificates listed
