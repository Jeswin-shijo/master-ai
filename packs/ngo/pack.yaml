playbooks:
  - id: fcra-foreign-money
    title: Foreign money under FCRA
    source: "Foreign Contribution (Regulation) Act, 2010 as amended in 2020 (sections 7, 8, 12, 16 and 17); FCRA Rules, 2011 as amended in 2025; FCRA Amendment Rules, 2026 (22 June 2026; rules 9A and 14A) as summarised by AZB & Partners. Check the 2026 rules in the gazette"
    body: |
      1. Take foreign money only with FCRA registration or prior permission, and only into the FCRA account at SBI, New Delhi Main Branch. Spend it through FCRA utilisation accounts and never put local money in them.
      2. A foreign source is decided by citizenship, not address: foreign citizens (OCI card holders too), foreign companies and foreign trusts. An Indian citizen living abroad is not a foreign source.
      3. Use foreign money only for the purposes FCRA has approved. Practitioners report that the 2026 rules also limit it to approved states, with existing holders naming them on Form FC-6F within a year (about June 2027); check the current rule before relying on this.
      4. Keep admin costs within 20% of the foreign money received in the year.
      5. Never pass foreign money to any other person or organisation, even one with its own FCRA registration. Run the work yourselves, or support partners from local or CSR money.
      6. Interest and other income earned on foreign money is foreign money too and stays in FCRA accounts.
      7. File the FCRA return (FC-4) by 31 December every year, even if nothing came in, with CA-certified accounts (UDIN) and the details the current rules ask for, such as project-wise and place-wise spending.
      8. Report changes in key people, address, aims or bank accounts on the FC-6 forms, and start renewal (FC-3C) six months before the certificate expires.
  - id: csr-funds
    title: Taking CSR money
    source: Companies Act, 2013 section 135; Companies (CSR Policy) Rules, 2014 as amended in 2021 and 2022 (rules 4 and 8)
    body: |
      1. To run a company's CSR project we need 12A and 80G registration, our CSR-1 registration number from the Ministry of Corporate Affairs and, as an independent NGO, at least 3 years of similar work.
      2. Agree the project, budget, timeline, reports and site visits in a written CSR agreement before work starts. Pass CSR money to a partner only if the agreement allows it in writing.
      3. CSR money from an Indian company is local money; keep it in its own grant code and report against it.
      4. Report spending and give utilisation certificates on time. The company must move money left unspent on ongoing projects into its Unspent CSR Account, so warn it early if spending is behind.
      5. Companies with an average CSR obligation of ₹10 crore or more must get an independent impact assessment of projects of ₹1 crore or more, at least a year after they finish, so keep baseline and results data ready.
  - id: fair-selection-and-data
    title: Fair selection and care with people's data
    source: "Digital Personal Data Protection Act, 2023 and DPDP Rules, 2025 (notified November 2025; consent, children's data and breach rules apply about 18 months later); Dowry Prohibition Act, 1961; common Indian NGO programme practice"
    body: |
      1. Write down who qualifies for each programme and select only against those criteria, after a home visit.
      2. Ask for any one valid ID. Take Aadhaar only with consent and store it masked.
      3. Explain in the person's language what details we collect and why, and take their consent; for a child, take a parent's or guardian's consent.
      4. Never ask for a fee, gift or favour. Treat any such demand by staff as a fraud alert.
      5. Tell people who are not selected the reason and where else they can ask, such as a government scheme or another organisation.
      6. Never pay for dowry; it is an offence. Share the women's helpline 181 instead.
      7. From about May 2027 the DPDP Rules require clear notice, consent, parental consent for children, data security and breach reports to the Data Protection Board; build these habits now.
  - id: child-safety-and-harassment
    title: Child safety and harassment concerns
    source: "Protection of Children from Sexual Offences Act, 2012 (sections 19 and 21); Juvenile Justice (Care and Protection of Children) Act, 2015; Sexual Harassment of Women at Workplace (Prevention, Prohibition and Redressal) Act, 2013 (sections 4, 6, 9, 11, 13 and 21)"
    body: |
      1. Act the same day: make the child or adult safe, keep the accused away from programme contact, and tell the safeguarding focal person and the chief functionary.
      2. Report sexual abuse of a child, or a fear that it may happen, to the police or the Special Juvenile Police Unit at once. Not reporting can mean up to 6 months in jail, and up to 1 year for a person in charge who fails to report about someone under them.
      3. Never replace the police report with an internal inquiry. A report made in good faith is protected.
      4. A child who needs care goes to the Child Welfare Committee; call 1098 (Childline) or 112 in an emergency.
      5. Sexual harassment at work goes to the Internal Committee (needed with 10 or more staff; otherwise the district Local Committee): complaint within 3 months, inquiry within 90 days, the employer acts within 60 days of the report, and a yearly report goes to the District Officer.
      6. Keep names private, keep the evidence, tell donors as the grant agreement requires, and take every case to the board.
  - id: government-grants-and-tax
    title: Government grants and tax status
    source: "General Financial Rules, 2017 (rule 238, Form GFR 12-A); NGO-DARPAN unique ID rule for central grants; Income-tax Act, 2025 (Registered Non-Profit Organisation rules, sections 332 to 354 as practitioners map them, in force 1 April 2026)"
    body: |
      1. Get an NGO Darpan ID before applying for any central government grant; without it the grant cannot be sanctioned.
      2. Send the utilisation certificate in the form the ministry asks for (usually GFR 12-A) with a CA-certified receipts and payments account within 12 months of the year's end. Show unspent money and return the interest earned; a late certificate holds up the next grant.
      3. Keep the old 12A registration and 80G approval valid (under the Income-tax Act, 2025 practitioners map them to sections 332 and 354; check the section numbers) and renew 6 months before expiry. Small NGOs (income within ₹5 crore in each of the last two years) can get 10-year registration; 80G approval stays at 5 years.
      4. Spend at least 85% of the year's income on the aims.
      5. File the audit report by 30 September, the return (ITR-7) by 31 October and the donation statement by 31 May, then send donors their tax certificates. Confirm the form numbers under the Income-tax Rules, 2026.
      6. Cash gifts above ₹2,000 give the donor no tax deduction, and anonymous gifts can be taxed, so record every donor's name, address and PAN.

kpis:
  - id: grant-spend-on-plan
    name: Grant spending on plan
    description: Money spent so far on active grants as a share of the spending their budgets planned by this date. Below 90% means work or spending is behind.
    unit: percent
    direction: up
    target: 90
  - id: reports-filings-on-time
    name: Reports and filings on time
    description: Donor reports, utilisation certificates and legal filings sent by their due date, as a share of all that fell due in the month.
    unit: percent
    direction: up
    target: 100
  - id: fcra-admin-share
    name: Admin share of foreign money
    description: Admin costs paid from foreign money this financial year as a share of foreign money received this year. The legal limit is 20%.
    unit: percent
    direction: down
    target: 15
  - id: applications-in-10-days
    name: Applications decided in 10 days
    description: Complete beneficiary applications decided (selected, or declined with a reason) within 10 days, as a share of all applications decided in the month.
    unit: percent
    direction: up
    target: 90
  - id: reach-vs-target
    name: People reached against target
    description: Different people who received support so far this year as a share of the year's target in the approved plans.
    unit: percent
    direction: up
    target: 100
  - id: safety-alerts-24h
    name: Safety alerts acted on in 24 hours
    description: Safeguarding and fraud alerts where the person was made safe, linked payments were held and required police reports were made within 24 hours, as a share of all such alerts.
    unit: percent
    direction: up
    target: 100

registers:
  - id: vouchers
    entity: Voucher
    label: Vouchers
    columns: [voucherNumber, grantCode, payee, amount, mode, status, paidOn]
    filters: [mode, paidFrom, status]
    totals: [amount, tdsDeducted]
    card: { sum: { field: amount, when: { status: [paid] }, label: paid out } }
    checks:
      - missing: [approvedBy]
        when: { status: [approved, paid] }
      - limit: { fields: [quotations], min: 3 }
        when: { amount: { above: 25000 } }
        why: "three quotations above ₹25,000"
      - duplicate: [voucherNumber]
  - id: donations
    entity: Donation
    label: Donations
    columns: [receiptNumber, donorName, amount, mode, receivedOn, certificateSentOn]
    filters: [mode, isForeignSource]
    date_field: receivedOn
    totals: [amount]
    card: { sum: { field: amount, label: received } }
    checks:
      - missing: [panOrId, certificateSentOn]
      - limit: { fields: [amount], max: 2000 }
        when: { mode: [cash] }
        why: "cash donations above ₹2,000 get no 80G deduction"
      - duplicate: [receiptNumber]
  - id: grants
    entity: Grant
    label: Grants
    columns: [grantCode, donorName, amountAgreed, receivedToDate, spentToDate, nextReportDue, status]
    filters: [donorType, status]
    date_field: startDate
    totals: [amountAgreed, receivedToDate, spentToDate]
    card: { sum: { field: amountAgreed, when: { status: [active] }, label: active } }
    checks:
      - limit: { fields: [spentToDate], max: receivedToDate }
      - limit: { fields: [adminSpent], max: receivedToDate, factor: 0.2 }
        when: { isForeign: [true] }
        why: "FCRA: admin costs up to 20%"
      - expiring: { date: nextReportDue, days: 15 }
        when: { status: [signed, active, closing] }
    follow_ups:
      - id: grant-reports-due
        label: Grant reports due → the programme lead
        who: staff
        due: { expiring: { date: nextReportDue, days: 15 } }
        when: { status: [signed, active, closing] }
        staff: { field: programmeLead }
        about: [grantCode, donorName, nextReportDue]
        find_out: [nextReportDue]
  - id: beneficiaries
    entity: Beneficiary
    label: Beneficiaries
    columns: [fullName, village, programme, status, lastVisitOn]
    filters: [gender, status]
    card: { count: { when: { status: [served] }, label: served } }
    checks:
      - missing: [consentOn]
