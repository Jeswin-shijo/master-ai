# Ready-made pack: NGOs and development programmes (charitable trusts,
# registered societies and Section 8 companies running programmes with CSR,
# government and foreign money). Built from researched Indian practice: FCRA 2010
# as amended in 2020 and its 2025 and 2026 rules, the Companies (CSR Policy)
# Rules 2014, the Income-tax Act 2025 (in force 1 April 2026), GFR 2017,
# POCSO 2012, the POSH Act 2013 and the DPDP Act 2023. The 2026 FCRA rules and
# the new income-tax section and form numbers were read from practitioner
# summaries, not the gazette: check them before relying on a date or form number.
id: ngo
version: 1.0.0
name: NGO & development programme
description: Beneficiary applications, field checks, new grants and CSR projects, donor reports and utilisation certificates, donations and 80G receipts, FCRA and tax filings, payments, partner grants, and fraud and safeguarding alerts for NGOs, trusts, societies and Section 8 companies.
kind: industry
sector: finance-development
extends: [sector-finance-development, projects-base]
match:
  keywords:
    - ngo
    - non-profit
    - nonprofit
    - non profit organisation
    - not-for-profit
    - voluntary organisation
    - charitable trust
    - public charitable trust
    - welfare trust
    - charitable society
    - welfare society
    - registered society
    - section 8 company
    - section eight company
    - not for profit company
    - non profit company
    - section 25 company
    - foundation
    - charity
    - charitable organisation
    - development organisation
    - development programme
    - rural development
    - community based organisation
    - civil society organisation
    - social welfare organisation
    - grassroots organisation

labels:
  Customer: Donor
  Client: Donor

entities:
  - name: Beneficiary
    label: Beneficiary
    plural_label: Beneficiaries
    title_field: fullName
    list_columns: [fullName, village, programme, status, lastVisitOn]
    fields:
      - { name: fullName, label: Full name, type: string, required: true }
      - { name: guardianName, label: Parent or guardian (if under 18), type: string }
      - name: gender
        label: Gender
        type: enum
        options: [female, male, transgender, other]
      - { name: dateOfBirth, label: Date of birth, type: date }
      - { name: mobile, label: Mobile, type: phone }
      - { name: village, label: Village or ward, type: string, required: true }
      - { name: blockDistrict, label: Block and district, type: string }
      - { name: state, label: State, type: string }
      - name: idType
        label: ID seen
        type: enum
        options: [aadhaar-masked, voter-id, ration-card, job-card, birth-certificate, disability-certificate, other]
      - { name: idLast4, label: Last 4 digits of the ID, type: string }
      - { name: householdIncome, label: Yearly household income, type: money }
      - { name: consentOn, label: Consent given on, type: date }
      - { name: programme, label: Programme, type: string }
      - name: status
        label: Status
        type: enum
        required: true
        options: [applied, verified, selected, served, not-eligible, exited]
      - { name: lastVisitOn, label: Last home visit, type: date }
  - name: Grant
    label: Grant or CSR project
    plural_label: Grants and CSR projects
    title_field: grantCode
    list_columns: [grantCode, donorName, donorType, endDate, nextReportDue, status]
    fields:
      - { name: grantCode, label: Grant code, type: string, required: true }
      - { name: donorName, label: Donor or funder, type: string, required: true }
      - { name: programmeLead, label: Programme lead, type: string }
      - name: donorType
        label: Donor type
        type: enum
        required: true
        options: [foreign, csr, government, indian-foundation, individual]
      - { name: isForeign, label: Foreign money (FCRA), type: boolean }
      - { name: fcraPurposeStates, label: FCRA purposes and states it covers, type: text }
      - { name: amountAgreed, label: Amount agreed, type: money }
      - { name: receivedToDate, label: Received so far, type: money }
      - { name: spentToDate, label: Spent so far, type: money }
      - { name: adminSpent, label: Admin costs spent, type: money }
      - { name: startDate, label: Start date, type: date }
      - { name: endDate, label: End date, type: date }
      - { name: nextReportDue, label: Next report due, type: date }
      - { name: bankAccount, label: Bank account (FCRA or local), type: string }
      - name: status
        label: Status
        type: enum
        required: true
        options: [proposal, signed, active, closing, closed]
  - name: Voucher
    label: Payment voucher
    plural_label: Payment vouchers
    title_field: voucherNumber
    list_columns: [voucherNumber, payee, amount, grantCode, status]
    fields:
      - { name: voucherNumber, label: Voucher number, type: string, required: true }
      - { name: grantCode, label: Grant code, type: string }
      - { name: budgetLine, label: Budget line, type: string }
      - { name: payee, label: Paid to, type: string, required: true }
      - { name: amount, label: Amount, type: money, required: true }
      - name: mode
        label: Mode
        type: enum
        options: [bank-transfer, upi, cheque, petty-cash]
      - name: paidFrom
        label: Paid from
        type: enum
        options: [fcra-utilisation-account, local-account]
      - { name: isAdminCost, label: Admin cost, type: boolean }
      - { name: quotations, label: Quotations taken, type: integer }
      - { name: tdsDeducted, label: TDS deducted, type: money }
      - name: status
        label: Status
        type: enum
        required: true
        options: [prepared, approved, paid, on-hold, rejected]
      - { name: paidOn, label: Paid on, type: date }
      - { name: approvedBy, label: Approved by, type: string }
  - name: Donation
    label: Donation
    title_field: receiptNumber
    list_columns: [receiptNumber, donorName, amount, receivedOn, mode]
    fields:
      - { name: receiptNumber, label: Receipt number, type: string, required: true }
      - { name: donorName, label: Donor name, type: string, required: true }
      - { name: panOrId, label: PAN or other ID, type: string }
      - { name: email, label: Email, type: email }
      - { name: mobile, label: Mobile, type: phone }
      - { name: address, label: Address, type: text }
      - { name: amount, label: Amount, type: money, required: true }
      - { name: receivedOn, label: Received on, type: date }
      - name: mode
        label: Mode
        type: enum
        options: [upi, bank-transfer, cheque, card, cash]
      - { name: isForeignSource, label: "Foreign source (foreign citizen, OCI card holder, foreign company or trust)", type: boolean }
      - { name: purpose, label: Purpose or appeal, type: string }
      - { name: certificateSentOn, label: Tax certificate sent on, type: date }

tools:
  - name: beneficiaries.search
    description: Search beneficiaries by name, village, programme or status, for duplicate checks and home visits.
    uses: records.search
    with: { entity: Beneficiary }
  - name: beneficiary.register
    description: Register a new applicant as applied. Selection is decided by the programme manager, never by an agent.
    uses: records.create
    with: { entity: Beneficiary, data: { status: applied } }
  - name: grants.search
    description: Search grants and CSR projects by code, donor, report date or status.
    uses: records.search
    with: { entity: Grant }
  - name: voucher.prepare
    description: Prepare a payment voucher for the finance team. No money moves; people approve and release it from the bank.
    uses: records.create
    with: { entity: Voucher, data: { status: prepared } }
  - name: voucher.hold
    description: Put a payment voucher on hold while a fraud or safeguarding alert is looked into.
    uses: records.update
    with: { entity: Voucher, patch: { status: on-hold } }
  - name: donations.search
    description: Search donations by donor, receipt number, date or amount.
    uses: records.search
    with: { entity: Donation }
  - name: donation.record
    description: Record a donation that has been matched in the bank statement.
    uses: records.create
    with: { entity: Donation }

agents:
  - role: programme-desk
    name: Programme desk
    description: Registers beneficiary applications, checks documents and duplicates, books home visits and field checks with field workers by phone, flags indicators that are off track, drafts selection notes and visit reports, and raises the first alarm on safeguarding concerns.
    instructions: Never select or turn away an applicant yourself; the programme manager decides. Collect only the details the programme needs, with consent in the person's language. Store Aadhaar masked. Never name or show a child without a guardian's consent. If anyone may be at risk, call the safeguarding focal person at once.
    autonomy: 3
    tools: [beneficiaries.search, beneficiary.register, records.search, records.update, knowledge.search, document.generate, message.draft, message.send, schedule.create, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }
  - role: grants-desk
    name: Grants and compliance desk
    description: Finds funding calls, drafts concept notes, proposals, budgets and due diligence packs, drafts donor reports and utilisation certificates from the books and the MIS, keeps the FCRA, tax and registration calendar, and drafts partner agreements.
    instructions: Take every figure from the books and the MIS, never estimate. Never sign, submit or file anything; the chief functionary signs and files. Foreign money is never passed on to another organisation.
    autonomy: 2
    tools: [grants.search, records.search, records.create, records.update, knowledge.search, document.generate, message.draft, schedule.create, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 200000, money_per_task_inr: 0, max_steps: 40 }
  - role: accounts-desk
    name: Accounts desk
    description: Checks budget lines, fund source and papers for payments, prepares vouchers, matches donations in the bank statement and sends receipts and tax certificates, and holds linked vouchers when a fraud or safeguarding alert comes in.
    instructions: Prepare, never pay; people release money from the bank. Foreign money comes in only to the FCRA account and is paid only from FCRA accounts. Cash payments above ₹10,000 to one person in a day are not allowed.
    autonomy: 2
    tools: [voucher.prepare, voucher.hold, donations.search, donation.record, grants.search, records.search, records.update, knowledge.search, document.generate, message.draft, message.send, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 120000, money_per_task_inr: 0, max_steps: 25 }

workflows:
  - id: beneficiary-intake
    name: Beneficiary intake and selection
    description: Register the application, check it against the written criteria, get the home visit done and prepare the selection note.
    keywords: [application, apply, enrol, scholarship, beneficiary, selection, home visit]
    steps:
      - key: register
        title: Register and check the application
        agent: programme-desk
        instructions: Register the applicant, check the ID, the place and the programme's written criteria, look for an earlier or duplicate entry, and note any missing paper in plain words for the applicant.
      - key: home-visit
        title: Get the home visit done
        agent: programme-desk
        depends_on: [register]
        instructions: Hand the home visit to the field worker for that village by phone with the applicant's details and the checklist, and record their notes and consent.
      - key: selection-note
        title: Prepare the selection note
        agent: programme-desk
        depends_on: [home-visit]
        instructions: Draft a short selection note for the programme manager with the criteria met or not met, and once decided, tell the applicant the outcome in their language with the reason and where else to ask.
  - id: field-check
    name: Field check or survey
    description: Plan the visit or survey, compare what is found with our records and get the fixes agreed.
    keywords: [field visit, spot check, survey, monitoring, mis, attendance, evaluation]
    steps:
      - key: plan
        title: Plan the visit and pull the records
        agent: programme-desk
        instructions: Prepare the route, checklist or survey form in the local language and pull the beneficiary lists, receipts, stock and MIS figures to compare.
      - key: visit
        title: Get the visit done and draft the report
        agent: programme-desk
        depends_on: [plan]
        instructions: Hand the visit to the M&E officer or field team by phone, then draft the visit report within 48 hours with each fix, its owner and its date.
  - id: proposal-and-agreement
    name: Proposal and grant agreement
    description: Draft the concept note or proposal, budget and due diligence pack, and set the grant up once signed.
    keywords: [proposal, concept note, csr, grant agreement, mou, due diligence]
    steps:
      - key: draft
        title: Draft the proposal and due diligence pack
        agent: grants-desk
        instructions: Check the fit with our registered aims and, for foreign money, our FCRA registration. Draft the concept note or proposal, the budget within the admin limits, and the due diligence pack, and track the deadline.
      - key: set-up
        title: Set up the grant
        agent: grants-desk
        depends_on: [draft]
        instructions: After the chief functionary signs, create the grant record with its code, budget, bank account and report dates, and ask the finance manager by phone to confirm the first instalment reached the right account.
  - id: donor-reporting
    name: Donor report or utilisation certificate
    description: Draft the report or certificate from the books and the MIS, get it checked and send it once signed.
    keywords: [donor report, progress report, utilisation certificate, uc, case study]
    steps:
      - key: draft
        title: Draft the report from the books
        agent: grants-desk
        instructions: Pull spending by budget line from the books and results from the MIS, show unspent money and interest earned, and draft the report or certificate in the donor's format with consented photos and stories.
      - key: check
        title: Get the figures checked
        agent: grants-desk
        depends_on: [draft]
        instructions: Ask the finance manager and the M&E officer by phone to check every figure, and the CA to certify where needed. Log the donor's acknowledgement and questions once it is sent.
  - id: donation-receipt
    name: Donation receipt
    description: Match the money, check the source, record the donor and send thanks and the receipt.
    keywords: [donation, 80g, receipt, 10be, donor]
    steps:
      - key: receipt
        title: Match, record and thank
        agent: accounts-desk
        instructions: Match the money in the bank statement, check whether the donor is a foreign source, record the donor's PAN or other ID, and send thanks and the receipt with our 80G details. Raise any foreign gift that reached a local account with the finance manager.
  - id: compliance-calendar
    name: Statutory filing
    description: Open the filing ahead of its due date, collect the figures and draft the forms for the chief functionary.
    keywords: [fcra, fc-4, itr-7, audit report, 12a, 80g, renewal, notice]
    steps:
      - key: prepare
        title: Collect the figures and draft the filing
        agent: grants-desk
        instructions: Collect the figures from the audited accounts, draft the form or reply, list what the CA must certify, and set reminders well before the due date.
      - key: chase
        title: Chase the papers
        agent: grants-desk
        depends_on: [prepare]
        instructions: Ask the finance manager by phone for the CA's certificate and any missing paper, then save the acknowledgement once the chief functionary has filed and set the next due date.
  - id: payment-voucher
    name: Payment voucher
    description: Check the budget line, fund source and papers, prepare the voucher and hand it to the finance manager to release.
    keywords: [payment, pay, invoice, voucher, reimbursement, honorarium, budget change]
    steps:
      - key: prepare
        title: Check and prepare the voucher
        agent: accounts-desk
        instructions: Check the bill against the order and the work received, the grant and budget line, the fund source (FCRA or local), quotations, the payee's bank details and TDS, then prepare the voucher.
      - key: release
        title: Hand it over for release
        agent: accounts-desk
        depends_on: [prepare]
        instructions: Hand the approved voucher to the finance manager by phone to release from the right bank account, and file the bank proof with the voucher.
  - id: partner-grant
    name: Grant to a partner organisation
    description: Check the partner, draft the MoU and prepare each instalment from local or CSR money.
    keywords: [partner ngo, sub grant, partner organisation, samiti, sanstha, mou]
    steps:
      - key: check-partner
        title: Check the partner and draft the MoU
        agent: grants-desk
        instructions: Check the partner's registration, PAN, bank account and past work, confirm the money is local or CSR money the CSR agreement lets us pass on, and draft the MoU with the budget, reports and instalments.
      - key: instalment
        title: Prepare the instalment
        agent: accounts-desk
        depends_on: [check-partner]
        instructions: Prepare the voucher for the instalment and hand it to the finance manager by phone to release once the MoU is signed.
  - id: fraud-response
    name: Fraud response
    description: Stop the loss, keep the evidence and get the right people acting.
    keywords: [fraud, fake bills, bribe, cut money, theft, hacked]
    steps:
      - key: contain
        title: Hold payments and keep the evidence
        agent: accounts-desk
        instructions: Put linked vouchers on hold, save copies of the records, bills and bank trail, and call the chief functionary and the finance manager at once. Keep the name of whoever raised it private.
      - key: follow-up
        title: Follow up the police complaint and donor notice
        agent: accounts-desk
        depends_on: [contain]
        instructions: Draft the facts for the police complaint and the note to affected donors for the chief functionary, and track the recovery and the fixes until the board reviews the case.
  - id: safeguarding-response
    name: Safeguarding response
    description: Make sure the person is safe, the report is made and the facts are kept private.
    keywords: [pocso, abuse, harassment, child, missing, safeguarding]
    steps:
      - key: alert
        title: Alert the focal person
        agent: programme-desk
        instructions: Call the safeguarding focal person and the chief functionary at once with what was reported, where and who is involved. Keep the accused away from programme contact and keep names private.
      - key: record
        title: Keep a confidential record
        agent: programme-desk
        depends_on: [alert]
        instructions: Write a short factual record with dates and words used, confirm with the focal person by phone that the police or SJPU report or the Internal Committee complaint is made, and track the follow-up until the board reviews it.

routines:
  - id: daily-work-report
    name: Daily field report
    description: Each field worker or centre in-charge reports who they reached, where they went, what ran short and any concern at the end of the day.
    mode: automatic
    days: [1, 2, 3, 4, 5, 6]
    time: "18:00"
    questions:
      - { key: people, label: "People reached", ask: "How many people did you meet or serve today?", type: number, unit: people }
      - { key: places, label: "Villages or centres", ask: "Which villages or centres did you visit today?", type: text }
      - { key: workDone, label: "Work done", ask: "What work got done today?", type: text }
      - { key: shortages, label: "Running short", ask: "Is anything running short, like kits, medicines or forms?", type: text, flag: true }
      - { key: concerns, label: "Safety or money concern", ask: "Did anyone raise a worry about a child's safety, harassment or money being asked for?", type: text, flag: true }
      - { key: problems, label: "Problems", ask: "Is there any problem you need help with?", type: text, flag: true, required: false }
  - id: donations-today
    name: Donations received today
    description: The AI calls accounts each evening and adds the day's donations to the Donations list.
    days: [1, 2, 3, 4, 5, 6]
    time: '18:00'
    collect:
      list: donations
      ask: [receiptNumber, donorName, amount, mode, panOrId, purpose]
      defaults: { receivedOn: today }
      who: accounts

policies:
  - id: board-above-5-lakh
    action: case.proceed
    approver: board-chair
    require_approval_above: { amount: 500000, currency: INR }
    when: { category: [payment, partner-grant] }
    reason: Payments and partner grants above ₹5,00,000 go to the board chair or a named trustee.

lifecycle:
  case: { label: Programme case, plural: Programme cases, prefix: PRG }
  stages:
    request:
      name: Request or application received
      description: A beneficiary's application, a donor or CSR partner's request, a staff request, a due date from the compliance calendar or an MIS alert comes in by WhatsApp, phone, form or email, gets a case number and is acknowledged in the person's language.
    review:
      name: Eligibility and document check
      description: Staff and agents check who is asking, the documents and the written rules of the programme or fund, make anyone at risk safe first, and ask for anything missing before the case moves on.
      checks:
        - "Anyone at risk? Make them safe and make any police, SJPU or Childline report first; it never waits for approval"
        - "Who is asking is confirmed: beneficiary ID, donor PAN, partner's registration papers, or a staff request from the right person"
        - Consent taken in the person's language before collecting personal details; a parent's or guardian's consent for a child
        - "Eligibility matched to the written criteria: project area, need, income, age, or the donor's terms"
        - Not already served, paid or reported for the same thing
        - "Documents complete and readable: ID, bills, quotations, agreements, CA certificates"
        - "The money may be used this way: foreign money only for our FCRA-approved purposes (and states, if the 2026 rules apply; check the current rule) and never passed to another organisation; CSR money only for the agreed project"
    classify:
      name: Priority, project and fund
      description: The case gets its type, priority, due date and owning team, and is tagged to the right project, grant, budget line and fund (foreign, CSR, government or local donations).
    assign:
      name: Assign team and deadline
      description: The programme manager or office lead names the person responsible (field worker, M&E officer, accountant, proposal writer or safeguarding focal person) and sets a deadline a few days before any donor or legal due date.
    approve:
      name: Approval by authorised person
      description: The authorised person decides within the delegation of powers, never the person who prepared the work, and no money moves before this step.
      checks:
        - Programme manager selects or declines beneficiaries against the written criteria
        - "Chief functionary (executive director, secretary or managing trustee) signs agreements, donor reports and filings and approves payments above ₹50,000"
        - Board chair or a named trustee approves payments and partner grants above ₹5,00,000 or outside the approved budget
        - "If the chief functionary is named in an alert, the board chair decides instead"
    execute:
      name: Deliver and track progress
      description: The team and agents deliver the support, make payments, send reports and filings, and track progress, spending against budget, proof and deadlines.
      checks:
        - Support paid by bank transfer to the person's own account or handed over against a signed or thumb-printed receipt
        - Spending booked to the right grant and budget line as it happens
        - Photos and stories collected only with written consent
    close:
      name: Verify proof and close
      description: Someone other than the person who did the work checks the proof, the named role signs off, the person who asked is told the outcome and the case is closed.
      checks:
        - "Proof on file: signed or thumb-printed receipt, bank transfer record, photo taken with consent, or filing acknowledgement"
        - Spending booked to the right grant, budget line and bank account (foreign money only from FCRA accounts)
        - Donor or regulator acknowledgement saved and the next due date set
        - The person who asked is told the outcome in their language, with the reason if declined
        - "Safeguarding and fraud cases: person safe, police reports made, donors told where the agreement needs it, board told"
    report:
      name: Donor reports and learning
      description: Each month the team reviews people reached, grant spending against plan, the admin share of foreign money, reports and filings due, and complaint and safeguarding trends, and the board reviews them at each meeting.
      checks:
        - Grants spending behind plan flagged early to the donor
        - Admin share of foreign money checked against the 20% limit
        - Safeguarding and fraud cases reviewed by the board
  priorities:
    - { id: P1, name: "Urgent: someone at risk or money lost", respond_within_hours: 1, resolve_within_hours: 72 }
    - { id: P2, name: "High: donor or legal deadline", respond_within_hours: 4, resolve_within_hours: 168 }
    - { id: P3, name: Normal, respond_within_hours: 24, resolve_within_hours: 240 }
    - { id: P4, name: Low, respond_within_hours: 48, resolve_within_hours: 360 }
  roles:
    - { id: programme-manager, name: Programme manager, approves: "Selects or declines each beneficiary against the written criteria; signs off field checks and monitoring findings once the fixes are agreed" }
    - { id: me-officer, name: Monitoring and evaluation (M&E) officer, approves: "Signs off each beneficiary case after checking the proof of delivery: signed or thumb-printed receipt, bank transfer record or photo taken with consent" }
    - { id: board-chair, name: Board chair or named trustee, approves: "Payments and partner grants above ₹5,00,000 or outside the budget; signs off the closing of every safeguarding and fraud case after reviewing what happened and what will change" }
    - { id: finance-manager, name: Finance manager, approves: "Releases payments up to ₹50,000 within the approved budget; signs off every payment voucher and confirms grant money reached the right bank account (foreign money only in the FCRA account)" }
  urgent_keywords: [fraud, forged, forgery, embezzlement, misappropriation, theft, stolen, hacked, data leak, bribe, cut money, abused, sexual abuse, child abuse, molested, pocso, harassment, harassed, harassing, threatened, threatening, sexual misconduct, missing child, went missing, ran away, trafficking, child marriage, domestic violence, suicide, self harm, caught fire, fire broke out, injured, food poisoning, drowned, snake bite, electrocuted, collapsed]
  categories:
    - id: beneficiary-application
      name: Beneficiary application
      keywords:
        - apply
        - applied
        - application form
        - want to join
        - enrol
        - enroll
        - enrolment
        - enrollment
        - admission
        - scholarship
        - fee support
        - school fees
        - education support
        - goat unit
        - goat rearing
        - poultry unit
        - livelihood
        - tailoring course
        - skill training
        - vocational training
        - ration kit
        - medical aid
        - medical help
        - treatment support
        - wheelchair
        - hearing aid
        - self-help group
        - shg
        - selection list
        - madad
        - sahayata
      priority: P3
      risk: low
      department: Programmes
      required_details:
        - key: place
          label: Where the person lives (village, ward or block)
          kind: keywords
          keywords: [village, gaon, ward, block, tehsil, taluka, taluk, mandal, district, zilla, basti, colony, nagar, panchayat, mohalla, pin code, pincode]
        - key: idOrForm
          label: An ID or the filled application form
          kind: keywords
          keywords: [aadhaar, aadhar, voter id, voter card, ration card, job card, pan card, birth certificate, disability certificate, udid, id proof, id card, bpl card, form attached, forms attached, forms are attached, documents attached]
      required_checks:
        - Lives in a project village and fits the programme's written criteria (need, income, age)
        - One valid ID seen; Aadhaar only with consent and stored masked
        - Consent to use their details taken in their language; a parent's or guardian's consent for a child
        - Not already getting the same support from us or a government scheme we can check
        - Home visit by a field worker, with notes; photos only with consent
        - No fee, gift or favour asked from the applicant
        - Support fits an approved budget line and the fund's allowed purpose
      not_eligible:
        - keywords: [dowry, dahej, dowry money, money for the dowry]
