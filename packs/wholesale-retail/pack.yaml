    - id: return-refund
      name: Return, refund or cancellation
      keywords: [return, returned, returning, want to return, return the goods, sales return, take back, wapas, wapas lo, paisa wapas, money back, refund, exchange, replacement, sent back, send back, sending back, brought back, damaged, defective, not working, stopped working, expired, expiry, near expiry, leaking, broken, broke, breakage, torn, wrong item, wrong product, wrong size, credit note, cancel my order, cancel the order, cancel order, order cancel]
      priority: P3
