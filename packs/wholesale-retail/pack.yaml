# Ready-made pack: wholesale and retail trade (distributors, wholesalers,
# stockists, dealers, shops and small chains). Built from researched Indian
# practice: the CGST Act and Rules (invoices, e-way bills, credit notes, input
# credit, detention), the Consumer Protection Act 2019, the MSMED Act 2006, the
# Negotiable Instruments Act s.138, Legal Metrology and FSSAI recall guidance,
# then checked by an operations and compliance expert.
id: wholesale-retail
version: 1.0.0
name: Wholesale & retail trade
description: Customer orders, credit limits and bounced cheques, dues and statements, GST invoice and e-way bill fixes, returns, restocking, supplier bills and urgent incidents for distributors, wholesalers, stockists, dealers and shops.
kind: industry
sector: trade-logistics-tourism
extends: [sector-trade-logistics-tourism, orders-base]
