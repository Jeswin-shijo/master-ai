      required_checks:
        - Current stock, daily sales and supplier lead time checked
        - Reorder level worked out as highest daily sale × longest lead time
        - Quantity covers the sales cycle but not more than the shelf life allows
        - "Supplier's latest rate, scheme and minimum order confirmed"
        - Supplier GSTIN active; Udyam (MSME) status noted for payment terms
        - Godown space and cash for the payment date checked
      approval: { required: above_amount, role: purchase-manager, amount_inr: 100000 }
      signoff: { required: true, role: godown-in-charge }
      workflow: restock-po
      execution: both
    - id: supplier-payment
      name: Supplier bill and payment
      keywords: [supplier, vendor, supplier bill, supplier invoice, supplier payment, vendor bill, vendor payment, vendor invoice, purchase bill, release payment, release the payment, payment release, send the payment, send payment, make the payment, pay the supplier, our bill, our invoice, our payment, payment due, bills due, payment list, company dues, dues to the company, outstanding with the company, company outstanding, stopped supply, supply stopped, stopped our supply, msme, udyam, micro unit, small enterprise, 45 days, transporter bill, freight bill, remittance, payment advice]
      priority: P3
      risk: medium
      department: Accounts
      required_details:
        - key: bill
          label: Which bill or bills
          kind: keywords
          keywords: [bill, bills, invoice, inv, debit note, statement, ledger, payment list]
      required_checks:
        - Bill matches the PO and the goods received note (rate, quantity, tax)
        - Bill shows in GSTR-2B and is accepted in IMS; supplier GSTIN active
        - "Due date worked out: micro and small (Udyam) suppliers by the agreed date, never later than 45 days from receiving the goods (15 days if there are no written terms)"
        - No open short-supply, damage or rate-difference claim
        - Paid by bank transfer (NEFT, RTGS or UPI) within 180 days of the bill date so the input credit stays
      not_eligible:
        - keywords: [in cash, by cash, cash payment, pay cash, cash me, cash mein, nakad, nakad payment]
          amount_above_inr: 10000
          reason: "We pay supplier bills above ₹10,000 only by bank transfer (NEFT, RTGS or UPI). Cash payments above ₹10,000 a day to one party are not allowed as a business expense under income-tax law, and a bank payment keeps the GST input credit trail clean."
      approval: { required: above_amount, role: owner, amount_inr: 50000 }
      signoff: { required: false }
      workflow: supplier-bill-payment
      execution: agents
    - id: urgent-incident
      name: Urgent incident
      keywords: [gst squad, mobile squad, flying squad, squad stopped, gaadi rok di, gaadi pakad li, truck stopped, vehicle detained, goods detained, detained, detain, detention, seized, seizure, gst raid, theft, stolen, chori, chori ho gaya, robbery, burglary, break-in, shutter broken, lock broken, caught fire, short circuit, flooded, water entered, paani bhar gaya, pani bhar gaya, recall, product recall, stop sale, failed lab test, lab test failed, unsafe, food poisoning, fell sick after eating, fridge failed, freezer not working, compressor failed, fake product, spurious, counterfeit, duplicate product, accident, raided, fire in, fire at, on fire, flood water, cold room not working, cold room failed, cold room temperature]
      priority: P1
      risk: high
      department: Operations
      required_checks:
        - "What happened, where and when, with photos"
        - Bill, e-way bill and batch numbers of the goods involved
        - Quantity and value of the goods affected
        - "Who has been told: driver, transporter, company, police, insurer or FSSAI as needed"
        - "Recall or fake stock: item stopped in billing and kept apart at once"
        - "Detention: copy of the officer's order received (release is on a penalty of 200% of the tax, or security)"
      approval: { required: high_risk_or_p1, role: owner }
      signoff: { required: true, role: owner }
      workflow: incident-response
      execution: both
