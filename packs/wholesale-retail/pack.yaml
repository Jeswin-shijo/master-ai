entities:
  - name: Party
    label: Party
    plural_label: Parties
    description: A customer or supplier the business bills or buys from, as in the ledger.
    title_field: name
    list_columns: [name, partyType, city, outstanding, onHold]
    fields:
      - { name: name, label: Party name, type: string, required: true }
      - name: partyType
        label: Type
        type: enum
        required: true
        options: [retailer, wholesaler, institution, walk-in customer, supplier, transporter]
      - { name: gstin, label: GSTIN, type: string }
      - { name: phone, label: Phone / WhatsApp, type: phone }
      - { name: email, label: Email, type: email }
      - { name: city, label: City, type: string }
      - { name: creditLimit, label: Credit limit, type: money }
      - { name: creditDays, label: Credit days, type: integer }
      - { name: outstanding, label: Outstanding, type: money }
      - { name: onHold, label: On credit hold, type: boolean }
      - { name: udyamNumber, label: Udyam no. (MSME supplier), type: string }
  - name: Product
    label: Item
    plural_label: Items
    title_field: name
    list_columns: [name, sku, price, stock, reorderLevel, active]
    fields:
      - { name: name, label: Item name, type: string, required: true }
      - { name: sku, label: Item code / barcode, type: string }
      - { name: price, label: Selling rate, type: money }
      - { name: stock, label: Stock in hand, type: integer }
      - { name: active, label: Billing allowed, type: boolean }
      - { name: hsn, label: HSN code, type: string }
      - { name: gstRate, label: GST %, type: number }
      - { name: mrp, label: MRP, type: money }
      - { name: reorderLevel, label: Reorder level, type: integer }
      - { name: leadTimeDays, label: Supplier lead time (days), type: integer }
      - { name: nearestExpiry, label: Nearest expiry, type: date }
  - name: Order
    label: Order
    title_field: customerName
    list_columns: [orderNo, customerName, orderType, amount, status, paymentStatus]
    fields:
      - { name: customerName, label: Party name, type: string, required: true }
      - { name: phone, label: Phone, type: phone }
      - { name: email, label: Email, type: email }
      - { name: items, label: Items and quantities, type: text, required: true }
      - { name: amount, label: Order value, type: money, required: true }
      - name: status
        label: Status
        type: enum
        required: true
        options: [new, confirmed, on-hold, packed, shipped, delivered, part-received, received, cancelled, returned]
      - name: paymentStatus
        label: Payment
        type: enum
        options: [unpaid, requested, part-paid, paid, refunded]
      - { name: orderedAt, label: Ordered at, type: datetime }
      - { name: notes, label: Notes, type: text }
      - { name: orderNo, label: Order / PO no., type: string }
      - name: orderType
        label: Type
        type: enum
        options: [customer order, purchase order]
      - { name: neededBy, label: Needed by, type: date }
      - { name: ewayBillNo, label: E-way bill no., type: string }
      - { name: proofNo, label: Delivery proof / GRN no., type: string }
  - name: Bill
    label: Bill
    title_field: billNo
    list_columns: [billNo, billType, party, total, dueDate, paymentStatus]
    fields:
      - { name: billNo, label: Bill no., type: string, required: true }
      - name: billType
        label: Type
        type: enum
        required: true
        options: [sales invoice, purchase bill, credit note, debit note]
      - { name: party, label: Party, type: reference, ref: Party }
      - { name: billDate, label: Bill date, type: date }
      - { name: taxableValue, label: Taxable value, type: money }
      - { name: gstAmount, label: GST amount, type: money }
      - { name: total, label: Total, type: money }
      - { name: irn, label: IRN (e-invoice), type: string }
      - { name: dueDate, label: Due date, type: date }
      - name: paymentStatus
        label: Payment
        type: enum
        options: [unpaid, part-paid, paid, cancelled]
      - { name: paymentRef, label: UTR / cheque no., type: string }

tools:
  - name: parties.search
    description: Search customers and suppliers by name, GSTIN, city, outstanding or credit hold.
    uses: records.search
    with: { entity: Party }
  - name: party.hold
    description: Put a party on credit hold after a bounced cheque or bills past their credit days. Only the owner releases a hold.
    uses: records.update
    with: { entity: Party, patch: { onHold: true } }
    risk: { reversible: true }
  - name: party.set_credit_terms
    description: Change a party's credit limit or credit days, or release a credit hold, after the owner has agreed.
    uses: records.update
    with: { entity: Party }
    risk: { reversible: true, sensitivity: confidential }
  - name: items.search
    description: Search items by name, code, stock, reorder level or expiry.
    uses: records.search
    with: { entity: Product }
  - name: item.stop_sale
    description: Stop billing an item at once, for a recall, a failed lab test or suspected fake stock.
    uses: records.update
    with: { entity: Product, patch: { active: false } }
    risk: { reversible: true }
  - name: orders.search
    description: Search customer orders and purchase orders by number, party or status.
    uses: records.search
    with: { entity: Order }
  - name: order.record
    description: Record a customer order with the party, items, quantities and value. It is not confirmed until checked.
    uses: records.create
    with: { entity: Order, data: { orderType: customer order, status: new } }
  - name: order.hold
    description: Hold a customer order while a credit limit, stock or rate question is sorted out.
    uses: records.update
    with: { entity: Order, patch: { status: on-hold } }
    risk: { reversible: true }
  - name: purchase_order.draft
    description: Draft a purchase order to a supplier with items, quantities, rate and value.
    uses: records.create
    with: { entity: Order, data: { orderType: purchase order, status: new } }
  - name: bills.search
    description: Search sales invoices, purchase bills, credit notes and debit notes.
    uses: records.search
    with: { entity: Bill }
  - name: bill.record
    description: Record a purchase bill, credit note or debit note with its number, party, date, amounts and due date.
    uses: records.create
    with: { entity: Bill }

agents:
  - role: order-desk
    name: Sales and order desk
    description: Takes orders from WhatsApp, phone and salesmen, checks stock, rate and the party's credit, records and confirms the order, prepares the GST invoice and e-way bill details, gets the godown to pack and dispatch by phone, and handles returns at the counter or from parties.
    job:
      mission: "Take orders, check stock, rate and credit, confirm them, prepare invoices and get the godown to dispatch."
      customer_facing: true
      never:
        - "Price overrides"
        - "Customer credit limits"
        - "Food-safety actions"
        - "Product recalls"
    instructions: Never bill above MRP and never send goods without a GST bill. Never promise stock you have not checked. If the party is on credit hold or the order takes them past their limit, hold the order and raise a credit request instead of confirming it.
    autonomy: 3
    tools: [parties.search, items.search, orders.search, order.record, order.confirm, order.hold, order.cancel, bills.search, records.search, knowledge.search, document.generate, message.draft, message.send, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }
  - role: billing-assistant
    name: Accounts desk
    description: Keeps party ledgers, sends statements and bill-wise reminders with payment links, prepares credit summaries for the owner, puts parties on hold after a bounced cheque, prepares credit notes and invoice corrections, matches supplier bills with the PO and goods received, and makes the supplier payment list.
    job:
      mission: "Keep party ledgers, send statements and payment reminders, prepare credit notes and match supplier bills."
      customer_facing: true
      never:
        - "Customer credit limits"
        - "Price overrides"
        - "Supplier orders"
        - "Writing off dues"
    instructions: Send a ledger only to the party's own registered phone or email. Never change a credit limit, credit days or a hold without the owner's okay. Never mark a bill paid without a UTR or cheque number, and never pay a supplier in cash. Keep reminders polite.
    autonomy: 3
    tools: [parties.search, party.hold, party.set_credit_terms, bills.search, bill.record, orders.search, records.search, knowledge.search, payment.request, document.generate, message.draft, message.send, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }
  - role: purchase-desk
    name: Purchase and godown desk
    description: Watches stock against reorder levels, works out order quantities, drafts and sends purchase orders, follows up supplier dispatch, gets the godown to receive and check the goods, and in a recall, theft or detention stops the sale, gathers the papers and lists the parties who got the goods.
    job:
      mission: "Watch stock against reorder levels, draft purchase orders, follow up suppliers and stop the sale in a recall."
      customer_facing: false
      never:
        - "Supplier orders without approval"
        - "Food-safety actions"
        - "Product recalls"
        - "Price overrides"
    instructions: Order no more than the shelf life allows. In a recall or detention, stop the sale first, then gather the papers; the owner deals with officers, police, insurers and the company.
    autonomy: 3
    tools: [items.search, item.stop_sale, orders.search, purchase_order.draft, parties.search, bills.search, records.search, knowledge.search, document.generate, message.draft, message.send, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: internal }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }

workflows:
  - id: order-dispatch
    name: Customer order to dispatch
    description: Check stock, rate and credit, record and confirm the order, then bill it and get it packed and dispatched.
    keywords: [order, supply, dispatch, bhej do, deliver]
    steps:
      - key: check-and-record
        title: Check stock, rate and credit, and record the order
        agent: order-desk
        instructions: Find the party and check their GSTIN, credit limit, credit hold and bills past their credit days. Check stock and the price list, never above MRP. Record the order and confirm it to the party, or hold it and raise a credit request if it goes past their limit.
      - key: bill-and-dispatch
        title: Bill and dispatch
        agent: order-desk
        depends_on: [check-and-record]
        instructions: Prepare the GST invoice details and, for goods worth over ₹50,000, the e-way bill details with the vehicle number. Ask the godown in-charge by phone to pick, pack and load the earliest expiry first, and send the party the bill and vehicle details. Save the signed challan or delivery photo.
  - id: return-and-credit
    name: Return and credit note
    description: Check the bill and the return rules, get the goods inspected, and prepare the credit note or refund.
    keywords: [return, refund, credit note, damaged, expired, exchange]
    steps:
      - key: check-return
        title: Check the bill and inspect the goods
        agent: order-desk
        instructions: Find the bill and check the return period and the reason. For an order cancelled before dispatch, cancel it in the records. Ask the counter or godown staff by phone to collect and inspect the goods and mark them saleable, damaged or expired, kept apart.
      - key: credit
        title: Prepare the credit note or refund
        agent: billing-assistant
        depends_on: [check-return]
        instructions: Prepare the credit note against the original invoice for a GST buyer, or the refund to the original payment mode. Update the ledger and tell the party the amount and reference.
  - id: credit-review
    name: Credit limit or bounced cheque
    description: Put the party's credit record in front of the owner, then apply the decision.
    keywords: [credit limit, credit days, hold, cheque bounce, security cheque]
    steps:
      - key: summary
        title: Prepare the credit summary
        agent: billing-assistant
        instructions: Pull the outstanding, bill-wise ageing, average days to pay over 12 months and any bounced cheques, and write a one-page summary for the owner. For a bounced cheque, put the party on hold and note the date of the bank's return memo.
      - key: apply
        title: Apply the decision and tell the party
        agent: billing-assistant
        depends_on: [summary]
        instructions: Apply the limit, credit days or hold the owner agreed. For a bounced cheque, draft the demand notice for the owner to sign within 30 days of the return memo. Tell the salesman by phone and the party politely.
  - id: dues-follow-up
    name: Dues reminders and statements
    description: Send statements and bill-wise reminders with a payment link and log the promised dates.
    keywords: [reminder, outstanding, ledger, statement, dues, collection]
    steps:
      - key: remind
        title: Send statements and reminders
        agent: billing-assistant
        instructions: Post every payment received first. Send each party its own statement or bill-wise reminder with a payment link to its registered phone or email, and log replies and promised payment dates for the salesman.
  - id: invoice-correction
    name: Invoice or e-way bill correction
    description: Prepare the corrected invoice, credit or debit note or e-way bill update for the accounts manager to file.
    keywords: [gstin, invoice correction, credit note, debit note, e-way bill, irn]
    steps:
      - key: prepare
        title: Prepare the correction
        agent: billing-assistant
        instructions: Check the bill and the correct details on the GST portal, and the time window (24 hours to cancel an IRN or e-way bill, 8 hours either side of expiry to extend an e-way bill). Prepare the credit or debit note, the new invoice or the e-way bill update.
      - key: file
        title: Get it filed and tell the party
        agent: billing-assistant
        depends_on: [prepare]
        instructions: Hand the filing to the accounts manager by phone with the papers ready. Once filed, send the party the corrected papers and ask a GST buyer to accept the credit note in IMS.
  - id: restock-po
    name: Restock order to supplier
    description: Work out the quantity, send the purchase order and get the goods received and checked.
    keywords: [low stock, reorder, restock, purchase order, supplier]
    steps:
      - key: order
        title: Work out the quantity and send the PO
        agent: purchase-desk
        instructions: Check stock, daily sales, lead time and shelf life, and the supplier's latest rate, scheme and minimum order. Draft the purchase order and send it to the supplier, then follow up the dispatch date.
      - key: receive
        title: Get the goods received and checked
        agent: purchase-desk
        depends_on: [order]
        instructions: Ask the godown in-charge by phone to count the goods against the PO and bill, check damage, batch and expiry dates, and report the GRN. Record any shortage or damage for a debit note.
  - id: supplier-bill-payment
    name: Supplier bill and payment
    description: Match the bill, work out the due date and put it on the payment list.
    keywords: [supplier bill, payment, msme, release payment, remittance]
    steps:
      - key: match
        title: Match the bill and work out the due date
        agent: billing-assistant
        instructions: Match the bill with the PO and goods received note, check it shows in GSTR-2B, and work out the due date (micro and small suppliers by the agreed date, never later than 45 days). Put it on the payment list with any open shortage or rate claim.
      - key: advise
        title: Send the remittance advice
        agent: billing-assistant
        depends_on: [match]
        instructions: Once a person has paid it by bank, record the UTR and send the supplier the remittance advice.
  - id: incident-response
    name: Urgent incident response
    description: Stop the sale, gather the papers and list who got the goods, while the owner deals with officers, police or the company.
    keywords: [detained, recall, theft, fire, flood, seized]
    steps:
      - key: contain
        title: Stop the sale and gather the papers
        agent: purchase-desk
        instructions: Tell the owner at once. For a recall or fake stock, stop billing the item and list every party that got the batch from the bills. Collect photos, the invoice, e-way bill, batch numbers, quantity and value.
      - key: act
        title: Get the people on the ground moving
        agent: purchase-desk
        depends_on: [contain]
        instructions: Ask the godown in-charge or driver by phone to keep the goods apart and safe, and draft the letters to parties, the company, police or insurer for the owner to sign. Report every day until it is closed.

lifecycle:
  case: { label: Request, plural: Requests, prefix: REQ }
  stages:
    request:
      name: Request comes in
      description: An order, return, credit ask, supplier bill or alert comes in by WhatsApp, phone, email, a salesman or the billing software and gets a request number.
    review:
      name: Check party and papers
      description: The desk checks who the party is, that bill, PO or e-way bill numbers, items, quantities and amounts are clear, and asks for anything missing.
      checks:
        - "Party found with a phone number; for business buyers and suppliers, GSTIN shows Active on the GST portal"
        - Bill, PO, invoice or e-way bill number and date given when the request is about one
        - Items, quantities and amount are clear
        - "Inside the limits: return period, credit limit and credit days, MSME due date, 24-hour cancel window"
        - Photos or papers attached for damaged, expired, defective or detained goods
        - Not a repeat of a request that is already open
    classify:
      name: Set type and urgency
      description: The request gets its type, priority (P1 to P4), risk and owning desk, which starts the reply and finish clock.
    assign:
      name: Assign person and deadline
      description: A person at sales, accounts, purchase or the godown, or an agent, is named with a clear deadline.
    approve:
      name: Owner or manager okay
      description: Credit changes, orders worth more than ₹5 lakh, refunds and credit notes above ₹10,000, purchase orders above ₹1 lakh, supplier payments above ₹50,000, GST corrections and urgent incidents wait for the named person's okay; ordinary orders go straight to packing.
      checks:
        - Amount within the approver's limit
        - "Credit changes: ledger, ageing and bounce history in front of the owner"
        - Supplier bank details confirmed by a call before a first or changed payment
    execute:
      name: Carry out and track
      description: Pack and dispatch, bill, pay, refund or fix, logging progress, costs, photos and delivery proof against the deadline.
      checks:
        - GST invoice (with IRN where e-invoicing applies) made before the goods leave
        - E-way bill with the vehicle number made before loading when the goods are worth over ₹50,000
        - Earliest expiry goes out first
        - Delays told to the party before the deadline runs out
    close:
      name: Confirm and close
      description: The result is checked against proof, the named person signs off where the case type needs it, the party is told and the request is closed.
      checks:
        - "Proof saved: signed challan or delivery photo, GRN, payment or refund UTR, IRN, credit note or e-way bill number"
        - Stock and the party's ledger updated in the billing software
        - Corrected invoice or credit note reported in GSTR-1
        - Returned, damaged or recalled stock counted and kept apart
        - Party told the outcome on WhatsApp, SMS or email
    report:
      name: Weekly review and fixes
      description: Each week the owner sees fill rate, late deliveries, overdue dues, returns, stock-outs and repeat problems by party, item or supplier, and fixes the causes.
  priorities:
    - { id: P1, name: Urgent, respond_within_hours: 0.5, resolve_within_hours: 24 }
    - { id: P2, name: High, respond_within_hours: 2, resolve_within_hours: 48 }
    - { id: P3, name: Normal, respond_within_hours: 4, resolve_within_hours: 72 }
    - { id: P4, name: Routine, respond_within_hours: 24, resolve_within_hours: 168 }
  roles:
    - { id: accounts-manager, name: Accounts manager, approves: "Every correction to a GST invoice, credit note or e-way bill (and signs it off once filed); returns, refunds and credit notes above ₹10,000" }
    - { id: purchase-manager, name: Purchase manager, approves: "Purchase orders to suppliers above ₹1,00,000, or with no value given" }
    - { id: godown-in-charge, name: Godown or store in-charge, approves: "Signs off goods received against a purchase order: count, damage, batch and expiry dates (GRN)" }
  urgent_keywords: [emergency, caught fire, smoke, short circuit, explosion, gas leak, flooded, accident, collision, overturned, injured, injury, ambulance, unconscious, fatal, death, theft, stolen, chori, robbery, robbed, burglary, looted, hijacked, fraud, seized, detained, food poisoning, fire in, fire at, on fire, flood water, water entered, raided, gst raid, income tax raid]
  categories:
    - id: customer-order
      name: Customer order
      keywords: [new order, fresh order, bulk order, repeat order, place an order, order cartons, cartons of, cases of, boxes of, bags of, for our order, contractor order, order for, requirement, our requirement, please supply, kindly supply, supply us, send, send us, bhej do, bhejo, bhej dena, bhejna, bhej dijiye, bhijwa do, maal chahiye, maal bhejo, same rate, same as last time, as per last rate, our po, po attached, purchase order attached, quotation for, rate list, price list, rate enquiry, price enquiry, need a quote, deliver to our, deliver by, bina bill, kachha bill]
      priority: P3
      risk: low
      department: Sales
      required_details:
        - key: quantities
          label: Items and quantities
          kind: keywords
          keywords: [case, carton, box, boxes, peti, dabba, bag, sack, bori, katta, kg, kgs, gm, litre, liter, ltr, dozen, pcs, piece, packet, pkt, pouch, bottle, tin, jar, bundle, roll, ream, pair, nos, strip, tray, crate, quintal, tonne, ton]
      required_checks:
        - Business buyer's GSTIN is Active on the GST portal
        - Stock is available, or a part-supply date is agreed
        - Rate matches the current price list or scheme and is never above MRP
        - "Order fits the party's credit limit and no bill is past its credit days (otherwise hold it and raise a credit request for the owner)"
        - "Walk-in buyer's name, address and state on the bill when it is ₹50,000 or more"
        - "E-way bill details ready (vehicle number, distance) when the goods are worth over ₹50,000"
      not_eligible:
        - keywords: [without bill, bina bill, bina bill ke, kachha bill, kacha bill, kachcha bill, kachi parchi, no bill needed, bill not needed, don't make a bill, dont make bill, without gst, no gst bill, skip the gst, skip gst, bill mat banao, cash without bill]
          reason: "We sell only on a proper GST bill. Selling without one is tax evasion under the CGST Act, and goods moving without a bill can be detained on the road."
      # Ordinary orders go straight through: parties rarely state a rupee value, and the
      # real risk is credit, which the order desk checks and sends to the owner as a
      # credit request. Orders that state a value above ₹5 lakh still need the owner.
      approval: { required: never }
      signoff: { required: false }
      workflow: order-dispatch
      execution: both
    - id: credit-limit
      name: Credit limit or hold
      keywords: [credit limit, raise the limit, increase the limit, raise limit, increase limit, limit increase, limit badha, limit badhao, over the limit, over their limit, over his limit, above the limit, above their limit, beyond the limit, beyond their limit, crossed the limit, crossed their limit, limit crossed, limit exceeded, exceeds the limit, credit days, more credit, extra credit, credit hold, on hold, release the hold, release their hold, release hold, remove the hold, remove hold, hold release, unblock, account blocked, billing blocked, cheque bounce, cheque bounced, bounced, bounce, cheque returned, cheque return, returned unpaid, dishonoured, dishonored, insufficient funds, funds insufficient, exceeds arrangement, security cheque, pdc, post dated cheque, new credit account, open a credit account, udhaar limit, udhar limit, hand loan, cash loan, personal loan, loan of]
      priority: P2
      risk: high
      department: Accounts
      required_details:
        - { key: amount, label: "Limit asked for, order value or cheque amount", kind: amount }
      required_checks:
        - Party's GSTIN and PAN checked and active
        - Current outstanding and bill-wise ageing pulled from the ledger
        - Payment record for the last 12 months (average days to pay)
        - Bounced cheques in the last 12 months
        - Security cheque or signed credit terms on file
        - "For a higher limit: no unpaid bounced cheque and no bill more than 90 days past due, otherwise recommend a refusal"
        - "For a bounced cheque: date of the bank's return memo noted, because the demand notice must go within 30 days of it"
      not_eligible:
        - keywords: [hand loan, cash loan, personal loan, loan of, lend him, lend them, lend money, udhaar paisa, udhar paisa, paise udhaar, cash advance, advance in cash, give him cash]
          reason: "We give credit only as time to pay for goods billed to the party. Lending cash to a party is not trade credit and stays outside the business books; the owner decides it personally."
      approval: { required: always, role: owner }
      signoff: { required: false }
      workflow: credit-review
      execution: agents
    - id: dues-statement
      name: Dues reminder or statement
      keywords: [payment reminder, send reminder, send a reminder, reminder for dues, outstanding, overdue, past due, pending dues, old dues, dues, baki, baaki, bakaya, udhaar, udhar, khata, hisaab, hisab, ledger, send the ledger, send ledger, send their ledger, ledger copy, statement of account, account statement, send the statement, send statement, bill wise, billwise, payment link, balance confirmation, confirmation of balance, invoice copy, copy of bill, bill copy, send the bill copy, duplicate bill, has not paid, not yet paid, still not paid, payment not showing, payment not reflecting, payment not updated, collection, recovery]
