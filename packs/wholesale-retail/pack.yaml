          reason: "This is outside our return rules. Change-of-mind returns are taken only within the period printed on the bill (usually 7 days), unused and with tags; defective goods within that period, or 30 days if none is printed. After that, a defect goes to the brand's service centre under warranty."
      approval: { required: above_amount, role: accounts-manager, amount_inr: 10000 }
      signoff: { required: false }
      workflow: return-and-credit
      execution: both
