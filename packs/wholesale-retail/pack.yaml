        - key: reference
          label: Which bill or order
          kind: keywords
          keywords: [bill, invoice, inv, receipt, cash memo, challan, order]
      required_checks:
        - Bill number and date found
        - Change-of-mind returns only within the period printed on the bill (shop default 7 days), unused and with tags
        - Defective goods taken back within the period on the bill, or within 30 days if none is printed
        - Reason given, with a photo or the goods checked at the counter or godown
        - Refund goes back to the original payment mode; a GST buyer gets a credit note against the original invoice
        - Returned stock marked saleable, damaged or expired and kept apart
      not_eligible:
