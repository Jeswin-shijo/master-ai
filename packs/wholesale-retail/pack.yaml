policies:
  - id: credit-terms-owner
    action: party.set_credit_terms
    require_approval: true
    approver: owner
    reason: Only the owner changes a party's credit limit or credit days, or releases a credit hold.

playbooks:
  - id: bill-and-dispatch-order
    title: Bill and dispatch a customer order
    source: CGST Act 2017, s.31; CGST Rules 2017, rules 46 and 138; Notification 10/2023-Central Tax; GSTN advisory of 5 November 2024 (30-day e-invoice reporting); Legal Metrology (Packaged Commodities) Rules 2011, r.18(2)
    body: |
      1. Check the buyer's GSTIN shows Active on the GST portal (Search Taxpayer) before billing a business.
      2. If the order takes the party past its credit limit, or any bill is past its credit days, hold the order and raise a credit request for the owner.
      3. Make the GST invoice before the goods leave: both GSTINs, HSN code, quantity, taxable value, tax rate and amount, and place of supply. For a walk-in buyer, put name, address and state on the bill when it is ₹50,000 or more.
      4. If turnover crossed ₹5 crore in any year since 2017-18, the invoice must be an e-invoice with IRN and QR code. At ₹10 crore or more, report it within 30 days of the invoice date.
      5. If the goods are worth over ₹50,000, make the e-way bill with the vehicle number before loading. It is valid one day for every 200 km.
      6. Never charge above MRP. Send the earliest expiry first, and keep the signed challan or delivery photo as proof.
  - id: returns-and-credit-notes
    title: Take back goods and give a credit note or refund
    source: Consumer Protection Act 2019, s.2(47); CGST Act 2017, s.34; FSSAI advisory on handling rejected and expired food (December 2024)
    body: |
      1. Find the bill first. Change-of-mind returns follow the period printed on the bill (shop default 7 days), unused and with tags.
      2. Defective goods must be taken back and refunded within the period on the bill, or 30 days if none is printed. Refusing is an unfair trade practice. After that, send the customer to the brand's service centre under warranty.
      3. Check the goods by photo or at the counter. Keep returned, damaged and expired stock apart and clearly marked.
      4. Refund to the same payment mode. Refunds and credit notes above ₹10,000 need the accounts manager's okay.
      5. For a GST buyer, issue a credit note against the original invoice and report it by 30 November after the year ends. Ask the buyer to accept it in IMS.
      6. Never resell expired food or pass it off as cattle feed. Record what was destroyed or sent back to the company.
  - id: credit-and-bounced-cheques
    title: Credit limits and bounced cheques
    source: Negotiable Instruments Act 1881, s.138 and s.142; house credit policy
    body: |
      1. Before any credit change, pull the outstanding, bill-wise ageing, the last 12 months' average days to pay and any bounced cheques, and put a one-page summary in front of the owner.
      2. Only the owner raises a limit, adds credit days or releases a hold. Recommend a refusal when there is an unpaid bounced cheque or a bill more than 90 days past due.
      3. When a cheque bounces, put the party on hold and note the date you received the bank's return memo.
      4. The written demand notice must reach the party within 30 days of that memo; the party then has 15 days to pay. If they do not, a complaint can be filed within one month. Ask the owner before any legal step.
      5. Keep every message polite. Share the ledger and a payment link, and tell the salesman before he visits.
  - id: restock-receive-pay-suppliers
    title: Restock, receive and pay suppliers
    source: ICAI study material on material control (reorder level); FSSAI guidance on first-expiry-first-out; CGST Act 2017, s.16(2); MSMED Act 2006, ss.15-16 (Office of DC-MSME)
    body: |
      1. Reorder when stock falls to the reorder level: highest daily sale × longest supplier lead time. Do not order more than the shelf life allows.
      2. On arrival, count against the PO and the bill, check damage, batch and expiry dates, and stack so the earliest expiry goes out first. The godown in-charge signs the GRN.
      3. Enter a bill only when it matches the PO and the goods received. Accept it in IMS if it is right; reject it or keep it pending with a remark if not.
      4. Pay micro and small (Udyam) suppliers by the agreed date, never later than 45 days after receiving the goods, or within 15 days if there are no written terms. Late payment costs compound interest at 3 times the RBI bank rate, and the expense is not allowed for income tax until paid.
      5. Pay every supplier by bank within 180 days of the bill date, or the input tax credit must be paid back with interest.
  - id: detention-and-recall
    title: Goods held on the road or a product recall
    source: CGST Act 2017, s.129; FSSAI Guidelines for Food Recall (2017)
    body: |
      1. Call the owner at once and get photos of the officer's order, the invoice and the e-way bill from the driver.
      2. Detained goods are released on paying a penalty of 200% of the tax, or on giving security. The officer must issue a notice within 7 days; if the penalty is not paid within 15 days of the order, the goods can be sold.
      3. For a recall or fake stock, stop the item in billing, pull it from shelves and godown, keep it apart and count it.
      4. From the bills, list every party that got the batch and inform them in writing. Send the list to the company or FSSAI.
      5. Send a status report every week until the stock is back. Destroy it only with the authority's okay and keep the records.

kpis:
  - id: fill-rate
    name: Order fill rate
    description: Share of ordered quantity sent in full with the first dispatch this month.
    unit: percent
    direction: up
    target: 95
  - id: on-time-delivery
    name: Orders delivered on time
    description: Share of customer orders delivered by the promised date this month.
    unit: percent
    direction: up
    target: 95
  - id: overdue-dues
    name: Overdue dues
    description: Share of customer outstanding that is past the agreed credit days, at month end.
    unit: percent
    direction: down
    target: 10
  - id: items-out-of-stock
    name: Items out of stock
    description: Items still on sale with no stock in hand.
    unit: count
    direction: down
    target: 0
    source: { type: records_count, entity: Product, where: { stock: 0, active: true } }
  - id: return-rate
    name: Returns
    description: Value of goods returned or credited as a share of sales value this month.
    unit: percent
    direction: down
    target: 2
  - id: msme-paid-on-time
    name: MSME bills paid on time
    description: Share of micro and small supplier bills paid by the agreed date, never more than 45 days after the goods arrived.
    unit: percent
    direction: up
    target: 100

routines:
  - id: todays-bills
    name: Today's bills
    description: The AI calls the person who makes bills each evening and adds the day's bills to the Bills list.
    days: [1, 2, 3, 4, 5, 6]
    time: '18:00'
    collect:
      list: bills
      ask: [billNo, billType, party, total, gstAmount, dueDate]
      defaults: { billDate: today, paymentStatus: unpaid }
      who: the billing clerk

registers:
  - id: bills
    entity: Bill
    label: Bills
    columns: [billNo, billType, party, billDate, total, paymentStatus, dueDate]
    filters: [billType, paymentStatus, party]
    date_field: billDate
    totals: [taxableValue, gstAmount, total]
    card: { sum: { field: total, when: { paymentStatus: [unpaid, part-paid] }, label: unpaid } }
    checks:
      - missing: [party, billDate, total]
      - adds_up: { field: total, plus: [taxableValue, gstAmount] }
      - duplicate: [billType, billNo, party]
      - overdue: { date: dueDate }
        when: { paymentStatus: [unpaid, part-paid] }
    follow_ups:
      - id: unpaid-bills
        label: Unpaid bills → the party
        who: party
        due: { overdue: { date: dueDate } }
        when: { billType: [sales invoice], paymentStatus: [unpaid, part-paid] }
        phone: { ref: party, field: phone }
        contact: { ref: party, field: name }
        about: [billNo, billDate, total, dueDate]
        find_out: [paymentStatus, paymentRef]
  - id: orders
    entity: Order
    label: Orders
    columns: [orderNo, orderType, customerName, amount, status, paymentStatus, neededBy]
    filters: [orderType, status, paymentStatus]
    date_field: orderedAt
    totals: [amount]
    card: { count: { when: { status: [new, confirmed, on-hold, packed, shipped] }, label: open } }
    checks:
      - missing: [customerName, items]
      - overdue: { date: neededBy }
        when: { status: [new, confirmed, on-hold, packed, shipped] }
    follow_ups:
      - id: late-purchase-orders
        label: Late purchase orders → the supplier
        who: party
        due: { overdue: { date: neededBy } }
        when: { orderType: [purchase order], status: [confirmed, on-hold, shipped] }
        phone: { field: phone }
        contact: { field: customerName }
        about: [orderNo, items, neededBy]
        find_out: [status, neededBy]
  - id: parties
    entity: Party
    label: Parties
    columns: [name, partyType, city, phone, outstanding, creditLimit]
    filters: [partyType, onHold]
    totals: [outstanding]
    card: { sum: { field: outstanding, label: outstanding } }
    checks:
      - missing: [phone]
      - limit: { fields: [outstanding], max: creditLimit }
  - id: products
    entity: Product
    label: Items
    columns: [name, sku, stock, reorderLevel, price, nearestExpiry]
    filters: [active]
    checks:
      - limit: { fields: [stock], min: reorderLevel }
      - expiring: { date: nearestExpiry, days: 30 }
