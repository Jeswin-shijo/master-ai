# Ready-made pack: lenders in India (NBFCs, microfinance institutions, gold
# loan companies, co-operative banks). Built from RBI rules: the KYC Master
# Direction, the 2025 conduct, digital lending and gold-collateral directions,
# the microfinance framework, release of property documents (Sep 2023), the
# Internal Ombudsman and Integrated Ombudsman schemes, and the 2023 settlement
# framework. Agents prepare and track; people sanction, pay out and recover.
id: lender
version: 1.0.0
name: Lender (NBFC, microfinance, co-op bank)
description: Loan applications, missed EMIs, recovery and settlements, closures and papers, refunds, complaints and fraud alerts for NBFCs, microfinance institutions, gold loan companies and co-operative banks.
kind: industry
sector: finance-development
extends: [sector-finance-development]
match:
  keywords:
    - nbfc
    - non banking finance company
    - non-banking financial company
    - gold loan
    - gold loan company
    - gold finance
    - jewel loan
    - microfinance
    - microfinance institution
    - mfi
    - nbfc mfi
    - co-operative bank
    - cooperative bank
    - urban co-operative bank
    - urban cooperative bank
    - district central co-operative bank
    - lending company
    - money lending
    - moneylender
    - loan provider
    - two wheeler finance
    - vehicle finance
    - housing finance

labels:
  Customer: Borrower

entities:
  - name: Customer
    label: Borrower
    plural_label: Borrowers
    description: A person or firm that has applied for or holds a loan with us.
    title_field: name
    list_columns: [name, phone, branch, kycRisk, kycDueOn]
    fields:
      - { name: name, label: Full name, type: string, required: true }
      - { name: phone, label: Registered mobile, type: phone }
      - { name: email, label: Email, type: email }
      - { name: city, label: City or village, type: string }
      - name: source
        label: Came through
        type: enum
        options: [walk-in, field-officer, dsa, phone, whatsapp, website, app, referral, other]
      - { name: pan, label: PAN (or Form 60), type: string }
      - { name: ckycNumber, label: CKYC number, type: string }
      - name: kycRisk
        label: KYC risk
        type: enum
        options: [low, medium, high]
      - { name: kycDueOn, label: Next KYC update due, type: date }
      - { name: householdIncome, label: Yearly household income, type: money }
      - { name: branch, label: Home branch or centre, type: string }
      - { name: isRelatedParty, label: "Director, staff or their relative", type: boolean }
      - { name: notes, label: Notes, type: text }
  - name: Loan
    label: Loan
    plural_label: Loans
    title_field: loanNumber
    list_columns: [loanNumber, borrowerName, product, principalOutstanding, bucket, status]
    fields:
      - { name: loanNumber, label: Loan number, type: string, required: true }
      - { name: borrowerName, label: Borrower, type: string, required: true }
      - name: product
        label: Product
        type: enum
        required: true
        options: [personal, gold, two-wheeler, vehicle, group-microfinance, crop, business, property, housing, other]
      - { name: amountAsked, label: Amount asked, type: money }
      - { name: amountSanctioned, label: Sanctioned amount, type: money }
      - { name: apr, label: Interest rate (APR %), type: number }
      - { name: tenureMonths, label: Tenure (months), type: integer }
      - { name: emi, label: EMI, type: money }
      - { name: sanctionedBy, label: Sanctioned by, type: string }
      - { name: disbursedOn, label: Disbursed on, type: date }
      - { name: principalOutstanding, label: Principal outstanding, type: money }
      - { name: daysPastDue, label: Days past due, type: integer }
      - name: bucket
        label: Overdue bucket
        type: enum
        options: [regular, sma-0, sma-1, sma-2, npa]
      - name: status
        label: Status
        type: enum
        required: true
        options: [applied, sanctioned, declined, disbursed, closed, settled, written-off]
      - { name: onHold, label: On hold (fraud or harassment check), type: boolean }
      - { name: closedOn, label: Closed on, type: date }
  - name: Repayment
    label: EMI and repayment
    plural_label: EMIs and repayments
    title_field: loanNumber
    list_columns: [loanNumber, dueDate, amountDue, amountPaid, status]
    fields:
      - { name: loanNumber, label: Loan number, type: string, required: true }
      - { name: borrowerName, label: Borrower name, type: string }
      - { name: borrowerPhone, label: Borrower phone, type: phone }
      - { name: dueDate, label: Due date, type: date, required: true }
      - { name: amountDue, label: Amount due, type: money }
      - { name: amountPaid, label: Amount paid, type: money }
      - { name: paidAt, label: Paid at, type: datetime }
      - name: mode
        label: Paid by
        type: enum
        options: [nach, upi, cash, branch, cheque, other]
      - { name: bounceReason, label: Bounce reason, type: string }
      - { name: penalCharge, label: Penal charge, type: money }
      - { name: promiseToPayOn, label: Promised payment date, type: date }
      - { name: receiptNumber, label: Receipt number, type: string }
      - name: status
        label: Status
        type: enum
        required: true
        options: [due, paid, part-paid, bounced, promised]
  - name: Collateral
    label: Security
    plural_label: Securities
    description: Gold, property papers or a vehicle held against a loan.
    title_field: description
    list_columns: [loanNumber, securityType, description, value, status]
    fields:
      - { name: loanNumber, label: Loan number, type: string, required: true }
      - name: securityType
        label: Type
        type: enum
        required: true
        options: [gold, property, vehicle, deposit, machinery, other]
      - { name: description, label: Description, type: text, required: true }
      - { name: value, label: Value, type: money }
      - { name: valuedOn, label: Valued on, type: date }
      - { name: goldNetWeightGrams, label: Gold net weight (grams), type: number }
      - { name: goldCarat, label: Gold purity (carat), type: number }
      - { name: packetNumber, label: Gold packet or seal number, type: string }
      - { name: originalsKeptAt, label: Originals kept at, type: string }
      - { name: chargeRegistered, label: "Charge registered (CERSAI, RTO, ROC)", type: boolean }
      - name: status
        label: Status
        type: enum
        required: true
        options: [held, release-due, returned, auctioned, sold]
      - { name: returnedOn, label: Returned to borrower on, type: date }

tools:
  - name: borrowers.search
    description: Search borrowers by name, mobile, PAN, branch or KYC due date.
    uses: records.search
    with: { entity: Customer }
  - name: borrower.update
    description: Update a borrower's address, mobile, email or KYC dates after the change has been verified.
    uses: records.update
    with: { entity: Customer }
  - name: loans.search
    description: Search loans by number, borrower, product, overdue bucket or status.
    uses: records.search
    with: { entity: Loan }
  - name: loan.prepare
    description: Open a loan application file with the product and amount asked. It stays "applied" until the sanctioning authority decides.
    uses: records.create
    with: { entity: Loan, data: { status: applied } }
  - name: loan.hold
    description: Put a loan on hold so nothing is paid out and no collection contact is made while a person looks into a fraud or harassment report. Only a person lifts the hold.
    uses: records.update
    with: { entity: Loan, patch: { onHold: true } }
  - name: repayments.search
    description: Search EMIs and repayments by loan number, due date or status.
    uses: records.search
    with: { entity: Repayment }
  - name: promise.record
    description: Record a borrower's promise to pay on an EMI, with the date they gave.
    uses: records.update
    with: { entity: Repayment, patch: { status: promised } }
  - name: collateral.search
    description: Search gold packets, property papers and vehicles held against loans.
    uses: records.search
    with: { entity: Collateral }

agents:
  - role: loan-desk
    name: Loan desk
    description: Collects documents, runs the KYC, CKYC and credit bureau checks, drafts the appraisal note, Key Facts Statement and sanction letter for the sanctioning authority, keeps applicants updated, and handles closures, statements, certificates and detail changes.
    job:
      mission: "Collect documents, run KYC and credit checks, draft the appraisal note and sanction letter for the sanctioning authority and keep applicants updated."
      customer_facing: true
      never:
        - "Credit decisions and underwriting exceptions"
        - "KYC and AML decisions"
        - "Money movement"
        - "Regulated advice"
    instructions: Never mark a loan sanctioned, declined or disbursed, and never promise a loan or an amount; only the sanctioning authority decides and operations pays out. Quote the loan number in everything you write. Never ask for a full Aadhaar number in a message, and keep it masked.
    autonomy: 3
    tools: [borrowers.search, borrower.update, loans.search, loan.prepare, collateral.search, records.search, knowledge.search, document.generate, message.draft, message.send, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }
  - role: collections-desk
    name: Collections desk
    description: Follows up missed EMIs with polite reminders and payment links, records promises to pay, prepares notices, settlement letters and the recovery file for the credit committee, and hands calls and visits to the collection officer by phone.
    job:
      mission: "Follow up missed EMIs with polite reminders, record promises to pay and prepare notices and the recovery file."
      customer_facing: true
      never:
        - "Moving money itself"
        - "Settlement decisions"
        - "Account freezes"
        - "Threats or harassment of borrowers"
    instructions: Contact borrowers only between 8 am and 7 pm (microfinance 9 am to 6 pm). Never threaten or shame anyone, and never contact relatives, neighbours or the employer. Never start a repossession, auction or legal case and never agree a settlement; prepare the file for the credit committee. If a borrower says they were harassed or threatened, stop all contact on that loan and hand it to a person.
    autonomy: 3
    tools: [loans.search, repayments.search, promise.record, collateral.search, records.search, knowledge.search, document.generate, message.draft, message.send, payment.request, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 120000, money_per_task_inr: 0, max_steps: 25 }
  - role: grievance-desk
    name: Complaints and fraud desk
    description: Logs and acknowledges complaints, pulls loan records, call recordings and visit logs, tracks the 30-day reply and credit bureau corrections, drafts replies with the RBI Ombudsman details, puts loans on hold during harassment or fraud checks, and drafts the reports the compliance officer files.
    job:
      mission: "Log and acknowledge complaints, pull loan records, track reply deadlines and draft replies and compliance reports."
      customer_facing: true
      never:
        - "Account freezes without approval"
        - "Suspicious transaction reports"
        - "Credit decisions and underwriting exceptions"
        - "Regulated advice"
    instructions: Never close a complaint and never call anyone a fraud; the grievance officer signs every reply and the compliance officer decides fraud action. Put the loan on hold at once when a borrower reports harassment, threats or a loan they never took. Keep the name of anyone who reports staff wrongdoing private.
    autonomy: 2
    tools: [borrowers.search, loans.search, repayments.search, collateral.search, loan.hold, records.search, knowledge.search, document.generate, message.draft, message.send, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 120000, money_per_task_inr: 0, max_steps: 25 }

workflows:
  - id: loan-disbursal
    name: Small loan documents and disbursal
    description: After the sanction decision, get the papers signed, have operations pay the right account and set up the EMIs; tell a declined applicant why.
    keywords: [personal loan, gold loan, group loan, jlg, sanction, disbursal, key facts statement]
    steps:
      - key: papers
        title: Prepare the papers for signing
        agent: loan-desk
        instructions: If the loan was declined, draft the letter giving the main reason. If sanctioned, prepare the sanction letter, the Key Facts Statement in the borrower's language and the loan agreement exactly as sanctioned, and send the borrower the time and place to sign.
      - key: disburse
        title: Hand the disbursal to operations
        agent: loan-desk
        depends_on: [papers]
        instructions: Once the papers are signed, hand the disbursal to the operations officer by phone with the loan number, amount and the borrower's verified own bank account (or the dealer or college for an end-use loan), and confirm the EMI mandate is registered.
      - key: welcome
        title: Send the repayment schedule
        agent: loan-desk
        depends_on: [disburse]
        instructions: When operations confirms the money reached the account, send the borrower the repayment schedule, the EMI date and the grievance officer's contact, and file the signed papers with the loan.
  - id: secured-loan-disbursal
    name: Business or property loan release
    description: Complete the sanction conditions and security, then have operations release the money.
    keywords: [business loan, loan against property, home loan, working capital, mortgage, security creation]
    steps:
      - key: conditions
        title: Track the sanction conditions and security
        agent: loan-desk
        instructions: List the sanction conditions, the legal and valuation reports, the mortgage or hypothecation papers to sign and the CERSAI registration, and hand the collection of missing papers to the credit officer by phone.
      - key: release
        title: Hand the release to operations
        agent: loan-desk
        depends_on: [conditions]
        instructions: When every condition is met and the security is created, hand the release to the operations officer by phone with the amount and the borrower's or seller's verified bank account, then send the borrower the Key Facts Statement copy and repayment schedule.
  - id: emi-follow-up
    name: Missed EMI follow-up
    description: Remind politely, take a promise to pay, re-present the mandate and send the collection officer when needed.
    keywords: [missed emi, bounce, nach return, overdue, promise to pay, reminder]
    steps:
      - key: remind
        title: Check the dues and remind
        agent: collections-desk
        instructions: Confirm the overdue amount and days past due, check it was not already paid by UPI or at the branch, then send a polite reminder with a payment link between 8 am and 7 pm and record any promise to pay.
      - key: call-or-visit
        title: Hand calls or visits to the collection officer
        agent: collections-desk
        depends_on: [remind]
        instructions: If there is no payment or promise in 3 days, hand a call or visit to the collection officer by phone with the dues and the contact hours. For microfinance, collect at the centre; a home visit only after two missed meetings in a row. Flag hardship (job loss, illness, death in the family) to the branch manager for a restructuring talk.
  - id: recovery-file
    name: Recovery or settlement file
    description: Prepare the account file and notices for the credit committee, then hand the approved step to the collections team.
    keywords: [npa, repossession, settlement, one time settlement, sarfaesi, legal notice, auction, restructuring]
    steps:
      - key: file
        title: Prepare the account file and notice
        agent: collections-desk
        instructions: Build the file with days past due, the NPA date, payments, past notices and the latest security value, and draft the notice the loan agreement or SARFAESI needs, or the settlement letter with the amount and pay-by date, for the credit committee.
      - key: act
        title: Hand the approved step to the collections team
        agent: collections-desk
        depends_on: [file]
        instructions: After approval, hand the step to the collections head by phone. Notices are served first; repossession only in daytime with the borrower's signed inventory and the local police told; gold auctions only after notice. Report a settled loan to the credit bureaus as settled.
  - id: loan-closure
    name: Loan closure and papers
    description: Give the closing amount, issue the NOC, return papers or gold and remove our charge on time.
    keywords: [noc, foreclosure, closure, original documents, release gold, form 35]
    steps:
      - key: statement
        title: Closing amount, NOC and closure letter
        agent: loan-desk
        instructions: Confirm the dues are zero or prepare the exact foreclosure amount with no charge where none is allowed, then prepare the NOC and closure letter and note the deadline, 30 days for papers and 7 working days for gold.
      - key: return
        title: Hand back the papers or gold
        agent: loan-desk
        depends_on: [statement]
        instructions: Hand the return of the original papers or gold to the branch team by phone, at the branch the borrower chose, against the borrower's signature. Draft the charge removal (CERSAI, sub-registrar, ROC or Form 35 for the RTO) and tell the credit bureaus the loan is closed.
  - id: account-service
    name: Account service and refunds
    description: Make statements and certificates, update verified details, and prepare refunds or waivers for operations to pay.
    keywords: [statement, interest certificate, address change, mandate change, refund, waiver]
    steps:
      - key: serve
        title: Do the service or prepare the refund
        agent: loan-desk
        instructions: Confirm the request came from the borrower (OTP on the registered mobile or a signed request). Make the statement or certificate and send it only to the registered email or address; update a changed detail only after checking the document. For a refund or waiver, check it in the loan and bank records and prepare the voucher; after approval, hand the payment to operations by phone, to the borrower's own bank account only.
  - id: complaint-handling
    name: Complaint handling
    description: Log, protect the borrower, find the facts, put it right and send the final reply within 30 days.
    keywords: [complaint, grievance, recovery agent, harassment, cibil, ombudsman]
    steps:
      - key: log
        title: Log, acknowledge and protect
        agent: grievance-desk
        instructions: Acknowledge the complaint the same day with its number and the reply date. If it says a recovery agent or staff member threatened, abused or harassed the borrower or came at odd hours, put the loan on hold and hand stopping the agent to the collections head by phone the same day.
      - key: facts
        title: Get the facts and draft the reply
        agent: grievance-desk
        depends_on: [log]
        instructions: Pull the loan records, receipts, call recordings and visit logs, and ask the staff member or agency for their side. Send corrected data to the credit bureaus within 21 days for bureau errors. Draft the final reply for the grievance officer; if any part is rejected, it names the RBI Ombudsman (cms.rbi.org.in, 14448), after the Internal Ombudsman has seen it where that applies.
  - id: fraud-response
    name: Fraud response
    description: Stop the loss, keep the evidence and prepare the reports for the compliance officer.
    keywords: [fraud, fake gold, forged, identity theft, without receipt, suspicious]
    steps:
      - key: contain
        title: Stop the loss and keep the evidence
        agent: grievance-desk
        instructions: Put the loan on hold, list the evidence to keep (documents, gold packets, call recordings, visit logs, bank trail) and hand stopping any payment or sealing the gold packets to the branch manager by phone.
      - key: report
        title: Draft the reports
        agent: grievance-desk
        depends_on: [contain]
        instructions: Draft the police complaint where money is lost, the suspicious transaction report for the principal officer (due within 7 working days of deciding), the show-cause notice giving at least 21 days to reply before anyone is called a fraud, and the reply to the customer.

lifecycle:
  case: { label: Loan case, plural: Loan cases, prefix: LN }
  stages:
    request:
      name: Case received
      description: A loan application, missed EMI, closure or service request, complaint or system alert (such as a bounced EMI) comes in from a borrower, field staff, a DSA or the loan system, gets a case number and is acknowledged.
    review:
      name: KYC and document check
      description: Agents and staff check the person's identity, documents, credit bureau report and loan records, and ask for anything missing before the case moves on.
      checks:
        - "Identity verified: Aadhaar e-KYC or offline check (number kept masked), DigiLocker, video KYC or an officially valid document, plus PAN or Form 60"
        - CKYC searched and every name checked against the UN and Indian sanctions lists
        - Credit bureau report pulled (for microfinance, for the whole household)
        - "Eligibility met: income, existing loans and overdues; microfinance income and lender limits; gold value and purity"
        - All documents for the product received and readable
        - Loan account, dues and payments confirmed for repayment, closure, service and complaint cases
    classify:
      name: Risk grade and priority
      description: The case gets its type, risk grade, priority, due date and owning desk (credit, collections, operations, grievance cell or compliance), which starts the response clock.
    assign:
      name: Assign officer and deadline
      description: The branch or head office names the credit officer, field officer, collection officer or grievance handler responsible and sets the deadline, ahead of any RBI time limit.
    approve:
      name: Sanction or approval
      description: The authorised person decides within their delegated power, never the person who prepared the file. The credit manager sanctions small loans, the credit committee business and property loans, recovery and settlements, the branch manager larger refunds and waivers, the compliance officer fraud action; the Board takes what is above the committee and loans to directors or their relatives.
      checks:
        - Approver is within their delegated power and took no part in preparing the file
        - "Related party (director, staff or their relative): sent to the Board"
        - "Settlement: approver is at least one level above whoever sanctioned the loan"
    execute:
      name: Disburse and follow up
      description: The team and agents carry out the decision and track it, whether signing the Key Facts Statement and paying out, reminders and visits, notices, refunds, or returning papers and gold.
      checks:
        - Signed Key Facts Statement on file before any money goes out
        - "Money paid only into the borrower's own bank account, or straight to the seller for an end-use loan; never in cash for ₹20,000 or more"
        - "Collection contact only from 8 am to 7 pm (microfinance 9 am to 6 pm), with no threats"
    close:
      name: Final check and close
      description: Someone other than the person who did the work checks the outcome, the named role signs off, the borrower gets a written reply and the case is closed.
      checks:
        - "Loan papers signed and filed: sanction letter, signed Key Facts Statement, loan agreement"
        - Money reached the right account and the EMI mandate is active
        - Loan system, receipts and bank records match
        - "Closures: dues zero, NOC issued, papers or gold returned on time, charge removed, credit bureaus told"
        - "Complaints: final written reply within 30 days, with the RBI Ombudsman details if not fully resolved"
    report:
      name: Reports and portfolio review
      description: Daily and monthly reports track collections, overdue buckets (SMA and NPA), time to disburse, complaints and repeat problems; credit bureau uploads and RBI returns go out on time and the board reviews them.
      checks:
        - Collection efficiency, PAR 30 and NPA reviewed by branch
        - Papers or gold returned late, and the compensation paid, listed
        - Complaints about recovery agents counted by agency
  priorities:
    - { id: P1, name: "Urgent: borrower or money at risk", respond_within_hours: 1, resolve_within_hours: 48 }
    - { id: P2, name: "High: RBI deadline or penalty at stake", respond_within_hours: 4, resolve_within_hours: 168 }
    - { id: P3, name: Normal, respond_within_hours: 24, resolve_within_hours: 240 }
    - { id: P4, name: Low, respond_within_hours: 48, resolve_within_hours: 360 }
  roles:
    - { id: credit-manager, name: Credit manager (sanctioning officer), approves: "Sanctions or declines personal, gold, vehicle, crop and group loans within the delegated power; in a gold loan branch, the branch head who holds that power" }
    - { id: credit-committee, name: Credit committee (loan committee in a co-op bank), approves: "Sanctions business, housing and property loans and policy exceptions; approves restructuring, repossession, auctions, legal action and settlements" }
    - { id: branch-manager, name: Branch manager, approves: "Refunds and charge waivers above ₹5,000, within the board's waiver policy" }
    - { id: operations-manager, name: Operations manager, approves: "Signs off disbursals and closures: money in the right account, papers filed, NOC issued, papers or gold returned" }
    - { id: collections-head, name: Collections head, approves: "Signs off recovery and settlement cases: notice served, repossession or auction done by the rules, money received, credit bureaus told" }
    - { id: grievance-officer, name: Grievance redressal officer, approves: "Signs off every complaint reply; sends complaints we would partly or fully reject to the Internal Ombudsman first, where that rule applies" }
    - { id: compliance-officer, name: Compliance officer (PMLA principal officer), approves: "Fraud classification and reports to FIU-IND, the police or RBI, and action against staff or recovery agents after a harassment or threat complaint" }
  urgent_keywords: [fraud, fraudulent, forged, forgery, fake gold, spurious gold, scam, phishing, hacked, data leak, leaked, theft, stolen, robbery, burglary, dacoity, embezzlement, misappropriation, siphoned, unauthorised transaction, unauthorized transaction, threatened, threatening, threat, dhamki, harassment, harassed, harassing, abused, abusing, assaulted, beaten, manhandled, goons, morphed, suicide, end my life, fire, injured, injury]
  categories:
    - id: small-loan
      name: Personal, gold, vehicle or group loan
      keywords: [personal loan, gold loan, jewel loan, nagai kadan, loan on gold, loan against gold, pledge my gold, two wheeler loan, bike loan, scooty loan, car loan, used car loan, consumer durable loan, education loan, crop loan, kcc, kisan credit card, group loan, jlg, jlg loan, joint liability group, shg loan, microfinance loan, mfi loan, new member, cgt, grt, need a loan, need loan, want a loan, give me a loan, get a loan, require a loan, loan required, loan needed, loan chahiye, loan application, apply for a loan, top up loan, salary loan]
      priority: P3
      risk: medium
      department: Credit
      required_details:
        - key: identity
          label: Identity proof or KYC
          kind: keywords
          keywords: [kyc, ekyc, e-kyc, ckyc, video kyc, aadhaar, aadhar, pan, pan card, form 60, voter id, passport, driving licence, driving license, digilocker, job card]
      required_checks:
        - "KYC: Aadhaar e-KYC, DigiLocker, video KYC or a valid ID, plus PAN or Form 60; CKYC searched and sanctions lists checked"
        - "Credit bureau report checked (microfinance: the whole household)"
        - "Microfinance: household income up to ₹3 lakh a year and all loan EMIs within 50% of monthly household income; at most 3 microfinance lenders including us and ₹2 lakh in all (MFIN)"
        - House or business visit; group training and group test (CGT and GRT) for group loans
        - "Gold: tested in front of the borrower; loan within 85% of the gold value up to ₹2.5 lakh, 80% up to ₹5 lakh, 75% above"
        - Key Facts Statement given in the borrower's language and signed
      not_eligible:
        - keywords: [3 microfinance loans, three microfinance loans, 4 microfinance loans, four microfinance loans, 3 running microfinance loans, three running microfinance loans, 4 running microfinance loans, 3 active microfinance loans, three active microfinance loans, 3 live microfinance loans, 3 mfi loans, three mfi loans, 4 mfi loans, 3 running mfi loans, 3 active mfi loans, 3 microfinance lenders, three microfinance lenders, 3 mfi lenders, three mfi lenders, 4th mfi lender, fourth mfi lender, 4th microfinance lender, more than 3 microfinance lenders, more than 3 mfi lenders, mfin cap, mfin limit, microfinance loans above 2 lakh, mfi loans above 2 lakh, household income above 3 lakh, household income more than 3 lakh, household income is above 3 lakh]
          reason: "A microfinance loan is only for households earning up to ₹3 lakh a year, and MFIN members lend only where the borrower has at most 3 microfinance lenders including us and owes up to ₹2 lakh in all. Tell the applicant the reason kindly; a different product may fit."
