playbooks:
  - id: kyc-before-loan
    title: KYC before any loan
    source: RBI Master Direction - Know Your Customer (KYC) Direction, 2016, as updated; Prevention of Money-laundering (Maintenance of Records) Rules, 2005
    body: |
      1. Verify identity before any loan: Aadhaar e-KYC or offline verification (with consent, number stored masked), DigiLocker, video KYC or another officially valid document, plus PAN or Form 60.
      2. Search CKYC with the customer's consent before asking for papers again. Upload a new customer's KYC to CKYC within 10 days and send any change within 7 days.
      3. Check every applicant, co-applicant and guarantor against the UN and Indian sanctions lists. On a match, stop and tell the principal officer the same day.
      4. For a firm or company, take its PAN, registration or partnership deed, GST registration where it has one, and the KYC of the people who own and run it.
      5. Grade each borrower low, medium or high risk, and refresh KYC at least every 10, 8 and 2 years respectively, and whenever details change.
      6. If someone will not give ID or the money does not fit the person, tell the principal officer, never the customer.
      7. Keep KYC and loan records for at least 5 years after the loan is closed.
  - id: fair-sanction-disbursal
    title: Fair sanction and disbursal
    source: RBI (Non-Banking Financial Companies - Responsible Business Conduct) Directions, 2025; RBI (Digital Lending) Directions, 2025; RBI circular on the Key Facts Statement for loans, 15 Apr 2024; RBI circular on penal charges in loan accounts, 18 Aug 2023; Income-tax Act, section 269SS
    body: |
      1. Acknowledge every loan application in writing and say when to expect a decision.
      2. Before the borrower signs, give the Key Facts Statement in a language they understand, with the APR, every fee and the repayment schedule. Keep it valid for at least 3 working days (1 working day for loans under 7 days) and file the signed copy. Charge nothing that is not in it.
      3. Only the sanctioning authority decides, within their delegated power and never on a file they prepared. Loans to directors, staff or their relatives go to the Board. Tell a declined applicant the main reason in writing.
      4. Pay the loan only into the borrower's own bank account, or straight to the seller for an end-use loan (vehicle dealer, builder, college). Never through an agent's or another person's account, and never in cash for ₹20,000 or more.
      5. Digital loans: give a cooling-off period of at least 1 day in which the borrower can leave by repaying the principal and the proportionate APR with no penalty, never raise a credit limit without consent, and collect only the data the loan needs.
      6. Late payment brings only the penal charges shown in the Key Facts Statement. Never add them to the principal or charge interest on them.
  - id: microfinance-and-gold-limits
    title: Microfinance and gold loan limits
    source: RBI Master Direction - Regulatory Framework for Microfinance Loans, 2022; MFIN Guardrails 2.0 (from 1 April 2025); RBI (Lending Against Gold and Silver Collateral) Directions, 2025
    body: |
      1. A microfinance loan is a loan without security to a household earning up to ₹3 lakh a year. All the household's loan EMIs, ours included, must stay within 50% of its monthly income. Check the bureau report for the whole household before every loan.
      2. MFIN members also lend only when the borrower has at most 3 microfinance lenders including us and owes no more than ₹2 lakh in all. If a limit is crossed, decline kindly and say why.
      3. No prepayment penalty on any microfinance loan. Collect at the agreed centre; visit the home or workplace only after the borrower misses two centre meetings in a row.
      4. Gold loans: test the gold in front of the borrower and value it at the lower of the 30-day average and the previous day's price of 22 carat gold. Lend at most 85% of the value up to ₹2.5 lakh, 80% up to ₹5 lakh and 75% above.
      5. Lend only against gold jewellery and small bank-sold coins (up to 1 kg of jewellery and 50 g of coins per borrower). Never lend against bars, bullion, gold ETFs or digital gold, and never lend to buy gold.
      6. Return pledged gold the same day the loan is closed where possible and within 7 working days at most; after that we pay ₹5,000 a day.
      7. Before an auction, send notice to the borrower. Hold the first auction in the branch's district at a reserve price of at least 90% of the current value (85% after two failed auctions), and refund any surplus within 7 working days.
  - id: lawful-collection
    title: Collect politely and lawfully
    source: RBI (Non-Banking Financial Companies - Responsible Business Conduct) Directions, 2025; RBI circular on recovery agents, 12 Aug 2022; RBI Master Direction on microfinance loans, 2022; RBI framework for compromise settlements and technical write-offs, 8 Jun 2023; SARFAESI Act, 2002, section 13(2); Supreme Court, ICICI Bank v. Prakash Kaur (2007)
    body: |
      1. Call or visit only between 8 am and 7 pm (microfinance: 9 am to 6 pm), and not during a death, illness or wedding in the family.
      2. No threats, abuse, shaming or force, and no calls to relatives, friends, neighbours or the employer. Never use muscle power to recover a loan.
      3. A recovery agent carries an ID card, our authorisation letter and a copy of the notice, and the borrower gets the agent's and our contact details.
      4. Before any repossession, send the written notice the loan agreement asks for, with a last chance to pay. Repossess only in daytime and never by force, list everything taken in an inventory the borrower signs, and tell the local police station.
      5. SARFAESI is for secured loans of ₹20 lakh and above (for NBFCs with ₹100 crore or more in assets); the 13(2) notice gives the borrower 60 days.
      6. Restructuring, settlement, repossession and legal action need the credit committee. A settlement approver sits at least one level above whoever sanctioned the loan; loans the committee or the MD sanctioned, and fraud or wilful-defaulter accounts, go to the Board. Report a settled loan to the credit bureaus as settled.
      7. If a borrower complains of harassment, stop all collection contact on that loan at once and raise it as a P1 complaint.
  - id: closure-and-papers
    title: Close loans and return papers on time
    source: RBI circular RBI/2023-24/60 on release of movable and immovable property documents, 13 Sep 2023; RBI (Non-Banking Financial Companies - Responsible Business Conduct) Directions, 2025; RBI (Pre-payment Charges on Loans) Directions, 2025; RBI (Lending Against Gold and Silver Collateral) Directions, 2025
    body: |
      1. When the loan is fully paid or settled, issue the NOC and return every original document within 30 days, at the branch where the loan was serviced or another office the borrower prefers where the papers are kept.
      2. Remove our charge (CERSAI, sub-registrar, ROC, or the RTO through Form 35 for vehicles) within the same 30 days.
      3. If we are late for reasons on our side, pay the borrower ₹5,000 for each day of delay and say why. If papers are lost, help get certified copies at our cost within another 30 days.
      4. Return pledged gold the same day where possible and within 7 working days at most (₹5,000 a day after that).
      5. No foreclosure charge on floating-rate loans to individuals for non-business use or on any microfinance loan. Give the exact foreclosure amount in writing.
      6. If the borrower has died, return the papers to the legal heirs under our written procedure.
      7. Tell every credit bureau the loan is closed in the next upload.
  - id: complaints-in-30-days
    title: Answer every complaint within 30 days
    source: RBI Internal Ombudsman Directions for NBFCs (2023, as reissued); RBI Integrated Ombudsman Scheme, 2021; RBI framework for compensation on credit information complaints, RBI/2023-24/72, 26 Oct 2023
    body: |
      1. Log every complaint from any channel with a complaint number, and acknowledge it the same day in the borrower's language where possible.
      2. A recovery agent or staff member who threatened, abused or harassed a borrower, or came at odd hours, is a serious complaint and is raised to P1. Stop collection contact on the loan the same day and take the agent off it; the compliance officer decides the action against the agent or agency.
      3. Get the facts: loan records, receipts, call recordings and visit logs, and the staff member's side.
      4. Fix what is wrong first (reverse a wrong charge, correct a record) and tell the borrower what you did.
      5. Credit bureau errors: send corrected data to the bureau within 21 days. After 30 days in all, we owe ₹100 a day.
      6. Before rejecting a complaint fully or in part, send it to the Internal Ombudsman within 20 days, where that rule applies to us.
      7. Send a final written reply within 30 days, signed off by the grievance redressal officer. A reply that does not fully resolve it names the RBI Ombudsman (cms.rbi.org.in, toll-free 14448).
      8. Money lost through forgery, a fake receipt or a loan the person never took is a fraud alert, not a complaint.

kpis:
  - id: collection-efficiency
    name: Collection efficiency
    description: EMI money collected this month as a share of EMI money due this month, not counting advance payments or old arrears.
    unit: percent
    direction: up
    target: 98
  - id: par-30
    name: Portfolio at risk (30+ days)
    description: Principal outstanding on loans with any payment more than 30 days late, as a share of all principal outstanding.
    unit: percent
    direction: down
    target: 4
  - id: gross-npa
    name: Gross NPA
    description: Principal outstanding on loans more than 90 days overdue, as a share of all loans outstanding.
    unit: percent
    direction: down
    target: 3
  - id: time-to-disburse
    name: Time to disburse
    description: Average hours from a complete loan file to money in the borrower's bank account.
    unit: hours
    direction: down
    target: 168
  - id: papers-on-time
    name: Papers and gold returned on time
    description: Closed loans whose original papers came back within 30 days (gold within 7 working days), as a share of all loans closed in the month.
    unit: percent
    direction: up
    target: 100

routines:
  - id: cash-collections
    name: Cash collections
    description: The AI calls the field officer each evening and adds the day's cash collections to the Repayments list.
    days: [1, 2, 3, 4, 5, 6]
    time: '18:30'
    collect:
      list: repayments
      ask: [loanNumber, borrowerName, amountPaid, receiptNumber]
      defaults: { mode: cash, status: paid, paidAt: now, dueDate: today }
      who: the field officer

registers:
  - id: repayments
    entity: Repayment
    label: Repayments
    columns: [loanNumber, borrowerName, dueDate, amountDue, amountPaid, status, promiseToPayOn]
    filters: [status, mode]
    date_field: dueDate
    totals: [amountDue, amountPaid, penalCharge]
    card: { sum: { field: amountDue, when: { status: [due, bounced, part-paid, promised] }, label: outstanding } }
    checks:
      - limit: { fields: [amountPaid], max: amountDue }
      - overdue: { date: dueDate }
        when: { status: [due, bounced, part-paid] }
      - overdue: { date: promiseToPayOn }
        when: { status: [promised] }
        why: promise date passed
      - missing: [receiptNumber]
        when: { mode: [cash], status: [paid, part-paid] }
    follow_ups:
      - id: missed-repayments
        label: Missed repayments → the borrower
        who: party
        due: { overdue: { date: dueDate, grace_days: 1 } }
        when: { status: [due, bounced, part-paid] }
        phone: { field: borrowerPhone }
        contact: { field: borrowerName }
        about: [loanNumber, dueDate, amountDue]
        find_out: [status, amountPaid, mode]
        hours: { start: '08:00', end: '19:00' }
      - id: broken-promises
        label: Broken promises → the borrower
        who: party
        due: { overdue: { date: promiseToPayOn } }
        when: { status: [promised] }
        phone: { field: borrowerPhone }
        contact: { field: borrowerName }
        about: [loanNumber, dueDate, amountDue]
        find_out: [status, amountPaid, mode]
        hours: { start: '08:00', end: '19:00' }
  - id: loans
    entity: Loan
    label: Loans
    columns: [loanNumber, borrowerName, product, amountSanctioned, principalOutstanding, bucket, status]
    filters: [product, bucket, status]
    date_field: disbursedOn
    totals: [amountSanctioned, principalOutstanding]
    card: { sum: { field: principalOutstanding, label: outstanding } }
    checks:
      - limit: { fields: [amountSanctioned], max: amountAsked }
      - missing: [sanctionedBy]
        when: { status: [sanctioned, disbursed] }
      - duplicate: [loanNumber]
  - id: collateral
    entity: Collateral
    label: Collateral
    columns: [loanNumber, securityType, value, valuedOn, packetNumber, status]
    filters: [securityType, status]
    date_field: valuedOn
    totals: [value]
    card: { sum: { field: value, when: { status: [held] }, label: held } }
    checks:
      - missing: [chargeRegistered, originalsKeptAt]
        when: { securityType: [property] }
      - missing: [packetNumber]
        when: { securityType: [gold] }
