playbooks:
  - id: sector-cert-in-reporting
    title: Cyber incidents and CERT-In reporting
    source: CERT-In Directions under section 70B(6) of the IT Act, 2000 (No. 20(3)/2022-CERT-In, 28 April 2022, in force 27 June 2022) and CERT-In FAQs, May 2022; IT Act section 70B(7)
    body: |
      1. Treat every suspected attack, leak or hacked account as P1 from the moment anyone notices it. The 6-hour clock starts then, not when it is confirmed.
      2. Stop the damage first: take the device or server off the network, reset passwords, revoke keys and tokens, remove unknown admins and block the attacker's IP address or sender. Do not wipe anything yet.
      3. Keep the evidence: logs, screenshots, the phishing email with its headers and copies of changed files. Keep logs of all systems for a rolling 180 days in India, with system clocks synced to the NIC or NPL time servers.
      4. Report to CERT-In within 6 hours of noticing it (incident@cert-in.org.in, or the helpline 1800-11-4949) with whatever you know, and send the rest later. Reportable incidents include unauthorised access, ransomware and other malware, phishing, data breaches and leaks, website defacement, DDoS and attacks on servers, cloud systems and apps.
      5. The security lead is the named CERT-In point of contact and approves the report before it goes.
      6. When the system belongs to a client, tell the client in writing at once and agree who files the report. Whoever notices the incident must make sure it is reported; a contract cannot pass this duty away. Keep the report and the acknowledgement on the ticket.
      7. Where money was stolen, also report it on cybercrime.gov.in or call 1930 at once so the bank can try to freeze it.
      8. Find the way in and close it, restore from a clean backup, and hold a blameless review within 5 working days, with each fix given to a named person and a date.
      9. Not reporting, or not giving CERT-In the information it asks for, can mean up to 1 year in jail, a fine of up to ₹1 lakh, or both.
  - id: sector-change-approval
    title: Changes to live systems
    source: ITIL 4 change enablement practice; common release practice in Indian software, IT services and agency teams
    body: |
      1. Every change to a live website, app, server, network or client system gets a ticket, even a small one.
      2. Know the three kinds. Standard changes are low risk, done often and pre-approved from a written list. Normal changes need the engineering manager's OK before work starts. Emergency changes, to end an outage or close a security hole, get a quick OK by phone and are written up within 1 working day.
      3. Write the plan: what and why, systems and users affected, steps, how it will be tested, how to roll back, and the time window. A change to a client's own systems also needs the client's written OK.
      4. The person who made the change never approves it. Test it outside the live system, take a backup first, and have someone else review the code or settings.
      5. Tell users and clients about planned downtime at least 72 hours ahead, and avoid busy times: month-end and year-end closing, GST return dates, sale days and festival campaigns.
      6. After the change, check it in the live system and watch errors for the first hour. If errors rise, roll back first and find the cause after.
      7. Record every change that caused trouble and review them each month.
  - id: sector-dpdp-data-protection
    title: Personal data under the DPDP Act
    source: Digital Personal Data Protection Act, 2023 and DPDP Rules, 2025 (notified November 2025; breach and rights duties from May 2027); PIB explainer on the DPDP Rules, November 2025
    body: |
      1. Know whose data it is. For your own customers and staff you decide how data is used (you are the data fiduciary). For data you hold or process for a client, the client decides (you are their data processor): follow their written instructions and pass rights requests to them.
      2. Collect only what the work needs, with a clear notice and consent in plain words, and give people an easy way to withdraw consent.
      3. Protect it: access only for people who need it, MFA on admin accounts, encryption, backups and logs. Remove client data and access when a contract ends.
      4. Never use real customer data for testing or demos without masking it.
      5. On a personal data breach, tell each affected person without delay in plain words: what happened, the likely impact, what you have done and whom to contact. Tell the Data Protection Board without delay and send the full report within 72 hours. As a processor, tell the client at once so they can do this.
      6. Answer requests to see, correct, update or erase personal data within 90 days, and show a contact person for data questions on the website and in the app.
      7. The breach and rights duties apply from May 2027; start working this way now. Penalties go up to ₹250 crore for weak security and ₹200 crore for not reporting a breach.

kpis:
  - id: sla-met
    name: Tickets fixed within SLA
    description: Share of tickets closed this month within the fix time their priority or the client's contract allows.
    unit: percent
    direction: up
    target: 90
  - id: p1-restore-time
    name: Time to restore service
    description: Average hours from a P1 outage being raised to service working again for everyone.
    unit: hours
    direction: down
  - id: failed-changes
    name: Changes that went wrong
    description: Share of releases and changes this month that caused a fault or needed a rollback or an emergency fix.
    unit: percent
    direction: down
    target: 10
  - id: cert-in-on-time
    name: CERT-In reports within 6 hours
    description: Share of reportable security incidents this month reported to CERT-In within 6 hours of being noticed.
    unit: percent
    direction: up
    target: 100

