# Sector base for technology and innovation: software and SaaS companies, IT
# services and support firms, digital agencies and other tech businesses.
# Ready-made types extend it; typed-in types borrow the closest ready-made type
# (other_org_types) or use it directly.
id: sector-technology-innovation
version: 1.0.0
name: Technology & Innovation
description: Outages, security incidents, bugs, releases and changes, billing and client complaints for software and SaaS companies, IT services firms, digital agencies and other technology businesses.
kind: base
sector: technology-innovation
extends: [crm-base]

lifecycle:
  case: { label: Ticket, plural: Tickets, prefix: TKT }
  stages:
    request:
      name: Ticket or request raised
      description: A client, user, staff member, partner or monitoring alert raises a ticket by email, WhatsApp, phone, chat or the help desk, gets a ticket number and an acknowledgement.
    review:
      name: Check details and scope
      description: Support checks who is asking and for which account or contract, collects what is missing (screen, error text, steps, how many users), looks for duplicates and checks the work is within the agreed scope.
      checks:
        - Client or account found, with its contract, plan and support level
        - Request comes from an authorised person on that account (admin, named contact or written email)
        - "Enough to act on: what happened, where (app, page, system or device), since when, how many users, and a screenshot or error text"
        - Signs of an attack, a hacked account or leaked data? Open a security incident at once, because the CERT-In 6-hour clock is running
        - Not a duplicate of an open ticket, a known issue or a planned change
        - New work or extra changes are inside the agreed scope and price, or need a written quote first
    classify:
      name: Set priority and SLA
      description: The ticket gets its type, priority (P1 to P4), risk and owning team, which starts the response and fix clocks in the client's SLA.
    assign:
      name: Assign team and deadline
      description: The team lead names the engineer or team in charge and the deadline; P1 tickets page the on-call engineer at any hour, others wait for working hours.
    approve:
      name: Approval to go ahead
      description: The named approver says yes before the risky step, such as a release, a change to a live system, an emergency fix, a CERT-In report or a refund, and never approves their own work.
    execute:
      name: Build, fix and track
      description: The team and agents fix, build or change what is needed, keep the client and status page updated, and track time, cost, logs and SLA clocks.
    close:
      name: Confirm and close
      description: Someone other than the person who did the work checks the result in the live system, the person who raised it confirms, and the named role signs off.
      checks:
        - Fix or change checked in the live system by someone other than the person who made it
        - Person who raised it confirms it works, or did not reply after 3 working days of reminders
        - Client, users and the status page told it is resolved
        - Downtime recorded for the SLA report and any service credit worked out
        - Root-cause report sent within 5 working days for P1 and P2 tickets
        - CERT-In or other required report filed and the acknowledgement saved with the ticket
    report:
      name: Reports and reviews
      description: Each month the team reviews SLA misses, outages, security incidents, failed changes, complaints and repeat problems, sends clients their SLA reports and fixes the causes that keep coming back.
  priorities:
    - { id: P1, name: "Critical: down or under attack", respond_within_hours: 0.5, resolve_within_hours: 4 }
    - { id: P2, name: "High: many users blocked or client escalation", respond_within_hours: 2, resolve_within_hours: 24 }
    - { id: P3, name: Normal, respond_within_hours: 8, resolve_within_hours: 72 }
    - { id: P4, name: "Low: planned work and ideas", respond_within_hours: 24, resolve_within_hours: 240 }
  roles:
    - { id: engineering-manager, name: Engineering manager, approves: "Releases and changes to live systems, and emergency fixes, rollbacks or failover during an outage; signs off outages and changes" }
    - { id: security-lead, name: Security lead (CERT-In contact), approves: "Containment steps, the CERT-In report and breach notices to clients and affected people; signs off security incidents" }
    - { id: account-manager, name: Account manager, approves: "Replies to client complaints and escalations, and any promise of a date, discount or service credit" }
    - { id: finance-manager, name: Finance manager, approves: "Refunds, credit notes, waivers and service credits above ₹10,000" }
