# Ready-made pack: construction and infrastructure (builders and real estate
# developers, EPC contractors, road, bridge and civil works). Built from
# researched Indian practice: the Labour Codes (OSH Code 2020, Code on Wages
# 2019, Code on Social Security 2020) and state BOCW rules where a state has not
# yet notified its own, RERA 2016, IS 456:2000 and the Manual for Procurement of
# Works 2025. Labour rules are in transition: check each site's state rules.
id: construction
version: 1.0.0
name: Construction & infrastructure
description: Accidents, site hold-ups, quality problems, drawing queries, change orders, material indents, labour and wages, and snags and handover for builders, EPC contractors and road and civil works.
kind: industry
sector: energy-heavy-industry
extends: [sector-energy-heavy-industry, projects-base]
match:
  keywords:
    - construction
    - construction company
    - building construction
    - civil construction
    - civil contractor
    - civil works
    - building contractor
    - pwd contractor
    - builder
    - builders and developers
    - real estate developer
    - property developer
    - township developer
    - housing project
    - apartment builder
    - villa projects
    - epc contractor
    - epc company
    - infrastructure projects
    - infrastructure contractor
    - road contractor
    - road construction
    - highway contractor
    - bridge contractor

labels:
  Customer: Client

entities:
  - name: Project
    label: Project (site)
    plural_label: Projects (sites)
    title_field: name
    list_columns: [projectCode, name, clientName, status, dueDate]
    fields:
      - { name: name, label: Project name, type: string, required: true }
      - { name: projectCode, label: Project code, type: string }
      - name: projectType
        label: Type
        type: enum
        options: [housing, villas-and-plots, commercial, road-or-highway, bridge-or-flyover, industrial, water-and-sewerage, institutional, other]
      - { name: clientName, label: Client or authority, type: string }
      - { name: clientEmail, label: Client email, type: email }
      - { name: siteAddress, label: Site address or stretch, type: text }
      - { name: reraNumber, label: RERA registration number, type: string }
      - { name: labourRegistration, label: Site labour registration number, type: string }
      - { name: budget, label: Contract value or project cost, type: money }
      - { name: startDate, label: Start date, type: date }
      - { name: dueDate, label: Planned completion, type: date }
      - { name: workersOnSite, label: Workers on site, type: integer }
      - { name: ocReceivedOn, label: Occupancy or completion certificate received on, type: date }
      - name: status
        label: Status
        type: enum
        required: true
        options: [proposed, active, on-hold, completed, cancelled]
  - name: Worker
    label: Worker
    title_field: fullName
    list_columns: [fullName, trade, contractor, bocwNumber, status]
    fields:
      - { name: fullName, label: Full name, type: string, required: true }
      - { name: mobile, label: Mobile, type: phone }
      - { name: dateOfBirth, label: Date of birth, type: date }
      - name: trade
        label: Trade
        type: enum
        options: [mason, carpenter, bar-bender, helper, electrician, plumber, welder, painter, operator, rigger, other]
      - { name: contractor, label: Labour contractor, type: string }
      - { name: homeState, label: Home state, type: string }
      - { name: bocwNumber, label: Welfare board (BOCW) registration number, type: string }
      - { name: uan, label: UAN or e-Shram number, type: string }
      - { name: dailyWage, label: Daily wage, type: money }
      - { name: joinedOn, label: Joined this site on, type: date }
      - { name: daysWorked12Months, label: Days of construction work in the last 12 months, type: integer }
      - { name: healthCheckDueOn, label: Next yearly health check (age 40 and over), type: date }
      - name: status
        label: Status
        type: enum
        required: true
        options: [working, on-leave, left]
  - name: Contractor
    label: Contractor or supplier
    plural_label: Contractors and suppliers
    title_field: name
    list_columns: [name, kind, work, workersOnSite, wagesPaidUpTo]
    fields:
      - { name: name, label: Name, type: string, required: true }
      - name: kind
        label: Type
        type: enum
        required: true
        options: [labour-contractor, subcontractor, supplier, consultant, machine-hire]
      - { name: work, label: Work or supply, type: string }
      - { name: phone, label: Phone, type: phone }
      - { name: gstin, label: GSTIN, type: string }
      - { name: pan, label: PAN, type: string }
      - { name: labourLicenceNo, label: Labour licence number, type: string }
      - { name: licenceValidTill, label: Licence valid till, type: date }
      - { name: workersOnSite, label: Workers on site, type: integer }
      - { name: wagesPaidUpTo, label: Wages paid up to, type: date }
      - { name: securityDeposit, label: Security deposit held, type: money }
      - { name: retentionHeld, label: Retention held, type: money }
