      - { name: contractor, label: Contractor, type: reference, ref: Contractor, required: true }
      - { name: project, label: Project, type: string, required: true }
      - { name: workOrderNo, label: Work order no., type: string }
      - { name: period, label: Period, type: string }
      - { name: raBillNumber, label: RA bill no., type: integer }
      - { name: receivedOn, label: Received on, type: date }
      - { name: workOrderValue, label: Work order value, type: money }
      - { name: previouslyBilled, label: Billed before, type: money }
      - { name: thisBill, label: This bill, type: money, required: true }
      - { name: retention, label: Retention, type: money }
      - { name: tds, label: TDS, type: money }
      - { name: otherDeductions, label: Other deductions, type: money }
      - { name: netPayable, label: Net payable, type: money }
      - { name: measuredBy, label: Measured by, type: string }
      - { name: certifiedBy, label: Certified by, type: string }
      - { name: certifiedOn, label: Certified on, type: date }
      - { name: dueDate, label: Due date, type: date }
      - { name: paidOn, label: Paid on, type: date }
      - { name: paymentRef, label: UTR / cheque no., type: string }
      - name: status
        label: Status
        type: enum
        options: [received, measuring, certified, approved, part-paid, paid, disputed, rejected]

tools:
  - name: projects.search
    description: Search projects and sites by name, code, client or status.
    uses: records.search
    with: { entity: Project }
  - name: workers.search
    description: Search the worker register by name, trade, contractor or welfare board number.
    uses: records.search
    with: { entity: Worker }
  - name: worker.add
    description: Add a worker to the site worker register.
    uses: records.create
    with: { entity: Worker }
  - name: contractors.search
    description: Search labour contractors, subcontractors, suppliers and consultants.
    uses: records.search
    with: { entity: Contractor }
  - name: units.search
    description: Search flats and units by number, tower, buyer or status.
    uses: records.search
    with: { entity: Unit }
  - name: letter.draft
    description: Draft a letter to the client, engineer, consultant or authority (hindrance notice, request for more time, drawing query, variation). Nothing is sent until a person signs it.
    uses: document.generate
    with: { kind: letter }
  - name: quote.draft
    description: Draft the price for a change or extra item from contract rates, for the QS to check. Nothing is sent.
    uses: document.generate
    with: { kind: quote }

agents:
  - role: site-desk
    name: Site desk
    description: Logs hold-ups in the hindrance register, drawing queries, quality problems and change requests against the project; drafts letters to the client, engineer and consultants; prices changes from contract rates for the QS; checks stock and budget for indents and gets quotes; and hands site work to the engineer in charge by phone.
    instructions: Quote the project, the exact place (tower, floor, grid or chainage) and the drawing number in everything you write. Never tell anyone to start change work before the written instruction or the buyer's signed request is in hand, and never place a purchase order yourself.
    autonomy: 3
    tools: [projects.search, contractors.search, records.search, records.create, records.update, knowledge.search, letter.draft, quote.draft, document.generate, message.draft, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: internal }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }
  - role: safety-labour-desk
    name: Safety and labour desk
    description: Records accidents, near misses and unsafe conditions, keeps the reporting clock and drafts the accident reports; follows up hospital care and compensation; keeps the worker register, chases contractors for proof of wages, prepares welfare board registrations and drafts replies to labour inspectors.
    instructions: Life and safety first. Never mark a statutory report as sent or wages as paid; people sign and send reports and approve payments. Never ask an injured worker to come back to work.
    autonomy: 2
    tools: [workers.search, worker.add, contractors.search, projects.search, records.search, knowledge.search, letter.draft, document.generate, message.draft, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 120000, money_per_task_inr: 0, max_steps: 25 }
  - role: crm-desk
    name: CRM and handover desk
    description: Registers snags and defects with the flat number, checks the possession date and the 5-year repair period, books joint inspections, sends each snag to the right trade by phone, keeps buyers updated, and logs buyers' change requests for the site desk to price.
    instructions: Give every buyer a complaint number and an expected date. Never promise a structural change, or a free repair after the 5-year period; a person decides. Structural cracks go to QA/QC and the structural consultant.
    autonomy: 3
    tools: [units.search, projects.search, records.search, records.update, knowledge.search, schedule.create, message.draft, message.send, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 100000, money_per_task_inr: 0, max_steps: 20 }

workflows:
  - id: accident-response
    name: Accident response
    description: Record the accident or unsafe condition, make the area safe, keep the reporting clock and follow up the corrective actions.
    keywords: [accident, injury, near miss, unsafe, fell, collapse, hospital]
    steps:
      - key: record
        title: Record it and draft the report
        agent: safety-labour-desk
        instructions: Record what happened, where (tower, floor or chainage), when, who was hurt and how badly, their contractor and whether they are registered with the welfare board. Draft the accident report and list the reporting deadlines for this state.
      - key: make-safe
        title: Make the area safe
        agent: safety-labour-desk
        depends_on: [record]
        instructions: Hand the make-safe work to the site engineer in charge by phone. Work stays stopped in the area, it is barricaded and the scene is kept as it is except for rescue, until the safety officer clears it.
      - key: follow-up
        title: Follow up the investigation and care
        agent: safety-labour-desk
        depends_on: [make-safe]
        instructions: Hand the investigation and corrective actions to the safety officer by phone, and track hospital care, the family and the compensation papers until the case closes.
  - id: hindrance-record
    name: Hold-up record and letter
    description: Record the hold-up in the hindrance register, write to the client and keep crews busy elsewhere.
    keywords: [hold-up, hindrance, idle, work stopped, front, delay]
    steps:
      - key: log
        title: Log the hold-up and draft the letter
        agent: site-desk
        instructions: Log the hold-up with project, place, start date and time, cause, whose side it is, and the crews and machines standing idle. Draft the letter to the client or Authority Engineer with the likely duration and, if it is not our fault, a request for more time.
      - key: clear
        title: Get it signed and keep crews busy
        agent: site-desk
        depends_on: [log]
        instructions: Hand the letter for signature to the project manager by phone, ask the site engineer to move idle crews and machines to other fronts, and record idle hours every day until work restarts.
  - id: quality-ncr
    name: Quality problem (NCR)
    description: Raise the non-conformance report, pull the test records and get the fix decided before anything is covered or loaded.
    keywords: [quality, ncr, cube, test failed, honeycomb, rework]
    steps:
      - key: log
        title: Raise the NCR and pull the records
        agent: site-desk
        instructions: Raise the NCR with a number, the element, floor, grid and drawing reference. Pull the pour card, cube register, mix design and material test certificates, and note what must not be covered up or loaded.
      - key: investigate
        title: Get the cause and the fix
        agent: site-desk
        depends_on: [log]
        instructions: Hand the investigation to the QA/QC engineer by phone. For structural parts, ask for the structural consultant's written opinion before any repair, demolition or more load, and track core tests and the fix to closure.
  - id: rfi-handling
    name: Drawing query (RFI)
    description: Number the query, send it to the right consultant and get the written answer to site before it is needed.
    keywords: [rfi, drawing, clarification, gfc, revision]
    steps:
      - key: log
        title: Log the query and draft the RFI
        agent: site-desk
        instructions: Number the query, quote the drawing numbers and revisions, add the sketch or photo and the date the answer is needed, and check that a later revision has not already answered it. Draft the RFI to the architect or consultant.
      - key: chase
        title: Chase and share the answer
        agent: site-desk
        depends_on: [log]
        instructions: Chase the answer before the needed-by date. Share the written answer and the revised GFC drawings with the site and subcontractors, and tell the site engineer by phone. If the answer adds cost or time, raise a change order.
  - id: change-order-pricing
    name: Change order
    description: Price the change from contract rates, get it approved and signed by the client or buyer, then start the work.
    keywords: [change order, variation, extra work, extra item, change request]
    steps:
      - key: price
        title: Log and price the change
        agent: site-desk
        instructions: Log the change with the written instruction or the buyer's request. Draft the price from BOQ rates, with a rate analysis for new items and the effect on time, for the QS to check.
      - key: sign
        title: Get it signed and start
        agent: site-desk
        depends_on: [price]
        instructions: Draft the variation letter or the buyer's change form for signature. Once signed, hand the work to the site engineer by phone and enter it in the variation register.
  - id: material-indent
    name: Material indent and order
    description: Check stock and budget, get the rate, prepare the purchase order and get the material checked at the gate.
    keywords: [indent, material, purchase order, cement, steel, quotation]
    steps:
      - key: check
        title: Check stock, budget and rates
        agent: site-desk
        instructions: Check site stock, open orders and the BOQ or budget balance. Use the rate contract or get three quotes, and prepare the purchase order for approval (above ₹2,00,000 it waits for the owner).
      - key: deliver
        title: Order and receive
        agent: site-desk
        depends_on: [check]
        instructions: Once approved, hand the order and delivery date to the purchase executive by phone, and ask the storekeeper to check quantity, GST invoice, e-way bill, ISI mark and test certificates at the gate.
  - id: labour-wages-welfare
    name: Labour, wages and welfare board
    description: Check the workers and their contractor, get wages paid on time and prepare welfare board and inspector paperwork.
    keywords: [wages, labour, welfare board, bocw, labour inspector, contractor]
    steps:
      - key: check
        title: Check the register and the contractor
        agent: safety-labour-desk
        instructions: Find the workers and their contractor in the worker register, check the wages-paid-up-to date and the labour licence, and ask the contractor for bank proof of wages. Prepare the list of workers and the amounts due.
      - key: settle
        title: Settle wages and file papers
        agent: safety-labour-desk
        depends_on: [check]
        instructions: If the contractor has not paid by the deadline, hand the payment list to the HR manager by phone to approve paying the workers directly and recovering it from the contractor's bill. Prepare welfare board registrations or the reply to the inspector as needed.
  - id: snag-repair
    name: Snags and defects
    description: Register the snag or defect, check the repair period, send it to the right trade and keep the buyer updated until they accept the fix.
    keywords: [snag, defect, seepage, leakage, crack, handover, punch list]
    steps:
      - key: register
        title: Register and book the inspection
        agent: crm-desk
        instructions: Register the snag or defect with the unit, buyer, possession date and photos, check the 5-year repair period, book a joint inspection, and text the buyer the complaint number and expected date.
      - key: fix
        title: Get it fixed and accepted
        agent: crm-desk
        depends_on: [register]
        instructions: Hand each snag to the trade in charge (civil, plumbing, electrical, waterproofing) by phone with a date inside 30 days, send structural cracks to QA/QC, update the buyer and record their acceptance.

lifecycle:
  case: { label: Site request, plural: Site requests, prefix: SR }
  stages:
    request:
      name: Site request raised
      description: A request, report or alert comes in from site staff, a home buyer, the client or its consultant, a subcontractor or a system (lab result, stock alert, government order), gets a number and is acknowledged.
    review:
      name: Check details and papers
      description: The site team checks that the request names the project, the exact place and the drawing, has photos and the papers it needs, and is ours to handle; anything missing is asked for before it moves on.
      checks:
        - "Project, tower or chainage, floor and grid given, with photos"
        - Drawing number and revision quoted for drawing, quality and change requests
        - Quantity checked against the BOQ and the budget balance
        - "Papers attached as needed: written instruction, test report, invoice, worker list or buyer agreement"
        - "Ours to handle: inside the contract scope, or inside the buyer's 5-year defect period"
        - Repeat or duplicate requests linked
    classify:
      name: Set type, risk and priority
      description: The request gets its type, risk, priority, due date and owning department (safety, projects, quality, design, contracts, purchase, HR or customer care), which starts the response clock.
    assign:
      name: Assign in-charge and deadline
      description: The project names the person responsible (site engineer, safety officer, QS, storekeeper, labour officer or CRM executive), sets the deadline and tells the subcontractor if their crew is involved.
    approve:
      name: Approval before work
      description: Where the type needs it, the named person approves before money is committed or work starts or restarts. The safety officer clears hot work, confined space, height and deep excavation permits, the project manager clears accident reports, restarts and quality fixes, the owner clears big purchases and changes, the projects head clears statutory replies, and the HR manager clears labour filings and wages paid on a contractor's behalf.
      checks:
        - Safety officer has cleared the area before work restarts after an accident
        - Written instruction or the buyer's signed request in hand before change work
        - "Amount within the approver's limit"
    execute:
      name: Site work and progress
      description: The team and agents do the work and track it daily with photos, measurements, test results, costs and dates; hold-ups go into the hindrance register and changes into the variation register.
      checks:
        - Hold-ups entered in the hindrance register the same day
        - Pour card signed and cubes taken for every concrete pour
        - No work covered up before it is inspected and measured
        - Delays reported before the deadline runs out
    close:
      name: Inspect and sign off
      description: Someone other than the person who did the work inspects it, the client or buyer accepts it in writing where needed, and the named role signs off.
      checks:
        - Joint inspection done, with before and after photos
        - Test results, checklists and pour cards filed
        - Work measured and entered in the measurement book, signed by both sides
        - Client or buyer acceptance in writing where needed
        - "Registers updated: accident register, hindrance register, variation register, snag list"
    report:
      name: Monthly review and lessons
      description: Weekly and monthly reports track progress against plan, accidents, quality problems, open drawing queries, change orders, material use and buyer defects; statutory returns go out on time and repeat problems get a lasting fix.
      checks:
        - Accidents and near misses reviewed in the monthly safety committee
        - Repeat quality problems on the same work or crew flagged
        - Hindrance and variation registers up to date for time and cost claims
  priorities:
    - { id: P1, name: Life or structure at risk, respond_within_hours: 0.25, resolve_within_hours: 48 }
    - { id: P2, name: Work stopped or legal duty due, respond_within_hours: 1, resolve_within_hours: 72 }
    - { id: P3, name: Normal, respond_within_hours: 8, resolve_within_hours: 168 }
    - { id: P4, name: Low or planned, respond_within_hours: 24, resolve_within_hours: 720 }
  roles:
    - id: project-manager
      name: Project manager (site in-charge)
      approves: "Accident reports to the authorities and the restart of work once the safety officer clears it; the fix for a quality problem and its cost; signs off hold-ups once work restarts"
    - id: safety-officer
      name: Safety officer (safety in-charge on smaller sites)
      approves: "Clears hot work, confined space, height and deep excavation permits; closes accident, near miss and unsafe-condition cases once the corrective actions are checked, and can stop unsafe work. Sites with 250 or more workers need a qualified safety officer."
    - id: quality-head
      name: QA/QC manager
      approves: Signs off quality problems after checking the repaired work and the new test results
    - id: contracts-manager
      name: Contracts and billing manager (QS)
      approves: Signs off change orders once the client or buyer has signed and the work is measured and billed
    - id: hr-manager
      name: HR and labour compliance manager
      approves: "Labour registrations and filings, replies to labour inspectors, and wages paid directly to workers when a contractor fails to pay"
    - id: crm-head
      name: CRM head (customer care)
      approves: "Signs off snag lists, possession handovers and replies to buyers' defect complaints. Contractors without home buyers give this to the project manager."
    - id: maintenance-head
      name: P&M in-charge (plant and machinery)
      approves: "Breakdown repairs and servicing of cranes, hoists, batching plants and other site machines"
    - id: plant-head
      name: Projects head (GM or director)
      approves: "Replies to statutory notices, RERA filings, licence renewals, NOCs and consents for the company's sites"
  # Not a bare "fire": fire NOCs, fire-fighting works and fire alarm jobs are routine for builders.
  urgent_keywords: [caught fire, fire broke out, on fire, fire in, fire at, fire near, flames, explosion, injured, injury, accident, electrocuted, electric shock, shock, collapse, collapsed, caved in, fell from, fall from height, fatal, died, death, unconscious, trapped, buried, gas leak, smoke, crane toppled]
  categories:
    - id: accident
      name: Accident or unsafe site
      keywords: [accident, injured, injury, hurt, broke his, broke her, fracture, fractured, fell from, fall from height, fell down, collapsed, collapse, caved in, electric shock, electrocuted, caught fire, fire broke out, on fire, fire in, fire at, died, death, fatal, unconscious, taken to hospital, ambulance, crane toppled, hoist failure, near miss, dangerous occurrence, unsafe, no railing, no edge protection, without harness, no safety net, without helmet, snake bite, heat stroke, durghatna, chot lagi]
      priority: P1
      risk: high
      department: Safety
      # P1: no required details, so it never waits as "needs info".
      required_checks:
        - "Exact place (tower, floor or chainage), time and who was hurt recorded; phone the person who raised it for anything missing"
        - "Work stopped in the area, first aid given and the injured taken to hospital; photos taken and the scene left as it is except for rescue"
        - "A death: the labour authority, police, District Magistrate or SDO and the family told at once"
        - "Serious injury (off work 48 hours or more) or a dangerous occurrence (collapse, crane or hoist failure, fire, falling objects): written report within the time the state's rules set"
        - Worker from another state on a site with 10 or more such workers reported to both states and the next of kin
        - "Worker's welfare board registration, ESI and insurance checked for compensation"
        - Safety officer has cleared the area and the crew had a toolbox talk before work restarts
      approval: { required: always, role: project-manager }
      signoff: { required: true, role: safety-officer }
      workflow: accident-response
      execution: both
    - id: breakdown
      name: Site machine breakdown
