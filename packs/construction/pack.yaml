playbooks:
  - id: site-accident-reporting
    title: Accidents and dangerous occurrences on site
    source: "Occupational Safety, Health and Working Conditions Code, 2020 (sections 10, 11, 22 and 59-60); OSH (Central) Rules, 2026 (notified 8 May 2026) as summarised by SCC Online. States are notifying their own OSH rules; until a state does, its BOCW rules apply. Check your state's rules."
    body: |
      1. Stop work in the area, give first aid and get the injured person to hospital. Leave the scene as it is, except for rescue, and take photos.
      2. Phone the safety officer and the project manager at once. For a death or serious injury, also tell the owner and the family.
      3. A death: tell the labour authority (Inspector-cum-Facilitator), the police station and the District Magistrate or SDO at once, as the state's rules require.
      4. An injury that keeps a worker off work 48 hours or more, or a dangerous occurrence even with no one hurt (collapse of a structure, scaffold or shuttering, crane or hoist failure, fire, falling objects, electric flash): send the written report in the time the rules set. The OSH Central Rules give 12 hours; check the current rule for your state.
      5. If a worker from another state is killed or badly hurt, and the site has 10 or more such workers, report it to both states and the next of kin.
      6. Check the worker's welfare board registration, ESI and insurance, and start the compensation papers. The owner decides any ex gratia help to the family.
      7. The safety officer finds the cause. Work restarts only after the safety officer clears the area and the project manager approves, with a toolbox talk for the crew.
      8. Sites with 250 or more workers need a qualified safety officer; smaller sites name a safety in-charge.
  - id: labour-wages-welfare
    title: Labour, wages and the welfare board
    source: "OSH Code, 2020 (sections 3, 5, 6, 24, 45 and 55); Code on Wages, 2019 (section 17); Code on Social Security, 2020 (sections 100 and 106); MoLE notification S.O. 2322(E), 8 May 2026; PIB release on the Labour Codes, 21 Nov 2025. The Codes replaced the BOCW and Contract Labour Acts, but states are still notifying their rules."
    body: |
      1. Register each site online within 60 days of starting, tell the authority when work starts and ends, and give every worker an appointment letter and ID.
      2. Check that each labour contractor with 50 or more contract workers holds a labour licence, and keep the worker list, attendance and wage records for every gang.
      3. Make sure wages are paid on time: daily wages at the end of the shift, weekly wages before the weekly holiday, monthly wages before the 7th of the next month. Contractors pay by bank transfer and send us the proof.
      4. If a contractor does not pay or pays short, pay the workers in full ourselves (the HR manager approves) and recover it from the contractor's bill.
      5. Register workers aged 18 to 60 who did 90 days of construction work in the last 12 months with the state welfare board, and pay the construction cess of 1% of the cost of construction.
      6. No one under 18 works on site. Give a free yearly health check to workers aged 40 and over, and provide housing at or near the site, drinking water, toilets, first aid and a creche as the rules require.
      7. Until your state notifies its rules under the Codes, follow its existing BOCW rules.
  - id: concrete-testing-curing
    title: "Concrete: cubes, curing and formwork"
    source: "IS 456:2000 Plain and Reinforced Concrete, Code of Practice (clauses 11.3, 13.5.1, 15 and 17.4); later amendments changed the strength acceptance table, so check the current text"
    body: |
      1. Take cube samples from every grade poured: 1 sample up to 5 cu m, 2 for 6 to 15, 3 for 16 to 30, 4 for 31 to 50, and one more for each further 50 cu m; at least one sample per shift and 3 cubes per sample.
      2. Accept or reject concrete only on its 28-day cube results; 7-day results are an early warning.
      3. Keep concrete wet for at least 7 days, or at least 10 days with blended cement or in hot, dry weather.
      4. Do not strip formwork early (ordinary cement, 15 °C or warmer): sides 16 to 24 hours; slab bottoms 3 days and beam bottoms 7 days with props left under; slab props 7 days (14 if the span is over 4.5 m); beam props 14 days (21 if over 6 m).
      5. If strength is in doubt, test at least 3 cores. The concrete passes if their average is at least 85% of the grade strength and none is below 75%; otherwise load test or repair as the structural consultant decides.
      6. Raise an NCR for every failed test, and cover or load nothing until the fix is approved.
  - id: changes-and-hold-ups
    title: Changes and hold-ups in writing
    source: "Manual for Procurement of Works, 2nd edition 2025, Department of Expenditure (paras 3.2.2, 5.2, 7.2.2, 7.3.2, 7.4.3 and 7.4.6), binding on Central Government works and good practice elsewhere; private clients follow their own contract"
    body: |
      1. Start no change work without a written, numbered instruction from the client or engineer (a phone call is not enough), or the buyer's signed request.
      2. Price changes at contract (BOQ) rates where they fit, build new rates from them where they do not, and work out the effect on time. Keep a variation register that records savings as well as extras.
      3. Quantities that go past the deviation limit in the contract are paid at new rates; check the clause in your contract.
      4. When something holds up work, write to the client the same day with the cause, the likely duration and, if it is not our fault, a request for more time. Keep the hindrance register daily with idle men and machines; never leave time-extension claims to the end.
      5. Record work in the measurement book, signed by both sides, before it is covered up.
      6. Government clients are expected to pay at least 75% of a running bill within 10 working days and the rest within 28 working days; chase late bills in writing.
  - id: home-handover-defects
    title: Possession, snags and defects for home buyers
    source: "Real Estate (Regulation and Development) Act, 2016 (sections 11(4), 14(2), 14(3), 17 and 19(10)). Contractors without home buyers follow the defect liability period and taking-over terms in their contract."
    body: |
      1. Give possession only after the occupancy certificate. Buyers must take possession within 2 months of it.
      2. Do a joint inspection with the buyer before handover, sign the snag list together and fix the snags on a fixed date.
      3. Hand over keys, the possession letter, meter readings, warranty cards and manuals once dues are cleared.
      4. Fix any structural or workmanship defect the buyer reports within 5 years of possession, free, within 30 days.
      5. After 5 years, or for damage from the buyer's own interior or alteration work, reply politely in writing and offer a paid repair.
      6. Change a buyer's flat only with that buyer's consent, and never make a structural change; plan or common-area changes need the written consent of two-thirds of the buyers.
      7. Where local law is silent, hand the common areas and documents to the buyers' association within 30 days of the occupancy certificate, and register the conveyance within 3 months.

kpis:
  - id: progress-vs-plan
    name: Work done vs plan
    description: Value of work done this month (from measurements) as a share of the value planned for the month in the approved work programme.
    unit: percent
    direction: up
    target: 95
  - id: ncr-closed-on-time
    name: Quality problems closed on time
    description: Quality problems (NCRs) closed by their due date, as a share of all that fell due this month.
    unit: percent
    direction: up
    target: 90
  - id: buyer-defects-in-30-days
    name: Buyer defects fixed in 30 days
    description: Defects reported by buyers within 5 years of possession and fixed within 30 days, as a share of all such defects that fell due this month.
    unit: percent
    direction: up
    target: 100
  - id: material-wastage
    name: Steel and cement wastage
    description: Steel and cement used beyond what the measured work should have used, as a share of what it should have used, from the monthly stock reconciliation.
    unit: percent
    direction: down
    target: 3
  - id: workers-registered
    name: Workers registered with the welfare board
    description: Eligible workers on site (aged 18 to 60, 90 days of construction work in the last 12 months) who hold a valid welfare board registration, as a share of all eligible workers.
    unit: percent
    direction: up
    target: 100

registers:
  - id: site-issues
    entity: SiteIssue
    label: Site issues
    columns: [issueNo, project, location, kind, contractor, dueBy, status]
    filters: [kind, status, contractor]
    date_field: raisedOn
    totals: [costImpact]
    card: { count: { when: { status: [open, in-progress] }, label: open } }
    checks:
      - missing: [engineer]
      - overdue: { date: dueBy }
        when: { status: [open, in-progress] }
  - id: contractor-bills
    entity: ContractorBill
    label: Contractor bills
    columns: [billNo, contractor, project, raBillNumber, thisBill, netPayable, status]
    filters: [status, contractor]
    date_field: receivedOn
    totals: [thisBill, retention, tds, netPayable]
    card: { sum: { field: netPayable, when: { status: [received, measuring, certified, approved, part-paid, disputed] }, label: to pay } }
    checks:
      - adds_up: { field: netPayable, plus: [thisBill], minus: [retention, tds, otherDeductions] }
      - limit: { fields: [previouslyBilled, thisBill], max: workOrderValue }
      - duplicate: [contractor, project, raBillNumber]
      - overdue: { date: dueDate }
        when: { status: [certified, approved, part-paid] }
  - id: units
    entity: Unit
    label: Units
    columns: [unitNumber, tower, project, buyerName, possessionDate, openSnags, status]
    filters: [status, duesCleared]
    date_field: agreementDate
    card: { count: { when: { status: [booked, agreement-signed] }, label: booked } }
    checks:
      - overdue: { date: possessionDate }
        when: { status: [booked, agreement-signed, ready-for-possession] }
        why: possession date passed
      - missing: [buyerMobile]
        when: { status: [booked, agreement-signed] }
  - id: workers
    entity: Worker
    label: Workers
    columns: [fullName, trade, contractor, mobile, bocwNumber, status]
    filters: [trade, status]
    card: { count: { when: { status: [working] }, label: working } }
    checks:
      - missing: [bocwNumber]
        when: { status: [working] }
        why: BOCW registration
      - expiring: { date: healthCheckDueOn, days: 15 }
        when: { status: [working] }
  - id: contractors
    entity: Contractor
    label: Contractors
    columns: [name, kind, work, phone, licenceValidTill, retentionHeld]
