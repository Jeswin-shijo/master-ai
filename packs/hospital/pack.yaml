    - { request: "Need a certified copy of my wife's case sheet from her May admission for our insurance reimbursement", category: certificate, priority: P2, approval: true }
    - { request: "Please give the MCCD copy for my mother who died in the ICU on 2 September; the municipal office needs it to register the death", category: certificate, priority: P2, approval: true }
    - { request: "My company wants a fitness certificate before I rejoin after the typhoid treatment here", category: certificate, priority: P2, approval: true }
    - { request: "We pressed the nurse call bell in room 304 for two hours and nobody came. Very bad experience.", category: complaint, priority: P3, approval: false }
    - { request: "The security guard shouted at my elderly father at the main gate and did not let him sit", category: complaint, priority: P3, approval: false }
    - { request: "I am sending a legal notice for medical negligence in my son's treatment last month", category: complaint, priority: P3, approval: false }
    - { request: "Needle stick to a staff nurse while recapping in the dialysis unit at 2 pm", category: incident, priority: P2, approval: true }
    - { request: "Near miss in ward 2: insulin was almost given to the wrong patient but caught at the bedside check", category: incident, priority: P2, approval: true }
    - { request: "Grade 2 pressure sore found on day 5 of the stay, bed 9 in the ICU", category: incident, priority: P2, approval: true }

playbooks:
  - id: emergency-care-first
    title: Emergency care comes first
    source: Supreme Court, Parmanand Katara v. Union of India (1989); Clinical Establishments (Registration and Regulation) Act, 2010, section 12; Bharatiya Nagarik Suraksha Sanhita, 2023, section 397; Motor Vehicles Act, 1988, section 134A; Cashless Treatment of Road Accident Victims Scheme, 2025 (MoRTH, S.O. 2015(E), 5 May 2025); AIIMS triage protocol and NHSRC module 'Triage in Emergencies'; National Building Code of India, 2016, Part 4
    body: |
      1. Never refuse or delay emergency care for a deposit, payment, papers or police formalities. Stabilise first with the staff and equipment you have.
      2. The triage nurse or doctor sees every arrival: red needs care now, yellow needs admission and watching, green gets minor care and goes home. Agents never set a triage colour.
      3. Medico-legal cases (accidents, assaults, burns, poisoning, suicide attempts, unclear cause): make the MLC entry and tell the police. Treatment does not wait for them.
      4. Rape and acid-attack survivors get free first aid and treatment in every hospital, public or private, and the police are told.
      5. Road accident victims get cashless treatment up to ₹1.5 lakh for 7 days from the accident at designated hospitals; other hospitals stabilise and transfer. The person who brought the victim is free to go and is never asked to pay or give details.
      6. Transfer only after stabilising, with a referral note, a suitable ambulance and the receiving hospital told.
      7. Critical lab or scan results go to the treating or duty doctor at once; note who took the call, the read-back and the time.
      8. Code red (fire), oxygen or gas leak: move patients sideways to the next safe zone, never by the lift, and wait for the safety officer's all-clear before going back.
  - id: cashless-and-pm-jay
    title: Cashless and PM-JAY approvals on time
    source: IRDAI Master Circular on Health Insurance Business, 29 May 2024; National Health Authority PM-JAY guidelines and claims adjudication manual; CAG performance audit of PM-JAY (2023), Chapter V; Ayushman Vay Vandana cover for everyone aged 70 and above (2024)
    body: |
      1. Check cover before a planned admission: the policy or e-card for insurance; Aadhaar e-KYC or the Ayushman card at the Arogya Mitra desk for PM-JAY (everyone aged 70 and above is covered, whatever their income); a valid CGHS, ECHS, ESI or state-scheme card.
      2. The treating doctor signs the diagnosis, plan and estimate. Never add, upgrade or change a package to get more approved.
      3. Insurers must decide a cashless request within 1 hour and the final discharge approval within 3 hours of the hospital's request. If they are late, the insurer pays the extra charges, not the patient.
      4. The insurer or TPA collects claim papers from the hospital; patients do not chase them. After a death, the claim is processed at once and the body is released without delay.
      5. PM-JAY: the state health agency usually decides a pre-auth within 6 hours (check your state's rules). In an emergency, start treatment and raise the pre-auth as soon as you can. The patient pays nothing for the package, including medicines and tests 3 days before and 15 days after the stay.
      6. Explain any denial or cut in writing before asking the patient to pay, and tell them how to claim reimbursement.
      7. Track the clock on every request, and each month the share of claims denied or cut and why.
  - id: patient-rights-consent-discharge
    title: Patient rights, consent and discharge
    source: Charter of Patients' Rights and Responsibilities (MoHFW and National Council for Clinical Establishments, 2021); Clinical Establishments (Central Government) Rules, 2012, rule 9; Indian Medical Council (Professional Conduct, Etiquette and Ethics) Regulations, 2002, regulation 7.16; Medical Termination of Pregnancy Act, 1971, section 3(4); NABH Hospital Accreditation Standards
    body: |
      1. Display the rate list in English and the local language, and the patients' rights charter. Give a written estimate before planned treatment.
      2. Take written informed consent before surgery, anaesthesia, blood transfusion and high-risk procedures, in a language the patient understands. For an operation that may cause sterility, both spouses consent; for an MTP, only the woman (a guardian if she is under 18 or mentally ill).
      3. Respect privacy and confidentiality, the right to a second opinion and the patient's choice of where to buy medicines and tests.
      4. Every patient who leaves gets a discharge summary signed by the treating doctor (diagnosis, treatment, medicines, follow-up and when to come back urgently), including those who leave against advice; after a death, a death summary.
      5. Never hold back a patient, or the body of a patient who died, over an unpaid or disputed bill.
      6. Name a grievance officer, log and acknowledge every complaint the same day and reply in writing within 7 days (our own rule). A patient who is not satisfied can go to the district registering authority under the Clinical Establishments Act, or the authority under your state's own law.
  - id: medical-records-and-certificates
    title: Medical records, certificates and privacy
    source: Indian Medical Council (Professional Conduct, Etiquette and Ethics) Regulations, 2002, regulations 1.3.1, 1.3.2, 7.7 and 7.14; Registration of Births and Deaths Act, 1969 (amended 2023), sections 8 and 10; PCPNDT Rules, 1996, rule 9; MTP Regulations, 2003; Digital Personal Data Protection Act, 2023; Aadhaar Act, 2016
    body: |
      1. Acknowledge every request for records and give copies within 72 hours. Give copies only; the originals stay with the hospital.
      2. Give records only to the patient, someone with the patient's written authorisation and ID, the legal heir of a patient who died, or on a signed police or court requisition. Never read records out on the phone. The medical superintendent approves every release.
      3. Medico-legal papers come only from the MLC register and go only to the police or court that asked in writing.
      4. Certificates (fitness, sick leave, disability) are issued only on the treating doctor's own examination and signature, with the true date. A false or backdated certificate is misconduct.
      5. When a patient dies, send the cause-of-death certificate (MCCD) to the registrar and give the nearest relative a copy. Report births and deaths to the registrar within 21 days; the registrar issues the birth or death certificate.
      6. Keep indoor records at least 3 years and medico-legal records until the case is over, or longer where your state or insurers ask. Keep PCPNDT records 2 years and the MTP admission register 5 years.
      7. Treat health data as sensitive under the DPDP Act: collect only what is needed, use Aadhaar only with consent and keep it masked, share only for the purpose the patient agreed to, and tell the patient and the Data Protection Board about any breach.
  - id: pregnancy-scans-and-mtp
    title: Pregnancy scans and MTP within the law
    source: Pre-Conception and Pre-Natal Diagnostic Techniques (Prohibition of Sex Selection) Act, 1994, sections 5, 6 and 23, and Rules, 1996, rule 9 and Form F; Medical Termination of Pregnancy Act, 1971 as amended in 2021, sections 3 and 5A, and MTP Rules, 2003; POCSO Act, 2012, section 19; Supreme Court, X v. Principal Secretary, Health and Family Welfare Department, Govt of NCT of Delhi (2022)
    body: |
      1. Every ultrasound or other prenatal test on a pregnant woman needs Form F, filled and signed by the doctor with the referral details, and the month's forms reach the district appropriate authority by the 5th of the next month. Keep the records for 2 years.
      2. Never tell, write or hint the sex of the baby, by words, signs or colours. Display the board saying sex determination is not done here. Doing it, or asking for it, is a crime for the doctor and for the family.
      3. Only registered machines and qualified, registered doctors do the scans; tell the appropriate authority about any new machine or change of place.
      4. MTP is a doctor's decision under the MTP Act: up to 20 weeks on one registered doctor's opinion, 20 to 24 weeks for the groups the rules list on two doctors' opinion, and later only for serious foetal abnormality decided by the state medical board. Only at a government-approved place.
      5. The woman's own written consent is enough; a guardian consents if she is under 18 or mentally ill. Her name is never shared except as the law allows.
      6. A pregnancy in a girl under 18 must be reported to the police under POCSO; her name can be left out of that report when she and her guardian ask.
      7. Agents only book the visit with the gynaecologist, keep it confidential and never give advice.
  - id: incidents-and-quality-indicators
    title: Reporting incidents and tracking quality
    source: NABH Hospital Accreditation Standards, 6th edition (2025), patient safety and quality chapters; NACO National Guidelines for HIV Care and Treatment (post-exposure prophylaxis); Pharmacovigilance Programme of India and Haemovigilance Programme of India (Indian Pharmacopoeia Commission)
    body: |
      1. Report every fall, medication error, needle-stick, drug or transfusion reaction, pressure sore and near miss on the incident form the same day. Nobody is blamed for reporting.
      2. Make the patient safe first and tell the treating or duty doctor.
      3. Tell the patient or family honestly what happened and what is being done, as the medical superintendent approves.
      4. Needle-stick or blood splash: wash with soap and water, report at once and start HIV preventive medicine (PEP) as early as possible, ideally within 2 hours and never after 72 hours.
      5. For a death or serious harm (sentinel event), tell management within 24 hours and do a root cause analysis with actions, owners and dates.
      6. Report drug reactions to the Pharmacovigilance Programme of India, and transfusion reactions to the blood centre and the Haemovigilance Programme of India.
      7. Each month, track the quality indicators your NABH level asks for, compare them with earlier months and act on the trend. Set your own targets and review them in the quality committee.

kpis:
  - id: opd-waiting-time
    name: OPD waiting time
    description: Average minutes from the booked time (or registration, for walk-ins) to the start of the consultation.
    unit: minutes
    direction: down
    target: 30
  - id: discharge-time
    name: Time to discharge
    description: Average hours from the doctor's discharge order to the patient leaving with the signed summary and a settled bill.
    unit: hours
    direction: down
    target: 3
  - id: emergency-return-72h
    name: Back in emergency within 72 hours
    description: Patients who come back to emergency within 72 hours with the same complaint, as a share of emergency patients sent home.
    unit: percent
    direction: down
    target: 2
  - id: falls-and-medication-errors
    name: Falls and medication errors
    description: Patient falls plus medication errors that reached the patient this month; the quality team also works out the rate per 1,000 patient days. Every one is reported, and the aim is fewer.
    unit: count
    direction: down
  - id: cashless-denials
    name: Cashless claims denied or cut
    description: Cashless, PM-JAY and scheme claims denied or paid less than billed, as a share of all such claims sent this month.
    unit: percent
    direction: down
    target: 5
  - id: incidents-awaiting-review
    name: Incidents waiting for review
    description: Patient safety incidents reported but not yet reviewed.
    unit: count
    direction: down
    source: { type: records_count, entity: Incident, where: { status: reported } }

registers:
  - id: visits
    entity: Visit
    label: Visits
    columns: [visitNumber, patientName, visitType, department, payer, finalBill, status]
    filters: [visitType, payer, status]
    date_field: arrivedAt
    totals: [estimate, advancePaid, finalBill]
    card: { sum: { field: finalBill, label: billed } }
    checks:
      - missing: [finalBill]
        when: { status: [discharge-ordered, left] }
      - limit: { fields: [advancePaid], max: finalBill }
        why: refund due
      - missing: [consentSigned]
        when: { visitType: [day-care, admission] }
      - missing: [summaryGiven]
        when: { status: [left] }
      - duplicate: [visitNumber]
  - id: cashless-requests
    entity: CashlessRequest
    label: Cashless requests
    columns: [patientName, visitNumber, insurerOrTpa, requestType, amountAsked, amountApproved, status]
    filters: [payer, requestType, status]
    date_field: sentAt
    totals: [amountAsked, amountApproved]
    card: { sum: { field: amountAsked, when: { status: [sent, query] }, label: waiting } }
    checks:
      - limit: { fields: [amountApproved], max: amountAsked }
      - overdue: { date: sentAt, grace_days: 1 }
        when: { status: [query] }
        why: query open for over a day
    follow_ups:
      - id: cashless-queries
        label: Cashless queries → the TPA
        who: party
        due: { overdue: { date: sentAt, grace_days: 1 } }
        when: { status: [query] }
        phone: { field: tpaPhone }
        contact: { field: insurerOrTpa }
        about: [visitNumber, packageCode, amountAsked]
        find_out: [status, amountApproved]
  - id: appointments
    entity: Booking
    label: Appointments
    columns: [customerName, service, date, time, status, paymentStatus]
    filters: [status, paymentStatus]
    date_field: date
    totals: [amount]
    card: { count: { when: { status: [requested, held, confirmed] }, label: coming up } }
    checks:
      - overdue: { date: date }
        when: { status: [requested, held] }
  - id: incidents
    entity: Incident
    label: Incidents
    columns: [summary, occurredAt, incidentType, harm, familyTold, status]
    filters: [incidentType, harm, status]
    date_field: occurredAt
    card: { count: { when: { status: [reported, under-review, actions-agreed] }, label: open } }
    checks:
      - missing: [familyTold]
        when: { harm: [moderate, severe, death] }
      - missing: [rootCause]
        when: { status: [actions-agreed, closed] }
