# Ready-made pack: hospitals, nursing homes and clinics in India (multispeciality,
# maternity, eye, dental and day-care). Built from Indian practice: the Clinical
# Establishments Act 2010 and its rules, NABH hospital standards, the IRDAI health
# insurance master circular (2024), PM-JAY guidelines, the IMC (Professional
# Conduct) Regulations 2002, the PCPNDT and MTP Acts, the Registration of Births
# and Deaths Act and the DPDP Act 2023. Agents register, coordinate, remind and
# document; doctors make every clinical decision.
id: hospital
version: 1.0.0
name: Hospital & clinic
description: Emergencies, OPD appointments, planned admissions and surgery, cashless and PM-JAY approvals, bills and refunds, medical records and certificates, complaints and patient safety incidents for hospitals, nursing homes and clinics.
kind: industry
sector: public-services
extends: [sector-public-services, bookings-base]
match:
  # Animal care is not human health care: vets get the sector defaults, not PM-JAY or PCPNDT.
  exclude: [veterinary, vet clinic, vet hospital, animal, animals, pet clinic, pet hospital, pet care, pets, cattle, livestock, poultry]
  keywords:
    - hospital
    - multispeciality
    - multispeciality hospital
    - multi speciality hospital
    - multispecialty hospital
    - super speciality hospital
    - superspeciality hospital
    - private hospital
    - trust hospital
    - charitable hospital
    - general hospital
    - nursing home
    - maternity home
    - maternity hospital
    - polyclinic
    - medical clinic
    - health clinic
    - family clinic
    - gp clinic
    - general physician
    - multispeciality clinic
    - multi speciality clinic
    - dental clinic
    - dental hospital
    - dentist
    - eye hospital
    - eye clinic
    - children's hospital
    - child clinic
    - children's clinic
    - paediatric clinic
    - pediatric clinic
    - gynaecology clinic
    - gynae clinic
    - maternity clinic
    - fertility clinic
    - ivf centre
    - ivf clinic
    - diabetes clinic
    - heart clinic
    - ortho clinic
    - skin clinic
    - dermatology clinic
    - ent clinic
    - orthopaedic hospital
    - cardiac hospital
    - cancer hospital
    - dialysis centre
    - day care surgery centre
    - medical centre
    - health centre
    - primary health centre
    - community health centre
    - dispensary
    - doctor's clinic
    - nabh hospital

labels:
  Customer: Patient
  Booking: Appointment
  Service: Treatment

connectors: [whatsapp-business, razorpay]

entities:
  - name: Customer
    label: Patient
    plural_label: Patients
    description: A person registered with the hospital or clinic. Aadhaar numbers are never stored here.
    title_field: name
    list_columns: [uhid, name, phone, gender, usualPayer]
    fields:
      - { name: name, label: Full name, type: string, required: true }
      - { name: uhid, label: UHID (hospital patient number), type: string }
      - { name: phone, label: Registered mobile, type: phone }
      - { name: email, label: Email, type: email }
      - { name: dateOfBirth, label: Date of birth, type: date }
      - name: gender
        label: Gender
        type: enum
        options: [female, male, other]
      - { name: city, label: City or village, type: string }
      - { name: address, label: Address, type: text }
      - { name: abhaNumber, label: ABHA number (only if the patient wants it linked), type: string }
      - { name: relativeName, label: Relative or attendant, type: string }
      - { name: relativePhone, label: Relative's mobile, type: phone }
      - name: usualPayer
        label: Usually pays by
        type: enum
        options: [cash, insurance, pm-jay, cghs, echs, esi, state-scheme, employer]
      - { name: allergies, label: Known allergies, type: text }
      - name: source
        label: Came through
        type: enum
        options: [walk-in, phone, whatsapp, website, referral, ambulance, other]
      - { name: notes, label: Notes, type: text }
  - name: Visit
    label: Visit or admission
    plural_label: Visits and admissions
    description: One OPD visit, day-care stay, admission or emergency visit, from arrival to leaving.
    title_field: visitNumber
    list_columns: [visitNumber, patientName, visitType, doctor, status]
    fields:
      - { name: visitNumber, label: OPD or IP number, type: string, required: true }
      - { name: patientName, label: Patient, type: string, required: true }
      - { name: uhid, label: UHID, type: string }
      - name: visitType
        label: Type
        type: enum
        required: true
        options: [opd, day-care, admission, emergency]
      - { name: department, label: Department, type: string }
      - { name: doctor, label: Treating doctor, type: string }
      - name: triageColour
        label: Triage colour (set by the triage nurse or doctor)
        type: enum
        options: [red, yellow, green]
      - { name: isMedicoLegal, label: Medico-legal case (MLC), type: boolean }
      - { name: arrivedAt, label: Arrived or admitted at, type: datetime }
      - { name: bed, label: Ward and bed, type: string }
      - { name: procedure, label: Surgery or procedure, type: string }
      - { name: consentSigned, label: Written consent signed, type: boolean }
      - name: payer
        label: Who pays
        type: enum
        options: [cash, insurance, pm-jay, cghs, echs, esi, state-scheme, employer]
      - { name: estimate, label: Cost estimate given, type: money }
      - { name: advancePaid, label: Advance paid, type: money }
      - { name: finalBill, label: Final bill, type: money }
      - { name: dischargeOrderedAt, label: Discharge ordered at, type: datetime }
      - { name: leftAt, label: Left the hospital at, type: datetime }
      - name: dischargeType
        label: How the patient left
        type: enum
        options: [routine, against-advice, referred, death]
      - { name: summaryGiven, label: Discharge summary given, type: boolean }
      - { name: followUpOn, label: Follow-up date, type: date }
      - name: status
        label: Status
        type: enum
        required: true
        options: [registered, in-treatment, discharge-ordered, left]
  - name: CashlessRequest
    label: Cashless or scheme approval
    plural_label: Cashless and scheme approvals
    description: A pre-authorisation, enhancement, final approval or claim sent to an insurer, TPA, PM-JAY or another government scheme.
    title_field: patientName
    list_columns: [patientName, payer, requestType, amountAsked, status]
    fields:
      - { name: patientName, label: Patient, type: string, required: true }
      - { name: visitNumber, label: IP or OPD number, type: string, required: true }
      - name: payer
        label: Payer
        type: enum
        required: true
        options: [insurance-tpa, pm-jay, cghs, echs, esi, state-scheme, employer]
      - { name: insurerOrTpa, label: Insurer or TPA, type: string }
      - { name: tpaPhone, label: TPA phone, type: phone }
      - { name: policyOrCardNumber, label: "Policy, e-card or beneficiary ID", type: string }
      - { name: packageCode, label: Package or procedure code, type: string }
      - name: requestType
        label: Request
        type: enum
        required: true
        options: [pre-auth, enhancement, final-approval, claim]
      - { name: amountAsked, label: Amount asked, type: money }
      - { name: amountApproved, label: Amount approved, type: money }
      - { name: sentAt, label: Sent at, type: datetime }
      - { name: decidedAt, label: Decided at, type: datetime }
      - name: status
        label: Status
        type: enum
        required: true
        options: [draft, sent, query, approved, part-approved, denied, claim-sent, paid]
      - { name: queryNote, label: Query or denial reason, type: text }
      - { name: claimPaidOn, label: Claim paid on, type: date }
  - name: Incident
    label: Patient safety incident
    plural_label: Patient safety incidents
    description: A fall, medication error, needle-stick, reaction, pressure sore or near miss, reported without blame.
    title_field: summary
    list_columns: [occurredAt, location, incidentType, harm, status]
    fields:
      - { name: summary, label: What happened (one line), type: string, required: true }
      - { name: occurredAt, label: When, type: datetime, required: true }
      - { name: location, label: Ward or area, type: string, required: true }
      - name: incidentType
        label: Type
        type: enum
        required: true
        options: [fall, medication-error, needle-stick, drug-reaction, transfusion-reaction, pressure-sore, wrong-patient-or-site, infection, absconding, equipment, other]
      - { name: patientName, label: Patient (if any), type: string }
      - { name: visitNumber, label: IP number, type: string }
      - name: harm
        label: Harm
        type: enum
        options: [near-miss, no-harm, minor, moderate, severe, death]
      - { name: isSentinel, label: Death or serious harm (sentinel event), type: boolean }
      - { name: familyTold, label: Patient or family told, type: boolean }
      - { name: reportedBy, label: Reported by, type: string }
      - { name: rootCause, label: Root cause, type: text }
      - { name: actions, label: Actions agreed, type: text }
      - name: status
        label: Status
        type: enum
        required: true
        options: [reported, under-review, actions-agreed, closed]
      - { name: closedOn, label: Closed on, type: date }

tools:
  - name: appointment.confirm
    description: Confirm an OPD appointment, test or scan slot in the hospital's own diary, or move it to a new date and time. The patient can still move or cancel it.
    uses: records.update
    with: { entity: Booking, patch: { status: confirmed } }
    level: 2
    risk: { external_reach: false, reversible: true }
  - name: appointment.cancel
    description: Cancel an OPD appointment, test or scan slot in the hospital's own diary when the patient asks or the doctor is away. The slot can be booked again.
    uses: records.update
    with: { entity: Booking, patch: { status: cancelled } }
    level: 2
    risk: { external_reach: false, reversible: true }
  - name: patients.search
    description: Find a patient by name, UHID or registered mobile.
    uses: records.search
    with: { entity: Customer }
  - name: patient.register
    description: Register a new patient and give them a UHID. Search first so nobody is registered twice.
    uses: records.create
    with: { entity: Customer }
  - name: visits.search
    description: Find OPD visits, admissions and emergency visits by number, patient, doctor or status.
    uses: records.search
    with: { entity: Visit }
  - name: visit.open
    description: Open an OPD visit, day-care stay, admission or emergency visit for a registered patient.
    uses: records.create
    with: { entity: Visit, data: { status: registered } }
  - name: cashless.search
    description: Find cashless, PM-JAY and scheme requests by patient, IP number, payer or status.
    uses: records.search
    with: { entity: CashlessRequest }
  - name: cashless.prepare
    description: Prepare a cashless, PM-JAY or scheme request from the treating doctor's notes. Nothing reaches the insurer or the portal until the insurance desk sends it.
    uses: records.create
    with: { entity: CashlessRequest, data: { status: draft } }
  - name: incidents.search
    description: Search patient safety incidents by type, ward, harm or status.
    uses: records.search
    with: { entity: Incident }
  - name: incident.report
    description: Record a patient safety incident or near miss with what happened, where and when, without naming anyone to blame.
    uses: records.create
    with: { entity: Incident, data: { status: reported } }

agents:
  - role: enquiry-intake
    name: Enquiry desk
    description: Logs every new message from patients and families (WhatsApp, website, phone) and drafts the first reply from the hospital's own information, such as doctors, OPD timings, rates, packages and how to book.
    job:
      mission: "Log every new message from patients and families and draft the first reply from the hospital's own information."
      customer_facing: true
      never:
        - "Diagnosis"
        - "Treatment or prescribing"
        - "Triage"
        - "Emergency medical decisions"
    instructions: >-
      Never give medical advice, never suggest a diagnosis, test or medicine, and never tell or hint the sex of an unborn baby.
      If a message mentions chest pain, breathlessness, heavy bleeding, fits, unconsciousness, poisoning, an accident, thoughts of suicide, or pain or bleeding in pregnancy,
      tell them to come to casualty or call 108 now and hand it to a person at once.
      Answer only from the hospital's own information and say the doctor will advise on anything about their health.
    autonomy: 2
    tools: [records.search, records.create, knowledge.search, message.draft, human.handoff]
    model: { tier: standard, fallback: small, data_class: restricted }
    budgets: { tokens_per_task: 100000, money_per_task_inr: 0, max_steps: 15 }
  - role: booking-coordinator
    name: Appointment desk
    description: Registers patients, books, moves and cancels OPD appointments, tests and scans, sends reminders and preparation instructions, and sends ready reports to the patient's registered mobile or email.
    job:
      mission: "Register patients, book, move and cancel appointments and tests, send reminders and send ready reports to the patient."
      customer_facing: true
      never:
        - "Diagnosis"
        - "Triage"
        - "Medication decisions"
        - "Access to sensitive patient records"
        - "Emergency medical decisions"
    instructions: >-
      Never give medical advice, never suggest a diagnosis, test or medicine, and never tell or hint the sex of an unborn baby.
      If a message mentions chest pain, breathlessness, heavy bleeding, fits, unconsciousness, or pain or bleeding in pregnancy, stop and hand it to the emergency team at once.
      Search before registering so nobody gets two UHIDs. Send reports only to the registered mobile or email.
    autonomy: 3
    tools: [patients.search, patient.register, visits.search, records.search, records.create, booking.hold, appointment.confirm, appointment.cancel, payment.request, refund.issue, knowledge.search, message.draft, message.send, human.handoff]
    model: { tier: standard, fallback: small, data_class: restricted }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }
  - role: billing-insurance-desk
    name: Billing and insurance desk
    description: Prepares cost estimates and cashless, PM-JAY and scheme requests from the doctor's notes, watches the insurer's clock and chases late decisions, checks and explains bills, and raises refunds to the payer's own account.
    job:
      mission: "Prepare cost estimates and insurance requests from the doctor's notes, chase late insurer decisions and explain bills."
      customer_facing: true
      never:
        - "Diagnosis"
        - "Treatment or prescribing"
        - "Refunds to anyone but the payer"
        - "Sharing sensitive patient records"
    instructions: >-
      Never give medical advice or comment on a diagnosis or treatment; send clinical questions to the treating doctor.
      Take every diagnosis, package and amount from what the treating doctor wrote and signed; never add, upgrade or change one.
      You prepare requests; the insurance desk sends them on the insurer, TPA or PM-JAY portal.
      Never ask a PM-JAY patient to pay for a covered package, and explain any denial or cut in writing before asking anyone to pay.
      Never hold back a patient or a body over a bill. Refunds go only to the payer's own account.
    autonomy: 2
    tools: [patients.search, visits.search, cashless.search, cashless.prepare, records.search, records.update, knowledge.search, document.generate, message.draft, message.send, payment.request, refund.issue, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: restricted }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }
  - role: patient-care-desk
    name: Patient care and quality desk
    description: Alerts the emergency team and the family, keeps admissions, bed and theatre slots and family updates moving, prepares medical record copies and certificates for signature, logs complaints and patient safety incidents, and drafts replies and reviews.
    job:
      mission: "Alert the emergency team and the family, keep admissions and updates moving and prepare record copies and certificates for signature."
      customer_facing: true
      never:
        - "Diagnosis"
        - "Treatment or prescribing"
        - "Triage"
        - "Medication decisions"
        - "Emergency medical decisions"
        - "Releasing sensitive patient records"
    instructions: >-
      You coordinate and write things down; doctors and nurses make every clinical decision.
      Never diagnose, set a triage colour, advise on medicines or tell anyone about a patient's condition beyond what the treating doctor has approved.
      In an emergency, alert the team first and do the papers after care has started.
      Release records only after the medical superintendent approves, and only to the patient, someone they authorised in writing, the legal heir of a patient who died, or a signed police or court requisition.
      Report incidents without blame.
    autonomy: 2
    tools: [patients.search, patient.register, visits.search, visit.open, incidents.search, incident.report, records.search, records.update, knowledge.search, document.generate, message.draft, message.send, schedule.create, staff.delegate, human.handoff]
    model: { tier: standard, fallback: small, data_class: restricted }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }

workflows:
  - id: emergency-response
    name: Emergency response
    description: Get the emergency team ready, reach the family, and do the papers once care has started.
    keywords: [emergency, casualty, code blue, ambulance, critical value, mlc]
    steps:
      - key: alert-team
        title: Alert the emergency team
        agent: patient-care-desk
        instructions: Phone the emergency in-charge or the duty doctor at once with who is coming or what happened, where and when, exactly as reported and without any medical opinion. For a critical lab or scan result, reach the treating or duty doctor and note who took the call and when. Pre-register the patient (as unknown, with sex and rough age, if the name is not known) and reach the family.
      - key: papers-after-care
        title: Papers after care has started
        agent: patient-care-desk
        depends_on: [alert-team]
        instructions: Once the doctor has started care, open the emergency visit, mark it medico-legal if the doctor says so and draft the police intimation for the doctor to sign. Find a ward or ICU bed if the doctor admits, start the PM-JAY, insurance or road-accident scheme papers, and never ask for a deposit before treatment. Report what the emergency in-charge confirmed.
  - id: opd-appointment
    name: OPD appointment
    description: Book, move or cancel an OPD visit, test or scan, remind the patient and share the report when it is ready.
    keywords: [appointment, opd, slot, reschedule, test, scan, report, follow-up]
    steps:
      - key: book
        title: Book or move the visit
        agent: booking-coordinator
        instructions: Find or register the patient, book the doctor, test or scan on a free slot and confirm it in the appointment diary, then send the time, the fee and how to prepare (fasting, old reports, the doctor's referral slip for a pregnancy scan). If the patient cancels, cancel the slot and offer another. If the doctor is away, move each patient to another date or another doctor of the same department and tell every patient affected.
      - key: remind
        title: Remind and share the report
        agent: booking-coordinator
        depends_on: [book]
        instructions: Send a reminder the day before, and when the report is ready send it only to the registered mobile or email. Hand anything that sounds urgent to a person at once.
  - id: booking-cancellation
    name: Cancel an appointment
    description: Cancel a patient's OPD appointment, test or scan when they ask, and offer another slot.
    keywords: [cancel, cancellation, not coming, cannot come, can't come]
    steps:
      - key: cancel
        title: Cancel the appointment
        agent: booking-coordinator
        instructions: Find the patient's appointment, cancel it in the diary and offer another slot. If they paid the fee in advance, say so in your summary so the refund can follow.
  - id: planned-admission
    name: Planned admission or surgery
    description: Give the estimate, settle who pays, book the bed and theatre slot, keep the family updated and get the discharge papers ready.
    keywords: [admission, surgery, operation, estimate, bed, day care, discharge]
    steps:
      - key: estimate-and-payer
        title: Estimate and payer
        agent: billing-insurance-desk
        instructions: Prepare the written estimate from the rate list or package rates for what the consultant advised, check who pays (cash, insurance, PM-JAY or another scheme) and start the cashless or scheme request from the doctor's notes. Take no deposit from a PM-JAY patient for a covered package.
      - key: bed-and-theatre
        title: Bed, theatre slot and pre-admission steps
        agent: patient-care-desk
        depends_on: [estimate-and-payer]
        instructions: Reserve the bed or day-care slot and the theatre slot the consultant asked for, send the pre-admission instructions (tests, fitness and anaesthesia check, fasting, papers to bring), and remind the ward that the doctor takes written consent in a language the patient understands.
      - key: stay-and-discharge
        title: Family updates and discharge papers
        agent: patient-care-desk
        depends_on: [bed-and-theatre]
        instructions: Send the family a daily update the doctor has approved, and when discharge is ordered get the summary signed, the final bill explained and the follow-up date given. Never hold the patient back over a bill.
  - id: cashless-approval
    name: Cashless or scheme approval
    description: Prepare the request from the doctor's notes, get it sent, watch the clock and chase until the insurer or scheme decides.
    keywords: [cashless, tpa, insurance, pre-auth, enhancement, final approval, pm-jay, ayushman, claim]
    steps:
      - key: prepare
        title: Prepare the request
        agent: billing-insurance-desk
        instructions: Check the policy, e-card or scheme card is active and in the patient's name. Fill the pre-auth, enhancement or final approval request from the treating doctor's notes and signed estimate or discharge summary, attach the papers and record the request.
      - key: send-and-chase
        title: Get it sent and chase the decision
        agent: billing-insurance-desk
        depends_on: [prepare]
        instructions: Hand the request to the insurance desk or the Arogya Mitra by phone to send on the portal. Insurers decide a cashless request within 1 hour and a discharge approval within 3 hours, so chase before the time runs out, draft answers to any query for the doctor, and tell the patient in writing about any denial or cut.
  - id: bill-and-refund
    name: Bill check and refund
    description: Check the bill line by line, explain it in plain words, and raise refunds or concessions once approved.
    keywords: [bill, refund, discount, concession, overcharged, receipt]
    steps:
      - key: check-bill
        title: Check and explain the bill
        agent: billing-insurance-desk
        instructions: Match every line of the bill against the rate list, the estimate, what was actually used and the receipts. Explain the charges in plain words and correct any mistake.
      - key: refund
        title: Refund or concession
        agent: billing-insurance-desk
        depends_on: [check-bill]
        instructions: Once approved, refund only to the payer's own bank account, card or UPI and send the receipt. Apply concessions only under the written concession policy.
  - id: records-release
    name: Medical records and certificates
    description: Check who is asking, pull the file, prepare the copies or certificate for signature and hand them over within 72 hours.
    keywords: [medical records, case sheet, certified copy, certificate, mlc, discharge summary]
    steps:
      - key: verify-and-prepare
        title: Check the requester and prepare
        agent: patient-care-desk
        instructions: Confirm the requester is the patient, someone they authorised in writing with ID, the legal heir of a patient who died, or a signed police or court requisition. Find the visit, list the pages to copy, and draft any certificate from the treating doctor's own findings for them to sign.
      - key: hand-over
        title: Hand over within 72 hours
        agent: patient-care-desk
        depends_on: [verify-and-prepare]
        instructions: Hand the copying and signing to the medical records officer by phone with the 72-hour deadline. Copies are handed over against a signature or sent only to the registered email, and the originals stay with the hospital.
  - id: complaint-handling
    name: Complaint handling
    description: Log and acknowledge the complaint, hear the family, get the facts and draft the written reply for the grievance officer.
    keywords: [complaint, grievance, rude, waiting, negligence, feedback]
    steps:
      - key: acknowledge
        title: Log and acknowledge
        agent: patient-care-desk
        instructions: Log the complaint with a number and acknowledge it the same day in the person's language. Ask patient relations by phone to call the family and fix what can be fixed at once (cleaning, waiting, behaviour).
      - key: facts-and-reply
        title: Get the facts and draft the reply
        agent: patient-care-desk
        depends_on: [acknowledge]
        instructions: Gather the case papers, bills, call logs and staff statements, and keep anyone named in the complaint out of handling it. Draft the written reply for the grievance officer within 7 days, saying what was done, what will change and where to go next. Raise a fall or a wrong medicine as a safety incident too.
  - id: incident-reporting
    name: Patient safety incident
    description: Record the incident without blame, gather the facts, and draft the review and the note to the family.
    keywords: [incident, fall, medication error, needle stick, near miss, reaction]
    steps:
      - key: record
        title: Record it the same day
        agent: patient-care-desk
        instructions: Record what happened, where, when and the harm, as the staff reported it, without blame. For a needle-stick or blood splash, phone the duty doctor at once so HIV preventive medicine (PEP) can start within 2 hours.
      - key: review
        title: Gather facts and draft the review
        agent: patient-care-desk
        depends_on: [record]
        instructions: Collect statements and records, check for repeats in recent months, and draft the review and the note to the family for the medical superintendent. Hand the agreed actions to the quality manager by phone and report the dates agreed.

policies:
  - id: facility-spend-above-25000
    action: case.proceed
    approver: head-of-institution
    require_approval_above: { amount: 25000, currency: INR }
    when: { category: [facility] }
    reason: Repairs and purchases above ₹25,000 need the medical superintendent's approval of the quote before work starts.

routines:
  - id: evening-ward-check
    name: Evening ward check-in
    description: The duty manager reports beds in use, discharges held up by bills or approvals, safety incidents and pending cashless approvals.
    mode: automatic
    days: [0, 1, 2, 3, 4, 5, 6]
    time: "20:00"
    questions:
      - { key: bedsInUse, label: "Beds in use", ask: "How many beds are in use right now?", type: number, unit: beds }
      - { key: dischargesHeldUp, label: "Discharges held up", ask: "Is any discharge waiting on a bill or an insurance approval?", type: text, flag: true }
      - { key: incidentsToday, label: "Incidents today", ask: "Did any fall, medication error or other safety incident happen today?", type: text, flag: true }
      - { key: cashlessPending, label: "Cashless pending", ask: "Is any cashless or PM-JAY approval still pending?", type: text, flag: true, required: false }
  - id: cashless-sent-today
    name: Cashless requests sent today
    description: The AI calls the TPA desk each evening and adds the day's pre-authorisation and claim requests to the Cashless requests list.
    days: [0, 1, 2, 3, 4, 5, 6]
    time: '19:00'
    collect:
      list: cashless-requests
      ask: [patientName, visitNumber, payer, insurerOrTpa, requestType, amountAsked]
      defaults: { sentAt: now, status: sent }
      who: the TPA desk

lifecycle:
  case: { label: Patient request, plural: Patient requests, prefix: PRQ }
  stages:
    request:
      name: Request or alert received
      description: A patient or family member, doctor, nurse, insurer or TPA, ambulance, the police or the hospital system raises an appointment, emergency, admission, cashless approval, bill, records request, complaint or safety incident, and it gets a request number and an acknowledgement.
    review:
      name: Registration and eligibility check
      description: The front office and agents find or register the patient, confirm who will pay (cash, insurance, PM-JAY or another scheme) and check that the details and papers needed are there; emergencies skip this, because treatment never waits for papers.
      checks:
        - Patient identified by two identifiers (name with UHID or date of birth), never by bed number
        - "Payer confirmed: cash, insurance or TPA, PM-JAY, CGHS, ECHS, ESI or a state scheme, with a valid policy or card"
        - Doctor's advice, referral or earlier reports attached where the request needs them
        - "The person asking has the right to: the patient, family with the patient's consent, the legal heir of a patient who died, or a signed police or court requisition"
        - ABHA linked and Aadhaar seen only with the patient's consent, and Aadhaar never stored unmasked
        - Anything that sounds like an emergency goes straight to the emergency team; treatment first, registration and payment after
    classify:
      name: Triage and priority
      description: The request gets its type, priority, risk, due time and department; emergency patients also carry the red, yellow or green triage colour given by the triage nurse or doctor, never by an agent.
    assign:
      name: Assign doctor and team
      description: The front office or duty manager names the consultant, duty doctor, nurse, insurance desk, billing, medical records or patient relations person responsible and sets the due time.
    approve:
      name: Approval and consent
      description: "When the rules need it, the right person decides in writing: the treating doctor for admission, surgery and what goes to the insurer (and the doctor takes the patient's written consent), and the medical superintendent for records, certificates, incident actions and refunds or concessions above ₹10,000."
      checks:
        - The approver is not the person who prepared the request
        - Written informed consent signed before surgery, anaesthesia or blood transfusion
        - Amount within the approver's limit
    execute:
      name: Treatment and follow-up
      description: Doctors, nurses and staff give the treatment or service; agents book, remind, chase approvals, update the family with what the doctor has approved and track time, cost and papers.
    close:
      name: Discharge and sign-off
      description: The outcome is checked against the request; the patient leaves with a signed discharge summary and an explained bill, or gets the records, refund or written reply asked for, and the named role signs off.
      checks:
        - Discharge summary signed by the treating doctor and given to every patient who leaves, including those leaving against advice, and a death summary after a death
        - Final bill itemised and explained; cashless or PM-JAY final approval received
        - No patient, and no body, held back over an unpaid or disputed bill
        - Consent forms, case sheet and reports complete and handed to medical records
        - "After a death: cause-of-death certificate (MCCD) sent to the registrar and a copy given to the nearest relative"
        - Outcome confirmed with the patient or family, and the sign-off recorded by the named role
    report:
      name: Quality indicators and review
      description: Each month the quality committee reviews the NABH quality indicators (OPD waiting time, discharge time, returns to emergency within 72 hours, falls, medication errors, needle-stick injuries), cashless denials, complaints and repeat problems, and checks that births, deaths and notifiable diseases were reported to the government on time.
  priorities:
    - { id: P1, name: "Emergency: life or limb at risk", respond_within_hours: 0.25, resolve_within_hours: 24 }
    - { id: P2, name: "Urgent: patient waiting, safety issue or 72-hour limit", respond_within_hours: 1, resolve_within_hours: 72 }
    - { id: P3, name: "Normal: within the week", respond_within_hours: 4, resolve_within_hours: 168 }
    - { id: P4, name: "Planned: elective care", respond_within_hours: 24, resolve_within_hours: 720 }
  roles:
    - { id: head-of-institution, name: Medical superintendent, approves: "Release of medical records, certificates and medico-legal papers; what the family is told and whether a root cause analysis is done after a safety incident; refunds, discounts and concessions above ₹10,000; repairs and purchases above ₹25,000; staff leave (or the nursing superintendent or head of department it is delegated to)" }
    - { id: treating-doctor, name: Treating doctor (consultant), approves: "Admission and surgery, and the diagnosis, plan and estimate in every cashless or scheme request; takes the patient's written consent and signs the discharge summary" }
    - { id: emergency-in-charge, name: Emergency in-charge (casualty medical officer), approves: "Signs off emergencies and critical alerts once the patient is admitted, transferred or sent home, the MLC entry and police intimation are done and the papers are complete" }
    - { id: insurance-manager, name: Insurance and TPA desk manager, approves: "Signs off cashless, PM-JAY and scheme cases when the approval, the final bill and the claim papers match" }
    - { id: quality-manager, name: Quality manager (NABH coordinator), approves: "Signs off patient safety incidents once actions are agreed, and runs the monthly quality indicator review" }
    - { id: grievance-officer, name: Grievance officer (patient relations), approves: "Signs off the written reply to every complaint, within 7 days" }
    - { id: records-officer, name: Medical records officer (MRD in-charge), approves: "Signs record copies and certificates after checking them against the file, and hands them over against a signature" }
