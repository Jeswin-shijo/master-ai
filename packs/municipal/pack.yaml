# Ready-made pack: municipal corporations, municipal councils, nagar panchayats
# and their ward offices in India. Built from Indian practice: the state Right to
# Services Acts and their notified time limits (Haryana's urban list, Maharashtra
# 2015, Karnataka Sakala 2011), the Registration of Births and Deaths Act 1969 as
# amended in 2023 (CRS portal), the Swachhata app service levels, the Solid Waste
# Management Rules 2026 and the Model Building Bye-laws 2016. Agents register,
# route to the ward and track the time limit; officers decide.
id: municipal
version: 1.0.0
name: Municipal & citizen services
description: Garbage, water and sewer, roads and streetlights, birth and death certificates, property tax, trade licences, building permissions, emergencies and grievances for municipal corporations, councils, nagar panchayats and ward offices.
kind: industry
sector: public-services
extends: [sector-public-services]
