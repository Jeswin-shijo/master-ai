playbooks:
  - id: service-time-limits
    title: Service time limits, designated officers and appeals
    source: Haryana Right to Service Act, 2014, consolidated list of notified urban local body services (Department of Urban Local Bodies, Haryana); Maharashtra Right to Public Services Act, 2015; Karnataka Sakala Services Act, 2011; DARPG guidelines for CPGRAMS, 2024
    body: |
      1. Every notified service has a time limit, a designated officer and a first and second appeal officer. Load your state's notified list; the clock starts when the complete application or complaint is received.
      2. Give every citizen the number, the time limit and the officer's name the day the request comes in.
      3. Typical urban limits (Haryana's notified list): garbage on streets, blocked sewer or leak, stray cattle, drain and manhole covers 2 days; pothole 5 days; water and sewer connection 7 days; new property ID 10 days; streetlight replacement 10 days; owner name change 15 days (45 after a death); trade licence 15 days (12 to renew); occupation certificate 18 days; building plan 20 days (60 for large commercial sites).
      4. If the work will miss the limit, the officer writes down why before the limit ends and tells the citizen the new date.
      5. A citizen whose service is late or refused can appeal to the first appeal officer, then the second, then the state commission. Officers who miss limits without good reason can be fined (up to ₹5,000 a case in Maharashtra); Karnataka pays the citizen ₹20 a day up to ₹500.
      6. Each month list every request past its limit by ward and officer, and fix the cause.
  - id: birth-death-registration
    title: Registering births and deaths and issuing certificates
    source: Registration of Births and Deaths Act, 1969, sections 8, 13 and 17A, as amended in 2023 (CRS portal from 1 October 2023); Ghaziabad district birth and death registration page
    body: |
      1. Births and deaths are registered by the registrar of the area where they happen. Hospitals report the events that happen there; families report home births and deaths.
      2. Reported within 21 days: register it free and give the informant the certificate free.
      3. Between 21 and 30 days: register it with the late fee.
      4. Between 30 days and 1 year: register it only with the written permission of the prescribed authority, the late fee and the declaration your state's rules ask for.
      5. After 1 year: register it only on the order of the District Magistrate, the Sub-Divisional Magistrate or an executive magistrate they authorise (as amended in 2023; check your state's current rule and any court ruling on it).
      6. Every event since 1 October 2023 is registered on the CRS portal. The digital birth certificate is proof of date of birth for school admission, licences, the voter list, Aadhaar and passports.
      7. A correction needs a supporting document and a dated note in the register; never overwrite the original entry. A child's name can be added later on a parent's request.
      8. Caste, income, domicile and EWS certificates are the tehsildar's; tell the citizen where to apply.
  - id: garbage-sanitation
    title: Garbage, sanitation and stray animal complaints
    source: MoHUA Swachhata app service levels (as reported, 2017); Solid Waste Management Rules, 2026 (MoEF&CC, in force from 1 April 2026); Animal Birth Control Rules, 2023; Haryana Right to Service Act notified list
    body: |
      1. Register every complaint from the counter, phone, WhatsApp or the Swachhata app with the spot, the ward and a photo if the citizen has one.
      2. Send it to the sanitary inspector of that ward by phone the same day. Start action within 6 hours.
      3. Clear a garbage point, a full bin or a missed vehicle within 12 hours, and a dead animal within 48 hours (Swachhata app levels). Your state's notified limit may be longer, such as 2 days in Haryana.
      4. Close only with an after-photo from the same spot. If the citizen says it is not done, reopen it.
      5. Mark spots that keep filling up: put a bin, post a sweeper, or fine the people dumping there.
      6. Remind households and shops to keep wet, dry, sanitary and special care waste separate. Bulk waste generators (such as those making 100 kg or more a day; check the current rules) must register and process their own waste.
      7. Stray dogs are caught for sterilisation and vaccination and returned to the same area; a dog bite is an emergency, so send the person for anti-rabies treatment and the dog squad at once.
  - id: dangerous-spots
    title: Open manholes, potholes and other dangerous spots
    source: Bombay High Court, suo motu PIL on potholes and open manholes (orders of October and November 2025, as reported by Moneylife and LiveLaw); Haryana Right to Service Act notified list (manhole covers 2 days, potholes 5 days)
    body: |
      1. Treat an open manhole, a road cave-in, a collapsing wall, a live wire or a fallen tree on people as an emergency: send the nearest team to barricade it at once.
      2. Call 112, 108 or 101 if anyone is hurt, trapped or there is a fire, and tell the electricity company about live wires.
      3. Cover the manhole or drain within the day and log the time, the photos and the staff on site.
      4. Patch deep potholes within the notified time (5 days in Haryana) and keep them barricaded until then.
      5. Courts can hold the municipality liable (check what your own High Court has ordered): the Bombay High Court set ₹6 lakh for a death from a pothole or open manhole and ₹50,000 to ₹2.5 lakh for injuries, decided by a committee that includes the commissioner, and recoverable from the officers or contractors responsible. Agencies that argue over who owns the road share the cost.
      6. After every accident, find why the spot was left open and fix the cause with a named person and a date.
  - id: building-permission-process
    title: Building permissions and unauthorised construction
    source: Model Building Bye-laws, 2016 (Ministry of Urban Development, as reported); Haryana Right to Service Act notified list; your state's municipal act and building bye-laws
    body: |
      1. Take building plans only through the online building permission system, with plans signed by a registered architect or engineer, ownership papers and the fee.
      2. Check the whole file once and list every missing paper in one message.
      3. Inspect the site and check the plan against the bye-laws: setbacks, FAR, height, parking and rainwater harvesting.
      4. Decide within the notified time: 20 days for most plots and 60 days for large commercial or institutional sites in Haryana; the model bye-laws set 30 days, and some states treat a late file as approved.
      5. The town planning officer signs the permission or the rejection with reasons; occupancy certificates follow the completion inspection (18 days in Haryana).
      6. For unauthorised construction, issue a notice under the municipal act, give a hearing, then a stop-work or demolition order. Ownership disputes go to the civil court.

