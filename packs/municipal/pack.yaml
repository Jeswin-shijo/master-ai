tools:
  - name: properties.search
    description: Find a property by property ID, owner name, address or water consumer number.
    uses: records.search
    with: { entity: Property }
  - name: wards.search
    description: Find a ward and its ward officer, sanitary inspector and junior engineer by ward number or area name.
    uses: records.search
    with: { entity: Ward }
  - name: applications.search
    description: Find service applications and complaints by number, applicant, ward, service or status.
    uses: records.search
    with: { entity: ServiceApplication }
  - name: application.register
    description: Register a service application or complaint with its notified service, ward and due date.
    uses: records.create
    with: { entity: ServiceApplication, data: { status: received } }
  - name: licences.search
    description: Find trade licences by number, shop name, holder, ward or status.
    uses: records.search
    with: { entity: TradeLicence }
  - name: licence.prepare
    description: Prepare a new or renewed trade licence as a draft for the health officer. It is not valid until the officer signs it.
    uses: records.create
    with: { entity: TradeLicence, data: { status: draft } }

agents:
  - role: citizen-desk
    name: Citizen service desk
    description: Registers complaints and service applications from the counter, phone, WhatsApp and portals, gives each a number, the notified time limit and the officer's name, checks the papers, answers status questions, and prepares certificates, tax corrections and refunds for the officer to sign.
    instructions: >-
      Give every citizen a number, the notified time limit and the designated officer's name, in their language.
      Never mark a certificate, correction or refund as done; the registrar or revenue officer signs.
      Take Aadhaar only with consent and keep it masked. If a message mentions an open manhole, a collapsing wall,
      a live wire, a fallen tree on people or anyone hurt, hand it to the people on duty at once.
      Caste, income and domicile certificates come from the tehsil office; say so kindly and name the state portal.
    autonomy: 3
    tools: [properties.search, wards.search, applications.search, application.register, records.search, records.create, records.update, knowledge.search, document.generate, message.draft, message.send, payment.request, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 120000, money_per_task_inr: 0, max_steps: 25 }
  - role: ward-coordinator
    name: Ward work coordinator
    description: Sends complaints to the sanitary inspector, junior engineer or crew of the right ward by phone, watches the notified time limit, chases the before and after photos, tells the ward officer before a deadline is missed and keeps the citizen updated.
    instructions: >-
      Find the ward from the street or landmark before sending anyone. Ask the field staff for an after-photo from the same spot;
      never close a complaint on a phone call alone. If the work will miss the time limit, tell the ward officer the same day.
      Roads that are national highways or state PWD roads, and work inside private societies or houses, are not ours: explain kindly who to contact.
    autonomy: 3
    tools: [wards.search, applications.search, records.search, records.update, knowledge.search, message.draft, message.send, staff.delegate, schedule.create, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 120000, money_per_task_inr: 0, max_steps: 25 }
  - role: licence-desk
    name: Licence and permission desk
    description: Checks trade licence and building permission files for missing papers, books the site inspection, prepares the scrutiny note, the licence or permit draft and any notice for the officer's signature, collects fees and reminds traders before renewal.
    instructions: >-
      You prepare; the health officer signs licences and the town planning officer decides building permissions and notices.
      Never tell an applicant a file is approved before the officer signs. Name every missing paper in one message, not one at a time.
      FSSAI, excise, drug and liquor licences come from their own departments; ownership disputes go to the civil court.
    autonomy: 2
    tools: [licences.search, licence.prepare, applications.search, properties.search, records.search, records.update, knowledge.search, document.generate, message.draft, message.send, payment.request, staff.delegate, schedule.create, human.handoff]
    model: { tier: standard, fallback: small, data_class: confidential }
    budgets: { tokens_per_task: 150000, money_per_task_inr: 0, max_steps: 30 }

workflows:
  - id: ward-complaint
    name: Ward complaint
    description: Send a garbage, road or streetlight complaint to the right ward team and close it with an after-photo inside the time limit.
    keywords: [garbage, sanitation, pothole, streetlight, road, park, ward, complaint]
    steps:
      - key: send
        title: Send it to the ward team
        agent: ward-coordinator
        instructions: Find the ward from the street or landmark, then hand the work by phone to the sanitary inspector (garbage, sweeping, dead animals, stray cattle) or the junior engineer (roads, streetlights, parks) with the spot, the citizen's photo and the notified time limit.
      - key: follow-up
        title: Chase the after-photo and update the citizen
        agent: ward-coordinator
        depends_on: [send]
        instructions: Before the time limit runs out, get the after-photo from the same spot, send it to the citizen and ask if the work is done. If it is late, tell the ward officer the same day.
  - id: water-sewer-repair
    name: Water and sewer repair
    description: Send the water or sewer crew, arrange a tanker when a lane has no water, and confirm supply or flow is back.
    keywords: [water, leak, sewer, sewage, drainage, tanker, connection]
    steps:
      - key: send-crew
        title: Send the crew and a tanker if needed
        agent: ward-coordinator
        instructions: Hand the job by phone to the junior engineer of the water or sewer section with the place, the problem and the time limit. If a lane has had no water for more than a day, ask for a tanker. For a new connection, book the site inspection.
      - key: confirm
        title: Confirm it is fixed
        agent: ward-coordinator
        depends_on: [send-crew]
        instructions: Get the after-photo or the junior engineer's note, check with the citizen that water or flow is back, and report what was done.
  - id: certificate-issue
    name: Birth or death certificate
    description: Find or register the birth or death and prepare the certificate or correction for the registrar.
    keywords: [birth, death, certificate, registration, correction]
    steps:
      - key: prepare
        title: Prepare the certificate for the registrar
        agent: citizen-desk
        instructions: Search the register for the event by name, date and place. Work out which rule applies (within 21 days, 21 to 30 days, up to 1 year, after 1 year), list any affidavit or order needed, and prepare the certificate or correction for the registrar's digital signature. Send it to the family once signed.
  - id: tax-correction
    name: Property tax or water bill correction
    description: Find the property and payments and prepare the correction, owner name change or refund for the revenue officer.
    keywords: [property tax, water bill, mutation, refund, assessment]
    steps:
      - key: prepare
        title: Prepare the correction for the revenue officer
        agent: citizen-desk
        instructions: Find the property or water connection, check the payments against the ledger and receipts, and prepare the bill correction, owner name change note or refund note with the papers attached for the revenue officer.
  - id: licence-processing
    name: Trade licence
    description: Check the papers, book the inspection and prepare the licence for the health officer.
    keywords: [trade licence, licence, license, renewal, shop]
    steps:
      - key: check
        title: Check the papers and book the inspection
        agent: licence-desk
        instructions: Check the application, ID, premises papers and property tax receipt, name every missing paper in one message, collect the fee and hand the premises inspection to the licence inspector by phone.
      - key: draft
        title: Prepare the licence
        agent: licence-desk
        depends_on: [check]
        instructions: After the inspection report, prepare the licence or renewal draft for the health officer's signature and tell the trader when it is signed.
  - id: building-permission-scrutiny
    name: Building permission scrutiny
    description: Check the plan file, book the site inspection and prepare the scrutiny note and the permit or notice for the town planning officer.
    keywords: [building, plan, occupancy, construction, permission, obps]
    steps:
      - key: scrutiny
        title: Check the file
        agent: licence-desk
        instructions: Check the plan, ownership papers, architect's details and fees on the file, list anything missing and prepare the scrutiny note against the building bye-laws.
      - key: inspect
        title: Book the site inspection and draft the order
        agent: licence-desk
        depends_on: [scrutiny]
        instructions: Hand the site inspection to the building inspector by phone, then prepare the permit, occupancy certificate or notice for the town planning officer with the inspection report.

policies:
  - id: works-above-1-lakh
    action: case.proceed
    approver: owner
    require_approval_above: { amount: 100000, currency: INR }
    when: { category: [facility, water-drainage, sanitation] }
    reason: Works and purchases above ₹1,00,000 need sanction by whoever holds that power under the municipal act before the work order goes out.

routines:
  - id: ward-sanitation-round
    name: Daily ward round
    description: Each sanitary inspector reports garbage points left, vehicles that missed their route, staff absent and any dangerous spot seen on the round.
    mode: automatic
    days: [1, 2, 3, 4, 5, 6]
    time: "12:00"
    questions:
      - { key: pointsLeft, label: "Garbage points left", ask: "Are any garbage points in your ward still not cleared?", type: text, flag: true }
      - { key: vehicleMissed, label: "Vehicle missed route", ask: "Did any garbage vehicle miss its route today?", type: yes_no, flag: true }
      - { key: staffAbsent, label: "Staff absent", ask: "How many safai staff were absent today?", type: number, unit: people }
      - { key: dangerSpots, label: "Dangerous spots", ask: "Did you see any open manhole, fallen tree or other dangerous spot today?", type: text, flag: true }

lifecycle:
  case: { label: Citizen request, plural: Citizen requests, prefix: CR }
  stages:
    request:
      name: Application or complaint received
      description: A citizen, a corporator's office, the police, field staff or a portal (Swachhata app, CPGRAMS, the state service portal) raises a complaint or a service application, and it gets a number and the notified time limit.
    review:
      name: Documents and eligibility check
      description: The ward office or counter checks the place or property, who is applying and the papers the service needs, and sends back anything that is not the municipality's job; danger to life skips the papers.
      checks:
        - "Place given: ward, street or landmark for complaints; property ID, licence or application number for services"
        - The place is inside our limits and the road, drain or line is ours (not a national highway, state PWD road, cantonment, private society or the inside of a house)
        - "Papers the notified service needs are attached: ID, ownership or rent papers, hospital or cremation slip, plan drawings, fee receipt"
        - Aadhaar taken only with consent and kept masked
        - Danger to life (open manhole, collapsing wall, live wire, fallen tree on people)? Send the team at once and mark it P1
        - Not a repeat of an open complaint for the same spot; if it is, link it and give the citizen the first number
    classify:
      name: Service, ward and time limit
      description: The request gets its service type, ward, department, priority and the time limit notified for that service under the state Right to Services Act.
    assign:
      name: Designated officer and deadline
      description: The request goes to the designated officer for that service in that ward (sanitary inspector, junior engineer, registrar, tax inspector, licence or building inspector) with a deadline inside the time limit, and the citizen gets the officer's name.
    approve:
      name: Sanction by the officer
      description: The officer with the power to decide sanctions or rejects in writing with reasons, never the clerk or inspector who prepared the file, and no work order or refund goes out before this.
      checks:
        - Officer holds the delegated power for this service and amount
        - Inspection report and scrutiny note on the file
        - Reasons written down for every rejection, with the appeal officer's name
    execute:
      name: Field work and tracking
      description: Field staff do the work, clear the garbage, fix the leak, patch the pothole or inspect the site, and upload before and after photos while agents update the citizen and watch the time limit.
      checks:
        - Work started inside the time limit
        - Before and after photos from the same spot
        - Ward officer told the same day if the time limit will be missed
    close:
      name: Site check and closure
      description: Someone other than the person who did the work checks the photos or the site, the named officer signs off and the citizen gets the outcome in writing with the appeal officer's name.
      checks:
        - After-photo from the same spot, or the signed certificate, licence or order attached
        - A sample of closed complaints spot-checked by the supervisor
        - Certificate, licence or permission matches the register and is digitally signed
        - Refund paid to the payer's own account and the tax ledger updated
        - Citizen told the outcome and the first appeal officer under the Right to Services Act
        - Complaint reopened, not closed, if the citizen says the work was not done
    report:
      name: Monthly service review
      description: Each month the commissioner's office reviews requests past their time limit by ward and officer, appeals and penalties, repeat garbage points, potholes and leaks, and fixes the causes that keep coming back.
      checks:
        - Requests past the time limit listed by ward and officer
        - Right to Services appeals and penalties reviewed
        - Repeat garbage points, potholes and leak spots flagged for a lasting fix
  priorities:
    - { id: P1, name: "Emergency: danger to life or property", respond_within_hours: 0.5, resolve_within_hours: 24 }
    - { id: P2, name: "Urgent: water, sewer or garbage service stopped", respond_within_hours: 4, resolve_within_hours: 48 }
    - { id: P3, name: "Normal: within the notified time limit", respond_within_hours: 24, resolve_within_hours: 360 }
    - { id: P4, name: "Planned: permissions and long applications", respond_within_hours: 48, resolve_within_hours: 720 }
  roles:
    - { id: owner, name: Owner (account holder for the municipal body), approves: "Road, light, park, water, sewer and sanitation works above ₹1,00,000, anything above ₹5,00,000 that no rule gives to a named officer, and anything sent to a role nobody holds. Let the person who holds that sanctioning power under your municipal act (commissioner, standing committee or council) decide these" }
    - { id: head-of-institution, name: Municipal commissioner or chief officer, approves: "Staff leave (or the head of department it is delegated to), emergency spending, and action against an officer who missed a notified time limit" }
    - { id: ward-officer, name: Ward officer (assistant commissioner or ward in-charge), approves: "Signs off garbage, sanitation and stray animal complaints in the ward after the after-photo and a spot check" }
    - { id: executive-engineer, name: Executive engineer, approves: "Signs off road, streetlight, park, water supply, sewer and drainage work after the site check; hears the first appeal for engineering services" }
    - { id: health-officer, name: Health officer (medical officer of health), approves: "Trade, food stall and meat shop licences and renewals after the inspection" }
    - { id: revenue-officer, name: Revenue officer (assessor and collector), approves: "Property tax and water bill corrections, owner name changes and refunds above ₹10,000; signs off once the register and ledger are updated" }
    - { id: town-planning-officer, name: Town planning officer, approves: "Building permissions, occupancy certificates and notices against unauthorised construction; signs off once the order is issued and the register updated" }
    - { id: records-officer, name: Registrar of births and deaths, approves: "Signs birth and death certificates and corrections after checking them against the register" }
    - { id: safety-officer, name: Disaster management officer, approves: "Signs off emergencies once the spot is barricaded or made safe, the injured are cared for and the police, fire service or electricity company are told" }
    - { id: grievance-officer, name: Public grievance officer, approves: "Signs off the written reply to every escalated complaint and every CPGRAMS or state portal grievance" }
