# Shared building blocks every tenant gets: a general operations assistant,
# platform-wide guardrails and operations KPIs.
id: core-business
version: 1.1.0
name: Core business
description: General operations assistant, money guardrails and operations KPIs shared by every pack.
kind: base

escalations:
  - id: emergency
    label: Emergencies
    for: customer_facing
    alert: owner
    reply: "If anyone is in danger, please call 112 now. We have alerted our team and a person will contact you right away."
    words: [fire, smoke, gas leak, explosion, accident, injured, injury, bleeding, unconscious, chest pain, heart attack, electric shock, collapsed, drowning, ambulance, emergency, "112", आग, धुआं, दुर्घटना, घायल, खून, बेहोश, सीने में दर्द, करंट, आपातकाल, aag, dhuan, durghatna, ghayal, khoon, behosh, current laga, seene mein dard]
  - id: distress
    label: Distress or self-harm
    for: customer_facing
    alert: owner
    reply: "We're sorry you are going through this. A person from our team will contact you shortly. If you are in danger or thinking of harming yourself, please call 112 or the Tele-MANAS helpline on 14416."
    words: [suicide, kill myself, end my life, self harm, hurt myself, want to die, no reason to live, आत्महत्या, खुदकुशी, मरना चाहता, मरना चाहती, जीना नहीं, khudkushi, aatmahatya, marna chahta, marna chahti, jeena nahi, khudkhushi, mar jaunga, mar jaungi, jaan de dunga, jaan de dungi]
  - id: anger
    label: Anger or abuse
    for: customer_facing
    alert: owner
    reply: "We're sorry. A person from our team will contact you shortly."
    words: [cheated, fraud, worst, pathetic, useless, disgusting, scam, shameful, धोखा, बकवास, घटिया, बेकार, dhokha, bakwas, ghatiya, bekar, chor, faltu]
  - id: legal-threat
    label: Legal threats
    for: customer_facing
    alert: owner
    reply: "Thank you. A senior person from our team will contact you about this."
    words: [lawyer, advocate, legal notice, court, police complaint, fir, consumer forum, consumer court, sue, lawsuit, वकील, अदालत, कोर्ट, कानूनी नोटिस, vakil, adalat, case karunga]
  - id: secrets
    label: "OTPs, PINs or card numbers"
    for: customer_facing
    alert: owner
    reply: "Please don't share OTPs, PINs, passwords or card numbers here. We will never ask for them."
    words: [otp is, password is, pin is, card number is, cvv, upi pin, atm pin, पिन नंबर, पासवर्ड है, ओटीपी है, mera otp, mera password, otp bata, pin bata]

agents:
  - role: ops-assistant
    name: Operations assistant
    description: Researches company knowledge and records, writes reports and drafts messages for the owner.
    job:
      mission: "Research company knowledge and records, write reports and draft messages for the owner."
      customer_facing: false
      never:
        - "Sending anything to customers on its own"
        - "Approving anything itself"
        - "Payments or financial commitments"
    autonomy: 2
    tools: [knowledge.search, records.search, records.get, document.generate, message.draft, human.handoff]
    model: { tier: standard, fallback: small, data_class: internal }
    budgets: { tokens_per_task: 120000, money_per_task_inr: 0, max_steps: 20 }

  - role: work-coordinator
    name: Work coordinator
    description: Gets work done through the team. Picks the person in charge, phones them to assign the work and agree a deadline, follows up by phone, and confirms it is done.
    job:
      mission: "Get work done through the team by picking the person in charge, phoning them to assign it and following up until it is done."
      customer_facing: false
      never:
        - "Hiring, firing or discipline"
        - "Approving anything itself"
        - "Payments or financial commitments"
        - "Legal, medical or safety decisions"
    instructions: Delegate to the single best-placed team member. Put the full task, place, people and deadline in plain words they can act on from one phone call.
    autonomy: 3
    tools: [staff.delegate, records.search, knowledge.search, human.handoff]
    model: { tier: standard, fallback: small, data_class: internal }
    budgets: { tokens_per_task: 120000, money_per_task_inr: 0, max_steps: 12 }

  - role: case-coordinator
    name: Case coordinator
    description: Takes in every request and moves it through its stages. It checks the details, sets the priority, finds the person in charge, asks for approval when the rules require it, checks the result and writes the report.
    job:
      mission: "Take in every request and move it through its stages, asking people for approval where the rules require it."
      customer_facing: false
      never:
        - "Approving anything itself"
        - "Payments or financial commitments"
        - "Legal, medical or safety decisions"
        - "Hiring, firing or discipline"
    instructions: Follow the stage you are given. Use the organization's own words for its work. Never approve anything yourself; approvals come from people.
    autonomy: 3
    tools: [case.proceed, case.close, records.search, knowledge.search]
    model: { tier: small, fallback: standard, data_class: internal }
    budgets: { tokens_per_task: 60000, money_per_task_inr: 0, max_steps: 10 }

workflows:
  - id: delegate-work
    name: Get it done by the team
    description: Hand the work to the person in charge, follow up by phone and confirm it is done.
    keywords: [make sure, ensure, arrange, check with, ask, assign, team, staff, inspect, inspection, prepare, collect, deliver, visit, fix, organise, organize, clean, repair, pick up, drop, send someone]
    steps:
      - key: delegate
        title: Delegate to the person in charge
        agent: work-coordinator
        instructions: Pick the team member in charge of this work and delegate it by phone. Report what they confirmed.
  - id: weekly-report
    name: Weekly operations report
    description: Summarise the week's work, open items and risks for the owner.
    keywords: [report, summary, weekly, week, review, status]
    steps:
      - key: compile-report
        title: Compile the weekly report
        agent: ops-assistant
        instructions: Search recent records and the knowledge base, then write a short report with wins, open items and risks.

routines:
  - id: daily-update
    name: Daily status update
    description: Everyone in charge says what got done, what is stuck and what they need from you.
    mode: automatic
    days: [1, 2, 3, 4, 5, 6]
    time: "18:00"
    questions:
      - { key: doneToday, label: "Done today", ask: "What did you get done today?", type: text }
      - { key: stuck, label: "Stuck or delayed", ask: "Is anything stuck or delayed?", type: text, flag: true }
      - { key: needs, label: "Needs from owner", ask: "Is there anything you need from the owner?", type: text, flag: true, required: false }

policies:
  - id: case-large-amount
    action: case.proceed
    require_approval_above: { amount: 500000, currency: INR }
    reason: Any case above ₹5,00,000 needs the owner's approval.
  - id: refund-hard-cap
    action: refund.issue
    forbid_above: { amount: 200000, currency: INR }
    reason: Refunds above ₹2,00,000 are handled by a human outside the system.
  - id: payment-request-large
    action: payment.request
    require_approval_above: { amount: 25000, currency: INR }
    reason: Payment requests above ₹25,000 need a second look.

kpis:
  - id: tasks-completed
    name: Tasks completed by agents
    description: Agent tasks finished in the last 30 days.
    unit: count
    direction: up
    source: { type: ops, metric: tasks_completed }
  - id: approval-rejection-rate
    name: Approval rejection rate
    description: Share of approval requests the owner rejected. Lower means agents propose better actions.
    unit: percent
    direction: down
    target: 10
    source: { type: ops, metric: approval_rejection_rate }
  - id: avg-approval-time
    name: Average approval time
    description: Minutes from an approval request to the owner's decision.
    unit: minutes
    direction: down
    source: { type: ops, metric: avg_approval_minutes }
  - id: ai-spend
    name: AI spend (30 days)
    description: Model cost across all agents.
    unit: inr
    direction: down
    source: { type: ops, metric: llm_cost_inr }
