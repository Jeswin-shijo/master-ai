# Local stack for ONEHUMAN OS. Production uses managed equivalents
# (RDS/Cloud SQL, Temporal Cloud or self-hosted Temporal, NATS cluster).
name: onehuman

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: onehuman
      POSTGRES_PASSWORD: onehuman
      POSTGRES_DB: onehuman
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onehuman -d onehuman"]
      interval: 3s
      timeout: 3s
      retries: 20

  temporal:
    # Temporal server persisted in Postgres (databases temporal + temporal_visibility),
    # so workflows survive restarts exactly like production.
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: onehuman
      POSTGRES_PWD: onehuman
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address $$(hostname -i):7233 | grep -q SERVING"]
      interval: 5s
      timeout: 5s
      retries: 30

  temporal-ui:
    image: temporalio/ui:2.55.0
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["8233:8080"]

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes:
      - natsdata:/data

volumes:
  pgdata:
  natsdata:
